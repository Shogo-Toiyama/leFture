<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moore - GPT 6 Luna</title>
<style>
  body {
    background-color: #FAF5E9; /* Orbit Paper World Background */
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 32px 16px;
    margin: 0;
  }
  .meta-bar {
    max-width: 600px;
    margin: 0 auto 16px auto;
    font-size: 13px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 8px;
  }
  .card-container {
    max-width: 600px;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <div class="meta-bar">
    <span><strong>Moore</strong> (chart)</span>
    <span>GPT 6 Luna | 47.74s | 6228 tok ($0.00411)</span>
  </div>
  <div class="card-container">
    <div class="deepnote-figure-card">
  <style>
    .deepnote-figure-card {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --indigo: #4f46e5;
      width: 100%;
      max-width: 600px;
      margin: 16px auto;
      box-sizing: border-box;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .deepnote-figure-card *,
    .deepnote-figure-card *::before,
    .deepnote-figure-card *::after {
      box-sizing: border-box;
    }

    .deepnote-figure-card .figure-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 20px 10px;
    }

    .deepnote-figure-card .figure-title {
      margin: 0;
      color: #0f172a;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.035em;
      line-height: 1.25;
    }

    .deepnote-figure-card .figure-subtitle {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .deepnote-figure-card .scale-badge {
      flex: 0 0 auto;
      margin-top: 1px;
      padding: 6px 9px;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 9.5px;
      font-weight: 750;
      letter-spacing: 0.075em;
      line-height: 1;
      white-space: nowrap;
    }

    .deepnote-figure-card .chart-wrap {
      padding: 0 8px;
    }

    .deepnote-figure-card svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .deepnote-figure-card .takeaway {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 16px 16px;
      padding: 11px 12px;
      border: 1px solid #e0e7ff;
      border-radius: 9px;
      background: #f8faff;
      color: #334155;
      font-size: 11.5px;
      line-height: 1.5;
    }

    .deepnote-figure-card .takeaway-mark {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      margin-top: 5px;
      border-radius: 50%;
      background: #4f46e5;
      box-shadow: 0 0 0 3px #e0e7ff;
    }

    .deepnote-figure-card .takeaway strong {
      color: #1e293b;
    }

    @media (max-width: 420px) {
      .deepnote-figure-card .figure-header {
        padding: 17px 15px 8px;
      }

      .deepnote-figure-card .figure-title {
        font-size: 17px;
      }

      .deepnote-figure-card .figure-subtitle {
        font-size: 11.5px;
      }

      .deepnote-figure-card .scale-badge {
        padding: 6px 7px;
        font-size: 8.5px;
      }

      .deepnote-figure-card .chart-wrap {
        padding: 0 4px;
      }

      .deepnote-figure-card .takeaway {
        margin: 0 12px 13px;
        font-size: 11px;
      }
    }
  </style>

  <div class="figure-header">
    <div>
      <h2 class="figure-title">Moore's Law</h2>
      <p class="figure-subtitle">Transistor count per chip · 1970–2025</p>
    </div>
    <span class="scale-badge">LOGARITHMIC Y-AXIS</span>
  </div>

  <div class="chart-wrap">
    <svg viewBox="0 0 600 370" role="img" aria-labelledby="moore-chart-title moore-chart-desc">
      <title id="moore-chart-title">Moore's Law: transistor count on a chip from 1970 to 2025</title>
      <desc id="moore-chart-desc">
        A logarithmic line chart rising from approximately 20,000 transistors in 1970 to approximately 200 billion in 2025. The curve continues upward but flattens somewhat in recent years.
      </desc>

      <defs>
        <linearGradient id="moore-area-gradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6366f1" stop-opacity="0.19" />
          <stop offset="100%" stop-color="#6366f1" stop-opacity="0.015" />
        </linearGradient>
      </defs>

      <!-- Plot area grid: each horizontal interval represents one decade. -->
      <g stroke="#e9edf5" stroke-width="1">
        <line x1="78" y1="278" x2="570" y2="278" />
        <line x1="78" y1="248.5" x2="570" y2="248.5" />
        <line x1="78" y1="219" x2="570" y2="219" />
        <line x1="78" y1="189.5" x2="570" y2="189.5" />
        <line x1="78" y1="160" x2="570" y2="160" />
        <line x1="78" y1="130.5" x2="570" y2="130.5" />
        <line x1="78" y1="101" x2="570" y2="101" />
        <line x1="78" y1="71.5" x2="570" y2="71.5" />
        <line x1="78" y1="42" x2="570" y2="42" />
      </g>

      <!-- Axes -->
      <g stroke="#94a3b8" stroke-width="1.25">
        <line x1="78" y1="42" x2="78" y2="278" />
        <line x1="78" y1="278" x2="570" y2="278" />
      </g>

      <!-- Log-scale tick labels -->
      <g fill="#64748b" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="end">
        <text x="68" y="282">10⁴</text>
        <text x="68" y="252.5">10⁵</text>
        <text x="68" y="223">10⁶</text>
        <text x="68" y="193.5">10⁷</text>
        <text x="68" y="164">10⁸</text>
        <text x="68" y="134.5">10⁹</text>
        <text x="68" y="105">10¹⁰</text>
        <text x="68" y="75.5">10¹¹</text>
        <text x="68" y="46">10¹²</text>
      </g>

      <!-- Year ticks -->
      <g stroke="#94a3b8" stroke-width="1">
        <line x1="78" y1="278" x2="78" y2="283" />
        <line x1="212.2" y1="278" x2="212.2" y2="283" />
        <line x1="346.4" y1="278" x2="346.4" y2="283" />
        <line x1="480.5" y1="278" x2="480.5" y2="283" />
        <line x1="570" y1="278" x2="570" y2="283" />
      </g>
      <g fill="#64748b" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
        <text x="78" y="301">1970</text>
        <text x="212.2" y="301">1985</text>
        <text x="346.4" y="301">2000</text>
        <text x="480.5" y="301">2015</text>
        <text x="570" y="301">2025</text>
      </g>

      <!-- Axis titles -->
      <text x="324" y="333" fill="#475569" font-size="12" font-weight="650"
            font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
        Year
      </text>
      <text transform="translate(20 160) rotate(-90)" fill="#475569" font-size="12" font-weight="650"
            font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
        Number of transistors per chip
      </text>

      <!-- Shaded area under the illustrative trend -->
      <path d="M78 269.1
               C109 263, 140 254, 167.5 248.5
               S230 225, 256.9 213.1
               S319 177, 346.4 160
               S409 123, 435.8 103.1
               S492 86, 525.3 68.5
               S557 63.5, 570 62.6
               L570 278 L78 278 Z"
            fill="url(#moore-area-gradient)" />

      <!-- Rising transistor-count curve; the recent segment visibly flattens. -->
      <path d="M78 269.1
               C109 263, 140 254, 167.5 248.5
               S230 225, 256.9 213.1
               S319 177, 346.4 160
               S409 123, 435.8 103.1
               S492 86, 525.3 68.5
               S557 63.5, 570 62.6"
            fill="none" stroke="#4f46e5" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round" />

      <!-- Endpoint markers -->
      <circle cx="78" cy="269.1" r="5.5" fill="#ffffff" stroke="#4f46e5" stroke-width="3" />
      <circle cx="570" cy="62.6" r="5.5" fill="#ffffff" stroke="#4f46e5" stroke-width="3" />

      <!-- Endpoint annotations -->
      <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
        <text x="91" y="247" fill="#334155" font-size="11" font-weight="700">1970</text>
        <text x="91" y="262" fill="#4f46e5" font-size="12" font-weight="750">≈ 2 × 10⁴</text>

        <text x="558" y="35" fill="#334155" font-size="11" font-weight="700" text-anchor="end">2025</text>
        <text x="558" y="50" fill="#4f46e5" font-size="12" font-weight="750" text-anchor="end">≈ 2 × 10¹¹</text>
      </g>

      <!-- Recent-years note -->
      <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
        <path d="M458 121 L486 98" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
        <rect x="352" y="117" width="143" height="23" rx="6" fill="#ffffff" stroke="#e2e8f0" />
        <text x="423.5" y="132" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">
          Growth has slowed somewhat
        </text>
      </g>
    </svg>
  </div>

  <div class="takeaway">
    <span class="takeaway-mark" aria-hidden="true"></span>
    <span><strong>More capacity, not necessarily more speed.</strong> Moore's Law describes rising chip complexity; processor speed has not increased at the same rate.</span>
  </div>
</div>
  </div>
</body>
</html>
