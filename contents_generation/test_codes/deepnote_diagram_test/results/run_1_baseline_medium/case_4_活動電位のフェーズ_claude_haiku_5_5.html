    .deepnote-figure-card .dn-kicker {

    .deepnote-figure-card .dn-title {

    .deepnote-figure-card .dn-subtitle {

    .deepnote-figure-card .dn-chart {

    .deepnote-figure-card .dn-swatch {
      width: 18px;
      height: 4px;
      border-radius: 2px;
      display: inline-block;
    }

    .deepnote-figure-card .dn-timing {
      margin-top: 14px;
      padding: 12px 12px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fcfdfe;
    }
    .deepnote-figure-card .dn-section-label {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-900);
    }
    .deepnote-figure-card .dn-timing svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .deepnote-figure-card .dn-timing text { font-family: inherit; fill: var(--ink-700); }

    .deepnote-figure-card .dn-phases {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 14px;
      padding: 0;
      list-style: none;
    }
    .deepnote-figure-card .dn-phase {
      position: relative;
      background: #ffffff;
      border: 1px solid var(--line);
      border-left: 4px solid var(--c);
      border-radius: 10px;
      padding: 10px 12px 11px 12px;
      min-width: 0;
    }
    .deepnote-figure-card .dn-phase-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .deepnote-figure-card .dn-badge {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--c);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .deepnote-figure-card .dn-phase-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-900);
      margin: 0;
    }
    .deepnote-figure-card .dn-mv {
      font-size: 11px;
      font-weight: 700;
      color: var(--c);

      border-radius: 6px;
      padding: 1px 6px;
      margin-left: auto;
      white-space: nowrap;
    }
