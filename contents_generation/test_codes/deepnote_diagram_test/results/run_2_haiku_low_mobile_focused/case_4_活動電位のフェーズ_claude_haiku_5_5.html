<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動電位のフェーズ - Claude Haiku 5.5</title>
<style>
  body {
    background-color: #FAF5E9; /* Orbit Paper World Background */
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 12px;
    margin: 0;
  }
  .meta-bar {
    max-width: 520px;
    margin: 0 auto 16px auto;
    font-size: 13px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 8px;
  }
  .card-container {
    max-width: 520px;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <div class="meta-bar">
    <span><strong>活動電位のフェーズ</strong> (chart)</span>
    <span>Claude Haiku 5.5 | 11.03s | 6024 tok ($0.00218)</span>
  </div>
  <div class="card-container">
    <div class="deepnote-figure-card">
  <style>
    .deepnote-figure-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      padding: 16px;
      max-width: 520px;
      width: 100%;
      margin: 16px auto;
      box-sizing: border-box;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      color: #1e293b;
    }
    .deepnote-figure-card * { box-sizing: border-box; }
    .deepnote-figure-card .dn-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 2px;
    }
    .deepnote-figure-card .dn-subtitle {
      font-size: 12px;
      color: #475569;
      margin: 0 0 10px;
    }
    .deepnote-figure-card .dn-svg-wrap {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 6px;
    }
    .deepnote-figure-card svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .deepnote-figure-card .dn-svg-label {
      font-family: inherit;
      font-size: 12px;
      fill: #334155;
    }
    .deepnote-figure-card .dn-svg-label-strong {
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      fill: #0f172a;
    }
    .deepnote-figure-card .dn-phases {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .deepnote-figure-card .dn-phase {
      border: 1px solid #e2e8f0;
      border-left-width: 4px;
      border-radius: 8px;
      padding: 8px 10px;
      background: #ffffff;
    }
    .deepnote-figure-card .dn-phase.p1 { border-left-color: #d97706; }
    .deepnote-figure-card .dn-phase.p2 { border-left-color: #e11d48; }
    .deepnote-figure-card .dn-phase.p3 { border-left-color: #4f46e5; }
    .deepnote-figure-card .dn-phase.p4 { border-left-color: #059669; }
    .deepnote-figure-card .dn-phase-name {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 4px;
    }
    .deepnote-figure-card .dn-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .deepnote-figure-card .dn-badge {
      font-size: 11.5px;
      line-height: 1.3;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }
    .deepnote-figure-card .b-na { background: #ecfdf5; color: #047857; }
    .deepnote-figure-card .b-k  { background: #fef3c7; color: #b45309; }
    .deepnote-figure-card .b-rest { background: #ffe4e6; color: #be123c; }
    .deepnote-figure-card .b-off { background: #e0e7ff; color: #4338ca; }
    .deepnote-figure-card .dn-key {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #1e293b;
      background: #eef2ff;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .deepnote-figure-card .dn-key strong { color: #4338ca; }
  </style>

  <p class="dn-title">活動電位のフェーズ</p>
  <p class="dn-subtitle">膜電位（mV）と時間の関係・イオンチャネルの動き</p>

  <div class="dn-svg-wrap">
    <svg viewBox="0 0 340 220" role="img" aria-label="活動電位の波形">
      <!-- Axes -->
      <line x1="40" y1="20" x2="40" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="40" y1="180" x2="326" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="8" y="28" class="dn-svg-label">+30</text>
      <text x="8" y="104" class="dn-svg-label">0</text>
      <text x="4" y="150" class="dn-svg-label">-70</text>
      <text x="8" y="196" class="dn-svg-label">-90</text>
      <text x="300" y="200" class="dn-svg-label">時間</text>
      <text x="6" y="12" class="dn-svg-label">mV</text>

      <!-- Zero line -->
      <line x1="40" y1="100" x2="326" y2="100" stroke="#cbd5e1" stroke-dasharray="4 4"/>
      <!-- Resting line -->
      <line x1="40" y1="150" x2="326" y2="150" stroke="#cbd5e1" stroke-dasharray="4 4"/>

      <!-- Phase shading -->
      <rect x="40" y="20" width="60" height="160" fill="#fef3c7" opacity="0.5"/>
      <rect x="100" y="20" width="60" height="160" fill="#ffe4e6" opacity="0.4"/>
      <rect x="160" y="20" width="50" height="160" fill="#e0e7ff" opacity="0.4"/>
      <rect x="210" y="20" width="116" height="160" fill="#ecfdf5" opacity="0.5"/>

      <!-- Action potential curve -->
      <path d="M40,150 L70,150 L92,140 L104,40 L116,26 L124,30 L140,70 L160,110 L178,128 L196,140 L210,152 L226,164 L240,162 L262,152 L290,150 L326,150"
            fill="none" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- Phase labels -->
      <text x="48" y="66" class="dn-svg-label-strong">①</text>
      <text x="104" y="60" class="dn-svg-label-strong">②</text>
      <text x="152" y="92" class="dn-svg-label-strong">③</text>
      <text x="236" y="186" class="dn-svg-label-strong">④</text>

      <!-- Leader lines for Na+ peak -->
      <line x1="112" y1="34" x2="150" y2="34" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3 3"/>
      <text x="154" y="38" class="dn-svg-label" fill="#be123c">Na⁺ 急速</text>
      <!-- K+ slow -->
      <line x1="200" y1="170" x2="240" y2="170" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 3"/>
      <text x="200" y="208" class="dn-svg-label" fill="#b45309">K⁺ 遅れて開く</text>
    </svg>
  </div>

  <div class="dn-phases">
    <div class="dn-phase p1">
      <p class="dn-phase-name">① 脱分極</p>
      <div class="dn-badges">
        <span class="dn-badge b-na">Na⁺ チャネル 開</span>
      </div>
    </div>
    <div class="dn-phase p2">
      <p class="dn-phase-name">② ピーク（立ち上がり）</p>
      <div class="dn-badges">
        <span class="dn-badge b-na">Na⁺ 急速に流入</span>
      </div>
    </div>
    <div class="dn-phase p3">
      <p class="dn-phase-name">③ 再分極</p>
      <div class="dn-badges">
        <span class="dn-badge b-off">Na⁺ 不活性化</span>
        <span class="dn-badge b-k">K⁺ 開</span>
      </div>
    </div>
    <div class="dn-phase p4">
      <p class="dn-phase-name">④ 過分極 → 回復</p>
      <div class="dn-badges">
        <span class="dn-badge b-k">K⁺ 流出 継続</span>
      </div>
    </div>
  </div>

  <div class="dn-key">
    <strong>ポイント：</strong>Na⁺チャネルは<strong>素早く開いて素早く閉じる</strong>一方、K⁺チャネルは<strong>遅れて開き</strong>膜電位を静止電位へ戻します。
  </div>
</div>
  </div>
</body>
</html>
