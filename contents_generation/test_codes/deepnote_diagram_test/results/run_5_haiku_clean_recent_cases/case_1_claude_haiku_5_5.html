    .deepnote-figure-card {
      background: #ffffff;

  <div class="dn-header">
    <span class="dn-badge">Bar Chart</span>
    <h3 class="dn-title">性差別的な模擬面接後の数学課題の成績</h3>

  <svg class="dn-chart" viewBox="0 0 340 220" role="img" aria-label="性別ごとの数学課題の成績。女性は性差別的な扱いで低下、男性は差がない">
    <!-- Y axis -->
    <line x1="48" y1="20" x2="48" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- X axis -->
    <line x1="48" y1="180" x2="320" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Y axis label -->
    <text x="14" y="104" font-size="12" fill="#334155" font-weight="600" transform="rotate(-90 14 104)" text-anchor="middle">数学課題の成績</text>

    <!-- Gridlines -->
    <line x1="48" y1="60" x2="320" y2="60" stroke="#e2e8f0" stroke-dasharray="3 3"/>
    <line x1="48" y1="100" x2="320" y2="100" stroke="#e2e8f0" stroke-dasharray="3 3"/>
    <line x1="48" y1="140" x2="320" y2="140" stroke="#e2e8f0" stroke-dasharray="3 3"/>

    <!-- Female group: sexist (dark) lower bar, non-sexist (light) higher -->
    <rect x="72" y="100" width="48" height="80" rx="4" fill="#1e293b"/>
    <rect x="128" y="50" width="48" height="130" rx="4" fill="#cbd5e1"/>
    <text x="110" y="198" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">女性</text>

    <!-- Male group: nearly equal bars -->
    <rect x="204" y="62" width="48" height="118" rx="4" fill="#1e293b"/>
    <rect x="260" y="60" width="48" height="120" rx="4" fill="#cbd5e1"/>
    <text x="260" y="198" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">男性</text>

    <!-- Annotation: rose gap on female group -->
    <line x1="176" y1="50" x2="176" y2="100" stroke="#e11d48" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="132" y="22" width="80" height="20" rx="10" fill="#e11d48"/>
    <text x="172" y="36" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">大きな低下</text>

    <!-- Annotation: emerald for male -->
    <rect x="200" y="36" width="112" height="20" rx="10" fill="#059669"/>
    <text x="256" y="50" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">差はほぼなし</text>
  </svg>

  <div class="dn-legend">
    <span class="dn-pill"><span class="dn-swatch" style="background:#1e293b"></span>性差別的な扱い</span>
    <span class="dn-pill"><span class="dn-swatch" style="background:#cbd5e1"></span>非性差別的な扱い</span>

    <div class="dn-insight">

      <span class="dn-tag safe">男性</span>

</div>
