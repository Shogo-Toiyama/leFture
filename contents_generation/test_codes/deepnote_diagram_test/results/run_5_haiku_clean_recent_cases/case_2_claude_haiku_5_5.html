  <h3 class="dn-title">バースト性トラフィックと帯域幅利用</h3>
  <p class="dn-subtitle">データは「たまに大きく」、音声は「常に小さく」。だから共有できる。</p>

  <svg class="dn-chart" viewBox="0 0 320 300" role="img" aria-label="音声トラフィックは一定の低いレベル、データトラフィックは長いアイドルと短い高いピークを示すグラフ">
    <!-- Panel 1: Voice -->
    <text x="16" y="24" class="dn-svg-label" fill="#059669">① 音声トラフィック</text>
    <line x1="40" y1="38" x2="40" y2="110" stroke="#64748b" stroke-width="1.5"/>
    <line x1="40" y1="110" x2="304" y2="110" stroke="#64748b" stroke-width="1.5"/>
    <text x="10" y="50" class="dn-axis-label" transform="rotate(-90 14 74)">帯域幅</text>
    <text x="280" y="126" class="dn-axis-label">時間</text>
    <path d="M40 90 L304 90" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 90 L304 90 L304 110 L40 110 Z" fill="#059669" opacity="0.12"/>

    <!-- Panel 2: Data -->
    <text x="16" y="164" class="dn-svg-label" fill="#4f46e5">② データトラフィック</text>
    <line x1="40" y1="178" x2="40" y2="262" stroke="#64748b" stroke-width="1.5"/>
    <line x1="40" y1="262" x2="304" y2="262" stroke="#64748b" stroke-width="1.5"/>
    <text x="10" y="200" class="dn-axis-label" transform="rotate(-90 14 220)">帯域幅</text>
    <text x="280" y="280" class="dn-axis-label">時間</text>
    <path d="M40 260 L110 260 L120 200 L132 260 L220 260 L230 196 L242 260 L304 260"
          fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M40 260 L110 260 L120 200 L132 260 L220 260 L230 196 L242 260 L304 260 Z"
          fill="#4f46e5" opacity="0.12"/>
    <text x="104" y="190" class="dn-axis-label" fill="#e11d48" font-weight="600">ピーク</text>
    <text x="224" y="186" class="dn-axis-label" fill="#e11d48" font-weight="600">ピーク</text>
    <text x="150" y="250" class="dn-axis-label" fill="#64748b">アイドル</text>
  </svg>

  <ul class="dn-legend">
    <li class="dn-badge"><span class="dn-dot" style="background:#059669"></span>音声: 一定・低い</li>
    <li class="dn-badge"><span class="dn-dot" style="background:#4f46e5"></span>データ: 長いアイドル・短い高ピーク</li>
  </ul>

  <div class="dn-takeaway">
    <strong>ポイント:</strong> 統計的多重化は、データのアイドル時間を他のユーザーが使えるため、<strong>ピーク時の全帯域</strong>を効率よく利用できる。
  </div>
</div>
