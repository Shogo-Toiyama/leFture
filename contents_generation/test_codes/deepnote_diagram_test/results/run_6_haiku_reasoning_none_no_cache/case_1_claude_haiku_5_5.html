<!DOCTYPE html>

<head>

<body>

  <style>
    .deepnote-figure-card {
      max-width: 520px;
      width: 100%;
      margin: 16px auto;
      box-sizing: border-box;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      padding: 16px;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    .deepnote-figure-card * { box-sizing: border-box; }
    .deepnote-figure-card .dn-badge {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      color: #4f46e5;
      background: #eef2ff;
      border-radius: 999px;
      padding: 3px 10px;
      letter-spacing: 0.02em;
    }
    .deepnote-figure-card .dn-title {

      font-weight: 700;
      color: #0f172a;
    }
    .deepnote-figure-card .dn-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #334155;
    }
    .deepnote-figure-card .dn-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .deepnote-figure-card .dn-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }
    .deepnote-figure-card .dn-chart {
      width: 100%;
      height: auto;

      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .deepnote-figure-card .dn-insights {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    .deepnote-figure-card .dn-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 13px;
      color: #334155;
    }
    .deepnote-figure-card .dn-pill {

      font-weight: 700;
      border-radius: 999px;
      padding: 3px 9px;
      color: #ffffff;
      white-space: nowrap;
    }
    .deepnote-figure-card .pill-rose { background: #e11d48; }
    .deepnote-figure-card .pill-emerald { background: #059669; }
    .deepnote-figure-card .pill-amber { background: #d97706; }
    .deepnote-figure-card .dn-row strong {
      color: #0f172a;
      font-weight: 700;
    }
    .deepnote-figure-card .dn-takeaway {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 10px;
      background: #eef2ff;
      border-left: 4px solid #4f46e5;
      font-size: 13px;
      color: #1e293b;
    }
    .deepnote-figure-card .dn-takeaway-title {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #4f46e5;
      margin-bottom: 2px;
    }
    .deepnote-figure-card svg text {
      font-family: inherit;

  <span class="dn-badge">📊 研究結果</span>
  <div class="dn-title">性差別的な模擬面接後の数学課題の成績</div>

    <text x="36" y="194" font-size="12" fill="#334155" text-anchor="end">低</text>
    <text x="14" y="103" font-size="12" fill="#334155" text-anchor="middle" transform="rotate(-90 14 103)">成績</text>

    <!-- Women group: dark (sexist) -->
    <rect x="64" y="128" width="52" height="62" rx="4" fill="#0f172a"/>
    <!-- Women group: gray (non-sexist) -->
    <rect x="124" y="58" width="52" height="132" rx="4" fill="#cbd5e1"/>

    <rect x="204" y="60" width="52" height="130" rx="4" fill="#0f172a"/>
    <!-- Men group: gray (non-sexist) -->

    <line x1="64" y1="58" x2="176" y2="58" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Value labels -->
    <text x="90" y="118" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle">大きく低下</text>
    <text x="150" y="48" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">男性並み</text>
    <text x="230" y="52" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">ほぼ同じ</text>
    <text x="290" y="48" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">ほぼ同じ</text>

    <text x="260" y="212" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">男性</text>

  <div class="dn-insights">
