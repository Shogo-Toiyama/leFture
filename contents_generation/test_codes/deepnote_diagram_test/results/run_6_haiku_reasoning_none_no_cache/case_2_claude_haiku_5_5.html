<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バースト性トラフィックと帯域幅利用 - Claude Haiku 5.5</title>
<style>
  body {
    background-color: #FAF5E9; /* Orbit Paper World Background */
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 12px;
    margin: 0;
  }
  .meta-bar {
    max-width: 520px;

  }

</style>
</head>
<body>
  <div class="meta-bar">
    <span><strong>バースト性トラフィックと帯域幅利用</strong> (graph)</span>
    <span>Claude Haiku 5.5 | 22.32s | 7789 tok ($0.00373)</span>
  </div>
  <div class="card-container">
    <div class="deepnote-figure-card">
  <style>
    .deepnote-figure-card {
      box-sizing: border-box;
      max-width: 520px;
      width: 100%;
      margin: 16px auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      padding: 16px;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    .deepnote-figure-card * { box-sizing: border-box; }
    .deepnote-figure-card .dnf-title {
      margin: 0 0 2px;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .deepnote-figure-card .dnf-sub {
      margin: 0 0 12px;
      font-size: 12px;
      color: #475569;
    }
    .deepnote-figure-card .dnf-panel {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 10px 6px;
      margin-bottom: 10px;
      background: #f8fafc;
    }
    .deepnote-figure-card .dnf-panel-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      margin-bottom: 4px;
    }
    .deepnote-figure-card .dnf-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;

    .deepnote-figure-card .dnf-pill.voice { background: #059669; }

      font-size: 13px;
      color: #334155;
      font-weight: 600;
    }
    .deepnote-figure-card svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .deepnote-figure-card .dnf-insight {
      background: #fffbeb;
      border-left: 4px solid #d97706;
      border-radius: 8px;
      padding: 10px 12px;
      margin: 12px 0;
      font-size: 14px;
      color: #1e293b;
    }
    .deepnote-figure-card .dnf-insight strong {
      color: #b45309;
    }
    .deepnote-figure-card .dnf-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .deepnote-figure-card .dnf-box {
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
    }
    .deepnote-figure-card .dnf-box.bad { border-top: 3px solid #e11d48; }
    .deepnote-figure-card .dnf-box.good { border-top: 3px solid #059669; }
    .deepnote-figure-card .dnf-box-label {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
    }
    .deepnote-figure-card .dnf-box-mid {
      font-size: 12px;
      color: #475569;
    }
    .deepnote-figure-card .dnf-big {
      font-size: 20px;
      font-weight: 800;
      margin-top: 4px;
      line-height: 1.2;
    }
    .deepnote-figure-card .dnf-box.bad .dnf-big { color: #e11d48; }
    .deepnote-figure-card .dnf-box.good .dnf-big { color: #059669; }
    .deepnote-figure-card .dnf-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .deepnote-figure-card .dnf-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #eef2ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
    }
    .deepnote-figure-card .dnf-tag.up {
      background: #ecfdf5;
      color: #065f46;
      border-color: #a7f3d0;
    }

  <h3 class="dnf-title">バースト性トラフィックと帯域幅利用</h3>
  <p class="dnf-sub">横軸: 時間 ／ 縦軸: 帯域幅</p>

  <div class="dnf-panel">
    <div class="dnf-panel-head">
      <span class="dnf-pill voice">音声</span>
      <span class="dnf-desc">ほぼ一定の低いレベル</span>
    </div>
    <svg viewBox="0 0 320 110" role="img" aria-label="音声トラフィック: 一定の低い帯域">
      <line x1="44" y1="8" x2="44" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="44" y1="90" x2="310" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="12" y="50" font-size="12" fill="#475569" text-anchor="middle" transform="rotate(-90 12 50)">帯域幅</text>
      <text x="306" y="106" font-size="12" fill="#475569" text-anchor="end">時間</text>
      <path d="M44 62 L90 60 L130 63 L170 61 L220 62 L260 60 L310 62 L310 90 L44 90 Z" fill="rgba(5,150,105,0.12)"/>
      <path d="M44 62 L90 60 L130 63 L170 61 L220 62 L260 60 L310 62" fill="none" stroke="#059669" stroke-width="3" stroke-linejoin="round"/>
      <text x="292" y="50" font-size="12" font-weight="700" fill="#059669" text-anchor="end">常時</text>
    </svg>
  </div>

  <div class="dnf-panel">
    <div class="dnf-panel-head">
      <span class="dnf-pill data">データ</span>
      <span class="dnf-desc">長いアイドル＋短い高いピーク</span>
    </div>
    <svg viewBox="0 0 320 110" role="img" aria-label="データトラフィック: 長いアイドルと短い高いピーク">
      <line x1="44" y1="8" x2="44" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="44" y1="90" x2="310" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="12" y="50" font-size="12" fill="#475569" text-anchor="middle" transform="rotate(-90 12 50)">帯域幅</text>
      <text x="306" y="106" font-size="12" fill="#475569" text-anchor="end">時間</text>
      <path d="M44 90 L70 90 L80 18 L92 18 L102 90 L190 90 L200 34 L212 34 L222 90 L262 90 L270 14 L282 14 L292 90 L310 90 Z" fill="rgba(79,70,229,0.15)" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="86" y="12" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">ピーク</text>
      <text x="146" y="80" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">アイドル</text>
    </svg>
  </div>

  <div class="dnf-insight">
    統計的多重化は、<strong>他のユーザーのアイドル時間</strong>を使い、自分のピーク時に<strong>全帯域</strong>を利用できる仕組みです。
  </div>

  <div class="dnf-compare">
    <div class="dnf-box bad">
      <div class="dnf-box-label">厳密な分割</div>
      <div class="dnf-box-mid">100人で分割 → 1人 0.1 Mbps</div>
      <div class="dnf-big">10秒</div>
    </div>
    <div class="dnf-box good">
      <div class="dnf-box-label">統計的多重化</div>
      <div class="dnf-box-mid">自分の番に 10 Mbps を独占</div>
      <div class="dnf-big">0.1秒</div>
    </div>
  </div>

  <div class="dnf-tags">
    <span class="dnf-tag up">遅延 ↓</span>
    <span class="dnf-tag up">スループット ↑</span>
  </div>
</div>
  </div>
