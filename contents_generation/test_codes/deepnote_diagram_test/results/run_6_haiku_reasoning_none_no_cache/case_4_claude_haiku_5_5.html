<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二分探索木への要素追加と構造共有 - Claude Haiku 5.5</title>
<style>
  body {
    background-color: #FAF5E9; /* Orbit Paper World Background */
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 12px;
    margin: 0;
  }
  .meta-bar {
    max-width: 520px;
    margin: 0 auto 16px auto;
    font-size: 13px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 8px;
  }
  .card-container {
    max-width: 520px;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <div class="meta-bar">
    <span><strong>二分探索木への要素追加と構造共有</strong> (diagram)</span>
    <span>Claude Haiku 5.5 | 25.42s | 8707 tok ($0.00418)</span>
  </div>
  <div class="card-container">
    <div class="deepnote-figure-card">
  <style>
    .deepnote-figure-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.07);
      padding: 16px;
      max-width: 520px;
      width: 100%;
      margin: 16px auto;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif;
      color: #1e293b;
    }
    .deepnote-figure-card * { box-sizing: border-box; }
    .dn-head { margin-bottom: 10px; }
    .dn-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 4px 0;
      line-height: 1.4;
    }
    .dn-sub {
      font-size: 13px;
      color: #334155;
      margin: 0;
      line-height: 1.5;
    }
    .dn-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 8px 0;
    }
    .dn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
      line-height: 1.2;
    }
    .dn-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dn-svg-wrap {
      width: 100%;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 8px 4px;
    }
    .dn-svg-wrap svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .dn-steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 12px;
    }
    .dn-step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #1e293b;
      line-height: 1.4;
      background: #f8fafc;
      border-radius: 8px;
      padding: 7px 10px;
      border-left: 3px solid #4f46e5;
    }
    .dn-step.emerald { border-left-color: #059669; }
    .dn-step.amber { border-left-color: #d97706; }
    .dn-step.rose { border-left-color: #e11d48; }
    .dn-step-num {
      font-weight: 700;
      color: #4f46e5;
      flex-shrink: 0;
    }
    .dn-footer {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 11.5px;
      color: #475569;
    }
    .dn-badge-stat {
      font-size: 11.5px;
      font-weight: 700;
      color: #065f46;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .dn-badge-gc {
      font-size: 11.5px;
      font-weight: 700;
      color: #9f1239;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      padding: 3px 9px;
      border-radius: 999px;
    }
  </style>

  <div class="dn-head">
    <p class="dn-title">二分探索木への要素追加と構造共有</p>
    <p class="dn-sub">ノード <strong>13</strong> を追加。経路上のノードだけ作り直し、残りは共有します。</p>
  </div>

  <div class="dn-legend">
    <span class="dn-pill"><span class="dn-dot" style="background:#4f46e5;"></span>再作成（新バージョン）</span>
    <span class="dn-pill"><span class="dn-dot" style="background:#94a3b8;"></span>共有（そのまま再利用）</span>
    <span class="dn-pill"><span class="dn-dot" style="background:#059669;"></span>新規ノード 13</span>
  </div>

  <div class="dn-svg-wrap">
    <svg viewBox="0 0 360 380" role="img" aria-label="ノード13追加後の二分探索木：経路上のノードは再作成、それ以外は共有">
      <!-- Edges: new path (indigo) -->
      <g stroke="#4f46e5" stroke-width="2.5" fill="none" stroke-linecap="round">
        <line x1="190" y1="32" x2="100" y2="96"/>
        <line x1="100" y1="96" x2="50" y2="160"/>
        <line x1="50" y1="160" x2="90" y2="224"/>
        <line x1="90" y1="224" x2="150" y2="288"/>
      </g>
      <!-- Edge to new node 13 (emerald) -->
      <line x1="150" y1="288" x2="130" y2="352" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Shared edges (gray) -->
      <g stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="none">
        <line x1="190" y1="32" x2="280" y2="96"/>
        <line x1="100" y1="96" x2="150" y2="160"/>
        <line x1="50" y1="160" x2="20" y2="224"/>
      </g>

      <!-- Node: 25 (re-created) -->
      <circle cx="190" cy="32" r="18" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
      <text x="190" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">25</text>

      <!-- Node: 20 (re-created) -->
      <circle cx="100" cy="96" r="18" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
      <text x="100" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">20</text>

      <!-- Node: 36 (shared) -->
      <circle cx="280" cy="96" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <text x="280" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">36</text>

      <!-- Node: 10 (re-created) -->
      <circle cx="50" cy="160" r="18" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
      <text x="50" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">10</text>

      <!-- Node: 22 (shared) -->
      <circle cx="150" cy="160" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <text x="150" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">22</text>

      <!-- Node: 5 (shared) -->
      <circle cx="20" cy="224" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <text x="20" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">5</text>

      <!-- Node: 12 (re-created) -->
      <circle cx="90" cy="224" r="18" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
      <text x="90" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">12</text>

      <!-- Node: 15 (re-created) -->
      <circle cx="150" cy="288" r="18" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
      <text x="150" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">15</text>

      <!-- Node: 13 (new) -->
      <circle cx="130" cy="352" r="18" fill="#059669" stroke="#ffffff" stroke-width="2"/>
      <text x="130" y="357" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">13</text>

      <!-- Callout for new node -->
      <text x="200" y="356" font-size="12" font-weight="700" fill="#059669">← 新規</text>
    </svg>
  </div>

  <div class="dn-steps">
    <div class="dn-step emerald">
      <span class="dn-step-num">①</span>
      <span>新しいノード 13 を作成</span>
    </div>
    <div class="dn-step">
      <span class="dn-step-num">②</span>
      <span>親の 15 → 12 → 10 → 20 → 25 を順に複製</span>
    </div>
    <div class="dn-step amber">
      <span class="dn-step-num" style="color:#d97706;">③</span>
      <span>36・22・5 は元の木をそのまま共有</span>
    </div>
  </div>

  <div class="dn-footer">
    <span class="dn-badge-stat">再作成 6ノード（O(log n)）</span>
    <span class="dn-badge-gc">旧パスは GC 対象</span>
  </div>
</div>
  </div>
</body>
</html>
