<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>性差別的な模擬面接後の数学課題の成績 - Claude Haiku 5.5</title>
<style>
  body {
    background-color: #FAF5E9; /* Orbit Paper World Background */
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 12px;
    margin: 0;
  }
  .meta-bar {
    max-width: 520px;
    margin: 0 auto 16px auto;
    font-size: 13px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 8px;
  }
  .card-container {
    max-width: 520px;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <div class="meta-bar">
    <span><strong>性差別的な模擬面接後の数学課題の成績</strong> (bar_chart)</span>
    <span>Claude Haiku 5.5 | 8.77s | 4599 tok ($0.00173)</span>
  </div>
  <div class="card-container">
    <div class="deepnote-figure-card">
  <style>
    .deepnote-figure-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      border-radius: 12px;
      padding: 16px;
      max-width: 520px;
      width: 100%;
      margin: 16px auto;
      box-sizing: border-box;
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
      color: #0f172a;
    }
    .deepnote-figure-card * {
      box-sizing: border-box;
    }
    .deepnote-figure-card .dn-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .deepnote-figure-card .dn-badge {
      align-self: flex-start;
      font-size: 11.5px;
      font-weight: 700;
      color: #4f46e5;
      background: #eef2ff;
      border-radius: 999px;
      padding: 3px 10px;
    }
    .deepnote-figure-card .dn-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      margin: 0;
      line-height: 1.4;
    }
    .deepnote-figure-card .dn-chart {
      width: 100%;
      height: auto;
      display: block;
    }
    .deepnote-figure-card .dn-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .deepnote-figure-card .dn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: #334155;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 4px 10px;
    }
    .deepnote-figure-card .dn-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
    }
    .deepnote-figure-card .dn-takeaway {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .deepnote-figure-card .dn-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      line-height: 1.5;
      color: #334155;
      background: #f8fafc;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .deepnote-figure-card .dn-tag {
      flex-shrink: 0;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 6px;
      padding: 2px 7px;
      color: #ffffff;
    }
    .deepnote-figure-card .dn-tag.male { background: #64748b; }
    .deepnote-figure-card .dn-tag.female { background: #e11d48; }
    .deepnote-figure-card .dn-key {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #059669;
      background: #ecfdf5;
      border-radius: 8px;
      padding: 8px 10px;
      line-height: 1.5;
    }
  </style>

  <div class="dn-header">
    <span class="dn-badge">Bar Chart</span>
    <h3 class="dn-title">性差別的な模擬面接後の数学課題の成績</h3>
  </div>

  <svg class="dn-chart" viewBox="0 0 320 220" role="img" aria-label="性別ごとの数学課題の成績。女性は性差別的な扱いで成績が著しく低下、男性は差がない。">
    <!-- Axes -->
    <line x1="48" y1="20" x2="48" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="48" y1="180" x2="300" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="10" y="105" font-size="12" fill="#334155" transform="rotate(-90 14 105)" text-anchor="middle">成績</text>

    <!-- Female group: sexist (dark, low) -->
    <rect x="72" y="92" width="50" height="88" rx="4" fill="#1e293b"/>
    <!-- Female group: non-sexist (light, high) -->
    <rect x="130" y="40" width="50" height="140" rx="4" fill="#cbd5e1"/>

    <!-- Male group: sexist (dark) -->
    <rect x="200" y="50" width="50" height="130" rx="4" fill="#1e293b"/>
    <!-- Male group: non-sexist (light) -->
    <rect x="258" y="48" width="50" height="132" rx="4" fill="#cbd5e1"/>

    <!-- Gap annotation for female -->
    <line x1="130" y1="40" x2="180" y2="40" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 96 40 L 96 92" stroke="#e11d48" stroke-width="2" fill="none" marker-end="url(#dn-arrow)"/>
    <defs>
      <marker id="dn-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#e11d48"/>
      </marker>
    </defs>
    <rect x="104" y="58" width="0" height="0"/>
    <text x="108" y="72" font-size="12" font-weight="700" fill="#e11d48">大きな低下</text>

    <!-- X-axis labels -->
    <text x="97" y="200" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">女性</text>
    <text x="233" y="200" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">男性</text>
    <text x="172" y="214" font-size="11.5" fill="#64748b" text-anchor="middle">性別</text>
  </svg>

  <div class="dn-legend">
    <span class="dn-pill"><span class="dn-swatch" style="background:#1e293b"></span>性差別的な質問</span>
    <span class="dn-pill"><span class="dn-swatch" style="background:#cbd5e1"></span>非性差別的な質問</span>
  </div>

  <div class="dn-takeaway">
    <div class="dn-row">
      <span class="dn-tag male">男性</span>
      <span>両条件の成績はほぼ同じ（差は有意ではない）</span>
    </div>
    <div class="dn-row">
      <span class="dn-tag female">女性</span>
      <span>性差別的な質問で成績が著しく低下</span>
    </div>
  </div>

  <div class="dn-key">
    ステレオタイプ脅威：否定的なステレオタイプにさらされると、パフォーマンスが損なわれる
  </div>
</div>
  </div>
</body>
</html>
