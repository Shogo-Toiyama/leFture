<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バースト性トラフィックと帯域幅利用 - Claude Haiku 5.5</title>
<style>
  body {
    background-color: #FAF5E9; /* Orbit Paper World Background */
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 12px;
    margin: 0;
  }
  .meta-bar {
    max-width: 520px;
    margin: 0 auto 16px auto;
    font-size: 13px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 8px;
  }
  .card-container {
    max-width: 520px;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <div class="meta-bar">
    <span><strong>バースト性トラフィックと帯域幅利用</strong> (graph)</span>
    <span>Claude Haiku 5.5 | 11.31s | 5132 tok ($0.00207)</span>
  </div>
  <div class="card-container">
    <div class="deepnote-figure-card">
  <style>
    .deepnote-figure-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      padding: 16px;
      max-width: 520px;
      width: 100%;
      margin: 16px auto;
      box-sizing: border-box;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    }
    .deepnote-figure-card * { box-sizing: border-box; }
    .deepnote-figure-card .dn-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 4px 0;
    }
    .deepnote-figure-card .dn-sub {
      font-size: 13px;
      color: #334155;
      margin: 0 0 12px 0;
      line-height: 1.5;
    }
    .deepnote-figure-card .dn-panel {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 10px 6px 10px;
      margin-bottom: 10px;
      background: #f8fafc;
    }
    .deepnote-figure-card .dn-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .deepnote-figure-card .dn-label {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }
    .deepnote-figure-card .dn-pill {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      line-height: 1.3;
      white-space: nowrap;
    }
    .deepnote-figure-card .dn-pill.voice {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .deepnote-figure-card .dn-pill.data {
      background: #eef2ff;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
    }
    .deepnote-figure-card svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .deepnote-figure-card .dn-axis-text {
      font-size: 11.5px;
      fill: #334155;
    }
    .deepnote-figure-card .dn-peak-text {
      font-size: 11.5px;
      fill: #d97706;
      font-weight: 600;
    }
    .deepnote-figure-card .dn-takeaway {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 4px;
    }
    .deepnote-figure-card .dn-takeaway-icon {
      font-size: 15px;
      line-height: 1.4;
      flex-shrink: 0;
    }
    .deepnote-figure-card .dn-takeaway-text {
      font-size: 14px;
      color: #1e293b;
      line-height: 1.55;
      margin: 0;
    }
    .deepnote-figure-card .dn-takeaway-text strong {
      color: #d97706;
    }
  </style>

  <h3 class="dn-title">バースト性トラフィックと帯域幅利用</h3>
  <p class="dn-sub">時間の経過で、どれだけの帯域幅を使うかを比べます。</p>

  <div class="dn-panel">
    <div class="dn-panel-head">
      <span class="dn-label">音声トラフィック</span>
      <span class="dn-pill voice">ほぼ一定・低レベル</span>
    </div>
    <svg viewBox="0 0 320 110" role="img" aria-label="音声トラフィック: ほぼ一定の低い帯域幅">
      <!-- Axes -->
      <line x1="30" y1="10" x2="30" y2="100" stroke="#334155" stroke-width="1.5"/>
      <line x1="30" y1="100" x2="312" y2="100" stroke="#334155" stroke-width="1.5"/>
      <text x="4" y="12" class="dn-axis-text">帯域幅</text>
      <text x="300" y="116" class="dn-axis-text">時間</text>
      <!-- Voice line: steady low level -->
      <path d="M30 62 L90 60 L150 63 L210 60 L270 62 L312 61" fill="none" stroke="#059669" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="dn-panel">
    <div class="dn-panel-head">
      <span class="dn-label">データトラフィック</span>
      <span class="dn-pill data">長いアイドル＋短いピーク</span>
    </div>
    <svg viewBox="0 0 320 110" role="img" aria-label="データトラフィック: 長いアイドル期間と短い高いピーク">
      <!-- Axes -->
      <line x1="30" y1="10" x2="30" y2="100" stroke="#334155" stroke-width="1.5"/>
      <line x1="30" y1="100" x2="312" y2="100" stroke="#334155" stroke-width="1.5"/>
      <text x="4" y="12" class="dn-axis-text">帯域幅</text>
      <text x="300" y="116" class="dn-axis-text">時間</text>
      <!-- Peak label -->
      <text x="66" y="14" class="dn-peak-text">ピーク</text>
      <!-- Data bursts: long idle, short high peaks -->
      <path d="M30 88 L70 88 L80 22 L95 22 L105 88 L160 88 L170 22 L182 22 L192 88 L250 88 L260 22 L272 22 L282 88 L312 88" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="dn-takeaway">
    <span class="dn-takeaway-icon">💡</span>
    <p class="dn-takeaway-text">
      データは<strong>アイドル時間が長く</strong>、ピークは短い。統計的多重化は、この<strong>ピークを他のユーザーと共有</strong>して効率よく使います。
    </p>
  </div>
</div>
  </div>
</body>
</html>
