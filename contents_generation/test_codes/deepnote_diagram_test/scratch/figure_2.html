<div class="deepnote-figure-card">
  <style>
    .deepnote-figure-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      margin: 16px auto;
      box-sizing: border-box;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      color: #0f172a;
    }
    .deepnote-figure-card * { box-sizing: border-box; }
    .deepnote-figure-card .dn-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 4px 0;
    }
    .deepnote-figure-card .dn-subtitle {
      font-size: 12px;
      color: #334155;
      margin: 0 0 14px 0;
      line-height: 1.5;
    }
    .deepnote-figure-card .dn-flow {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .deepnote-figure-card .dn-node {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .deepnote-figure-card .dn-node.dn-router {
      background: #eef2ff;
      border-color: #c7d2fe;
    }
    .deepnote-figure-card .dn-node-icon {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
    }
    .deepnote-figure-card .dn-node-body { flex: 1 1 auto; min-width: 0; }
    .deepnote-figure-card .dn-node-name {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
    }
    .deepnote-figure-card .dn-node-note {
      font-size: 12px;
      color: #475569;
      margin-top: 2px;
    }
    .deepnote-figure-card .dn-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .deepnote-figure-card .dn-badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      line-height: 1.3;
      white-space: nowrap;
    }
    .deepnote-figure-card .badge-strip { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .deepnote-figure-card .badge-add   { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .deepnote-figure-card .badge-keep  { background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; }
    .deepnote-figure-card .badge-dest  { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
    .deepnote-figure-card .dn-connector {
      display: flex;
      justify-content: center;
      height: 34px;
    }
    .deepnote-figure-card .dn-connector svg {
      width: 100%;
      max-width: 320px;
      height: 34px;
      overflow: visible;
    }
    .deepnote-figure-card .dn-keep-bar {
      margin-top: 14px;
      border: 1.5px dashed #4f46e5;
      border-radius: 10px;
      padding: 10px 12px;
      background: #f5f3ff;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .deepnote-figure-card .dn-keep-label {
      font-size: 13px;
      font-weight: 700;
      color: #4338ca;
    }
    .deepnote-figure-card .dn-keep-text {
      font-size: 13px;
      color: #1e293b;
      width: 100%;
    }
    .deepnote-figure-card .dn-caption {
      font-size: 11.5px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>

  <p class="dn-title">ルーターによるヘッダー処理</p>
  <p class="dn-subtitle">パケットは各ルーターで データリンクヘッダーだけ 付け替えられる</p>

  <div class="dn-flow">

    <!-- Source -->
    <div class="dn-node">
      <svg class="dn-node-icon" viewBox="0 0 36 36" aria-hidden="true">
        <rect x="6" y="6" width="24" height="18" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
        <rect x="10" y="10" width="16" height="10" rx="1" fill="#ffffff"/>
        <rect x="13" y="26" width="10" height="3" fill="#334155"/>
        <rect x="9" y="29" width="18" height="2.5" rx="1" fill="#334155"/>
      </svg>
      <div class="dn-node-body">
        <div class="dn-node-name">送信元 (Source)</div>
        <div class="dn-badges">
          <span class="dn-badge badge-add">+ 新データリンクH</span>
        </div>
      </div>
    </div>

    <div class="dn-connector">
      <svg viewBox="0 0 320 34" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <line x1="160" y1="0" x2="160" y2="26" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
        <polygon points="154,24 166,24 160,33" fill="#94a3b8"/>
      </svg>
    </div>

    <!-- Router -->
    <div class="dn-node dn-router">
      <svg class="dn-node-icon" viewBox="0 0 36 36" aria-hidden="true">
        <rect x="4" y="16" width="28" height="12" rx="3" fill="#4f46e5"/>
        <circle cx="10" cy="22" r="1.6" fill="#ffffff"/>
        <circle cx="15" cy="22" r="1.6" fill="#a5b4fc"/>
        <line x1="20" y1="22" x2="27" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="16" x2="8" y2="8" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
        <line x1="24" y1="16" x2="28" y2="8" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="dn-node-body">
        <div class="dn-node-name">ルーター (Router)</div>
        <div class="dn-node-note">宛先アドレスを確認して転送先を決定</div>
        <div class="dn-badges">
          <span class="dn-badge badge-strip">− 古いデータリンクH 剥ぎ取り</span>
          <span class="dn-badge badge-add">+ 次のMACアドレスを持つH 追加</span>
        </div>
      </div>
    </div>

    <div class="dn-connector">
      <svg viewBox="0 0 320 34" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <line x1="160" y1="0" x2="160" y2="26" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
        <polygon points="154,24 166,24 160,33" fill="#94a3b8"/>
      </svg>
    </div>

    <!-- Destination -->
    <div class="dn-node">
      <svg class="dn-node-icon" viewBox="0 0 36 36" aria-hidden="true">
        <rect x="9" y="4" width="18" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
        <rect x="13" y="9" width="10" height="16" rx="1" fill="#ffffff" stroke="#a7f3d0"/>
        <circle cx="18" cy="28" r="1.4" fill="#059669"/>
      </svg>
      <div class="dn-node-body">
        <div class="dn-node-name">宛先 (Destination)</div>
        <div class="dn-badges">
          <span class="dn-badge badge-dest">全ヘッダーを剥ぎ取り → アプリへ</span>
        </div>
      </div>
    </div>

  </div>

  <div class="dn-keep-bar">
    <span class="dn-keep-label">🔒 変化しない層</span>
    <span class="dn-keep-text">ネットワーク層（IP）以上のヘッダーは、どのルーターでも変更されません。</span>
  </div>

  <p class="dn-caption">※ ルーターはデータリンクヘッダーのみを書き換えます。</p>
</div>
