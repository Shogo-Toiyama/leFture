<div class="deepnote-figure-card">
  <style>
    .deepnote-figure-card {
      max-width: 520px;
      width: 100%;
      margin: 16px auto;
      box-sizing: border-box;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.07);
      padding: 16px;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      color: #0f172a;
      box-sizing: border-box;
    }
    .deepnote-figure-card * { box-sizing: border-box; }
    .deepnote-figure-card .dn-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      margin: 0 0 4px;
    }
    .deepnote-figure-card .dn-sub {
      font-size: 13px;
      color: #334155;
      margin: 0 0 14px;
    }
    .deepnote-figure-card .dn-row {
      border-top: 1px dashed #e2e8f0;
      padding: 12px 0;
    }
    .deepnote-figure-card .dn-row:first-of-type { border-top: none; padding-top: 0; }
    .deepnote-figure-card .dn-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .deepnote-figure-card .dn-cls {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .deepnote-figure-card .dn-pat {
      font-size: 12px;
      color: #334155;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 3px 10px;
    }
    .deepnote-figure-card .dn-pat b {
      color: #e11d48;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .deepnote-figure-card .dn-bar {
      display: flex;
      width: 100%;
      height: 46px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }
    .deepnote-figure-card .dn-net {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      color: #ffffff;
      padding: 2px 4px;
      text-align: center;
      min-width: 0;
    }
    .deepnote-figure-card .dn-host {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      background: #e2e8f0;
      color: #334155;
      padding: 2px 4px;
      text-align: center;
      min-width: 0;
    }
    .deepnote-figure-card .dn-seg-name {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }
    .deepnote-figure-card .dn-seg-bits {
      font-size: 11.5px;
      line-height: 1.2;
      opacity: 0.95;
      white-space: nowrap;
    }
    .deepnote-figure-card .dn-lead {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 5px;
      border-radius: 6px;
      background: #ffffff;
      color: #e11d48;
      font-size: 12px;
      font-weight: 700;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .deepnote-figure-card .dn-note {
      font-size: 13px;
      color: #334155;
      margin: 8px 0 0;
    }
    .deepnote-figure-card .dn-cls-a { background: #4f46e5; }
    .deepnote-figure-card .dn-cls-b { background: #059669; }
    .deepnote-figure-card .dn-cls-c { background: #d97706; }
    .deepnote-figure-card .dn-net-a { background: #4f46e5; }
    .deepnote-figure-card .dn-net-b { background: #059669; }
    .deepnote-figure-card .dn-net-c { background: #d97706; }
    .deepnote-figure-card .dn-scale {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: #64748b;
      margin-bottom: 6px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .deepnote-figure-card .dn-key {
      margin-top: 14px;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 13px;
      color: #1e293b;
      line-height: 1.5;
    }
    .deepnote-figure-card .dn-key strong { color: #4f46e5; }
  </style>

  <p class="dn-title">IPアドレスのクラスと先頭ビット</p>
  <p class="dn-sub">先頭ビットのパターンで、網番号とホストIDの境界が決まる</p>

  <div class="dn-scale"><span>先頭</span><span>32 bit</span></div>

  <div class="dn-row">
    <div class="dn-head">
      <span class="dn-cls dn-cls-a">Class A</span>
      <span class="dn-pat">先頭1ビット <b>0</b></span>
    </div>
    <div class="dn-bar" role="img" aria-label="Class A: 網番号8ビット、ホストID24ビット">
      <div class="dn-net dn-net-a" style="width:25%;">
        <span class="dn-lead">0</span>
        <span class="dn-seg-name">網番号</span>
        <span class="dn-seg-bits">8bit</span>
      </div>
      <div class="dn-host" style="width:75%;">
        <span class="dn-seg-name">ホストID</span>
        <span class="dn-seg-bits">24bit</span>
      </div>
    </div>
    <p class="dn-note">大規模ネットワーク向け（網は少数）</p>
  </div>

  <div class="dn-row">
    <div class="dn-head">
      <span class="dn-cls dn-cls-b">Class B</span>
      <span class="dn-pat">先頭2ビット <b>10</b></span>
    </div>
    <div class="dn-bar" role="img" aria-label="Class B: 網番号16ビット、ホストID16ビット">
      <div class="dn-net dn-net-b" style="width:50%;">
        <span class="dn-lead">10</span>
        <span class="dn-seg-name">網番号</span>
        <span class="dn-seg-bits">16bit</span>
      </div>
      <div class="dn-host" style="width:50%;">
        <span class="dn-seg-name">ホストID</span>
        <span class="dn-seg-bits">16bit</span>
      </div>
    </div>
    <p class="dn-note">中規模ネットワーク向け（網と端末が同程度）</p>
  </div>

  <div class="dn-row">
    <div class="dn-head">
      <span class="dn-cls dn-cls-c">Class C</span>
      <span class="dn-pat">先頭3ビット <b>110</b></span>
    </div>
    <div class="dn-bar" role="img" aria-label="Class C: 網番号24ビット、ホストID8ビット">
      <div class="dn-net dn-net-c" style="width:75%;">
        <span class="dn-lead">110</span>
        <span class="dn-seg-name">網番号</span>
        <span class="dn-seg-bits">24bit</span>
      </div>
      <div class="dn-host" style="width:25%;">
        <span class="dn-seg-name">ホストID</span>
        <span class="dn-seg-bits">8bit</span>
      </div>
    </div>
    <p class="dn-note">小規模ネットワーク向け（端末は少数）</p>
  </div>

  <div class="dn-key">
    <strong>ポイント：</strong>先頭ビットを読めば、網番号の長さ（8 / 16 / 24bit）が分かる。
  </div>
</div>
