ut", "alert_type": "info", "text": "Finally, look at **impact**: what information did you wish the interface gave you, like knowing your coffee was over- or under-extracted? ⟦s000137-s000139⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🕵️", "title": "Interfaces Carry Hidden Assumptions", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "An interface never just shows you options. It quietly decides who the **intended user** is and which goals it makes easy or hard. ⟦s000144-s000148⟧"}, {"type": "paragraph", "text": "The YouTube sidebar assumes a particular device, a particular listening setup, and whether you're alone or with others. Zoom out further, and the social and political context in which the media reaches you matters too. ⟦s000150-s000153⟧"}, {"type": "paragraph", "text": "Voice assistants push this harder. A feature that recreates a dead loved one's voice might be comforting in one context and creepy or disrespectful in another. ⟦s000160-s000163⟧"}, {"type": "paragraph", "text": "Placement matters too: a voice assistant by your bed, in the bathroom, or in your car raises very different questions about the data it collects. ⟦s000164-s000169⟧"}]}, {"card_type": "next_action", "hero_emoji": "🔭", "title": "Zoom Out, Then Look Ahead", "content_blocks": [{"type": "paragraph", "text": "We learned that every interface reflects assumptions about its users, goals, and context, and that asking the right questions reveals them. Chatbots and health trackers follow the same logic."}, {"type": "paragraph", "text": "Curious? Dig into these too:"}, {"type": "list", "items": ["What expectations people bring to chatbots, especially about the accuracy and the speed and format of answers ⟦s000181-s000182⟧", "What data voice devices might be collecting or using to make their interactions work ⟦s000168-s000169⟧", "The Apple Health rollout gap, and what it reveals about whose needs get built in first ⟦s000205-s000209⟧"]}, {"type": "paragraph", "text": "Next up, we'll look at the HCI design lens, where intentional design and inclusive assumptions about users shape the real consequences of voice assistants. Let's see how far those assumptions reach!"}]}], "2": [{"card_type": "hook", "hero_emoji": "🎭", "title": "No Accidents Allowed", "content_blocks": [{"type": "quote", "text": "Every app you've ever rage-tapped was built on purpose, and that frustration might be a design choice you never noticed!"}, {"type": "paragraph", "text": "Think of a restaurant menu: the order of items is never random, and someone decided what you'd notice first. Technology works the same way, so that moment of joy or frustration was likely shaped by someone's choices."}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "Designs Steer Our Minds", "content_blocks": [{"type": "paragraph", "text": "Designers don't just build tools; they shape how we experience ourselves, each other, and the world. ⟦s000226-s000228⟧"}, {"type": "paragraph", "text": "Every interaction quietly **promotes** some behaviors and **demotes** others, nudging how we reason, whether that's cognitive, social, or emotional. ⟦s000230-s000233⟧"}, {"type": "callout", "alert_type": "info", "text": "Early HCI and AI thinkers described design as devising artifacts, and Don Norman later showed how great designers think about these everyday choices. ⟦s000219-s000223⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🔍", "title": "Your Questions Pick Your Answers", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Pro-tip from the professor: the way we pose questions directly influences the kinds of answers we allow ourselves to accept and the things we learn. ⟦s000239-s000241⟧"}, {"type": "paragraph", "text": "So when someone says \"you're probably just doing it wrong,\" remember the problem might be an unintended consequence of the design, not your fault. ⟦s000215-s000218⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Wear the HCI Lens", "content_blocks": [{"type": "paragraph", "text": "We learned that every technology interaction is deliberately designed, and that those designs shape our reasoning, feelings, and relationships. The big goal is to bring an HCI lens to any problem you meet, in engineering, research, or beyond."}, {"type": "paragraph", "text": "Curious? Dig into these too:"}, {"type": "list", "items": ["The student projects from earlier in the course, like a platform helping local speakers improve public health communication and VR/3D tools for creating shapes in a game engine ⟦s000267-s000278⟧", "The project theme framework for novel data interaction, covering what kind of data you're working with, where it comes from, and whether a reliable database exists ⟦s000281-s000282⟧"]}, {"type": "paragraph", "text": "So how do we turn this lens into real research? Next up, we'll explore user research, interviews, personas, and iterative prototyping, starting with the U.S. immigration visa process!"}]}], "3": [{"card_type": "hook", "hero_emoji": "🧭", "title": "Don't Build First, Hunt First", "content_blocks": [{"type": "quote", "text": "Great products don't start with code. They start with a hunch, a few real people, and a lot of listening!"}, {"type": "paragraph", "text": "Think of it like a detective's case file. You start with a suspicion, go gather testimony from the people who actually live the problem, and only then decide what the real crime is. The project in this lecture kicks off the exact same way."}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "Hypothesis, Research, Problem", "content_blocks": [{"type": "paragraph", "text": "The team's starting hunch was that the U.S. immigration process is often confusing and incomprehensible. ⟦s000544⟧ That hunch is only a guess, so the next move is to find out who is actually struggling."}, {"type": "paragraph", "text": "Research means building **user profiles**, which are groups of the people you want to target, and then mapping how those users interact with your system. ⟦s000545-s000546⟧ ⟦s000552-s000559⟧"}, {"type": "callout", "alert_type": "info", "text": "The payoff of all this research is a **problem statement**: people need reliable and understandable sources outside of attorneys, but that information is hard to find and hard to interpret. ⟦s000560-s000565⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "A Guess Is Not a Problem", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Your hypothesis is where you start, not where you finish. The **problem statement** has to be earned through research, not assumed from your first gut feeling. ⟦s000543-s000544⟧ ⟦s000560-s000564⟧"}, {"type": "paragraph", "text": "The real pain was not just that immigration is complicated. It was that good information is scarce and hard to interpret, which adds to the confusion and anxiety. ⟦s000565-s000566⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "Take the Next Step", "content_blocks": [{"type": "paragraph", "text": "We just saw how a project goes from a rough hunch to a clear problem statement, using user research to figure out who is actually affected and what they struggle with. Keep the hypothesis as a starting point, and let the people you're studying shape the real problem."}, {"type": "paragraph", "text": "Make sure to cover these:"}, {"type": "list", "items": ["Storyboarding the targeted user's journey, telling the story of what they go through ⟦s000568-s000569⟧", "Process maps and diagrams, which start out analog and on paper ⟦s000547-s000549⟧", "Paper prototyping and the later build of the actual system ⟦s000570⟧"]}, {"type": "paragraph", "text": "So we know how to find a problem worth solving. Next up, we'll look at real interactive system examples, including a cross-device idea capture tool called Scrapper and a domain-specific decision helper for fishing regulations, and see how they get tested with iterative field feedback!"}]}], "4": [{"card_type": "hook", "hero_emoji": "🎯", "title": "Don't Build for Everyone", "content_blocks": [{"type": "quote", "text": "Great interactive systems don't try to solve everything; they zoom in on one real person's one real problem."}, {"type": "paragraph", "text": "Think of it like a tailor who makes one perfect suit instead of a rack of clothes that fits nobody. The professor's examples show how a single focused problem can grow into a whole system."}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "Notes That Remember for You", "content_blocks": [{"type": "paragraph", "text": "The Scrapper team started from a real pain point: writers have ideas and then forget they already had them. ⟦s000592-s000593⟧"}, {"type": "callout", "alert_type": "info", "text": "The system spans devices: a Chrome extension and a companion mobile app sync through your Google account, so an idea captured anywhere lands in one shared database. ⟦s000589-s000599⟧"}, {"type": "paragraph", "text": "Later, when you write something similar, the system compares your new thought against the stored notes and offers its **top three suggestions**. ⟦s000604-s000611⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🐟", "title": "One Problem, Real Feedback", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Professor's pro-tip: the team 'pinpointed and focused on' one problem and made an entire system around it. That focus is the whole point. ⟦s000612-s000614⟧"}, {"type": "paragraph", "text": "The fishing app shows the same idea in another domain. California's fishing rules depend on location, species, and size, so the app takes a photo, sends it to an LLM for species identification, and combines that with the user's location and length to say whether a fish must be released. ⟦s000619-s000627⟧ ⟦s000639-s000645⟧"}, {"type": "paragraph", "text": "Systems like this are never finished on the first try. The team pitched ideas to real users, got direct feedback, and went back and forth between interviews and prototypes for 10 weeks. ⟦s000655-s000659⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "Wrapping Up the Showcase", "content_blocks": [{"type": "paragraph", "text": "We saw two student projects, Scrapper and a fishing regulations app, and how each began with one focused problem and was refined through repeated user feedback."}, {"type": "paragraph", "text": "Curious? Dig into these too:"}, {"type": "list", "items": ["The ranking algorithm that picks the top three similar notes in Scrapper", "The API layer that sends fishing photos to an LLM for species identification", "The gamification system that ranks anglers by catches"]}, {"type": "paragraph", "text": "Today's lecture started with analyzing user goals and the context of use, moved through HCI design lenses and inclusive assumptions, and built toward user research, personas, and iterative prototyping. These student projects put all of that into practice, showing how a focused problem can become a working system."}]}]}, "deep_notes": {"1": "# 1. Analyzing Interactive Experiences and Their Contexts\n\nEvery interface is used by a particular person, in a particular place, for a particular purpose, and with particular effects. Analyzing an interaction means looking past the screen or control to ask about the **context of use**, the **user goals**, the **interface choices and affordances**, and the **user experience and impact** that together determine whether the design actually works for someone.\n\n## 🔍 Starting From Everyday Interactions\n\nThe analysis begins with familiar moments. Students were asked to recall one day's worth of interactions, and several described making espresso coffee on a machine. One student said they only pressed a few buttons, such as the power button and another button.⟦s000098-s000100⟧ Another student made coffee on a machine with a specific named function, and a different student described using a microwave.⟦s000102-s000105, s000113⟧ These examples show how ordinary tasks already involve interfaces with buttons, modes, and outcomes, which is the starting point for asking deeper questions.\n\nThe questions to ask about such interactions fall into a few groups. They include the context, the setting, the users, the relationships between users, the goals, and the impact on the person.⟦s000132-s000137⟧ For instance, the presence of a roommate or family member watching while someone makes coffee or heats oatmeal changes what the interaction means.⟦s000134-s000135⟧\n\n## 🌍 Context of Use\n\n**Context of use** includes the physical, social, and situational conditions in which someone interacts with a technology. The physical part covers where the interaction happens, while the social part covers who is present, such as a roommate, a family member, or a crying child.⟦s000135-s000136⟧ The situational part includes conditions like whether a user can hear audio or is watching alone or with a group.⟦s000151⟧\n\nContext also extends beyond the room. The analysis includes the **social and political context** in which media is delivered to a person, not only the physical environment.⟦s000152-s000153⟧ The reason this matters is that the same interface can support one person well and hinder another, depending on these circumstances.\n\n## 🎯 User Goals\n\n**User goals** are the outcomes people seek through an interaction. These goals may differ from the immediate task that an interface appears to support. The key distinction is between a direct goal and a means to an end. Drinking coffee may be the explicit goal, or coffee may be a means of making it to class on time.⟦s000136⟧\n\nConsidering both kinds of goals helps designers see which actions an interface makes easy and which broader needs it may overlook. A person who only needs coffee quickly has different needs from a person who needs to leave for class, even though both are using the same machine.\n\n## 🧭 Interface Choices and Affordances\n\n**Interface choices and affordances** are the options, controls, and cues that shape how people can act within a system. Examining them shows how an interface guides attention and action rather than presenting neutral features.⟦s000142-s000146⟧\n\nThe YouTube example illustrates this clearly. On the left side of the layout, options such as home, shorts, subscriptions, and history appear.⟦s000144-s000145⟧ The analysis asks which goals these options facilitate, which they promote or demote, and where a user is likely to begin when faced with many simultaneous choices.⟦s000146-s000147, s000154-s000156⟧\n\nThese questions also reveal assumptions about the **intended user**. Designers may assume a particular kind of physical device or a particular viewing situation.⟦s000148, s000150⟧\n\n## 🏠 Context and Choices in Other Technologies\n\nThe same questions apply to other technologies. Voice assistants, such as Siri, Echo, and Alexa, are placed in many settings, including next to a nightstand, in the kitchen, in a car, or in a bathroom. Each placement changes what the interaction means and what data might be gathered to support it.⟦s000158-s000159, s000164-s000169⟧\n\nA specific feature shows how context shapes interpretation. One voice assistant allowed a user to turn a deceased loved one's voice into the assistant's voice.⟦s000160⟧ In a benign context, a person might miss a grandmother and want to hear her voice. In another context, the same feature could feel creepy or disrespectful, particularly if the relationship was strained.⟦s000161-s000163⟧ The feature is the same, but its appropriateness depends on context and who is using it.\n\nChatbot tools present a parallel case. Typing natural language and receiving text or code may feel routine, but the analysis asks whether this is the only interaction that should be supported.⟦s000172-s000174⟧ A person deep in a code base may need information without switching to a separate chat interface or leaving a visual environment.⟦s000175-s000179⟧ The questions then turn to which goals this interaction makes easy and what expectations users bring, including the veracity of the information and the speed and format of its delivery.⟦s000180-s000182⟧\n\n## ❤️ User Experience and Impact\n\n**User experience** includes how an interaction affects a person cognitively, emotionally, and practically. The analysis considers what information a person wishes they had during a task. Examples include knowing that oatmeal is about to boil over, or knowing that coffee is over-extracted or under-extracted.⟦s000137-s000139⟧\n\nEmotional state also matters. The analysis asks how a person feels before, during, and after an interaction.⟦s000157⟧ This perspective captures consequences that are not measured by whether a task can technically be completed.\n\nHealth-tracking devices illustrate this dimension. Smart watches, Fitbits, rings, and similar devices collect health data, and the analysis asks what data is collected and how it is presented to the user.⟦s000184-s000196⟧ When Apple Health was first rolled out, one aspect of health was not included in the initial release, namely the menstrual period.⟦s000199-s000208⟧ The omission suggests that assumptions about who the end user is shape which needs a system addresses, and that end users can indirectly set expectations about who the users are.⟦s000209-s000210⟧\n\n## 🎯 Key Takeaway\n\nAnalyzing an interaction requires asking who is involved, where and when it happens, what the person is trying to achieve, how the interface shapes action, and what effects the interaction has on the person. Each of these questions can reveal gaps between what a technology supports and what its users actually need.", "2": "# 2. Design Consequences and the HCI Perspective\n\nThe HCI design lens treats every interactive technology as the result of deliberate choices, and it asks who a system serves, what it encourages or discourages, and what information it collects or presents. Because those choices have consequences, a user's difficulty is not automatically a personal failing.\n\n## 🔍 What the HCI Design Lens Asks\n\nThe HCI design lens is a way of examining how interactive technologies shape people's experiences, relationships, and actions. It asks who a system is designed for, what it encourages or discourages, and what information it collects or provides.⟦s000195-s000196⟧ Applying the lens to a health-tracking device, for example, means asking what data is being collected and how it is presented back to us.⟦s000192-s000196⟧\n\n## ⚙️ Interfaces Are Never Accidental\n\nThe central claim is that **no interaction with technology happens by accident**. Interactions are intentionally designed, and those designs are constant, shaping every experience a person has with a system.⟦s000211-s000212⟧ This is the core of **intentional design**: an interface's structure and behavior come from decisions about what the system makes possible or difficult.\n\nThis connects directly to lived experience. Whether an app produces frustration or immense joy, other people may have a different experience of the same system.⟦s000213-s000214⟧ When someone concludes \"I'm probably just not doing it right,\" that conclusion might not actually be the user's fault or the designer's fault. It may instead be an **unintended consequence** of how the technology was built.⟦s000215-s000218⟧\n\n## 🧭 Design as Devising Artifacts\n\nEarly research in AI and HCI described design as being concerned with devising artifacts.⟦s000219-s000220⟧ Don Norman, an engineer who became a cognitive scientist, popularized this view in *The Design of Everyday Things*, which explored how good designers think about the things people use.⟦s000220-s000222⟧ Viewing design this way means treating every product as a made object whose reasoning and consequences can be examined.\n\n## 🌐 Consequences for Ourselves, Each Other, and the World\n\nDesign choices affect people's experiences with themselves, with each other, and with the world.⟦s000226-s000228⟧ Designers should pay attention to three kinds of choices:\n\n- **What is promoted and what is demoted** in an interaction.⟦s000230-s000231⟧\n- **Which reasoning is facilitated**, whether cognitive, social, or emotional.⟦s000232-s000233⟧\n- **Who the system is built for**, and who it leaves out.⟦s000209, s000282⟧\n\n## 🩺 Example: The Apple Health Omission\n\nThe initial rollout of Apple Health, a health-tracking app that monitors many metrics, did not include period tracking.⟦s000203-s000206, s000208⟧ The example shows that a product implicitly defines its expected users through what it measures. An omission communicates an assumption, and it leaves an important user need unsupported.⟦s000206-s000209⟧ The lesson is that inclusive design requires asking which people and needs a system represents and which it excludes.\n\n## ❓ How Questions Shape Answers\n\nThe way we pose questions influences the kinds of answers we allow ourselves to accept and the things we learn.⟦s000239-s000241⟧ For a data-focused project, this means asking who a system enables, for what purpose, what type of data is involved, where that data comes from, and whether a reliable source exists.⟦s000281-s000282⟧ Designers are encouraged to observe, listen, and ask questions constantly, of themselves, of each other, and of the artifacts they encounter and create.⟦s000248-s000249⟧\n\n## 🎯 Key Takeaway\n\nThe most important idea is to bring an **HCI lens** to any future problem, whether in engineering, research, computer science, or cognitive science.⟦s000234-s000236⟧ Doing so means recognizing that design decisions carry consequences, and that difficulties users face should be examined as possible design outcomes rather than dismissed as individual failures.⟦s000215-s000218, s000226-s000228⟧", "3": "# 3. User Research and Project Development\n\nThe project process described here moves from a rough idea, through user research, to a problem statement, personas, and scenarios, and finally to prototypes and a built system. Each stage builds on the one before it, so research findings shape who the system is for and what it should do.⟦s000511⟧\n\n## 🔍 Starting From a Hypothesis\n\nThe process begins with a hypothesis, which is a working guess about a problem worth exploring.⟦s000543⟧ In the example given, the team's hypothesis was that the U.S. immigration process is often confusing and incomprehensible.⟦s000544⟧ The motivation came from experience: many group members had family members or loved ones who had applied for either a work visa or an F-1 visa, and had seen how convoluted the process could be.⟦s000540-s000542⟧\n\nThe team's premise was to make the process less convoluted by turning it into a linear, step-by-step process, at least for informational purposes.⟦s000524⟧ This framing shows how a broad hypothesis narrows into a specific design goal.\n\n## 🧭 User Research and User Interviews\n\nOnce the hypothesis is set, the next step is user research, which aims to identify the people the system should serve and the problems they face.⟦s000545-s000546⟧ Based on this research, designers conduct user interviews and create diagrams and process maps.⟦s000547-s000548⟧ The process is intentionally analog at the start: the early work is done on paper rather than in software.⟦s000549⟧\n\nThe interviews are the bridge between a hypothesis and real user experience. They reveal how people actually encounter the difficulties, which the team can then translate into design decisions.\n\n## 👥 From Research to Personas and Scenarios\n\nAfter research is complete, the findings are grouped into **user profiles**, which organize the different people the team intends to target.⟦s000552-s000554⟧ Once the team has a clear idea of the group it is trying to help, it begins sketching a flow that shows how it expects those users to interact with the system.⟦s000555-s000559⟧\n\nPersonas, as described by former students, capture the target audience, what that audience wants, and what challenges it faces with respect to the problem.⟦s000578-s000583⟧ Designers then focus on these people and craft the interactive system around them.⟦s000584-s000585⟧ Scenarios describe the situations these users will go through inside the system, and the project also includes some form of evaluation.⟦s000586-s000588⟧\n\n## 📝 The Problem Statement\n\nAfter user research, the team writes a **problem statement** that names the people affected and the gap they experience. In the visa example, the problem statement was that people in the U.S. immigration process seek reliable and understandable sources outside of attorneys.⟦s000561-s000564⟧ The statement also explains the obstacle: this information is often hard to find and difficult to interpret for people of various backgrounds, which adds to confusion and anxiety about the process.⟦s000565-s000566⟧\n\nA **storyboard** follows the problem statement. It tells a story of what the targeted user is going through, connecting the problem to a concrete experience.⟦s000568-s000569⟧\n\n## 🛠️ Iterative Prototyping\n\nDevelopment proceeds in stages. The team begins with the most basic prototype, a paper prototype, and later moves toward actually building the system.⟦s000570⟧ Research, prototyping, and refinement happen over the course of the quarter rather than as a single step.⟦s000570⟧\n\nThe design is not limited to one format. The example system included a Google Chrome extension together with a companion mobile app, showing that the interactive system can take forms beyond a computer or website.⟦s000589, s000590-s000591⟧\n\n## 🎯 Key Takeaway\n\n- **Research drives design:** Hypotheses, user interviews, personas, and problem statements each narrow the focus until the system is built around specific people and their needs.⟦s000543, s000547, s000578-s000585⟧\n- **Prototypes come first, then refinement:** Starting with paper prototypes allows the team to explore interactions before committing to implementation.⟦s000549, s000570⟧", "4": "# 4. Interactive System Examples and Evaluation\n\nThis segment walks through two student-built interactive systems to show how interview findings and a clearly chosen problem can be turned into a working tool. The Scrapper project pairs a browser extension with a mobile companion for cross-device idea capture, while the fishing-regulation app uses photo, location, and size data to support a legal keep-or-release decision, refined through repeated field feedback.\n\n## 🧭 From User Research to a Focused Problem\n\nThe path to a system begins with user research, which is grouped into user profiles and then narrowed to a single problem. In the Scrapper example, the team defined the problem as people in the US immigration process seeking reliable and understandable sources outside of attorneys, where such information is often hard to find and difficult to interpret for people of various backgrounds, adding to confusion and anxiety.⟦s000560-s000566⟧ Once the problem is clear, the team builds personas, which describe who the target audience is, what they want, and what challenges they face with regard to the problem.⟦s000577-s000583⟧\n\nPersonas then guide the design. The team focuses on these people, crafts the interactive system around them, and maps out the scenarios each persona will go through within the system, along with some form of evaluation.⟦s000584-s000588⟧ Earlier stages in this process include a storyboard that narrates what the targeted user experiences, which precedes the system design.⟦s000568-s000569⟧\n\n## 🧩 Cross-Device Idea Capture in Scrapper\n\nThe Scrapper team used interviews to learn about the everyday challenges writers face, and this led them to decide that one device was not enough.⟦s000592-s000595⟧ The system therefore combined a **Google Chrome extension** with a **companion mobile app**, and the team believed few other groups in their quarter used a browser extension in this way.⟦s000589⟧ Writers can create notes on a computer or on the mobile app, and both sync together when logged into the same Google account.⟦s000598-s000599⟧\n\nThe key idea is what happens when a writer later cannot recall where an idea was recorded. The system stores a database of notes, and a writer who suspects they once had a similar thought can compare new writing against that database.⟦s000600, s000603-s000606⟧\n\n## 🔎 Similarity-Based Note Retrieval\n\nThe retrieval feature addresses a specific gap: the writer remembers an idea was recorded but not where it lives. Scrapper returns a short ranked list, specifically the top three suggestions, produced by a ranking algorithm, so the writer can check whether something similar was already written.⟦s000609-s000611⟧ The team emphasized that this single problem was pinpointed and focused on, and the entire system was built around it.⟦s000612-s000614⟧\n\n> The design principle here is that a system can be organized around one well-chosen problem rather than many loosely related features.⟦s000612-s000614⟧\n\n## 🐟 Domain-Specific Decision Support for Fishing\n\nThe second example began with a team member who fishes often and wanted an app that makes the act of recording a catch easy. The difficulty lies in regulations: in California, legality depends on the fishing area, the size of the fish, and the species.⟦s000620-s000627⟧ The goal was to streamline this check so fishermen can determine what they are allowed to do with a catch.⟦s000628-s000629⟧\n\nThe app brings these pieces of information together in a sequence:\n\n1. **Species identification:** An API layer sends a photo to an LLM, which identifies the species.⟦s000639-s000640⟧\n2. **Context entry:** The user types in the location and the length of the fish, for example 12 inches.⟦s000641-s000642⟧\n3. **Regulatory verdict:** The app tells the user whether the fish must be released, indicating the catch cannot be kept.⟦s000645⟧\n\nThe app also supports record keeping. Users document how many fish they caught and how many they released, and the history view shows totals for catches, safe releases, and safe keeps.⟦s000646-s000648⟧ A gamified element shows ranks based on how many fish a user catches.⟦s000649-s000650⟧\n\n## 🔁 Iterative Field Feedback\n\nThe fishing team developed the app through repeated contact with its intended users. They pitched the idea to fishermen, received direct feedback, and went back and forth on certain features, with the process cycling through interviewing, prototyping, and interviewing again.⟦s000655-s000658⟧ The final result reflects about ten weeks of this iterative work.⟦s000657⟧ This approach shows that user research does not end at the start of a project; it continues as the system takes shape.⟦s000655-s000659⟧\n\n## 🎯 Key Takeaways\n\n* **Focus on one problem:** A clearly defined problem, supported by personas and scenarios, guides which features a system needs.⟦s000577-s000588, s000612-s000614⟧\n* **Look beyond the default device:** Interview insights can justify combining a browser extension with a mobile companion, or other non-standard formats.⟦s000589-s000592⟧\n* **Combine data for decisions:** Domain-specific tools can merge photos, location, size, and species to answer a rule-based question.⟦s000639-s000645⟧\n* **Iterate with users:** Repeated feedback from intended users shapes features throughout development.⟦s000655-s000658⟧"}, "fun_facts": {"title": "The Voice Assistant That Couldn't Hear Half the World 🎙️", "hook": "Did you know that early voice recognition systems could misunderstand women's speech far more often than men's, simply because the engineers training them had mostly recorded men? It turns out a voice assistant can be quietly unfair to half its users without anyone intending it.", "body": "The idea behind today's HCI design lens, that a system only serves the people its designers pictured, shows up dramatically in how voice technology learned to listen.\n\nIn one audit of OpenAI's Whisper speech model, the baseline version had a word error rate of 11.69% for women compared with 9.07% for men, a gap that quietly penalized every female speaker who used it⟦1⟧.\n\nThe culprit was unbalanced training data: when speech systems learn mostly from one group's voices, they become fluent in that group and stumble over everyone else, a pattern researchers have tied to the fact that voice recognition was often designed by and largely for men⟦2⟧.\n\nThe fix was not simply to add more women, because researchers found the best balance appeared around 60 to 70 percent women in the training set, showing that fairness depends on careful design rather than a neat 50-50 split⟦3⟧.\n\nThe next time your phone misunderstands you, remember that the question is not just how smart the machine is, but whose voice it was built to hear.", "sources": ["https://arxiv.org/html/2502.18434v1", "https://makingnoiseandhearingthings.com/2016/07/12/googles-speech-recognition-has-a-gender-bias/", "https://www.researchgate.net/publication/389351890_Exploring_Gender_Disparities_in_Automatic_Speech_Recognition_Technology"]}}, "gemini": {"review_cards": {"1": [{"card_type": "hook", "title": "Beyond the Button Press", "hero_emoji": "🤔", "content_blocks": [{"text": "Ever just hit a button on your espresso machine or microwave and not think twice? What if every interaction had a secret story?", "type": "quote"}, {"text": "We interact with countless interfaces every day, from making coffee to heating oatmeal. But how often do we stop to truly **analyze** what's happening behind the scenes, and what impact those designs have? ⟦s000091-s000128⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "Unpacking the 'Why' of Design", "hero_emoji": "🔍", "content_blocks": [{"text": "Analyzing interactions isn't just about *what* buttons you press, but **why** those buttons exist and what happens when you do. ⟦s000129-s000133⟧", "type": "paragraph"}, {"text": "Every interaction is a complex web of **context, users, goals, and impact**. We need to ask deep questions about each! ⟦s000134-s000137⟧", "type": "callout", "alert_type": "info"}, {"type": "list", "items": ["**Context & Setting:** Where is this happening? Physical, social, political environment? ⟦s000134, s000152-s000153⟧", "**Users & Relationships:** Who is using it? Alone or with others? What are their needs? ⟦s000134-s000135, s000148-s000151⟧", "**Goals:** What are users trying to achieve? Explicit or implicit? What goals does the design promote/demote? ⟦s000136, s000146-s000147, s000180⟧", "**Impact:** What information is missing? What's the emotional state before/during/after? What are the consequences? ⟦s000137-s000139, s000154-s000157⟧"]}, {"text": "From YouTube's layout to voice assistants and AI chatbots, these questions help us understand and design technology with human considerations in mind. ⟦s000140-s000141, s000142-s000182⟧", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "The Invisible User & Design Blind Spots", "hero_emoji": "💡", "content_blocks": [{"text": "Sometimes, the biggest design flaw isn't a bug, but an **unspoken assumption** about who the user is, or isn't. ⟦s000209-s000210⟧", "type": "paragraph"}, {"text": "The initial Apple Health app launch famously **omitted period tracking** ⟦s000206-s000208⟧. This wasn't an oversight; it revealed a fundamental lack of **inclusive assumptions** about its diverse user base! ⟦s000209-s000210⟧", "type": "callout", "alert_type": "warning"}, {"text": "This highlights that designers must actively consider *all* potential users and their unique needs, not just a default or assumed demographic. Otherwise, you create a system that works for some, but fails others. ⟦s000209-s000210⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "Beyond the Surface", "hero_emoji": "➡️", "content_blocks": [{"text": "We've explored how to look beyond the superficial interaction and ask critical questions about context, users, goals, and the often-unseen impact of design decisions.", "type": "paragraph"}, {"text": "Curious? Dig into these too:", "type": "paragraph"}, {"type": "list", "items": ["The specific interactions shared by Emily, Jason, and Bonshika ⟦s000098-s000128⟧", "The full list of questions posed for YouTube's interface ⟦s000144-s000157⟧", "The ethical considerations of voice assistants using 'dead loved one's voices' ⟦s000160-s000163⟧", "Detailed questions about chatbot (ChatGPT) interaction design ⟦s000174-s000182⟧"]}, {"text": "Now that we've seen how design choices have profound consequences, we'll dive deeper into the **HCI design lens** and explore **intentional design** to make more **inclusive assumptions about users**.", "type": "paragraph"}]}], "2": [{"card_type": "hook", "title": "It's Not You, It's The Design!", "hero_emoji": "💡", "content_blocks": [{"text": "No interactions with technology are by accident. They are intentionally designed. ⟦s000211-s000212⟧", "type": "quote"}, {"text": "Ever felt frustrated with an app and thought, 'Ugh, I'm probably just doing it wrong?' Think again! That frustration isn't your fault; it's often an **unintended consequence of the design itself**. ⟦s000213-s000218⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "Design Shapes Our World", "hero_emoji": "🌍", "content_blocks": [{"text": "Design isn't just about making things look pretty; it's about **devising artifacts** that shape our reality. ⟦s000219-s000220⟧", "type": "paragraph"}, {"text": "As Don Norman, author of *The Design of Everyday Things*, and other early HCI researchers highlighted, the choices designers make have a **profound impact** on our experiences with ourselves, each other, and the world. ⟦s000220-s000228⟧", "type": "paragraph"}, {"text": "Every design choice—what we promote, what we demote—facilitates certain kinds of **cognitive, social, or emotional reasoning**. Design literally guides how we think and feel! ⟦s000230-s000233⟧", "type": "callout", "alert_type": "info"}]}, {"card_type": "gotcha", "title": "The HCI Lens: Your Superpower", "hero_emoji": "🔍", "content_blocks": [{"text": "If there's one takeaway from this course, it's to **bring an HCI lens to ANY problem** you encounter, anywhere! ⟦s000234-s000236⟧", "type": "callout", "alert_type": "warning"}, {"text": "What does that mean? It means being **curiosity-driven** and understanding how the questions we ask influence the answers we accept. ⟦s000239-s000241⟧", "type": "paragraph"}, {"text": "It's about learning to **observe, listen, and constantly ask questions** of yourself, others, and the artifacts around you. This critical perspective is a marker of success in any field. ⟦s000248-s000253⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "Apply Your New Vision", "hero_emoji": "➡️", "content_blocks": [{"text": "We've just uncovered how intentional design shapes every interaction and why adopting an HCI lens—being curious, observant, and questioning—is your most powerful tool.", "type": "paragraph"}, {"text": "Curious? Dig into these too:", "type": "paragraph"}, {"type": "list", "items": ["The specific examples of projects like the **Toastmasters platform** ⟦s000267-s000273⟧", "How **3D/VR interactions** were prototyped for game engine creation ⟦s000275-s000278⟧", "The current project theme: **enabling novel data interaction** ⟦s000281-s000287⟧", "The class rule of **not using computers or phones** during learning ⟦s000253⟧"]}, {"text": "So, how do we actually *apply* this HCI lens to build better experiences? Next, we'll dive into **User Research and Project Development**, exploring **user interviews**, creating **personas and user scenarios**, and using **iterative prototyping** to bring designs to life!", "type": "paragraph"}]}], "3": [{"card_type": "hook", "title": "Your Project's Adventure Map", "hero_emoji": "🗺️", "content_blocks": [{"text": "Building an awesome interactive system isn't just coding—it's a whole process, starting from finding an idea, doing user research, and then having a final product! ⟦s000511⟧", "type": "quote"}, {"text": "Think of it like planning a grand adventure: you don't just start walking! You need a map, a destination, and a deep understanding of the terrain and who you're traveling with.", "type": "paragraph"}]}, {"card_type": "core_why", "title": "Start with the 'Why'", "hero_emoji": "🕵️‍♀️", "content_blocks": [{"text": "Before you build, you need to know **what problem you're solving** and **for whom**. Our example project tackled the incredibly convoluted US immigration visa process. ⟦s000524, s000540-s000542⟧", "type": "paragraph"}, {"text": "This starts with a **hypothesis**—your educated guess about the problem. For the visa project, it was: 'the U.S. immigration process is often confusing and incomprehensible.' ⟦s000543-s000544⟧", "type": "paragraph"}, {"text": "Why bother? Because building without understanding your users is like designing a car without knowing if people need to drive on roads or fly to the moon!", "type": "callout", "alert_type": "info"}, {"text": "From there, you dive into **user research** to validate your hypothesis and understand your target audience. This means user interviews and creating initial diagrams and process maps, often on paper! ⟦s000545-s000549⟧", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "The Problem Statement Power-Up", "hero_emoji": "💡", "content_blocks": [{"text": "The real magic of user research isn't just gathering data; it's transforming that data into **actionable insights**.", "type": "paragraph"}, {"text": "After interviews and analysis, you'll create **user profiles** to group and understand your target audience. ⟦s000552-s000554⟧", "type": "paragraph"}, {"text": "The ultimate output of this research phase is a crystal-clear **problem statement**. This is your North Star! For the visa project, it was: 'People in the US immigration process seek reliable and understandable sources outside of attorneys, but this information is often hard to find and difficult to interpret, adding to confusion and anxiety.' ⟦s000560-s000567⟧", "type": "callout", "alert_type": "warning"}, {"text": "This statement defines *exactly* what you need to solve, guiding all your design decisions. Once you have this, you can start creating a **plot flow** for how users will interact with your system and **storyboards** to visualize their journey. ⟦s000555-s000559, s000568-s000569⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "Design, Develop, Deliver!", "hero_emoji": "🚀", "content_blocks": [{"text": "We've explored the crucial early stages of interactive system development, from identifying a problem and forming a hypothesis to conducting user research and crafting a precise problem statement.", "type": "paragraph"}, {"text": "Curious? Dig into these too:", "type": "paragraph"}, {"type": "list", "items": ["Specific techniques for creating **diagrams and process maps** during user research ⟦s000548⟧", "Detailed methods for designing **system plot flows** ⟦s000558-s000559⟧", "How to effectively create compelling **user storyboards** ⟦s000568-s000569⟧", "The 'lot of other user research' methods mentioned ⟦s000570⟧"]}, {"text": "Next, we'll dive into concrete examples of interactive systems and explore how we evaluate their effectiveness, including cross-device idea capture and domain-specific decision support!", "type": "paragraph"}]}], "4": [{"card_type": "hook", "title": "Design for Real People", "hero_emoji": "👥", "content_blocks": [{"text": "Who are you designing for? What do they want? What challenges do they face? These are the questions that kick off great interactive systems!", "type": "quote"}, {"text": "Before you even think about code, you need to understand your **target audience**. This means creating **personas** – detailed profiles of your ideal users – and mapping out **scenarios** they'll encounter. ⟦s000579-s000587⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "Solving Real-World Problems", "hero_emoji": "💡", "content_blocks": [{"text": "Once you know your users, you can craft systems that truly solve their problems. The world's your oyster – don't limit yourself to just websites! ⟦s000590-s000591⟧", "type": "paragraph"}, {"text": "Take **Scrapper**, for example: a Chrome extension and mobile app combo for writers. It tackles the challenge of capturing fleeting ideas across devices and helps retrieve similar thoughts later, even years apart! ⟦s000592-s000606⟧", "type": "paragraph"}, {"text": "Or consider the **fishing regulation app**. It streamlines the complex rules for catching fish in California, using an LLM to identify species from a photo and instantly tell you if your catch is legal based on location and size. No more guessing! ⟦s000624-s000627⟧ ⟦s000639-s000645⟧", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "The Iterative Feedback Loop", "hero_emoji": "🔄", "content_blocks": [{"text": "The secret sauce to a successful interactive system isn't just a great idea, it's the **relentless cycle of feedback and refinement**! ⟦s000655-s000659⟧", "type": "callout", "alert_type": "info"}, {"text": "You don't just build it and ship it. You **pitch your idea**, get direct feedback from users, go back to **prototyping**, interview again, and keep iterating. This back-and-forth process is how you arrive at a truly polished and useful product. ⟦s000655-s000658⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "Reflect & Connect", "hero_emoji": "🎓", "content_blocks": [{"text": "We've explored how user research, personas, and iterative feedback drive the creation of effective and diverse interactive systems, from cross-device note-taking to domain-specific decision support.", "type": "paragraph"}, {"text": "Curious? Dig into these too:", "type": "paragraph"}, {"type": "list", "items": ["The specific **ranking algorithm** Scrapper uses for similarity-based note retrieval ⟦s000610⟧", "The detailed implementation of the **API layer** for the fishing app's LLM integration ⟦s000639-s000640⟧", "The exact mechanics of the **gamification** features in the fishing app ⟦s000649-s000650⟧"]}, {"text": "Today, we've journeyed from analyzing interactive experiences and their contexts, through understanding design consequences from an HCI perspective, to the practical application of user research and iterative prototyping in developing real-world systems. This final look at interactive system examples and their evaluation brings our lecture to a close, highlighting how intentional design and continuous feedback lead to impactful user experiences.", "type": "paragraph"}]}]}, "deep_notes": {"1": "## 🔍 Why Analyze Interactive Experiences?\nTo effectively understand and design technology, it is crucial to consider various factors that shape how people interact with interfaces. This includes the setting, the users involved, their relationships, their goals, and the overall impact these interactions have on them. By asking specific questions about these elements, designers can create more thoughtful and effective technologies.⟦s000132-s000134, s000140-s000141⟧\n\n## 🌍 Context of Use\nThe **context of use** encompasses the specific conditions under which an interaction occurs, including physical, social, and situational aspects. These conditions significantly influence how an interface is perceived and used.\n\nKey questions to consider about context include:\n*   **Physical Environment**: Where is the interaction happening? Is it on a specific kind of physical device? Can the user listen to audio, or are they in a silent environment?⟦s000150-s000151, s000164-s000167⟧\n*   **Social Setting**: Is the user alone or with a group of people? Are there other individuals present, such as a roommate or family member, observing the interaction?⟦s000135, s000151⟧\n*   **Situational Factors**: What is the broader social and political context in which the media or technology is presented? What are the possible sources of data these devices might be collecting or using?⟦s000153, s000168-s000169⟧\n\n### 💡 Examples of Contextual Analysis:\n*   **Making Coffee**: Consider if a roommate or family member is watching while coffee is being made.⟦s000135⟧\n*   **Using YouTube**: The experience changes depending on whether you can listen to audio, if you are watching alone or with others, and the physical device being used.⟦s000150-s000153⟧\n*   **Voice Assistants**: The placement of a voice assistant (e.g., next to a nightstand, in the kitchen, car, or bathroom) affects its utility and appropriateness.⟦s000164-s000167⟧\n*   **Chatbots (e.g., ChatGPT)**: The setting for asking information from a chatbot matters; for instance, if a user is deep in a codebase, they might not want to switch to a different chat interface.⟦s000175-s000177, s000179⟧\n\n## 🎯 User Goals\n**User goals** refer to the desired outcomes a person aims to achieve through an interaction. These can be explicit, immediate tasks or broader, underlying motivations.\n\nKey questions to consider about user goals:\n*   **Explicit vs. Implicit Goals**: What are the direct goals (e.g., to drink coffee)? What are the underlying or indirect goals (e.g., using coffee as a means to get to class on time, or to ignore a crying child)?⟦s000136⟧\n*   **Facilitation and Demotion**: Which goals do the interface's features or options facilitate, promote, or demote?⟦s000146-s000147, s000180⟧\n*   **Intended User**: Who is the intended user for this interface or interaction?⟦s000148-s000149, s000161⟧\n\n### 💡 Examples of Goal Analysis:\n*   **Making Coffee**: The explicit goal might be to drink coffee, but the implicit goal could be to stay awake for class.⟦s000136⟧\n*   **YouTube Navigation**: The options on the left-hand side (Home, Shorts, Subscriptions, History) are designed to facilitate specific user goals, promoting some while potentially demoting others.⟦s000144-s000147⟧\n*   **Voice Assistants with Deceased Voices**: While a benign goal might be to hear a grandmother's voice, other contexts could make it feel creepy or disrespectful, especially if the relationship was not positive.⟦s000161-s000163⟧\n*   **AI Chatbots**: These interactions make it easy to get information or code in natural language, but designers should question if these are the *only* interactions that should be supported.⟦s000172-s000174, s000180⟧\n\n## ⚙️ Interface Choices and Affordances\n**Interface choices and affordances** refer to the design decisions, controls, and cues within a system that shape how users can interact and what actions are made easy or difficult.\n\nKey questions to consider about interface choices:\n*   **Navigation and Options**: Why are specific options presented? How do they guide user attention and action?⟦s000144-s000145⟧\n*   **Ease of Use**: What kinds of interactions does the interface make easy?⟦s000180⟧\n*   **User Expectations**: What expectations do end-users bring to these systems regarding information veracity, speed, and format?⟦s000181-s000182⟧\n\n### 💡 Examples of Interface Choices:\n*   **YouTube Interface**: The specific layout and options on the left-hand side (Home, Shorts, Subscriptions, History) are deliberate choices that guide users and influence where they might begin their interaction.⟦s000142-s000145, s000156⟧\n*   **AI Chatbots**: The standard interaction of typing natural language text to receive natural language output or code is a specific interface choice. It prompts questions about whether other interaction models should be supported, especially when users are in different contexts, like deep in a codebase.⟦s000172-s000174, s000176-s000177, s000179⟧\n\n## 💖 User Experience and Impact\nThe **user experience and impact** encompass the cognitive, emotional, and practical effects an interaction has on a person, both during and after using a technology.\n\nKey questions to consider about user experience and impact:\n*   **Desired Information**: What information did the user wish they had during the interaction?⟦s000138-s000139⟧\n*   **Emotional State**: What was the user's emotional state before, during, and after the interaction? Does the interface make it clear where to begin?⟦s000154-s000157⟧\n*   **Consequences**: What are the broader consequences or implications of the interaction, including potential discomfort or disrespect?⟦s000163⟧\n*   **Data Presentation**: How is collected data presented to the user, and what does this presentation imply about the intended user or the system's priorities?⟦s000195-s000196, s000206-s000210⟧\n\n### 💡 Examples of User Experience and Impact:\n*   **Cooking Oatmeal/Coffee**: A user might wish they knew if their oatmeal was about to boil over, or if their coffee was over- or under-extracted.⟦s000138-s000139⟧\n*   **YouTube Interface**: Seeing many options can impact a user's emotional state and their ability to know where to begin.⟦s000154-s000157⟧\n*   **Voice Assistants with Deceased Voices**: The impact can range from comforting (missing a loved one) to creepy or disrespectful, depending on the relationship and context.⟦s000162-s000163⟧\n*   **Health-Tracking Devices (e.g., Apple Health)**: These devices collect and present health data. A notable example of impact is the initial rollout of Apple Health, which did not include period tracking. This omission implicitly set a tone for who the expected end-user was, highlighting how design choices can overlook significant user needs and experiences.⟦s000184-s000196, s000199-s000210⟧", "2": "## 💡 Intentional Design and Its Consequences\nNo interactions with technology occur by accident; they are all **intentionally designed** ⟦s000211-s000212⟧. These designs have constant impacts, influencing every experience users have with applications, whether it results in frustration or immense joy ⟦s000213-s000214⟧. Often, when users struggle with technology, they might assume it's their own fault ⟦s000215⟧. However, this difficulty might not be the user's fault at all, but rather an **unintended consequence** of the technology's design ⟦s000217-s000218⟧.\n\nEarly research in AI and Human-Computer Interaction (HCI) described design as being concerned with devising artifacts ⟦s000219⟧. As noted by Don Norman, author of *The Design of Everyday Things*, the way things are designed profoundly impacts our experiences with ourselves, with each other, and with the world ⟦s000220-s000228⟧. Design choices determine what interactions are promoted versus demoted, and what kinds of cognitive, social, or emotional reasoning are facilitated ⟦s000230-s000233⟧.\n\n## 🔍 Applying the HCI Design Lens\nA core takeaway from this perspective is the ability to bring an **HCI lens** to any problem encountered, whether in engineering, research, computer science, or cognitive science ⟦s000234-s000236⟧. Applying this lens means being driven by curiosity and understanding how the questions posed influence the types of answers accepted and the knowledge gained ⟦s000239-s000241⟧.\n\nThis approach involves constantly observing, listening, and asking questions:\n*   Of oneself ⟦s000248-s000249⟧\n*   Of others ⟦s000249⟧\n*   Of the artifacts encountered and created ⟦s000249-s000253⟧\n\n## 🛠️ Core Skills in HCI Practice\nTo effectively apply the HCI lens and engage in the practice of HCI and research, several key skills are emphasized:\n*   **Conducting User Research**: This forms the initial dive into understanding user needs and contexts ⟦s000243⟧.\n*   **Prototyping**: Learning how to prototype effectively is crucial for iterative design and learning ⟦s000245⟧.\n*   **Communicating Design Choices**: The ability to articulate complex design choices and the trade-offs made during the design of interactive systems is essential ⟦s000245-s000246⟧.\n*   **Observation and Inquiry**: Continuously observing, listening, and asking questions about artifacts and interactions is fundamental ⟦s000248-s000249⟧.\n\n## 📊 Project Theme: Novel Data Interaction\nThe project theme for the current quarter focuses on **enabling novel data interaction** ⟦s000281⟧. This involves applying the HCI lens to questions such as:\n*   **Who is being enabled?** ⟦s000282⟧\n*   **For what purpose?** ⟦s000282⟧\n*   **What type of data is involved?** This could include quantitative tabular data, video data, or text data ⟦s000282-s000283⟧.\n*   **Where does the data come from?** Do users collect it, or is there a reliable database? ⟦s000283-s000284⟧\n*   **What interactions are currently available, and what new interactions might be desired?** This requires careful consideration of existing systems and potential innovations ⟦s000285-s000287⟧.", "3": "## 🎯 The Challenge: Navigating Complex Systems\nThe development process often starts by identifying a complex or convoluted system that users find difficult to navigate. For instance, one project focused on the U.S. immigration visa application process, which was perceived as very difficult and confusing.⟦s000524, s000544⟧ This challenge was personally relevant to group members who had family and loved ones experience difficulties applying for various visas, such as work visas or F1 visas.⟦s000540-s000542⟧ The overarching goal was to simplify this process, making it a linear, step-by-step journey, at least for informational purposes.⟦s000524⟧\n\n## 🗺️ The Project Development Lifecycle\nThe entire project development process is a comprehensive journey, starting from finding an idea, progressing through user research, and culminating in a final product.⟦s000511⟧ This lifecycle begins with forming a **hypothesis** or identifying a topic to explore.⟦s000543⟧ For the immigration visa project, the hypothesis was that \"the u.s immigration process often confusing and incomprehensible.\"⟦s000544⟧\n\n## 🧑‍💻 Conducting User Research\nBased on the initial hypothesis, the next critical step is to conduct **user research**. This involves:\n*   **Targeting Profiles**: Creating different profiles of people to understand who the system aims to serve and whose issues it will solve.⟦s000545-s000546⟧\n*   **User Interviews**: Engaging in conversations with potential users to gather insights into their experiences and challenges.⟦s000547⟧\n*   **Diagrams and Process Maps**: Visualizing user journeys and system interactions, often starting with analog, paper-based methods.⟦s000548-s000549⟧\n*   **User Profiles**: After conducting research, grouping different target users into distinct profiles to gain a clear understanding of the audience for whom the problem is being solved.⟦s000553-s000556⟧\n\n## 📝 Crafting a Problem Statement\nFollowing user research, a **problem statement** is formulated to clearly articulate the core issue the project aims to address.⟦s000560-s000561⟧ For the immigration visa project, the problem statement highlighted that \"people in the US immigration process seek reliable and understandable sources outside of attorneys.\"⟦s000562-s000564⟧ However, this information is \"often hard to find and difficult to interpret for people of various backgrounds, adding to the confusion and anxiety about this process.\"⟦s000565-s000566⟧ This statement precisely defined the problem the team sought to solve.⟦s000567⟧\n\n## 💡 From Research to Design: Personas, Scenarios, and Flow\nOnce a clear understanding of the target user group and the problem is established, the design phase begins:\n*   **System Flow**: Developing a plot flow that illustrates how users are expected to interact with the proposed system.⟦s000557-s000559⟧\n*   **Storyboarding**: Creating a storyboard to visually narrate the experience of the targeted user, detailing their journey and interactions within the system.⟦s000568-s000569⟧\n*   **Personas**: Defining **personas** for the interactive system, which represent the target audience, their goals, desires, and the challenges they face in relation to the problem. These personas guide the crafting of the interactive system.⟦s000579-s000585⟧\n*   **Scenarios**: Developing specific **scenarios** that describe how these personas will interact with and experience the interactive system.⟦s000586-s000587⟧\n\n## 🚀 Iterative Prototyping and System Development\nThe final stage involves developing the system, which typically begins with basic prototypes and progresses to a fully built system.⟦s000570-s000571⟧\n*   **Paper Prototypes**: The initial step often involves creating the most basic prototype, such as a **paper prototype**, to quickly test ideas and interactions without committing to complex implementation.⟦s000570-s000571⟧\n*   **System Building**: Over time, the project culminates in actually building the interactive system.⟦s000571⟧\n*   **Evaluation**: Throughout this process, there is an element of evaluation to assess the effectiveness and usability of the design.⟦s000588⟧", "4": "## 👥 Understanding Users: Personas and Problem Statements\nBefore developing an interactive system, it is crucial to understand the target audience and the specific problems they face. This process involves:\n*   **Problem Statement**: Clearly articulating the challenge the system aims to solve. This statement summarizes the core issue identified through user research.⟦s000577, s000583⟧\n*   **User Research Summary**: A concise overview of findings from user interviews and observations.⟦s000578, s000592⟧\n*   **Personas**: Creating detailed profiles of target users. These personas define:\n    *   Who the target audience is.⟦s000579-s000580⟧\n    *   Their goals and what they want to achieve.⟦s000581⟧\n    *   The specific challenges they encounter related to the problem statement.⟦s000582-s000583⟧\n    The interactive system is then crafted specifically around these personas and the scenarios they might experience.⟦s000584-s000587⟧\n\n## 💡 Example: Scrapper – Cross-Device Idea Capture\nThe \"Scrapper\" system demonstrates how user research can lead to a multi-platform solution for a specific user problem.\n*   **Problem**: Writers often face challenges in their daily lives, particularly in remembering ideas they've had and later finding those ideas when needed.⟦s000592-s000593, s000606⟧\n*   **System Design**: The team identified the need for both a **Google Chrome extension** and a **companion mobile app**. This approach highlights that interactive systems are not limited to a single platform, and designers have flexibility in choosing the best tools for the job.⟦s000589-s000591, s000595-s000596⟧\n*   **Core Features**:\n    *   **Cross-Device Note Creation and Synchronization**: Users can create notes on either their computer via the browser extension or on their mobile app. These notes sync together when logged into a Google account, ensuring ideas are captured regardless of the device.⟦s000598-s000600⟧\n    *   **Similarity-Based Note Retrieval**: The system stores a database of notes. If a user is writing something later and thinks they had a similar idea previously but can't recall it, the system provides a ranked list of the top three similar suggestions using an underlying algorithm. This helps users retrieve relevant past thoughts.⟦s000603-s000611⟧\n*   **Outcome**: Scrapper was built around this specific, pinpointed problem, creating an entire system to address it.⟦s000612-s000614⟧\n\n## 🎣 Example: Fishing App – Domain-Specific Decision Support\nAnother interactive system example focused on providing decision support within a specific domain.\n*   **Problem**: Fishermen in California face numerous complex regulations regarding catching fish, including rules based on the fishing area, fish size, and species. It is often difficult to determine if a caught fish is legal to keep.⟦s000621-s000627⟧\n*   **System Goal**: To create an app that makes it \"super streamlined\" and easy for fishermen to understand and follow regulations.⟦s000628-s000629⟧\n*   **Core Features**:\n    *   **Automated Species Identification**: Users can take a photo of a fish, which is sent via an API layer to a Large Language Model (LLM) to identify the species.⟦s000639-s000640⟧\n    *   **Regulation Check**: Users input the location where the fish was caught and its length. The app then combines this information with the identified species to determine if the fish must be released.⟦s000641-s000645⟧\n    *   **Catch Documentation**: Users can document how many fish they caught, how many were safely released, and how many were kept.⟦s000646-s000648⟧\n    *   **History and Gamification**: The app allows users to view their total catches, releases, and keeps. It also incorporates gamification elements, such as streaks and ranks based on the number of fish caught.⟦s000648-s000650⟧\n\n## 🔄 Iterative Field Feedback and Evaluation\nThe development of interactive systems, particularly those addressing real-world problems, benefits significantly from continuous user engagement and iterative refinement.\n*   **Iterative Process**: The fishing app's development involved an iterative process of interviewing fishermen, pitching ideas to them, and gathering direct feedback. This feedback directly influenced feature changes.⟦s000655-s000657⟧\n*   **Cycle of Development**: This iterative approach involved repeatedly cycling through user interviews, prototyping, and then returning to interviews to refine the system over a period, such as 10 weeks.⟦s000657-s000659⟧\n*   **Evaluation**: Throughout this process, there is an ongoing \"sense of evaluation\" to assess how well the system addresses user needs and performs in real-world scenarios.⟦s000588⟧"}, "fun_facts": {"title": "Siri's Secret: The Gender Voice Gap 🗣️", "hook": "Imagine talking to a voice assistant that just *doesn't get you*. Early voice recognition systems, including those powering devices like Siri, had a shocking secret: they were significantly worse at understanding women's voices.", "body": "Today's discussion on the HCI design lens perfectly explains how a crucial oversight in early tech design created a major communication barrier for millions.\n\nEarly speech recognition systems exhibited a significant gender bias, consistently showing higher word error rates (WER) for female speakers compared to men ⟦1, 2, 3⟧.\n\nFor instance, one analysis of a commercial ASR system found that less than half of female speakers' words were captioned correctly (47%), while male speakers achieved 60% accuracy ⟦3, 4⟧.\n\nThis wasn't due to inherent differences in voices, but because training datasets were overwhelmingly composed of male voices, often those of the male engineers developing the systems ⟦3, 4, 5⟧.\n\nThis demographic skew meant the systems weren't adequately trained on the diverse pitch, intonation, and speech patterns typical of female speakers ⟦5, 6⟧.\n\nThis glaring HCI design flaw highlighted how assuming a 'default' user can inadvertently exclude entire populations, underscoring the critical need for inclusive and diverse datasets in AI development.", "metadata": {"sources": ["https://arxiv.org/html/2502.18434v1", "https://arxiv.org/html/2507.05885v1", "https://makingnoiseandhearingthings.com/2016/07/12/googles-speech-recognition-has-a-gender-bias/", "https://makingnoiseandhearingthings.com/2016/07/12/googles-speech-recognition-has-a-gender-bias/", "https://www.nature.com/articles/s41598-025-99011-x", "https://arxiv.org/abs/2502.18434"]}, "created_at": "2026-10-01T20:27:42.122664+00:00"}}, "checks": {"review_cards": {"calls": 4, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 8994, "exclamations": 5, "question_marks": 6, "citations": 34, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 34091, "output_tokens": 14553, "max_output_tokens_single_call": 4274, "sum_call_seconds": 63.4, "max_call_seconds": 17.95, "topics": 4, "topics_with_bad_card_sequence": 0}, "deep_notes": {"calls": 4, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 20146, "exclamations": 0, "question_marks": 0, "citations": 87, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 28183, "output_tokens": 8353, "max_output_tokens_single_call": 2842, "sum_call_seconds": 39.9, "max_call_seconds": 13.37}, "fun_facts": {"calls": 1, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 1366, "exclamations": 0, "question_marks": 1, "citations": 3, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 39528, "output_tokens": 465, "max_output_tokens_single_call": 465, "sum_call_seconds": 3.4, "max_call_seconds": 3.44, "fun_fact_sources": 3}}, "errors": {}}]};
const TASKS = [["review_cards","Review Cards"],["deep_notes","Deep Notes"],["fun_facts","Fun Fact"]];
let state = { lec: 0, task: "review_cards" };
try { const s = JSON.parse(localStorage.getItem("haikuViewer") || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
if (!DATA.lectures[state.lec]) state.lec = 0;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function inline(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\\\((.+?)\\\)/g, '<span class="math">$1</span>');
  h = h.replace(/⟦([^⟧]*)⟧/g, '<span class="cite">$1</span>');
  return h;
}
function block(b) {
  switch (b.type) {
    case "paragraph": return `<p class="blk-p">${inline(b.text)}</p>`;
    case "quote": return `<p class="blk-quote">${inline(b.text)}</p>`;
    case "callout": { const t = ["info","warning","error"].includes(b.alert_type) ? b.alert_type : "info";
      return `<div class="blk-callout ${t}"><span class="tag">${t}</span>${inline(b.text)}</div>`; }
    case "list": return `<ul class="blk-list">${(b.items||[]).map(i => `<li>${inline(i)}</li>`).join("")}</ul>`;
    case "code": return `<div class="blk-code"><pre><code>${esc(b.code_string)}</code></pre>${b.explanation ? `<div class="expl">${inline(b.explanation)}</div>` : ""}</div>`;
    default: return `<pre>${esc(JSON.stringify(b, null, 1))}</pre>`;
  }
}
function cards(list) {
  if (!list || !list.length) return `<p class="empty">出力なし</p>`;
  return list.map(c => `<article class="card"><div class="card-head"><span class="emoji">${esc(c.hero_emoji||"")}</span>
    <div><div class="type">${esc(c.card_type)}</div><div class="title">${inline(c.title)}</div></div></div>
    ${(c.content_blocks||[]).map(block).join("")}</article>`).join("");
}
function md(src) {
  if (!src) return `<p class="empty">出力なし</p>`;
  let s = src.replace(/<!--\s*FIGURE:([\s\S]*?)-->/g, (_, a) => `\n\n<div class="figure">図の指定: ${esc(a.trim())}</div>\n\n`);
  s = s.replace(/⟦([^⟧]*)⟧/g, '<span class="cite">$1</span>');
  let html;
  try { html = window.marked ? marked.parse(s) : `<pre>${esc(src)}</pre>`; } catch (e) { html = `<pre>${esc(src)}</pre>`; }
  return `<div class="note">${html}</div>`;
}
function funfact(f) {
  if (!f) return `<p class="empty">出力なし</p>`;
  const body = String(f.body||"").split(/\n\n+/).map(p => `<p>${inline(p)}</p>`).join("");
  const src = (f.sources || (f.metadata && f.metadata.sources) || []);
  return `<div class="ff"><div class="t">${inline(f.title)}</div><div class="h">${inline(f.hook)}</div><div class="b">${body}</div>
    ${src.length ? `<div class="src">${src.map((u,i)=>`[${i+1}] ${esc(u)}`).join("<br>")}</div>` : ""}</div>`;
}
function stats(c) {
  if (!c) return "";
  const items = [["calls", c.calls], ["文字数", c.chars], ["！", c.exclamations], ["？", c.question_marks], ["引用", c.citations],
    ["原語併記", c.english_gloss_parens], ["出力tok(合計)", c.output_tokens], ["最長呼び出し", (c.max_call_seconds||0) + "s"]];
  const bad = [["途中切れ", c.truncated_calls], ["JSON失敗", c.json_parse_errors], ["タグ混入", c.placeholder_leak], ["カード順違反", c.topics_with_bad_card_sequence]];
  return `<div class="stats">${items.map(([k,v]) => `<span>${k} <b>${v ?? "-"}</b></span>`).join("")}
    ${bad.filter(([,v]) => v !== undefined).map(([k,v]) => `<span class="${v ? "bad" : ""}">${k} <b>${v}</b></span>`).join("")}</div>`;
}
function pair(left, right) {
  return `<div class="pair"><div class="col haiku"><div class="col-label"><span class="dot"></span>Haiku 5.5 (${esc(DATA.meta.prompt_version)})</div>${left}</div>
    <div class="col gemini"><div class="col-label"><span class="dot"></span>Gemini 2.5 Flash（既存・参考）</div>${right}</div></div>`;
}
function render() {
  try { localStorage.setItem("haikuViewer", JSON.stringify(state)); } catch (e) {}
  const m = DATA.meta;
  document.getElementById("runmeta").textContent = `${m.created_at} · ${m.model} · effort=${m.reasoning_effort} · max_tokens=${m.max_tokens} · $${m.token_cost_usd_total}`;
  document.getElementById("lectures").innerHTML = DATA.lectures.map((l, i) =>
    `<button class="chip" id="lec-${i}" aria-pressed="${i === state.lec}" data-lec="${i}">${esc(l.title)}<span class="lang">${esc(l.lang)}</span></button>`).join("");
  document.getElementById("tasks").innerHTML = TASKS.map(([k, n]) =>
    `<button class="chip" id="task-${k}" aria-pressed="${k === state.task}" data-task="${k}">${n}</button>`).join("");
  const L = DATA.lectures[state.lec], t = state.task;
  let out = stats(L.checks[t]);
  if (L.errors[t]) out += `<div class="errorbox">エラー: ${esc(L.errors[t])}</div>`;
  if (t === "fun_facts") {
    out += `<section class="topic">${pair(funfact(L.haiku.fun_facts), funfact(L.gemini.fun_facts))}</section>`;
  } else {
    for (const tp of L.topics) {
      const h = t === "review_cards" ? cards(L.haiku.review_cards[tp.idx]) : md(L.haiku.deep_notes[tp.idx]);
      const g = t === "review_cards" ? cards(L.gemini.review_cards[tp.idx]) : md(L.gemini.deep_notes[tp.idx]);
      out += `<section class="topic"><h2><small>Topic ${esc(tp.idx)}</small>${esc(tp.title)}</h2>${pair(h, g)}</section>`;
    }
  }
  document.getElementById("content").innerHTML = out;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button.chip"); if (!b) return;
  if (b.dataset.lec !== undefined) state.lec = +b.dataset.lec;
  if (b.dataset.task) state.task = b.dataset.task;
  render(); window.scrollTo({ top: 0 });
});
render();
</script>
