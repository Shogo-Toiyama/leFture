画に分かれていること、即値ロードで定数をレジスタに入れること、そして命令が主記憶から一つずつ実行されることを学びました。"}, {"type": "paragraph", "text": "以下は、授業では扱ったものの、このカードでは深掘りしなかった内容です。ぜひ自分で見てみてください。"}, {"type": "list", "items": ["34を16進数（hex）に変換する計算。10進数と16進数の行き来に慣れておくと、後で役立ちます ⟦s000223-s000240⟧", "コメントの書き方（#記号で行の残りを無視する仕組み） ⟦s000261-s000263⟧", "ループや分岐によって、命令の実行順序を飛ばす仕組み ⟦s000284-s000286⟧"]}, {"type": "paragraph", "text": "ところで、即値ロードで34をT1に入れた後、その値を使って足し算をしたくなりませんか？次は、命令どうしで計算を行う「算術命令とオペランド」の世界に入ります。加算命令（add instruction）や即値加算命令（add immediate）が登場するので、楽しみにしていてください！"}]}], "3": [{"card_type": "hook", "hero_emoji": "🧩", "title": "命令はレゴブロック", "content_blocks": [{"type": "quote", "text": "アセンブリの命令は、『何をする？（オペコード）』と『何を使う？（オペランド）』を組み合わせたレゴブロックのようなもの！"}, {"type": "paragraph", "text": "まずは、レジスタに値を入れたり、値を足したりする小さな命令を一つずつ組み立てていくイメージで見てみましょう。ステップ実行で結果が画面に出てくる瞬間は、意外とワクワクしますよ。⟦s000320-s000329⟧"}]}, {"card_type": "core_why", "hero_emoji": "⚙️", "title": "加算命令の仕組みを押さえよう", "content_blocks": [{"type": "paragraph", "text": "まず大事なのは、命令は2つの部分でできているということです。**オペコード（opcode）**は『加算しろ』のように、ALU（算術論理演算装置）に何をさせるかを指示する部分です。⟦s000526-s000528⟧"}, {"type": "paragraph", "text": "そして**オペランド（operand）**は、演算の対象になるデータ部分です。加算命令では、先頭に『結果を入れる宛先』が来て、その後ろに足す値が並びます。⟦s000374-s000376⟧"}, {"type": "code", "language": "cpp", "code_string": "add T2, zero, T3   // T2 = 0 + T3", "explanation": "先頭のT2が宛先、後ろの2つが足される値です。結果は宛先に入ります。⟦s000376⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "即値は『定数』、即値同士は足せない", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "**即値加算命令（add immediate）**は、最後のオペランドに**即値オペランド（immediate operand）**、つまり数字そのものを直接書ける命令です。ただし、足すのは『レジスタ＋即値』までで、『即値＋即値』は書けません。⟦s000496-s000497⟧⟦s000507-s000509⟧"}, {"type": "paragraph", "text": "名前の『I』は、最後の値が『レジスタ名』ではなく『即値（定数）』であることを示しています。だから、ふつうの加算は『add』、即値を使うなら『add I』と覚えると混乱しにくくなりますよ。⟦s000497⟧⟦s000499-s000501⟧"}, {"type": "paragraph", "text": "つまり『3＋5』のような高級言語の計算を直接書くことはできません。二つの値をどちらもレジスタに入れてから加算する、という手順を踏む必要があります。⟦s000514-s000516⟧⟦s000518-s000522⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩とさらなる探検", "content_blocks": [{"type": "paragraph", "text": "今回は、命令がオペコードとオペランドで組み立てられていること、加算命令の宛先の書き方、そして即値加算命令の特徴を学びました。命令は『何をするか』と『何を使うか』の組み合わせだと覚えておけば、コードを読むのがぐっと楽になります。"}, {"type": "paragraph", "text": "ここからは、授業で扱ったものの、今回のカードでは詳しく扱えなかった内容を自分で確認してみてください。"}, {"type": "list", "items": ["ステップ実行でレジスタの値が変わる過程を追いかける手順 ⟦s000398-s000406⟧", "ヘックス値22（10進数34）に1を足すと23になる計算の確認 ⟦s000435-s000446⟧", "アセンブルの段階で、命令名がレジスタ番号に置き換わる仕組み ⟦s000391-s000392⟧"]}, {"type": "paragraph", "text": "さて、次はレジスタの値を交換する方法を見ていきます。一時的な置き場所をどう使うのか、そしてアセンブリ言語がコンパイラ最適化とどうつながるのかが、次の大きな謎になりますよ！"}]}], "4": [{"card_type": "hook", "hero_emoji": "🔀", "title": "コップの水を入れ替えろ！", "content_blocks": [{"type": "quote", "text": "赤いコップの水と青いコップの水を入れ替えてみて。ただし、どちらも空にしてはいけないよ！"}, {"type": "paragraph", "text": "ここでいきなり困るよね。片方に注ぐと、もう片方の中身がこぼれて消えてしまう。実はこれ、レジスタの値の交換（register swapping）と同じ問題なんだ。⟦s000551-s000553⟧"}, {"type": "paragraph", "text": "さらに、アセンブリ言語（assembly language）では、高級言語なら一行でできることが何行もの命令に分かれてしまう。だからこそ、この小さな課題がとても良い練習台になるんだよ。⟦s000564-s000565⟧"}]}, {"card_type": "core_why", "hero_emoji": "🧺", "title": "3つ目の箱がカギ", "content_blocks": [{"type": "paragraph", "text": "まず、一番ありがちな方法を試してみよう。T1の値をT0に入れ、次にT0の値をT1に入れる。ところが、T1の元の値は最初の命令で消えてしまっている。⟦s000648-s000652⟧"}, {"type": "callout", "alert_type": "info", "text": "2つの命令だけでは交換できない。値を一時的に置いておく場所、つまり一時記憶（temporary storage）が必要なんだ！⟦s000655-s000658⟧"}, {"type": "paragraph", "text": "そこで、3つ目のレジスタT2を退避場所として使う。最初にT1の値をT2へ逃がし、次にT0の値をT1へ移し、最後にT2の値をT0へ戻す。この3つの順番がポイントだよ。⟦s000660-s000665⟧"}, {"type": "code", "language": "asm", "code_string": "move T2, T1   # T1の値をT2に退避\nmove T1, T0   # T0の値をT1へ\nmove T0, T2   # 退避しておいた値をT0へ", "explanation": "この3行で、T0とT1が正しく入れ替わる。⟦s000676-s000678⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "T系レジスタは使い捨て？", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "上書きされて困るのに、なぜT2は自由に使ってよいのか？ それは、T系レジスタ（一時レジスタ）には「一時的に使ったら、そのまま上書きしてよい」という一時レジスタ規約（temporary-register convention）があるからなんだ。⟦s000687-s000689⟧"}, {"type": "paragraph", "text": "つまり、T2を使っても問題ないのは、そもそも一時的な作業場として使うと決められているから。プログラム全体の決まりごとを理解しておくと、「どこまで壊してよいか」が見えてくるよ。⟦s000688-s000689⟧"}, {"type": "paragraph", "text": "そして、教授は実際にテスト用の値（3と2など）を入れて実行し、交換が成功することを確かめた。自分の書いたコードは、必ず動かして確認しようね。⟦s000696-s000698⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "アセンブリで見えた景色", "content_blocks": [{"type": "paragraph", "text": "今回は、レジスタの値を交換するには3つ目のレジスタを一時的に使う必要があることを学んだ。アセンブリでは、単純な操作でも多くの命令に分解されるので、ひとつずつ丁寧に考えることが大事なんだ。"}, {"type": "paragraph", "text": "自分で復習するなら、教授が『時間があれば見ておくとよい』と触れた、次のような話題も役に立つよ。"}, {"type": "list", "items": ["保存レジスタ規約（saved-register convention）：S系レジスタは元の値に戻すという決まり ⟦s000690-s000691⟧", "アセンブリが使われなくなった経緯とコンパイラ最適化（compiler optimization）の進歩 ⟦s000580-s000593⟧", "順不同実行（out-of-order execution）が、アセンブリの読み方にどう関係するか ⟦s000603-s000609⟧", "4命令版で使い終わったレジスタを0に戻す考え方 ⟦s000704-s000706⟧"]}, {"type": "paragraph", "text": "次は、ビット単位の論理演算（AND、OR、XOR、NOT）を扱うよ。今回の『値をどこに置くか』という考え方が、ビットの世界でどう活きるのかが楽しみだね！"}]}], "5": [{"card_type": "hook", "hero_emoji": "💡", "title": "ビットは電気のスイッチ", "content_blocks": [{"type": "quote", "text": "CPUのビット演算は、1つ1つのスイッチをON/OFFする作業だと思ってください！"}, {"type": "paragraph", "text": "2つのスイッチを並べて「両方ONのときだけ点灯する」のがAND、「どちらかがONなら点灯する」のがORです。コンピュータは32ビットのようなスイッチを一度に全部まとめて操作しています。"}]}, {"card_type": "core_why", "hero_emoji": "🧱", "title": "論理演算はNORから組み立てる", "content_blocks": [{"type": "paragraph", "text": "AND、OR、XORは、3つのオペランドを持つ命令です。先頭が結果を入れる宛先レジスタで、後ろの2つが入力のソースレジスタです。例えば AND T3, T1, T0 は、T1とT0のビットごとの積をT3に入れる、という意味です。 ⟦s000723-s000724⟧"}, {"type": "paragraph", "text": "ところが、NOT（反転）の組み込み命令は用意されていません。 ⟦s000753⟧ 設計者は命令のビットを節約するために、NOTを省いたのです。その代わりに使えるのがNOR命令です。 ⟦s000754-s000756⟧"}, {"type": "code", "language": "text", "code_string": "NOR T3, T1, T0   # T3 = (T1 OR T0) の反転", "explanation": "NORは「OR してから反転する」命令です。 ⟦s000757-s000759⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🔑", "title": "ゼロレジスタがNOTを生む", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "教授のポイント：NOTは「NORの片方にゼロを入れる」だけで作れます。 ⟦s000760-s000763⟧"}, {"type": "paragraph", "text": "NORに入力AとゼロレジスタZEROを渡すと、ORの結果は必ずAになり、それを反転するとNOT Aになります。Aの値そのものがORの結果として残るので、これが反転の正体です。 ⟦s000762-s000763⟧"}, {"type": "code", "language": "text", "code_string": "NOR T3, T1, ZERO   # T3 = NOT T1", "explanation": "ゼロレジスタを使うと、NOTは「片方を無視するNOR」になります。実際の実装もこの形です。 ⟦s000772-s000777⟧"}, {"type": "paragraph", "text": "ちなみに「A OR A」をNORの片方に入れても反転になります。どちらの書き方でも動きますが、実装ではゼロレジスタを使う形が採用されています。 ⟦s000764-s000777⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "ビット演算の全体像", "content_blocks": [{"type": "paragraph", "text": "今回はAND、OR、XORという基本のビット演算と、NOT演算がNOR命令とゼロレジスタの組み合わせで実現されることを学びました。命令の数を減らすために、設計がどこまで工夫されているかも見えてきましたね。"}, {"type": "paragraph", "text": "ここからは、自分で学習しておくと良い項目です。授業では扱いましたが、カードでは詳しく説明していません。"}, {"type": "list", "items": ["AND immediate（即値を使うAND）の使い方 ⟦s000722⟧", "反転した値を2進数に分解し、16進数に直す手順（例として5の反転） ⟦s000834-s000848⟧", "add unsignedのニーモニックは使わないという注意点 ⟦s000715⟧"]}, {"type": "paragraph", "text": "今日の講義は、レジスタと疑似命令によるアセンブリ入門から始まり、プログラムの構成と命令の実行、算術命令とオペランド、レジスタの値交換、そして今回のビット論理演算とNOTの実現へと進みました。今日の授業で学んだ命令は、次のアセンブリの課題でもそのまま使えます。ラボでたくさん動かして、感覚をつかんでください！"}]}]}, "deep_notes": null, "fun_facts": null}, "ran": ["review_cards"], "checks": {"review_cards": {"calls": 5, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 6899, "exclamations": 14, "question_marks": 6, "citations": 63, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 25, "input_tokens": 60278, "output_tokens": 19867, "max_output_tokens_single_call": 4711, "sum_call_seconds": 90.3, "max_call_seconds": 21.08, "topics": 5, "topics_with_bad_card_sequence": 0}}, "errors": {}}, "v1c": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🧰", "title": "CPUの手元の作業台", "content_blocks": [{"type": "paragraph", "text": "前回は主記憶と、計算の前に値を取り込むレジスタの関係、そして命令セットの話をしましたね。今日はその続きで、実際に手を動かしてレジスタを使う入門編です。"}, {"type": "quote", "text": "レジスタ（register）は、CPUが今まさに使っている値をしまう超小型の作業台みたいなものです！"}]}, {"card_type": "core_why", "hero_emoji": "🗂️", "title": "作業台の役割分担", "content_blocks": [{"type": "paragraph", "text": "MIPSには用途ごとに名前の付いたレジスタがたくさんあります。計算に自由に使えるのがT0、T1、T2などの一時レジスタ（temporary register）で、関数の中で使うことが多いです。⟦s000003⟧"}, {"type": "paragraph", "text": "引数を渡すためのA0からA3までは引数レジスタ（argument register）と呼ばれ、手続きのときによく使われます。Sのレジスタは、大域変数のような役割を持つと考えるとイメージしやすいです。⟦s000004-s000008⟧"}, {"type": "callout", "alert_type": "info", "text": "ゼロレジスタ（zero register）は名前の通り、中身がいつも0のレジスタです。ほかのレジスタは、実際のハードウェアでは前の値が残っていることがあります。⟦s000001-s000002⟧"}, {"type": "paragraph", "text": "同じレジスタには名前と番号の2つの呼び方があり、たとえばT3は11番です。番号は『識別子（register identifier）』のような役割で、値そのものとは別物だと覚えてください。⟦s000029-s000035⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🪤", "title": "0の保証と疑似命令の正体", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "シミュレータでは最初に全部0になっていますが、本物のハードウェアでは残りかすの値が入っています。0にしたいなら、自分で必ず初期化する必要があります。⟦s000039-s000041⟧"}, {"type": "paragraph", "text": "ではT0に0を入れるmoveは、どう実行されるのでしょうか。実はmoveは機械が直接持っている命令ではなく、アセンブラが足し算のaddに置き換えている疑似命令（pseudo-instruction）なんです。⟦s000097-s000106⟧"}, {"type": "code", "code_string": "add $8, $0, $0", "language": "mips", "explanation": "0と0を足して8番のレジスタ（T0）に入れる。ゼロレジスタを足すことで、結果として0を代入できる。⟦s000109-s000116⟧"}, {"type": "callout", "alert_type": "info", "text": "先生の決め台詞はこれです。『ハードウェアに実装されていないなら、足し算で作ってしまえばいい』。moveは便利な名前を付けただけの、足し算なんです！⟦s000153-s000159⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "疑似命令の裏側を覗く", "content_blocks": [{"type": "paragraph", "text": "今日は、レジスタには用途ごとの名前があり、ゼロレジスタ以外は初期値に頼れないことを学びました。そしてmoveのような疑似命令は、アセンブラが足し算に変換しているという仕組みを確認しました。"}, {"type": "paragraph", "text": "ここからは、授業で触れたけれどカードでは省いた内容を自分で調べてみてください。"}, {"type": "list", "items": ["シミュレータで最初に割り込んだChromeプロセスの選択や、実行ウィンドウが固まるときの話 ⟦s000020-s000024⟧", "addに付くunsigned（符号なし）という注釈の意味 ⟦s000110-s000111⟧", "保存してアセンブルしたときに、機械語（バイナリ）がどう生成されるか ⟦s000082-s000097⟧", "RA、PC、K0、K1、GP、SP、FP、ATなど、今回触れなかったレジスタの役割 ⟦s000013-s000014⟧"]}, {"type": "paragraph", "text": "さて、ここまでは『命令を書けば機械が動く』という話でした。でも、プログラムには文字列や変数などのデータも必要ですよね。次回は、データセグメント（.data segment）とテキストセグメント（.text segment）という、プログラムの置き場所の話に進みます。"}]}], "2": [{"card_type": "hook", "hero_emoji": "🧳", "title": "知らないまま詰めたスーツケース", "content_blocks": [{"type": "quote", "text": "Hello Worldのコードは、中身を知らずに詰め込んだスーツケースのようなもの。でも、ちゃんと開ける日が来るから安心して！"}, {"type": "paragraph", "text": "今は『なんでこれを書くの？』と思っていて当然です。先生も『来週か再来週には全部分かるようになる』と言っています。⟦s000172-s000175⟧ まずは、このコードがどんな部品からできているのかを一緒に覗いてみましょう。"}]}, {"card_type": "core_why", "hero_emoji": "🗂️", "title": "命令とデータは別の棚に置く", "content_blocks": [{"type": "paragraph", "text": "アセンブリのプログラムは大きく二つのセクションに分かれています。`.data`は『データを置く場所』、`.text`は『命令を置く場所』です。⟦s000181-s000182⟧"}, {"type": "paragraph", "text": "どちらもメモリ（RAM、主記憶）に入ります。命令もデータも、最終的にはメモリの中に並んでいるんです。⟦s000183⟧ ここでのメモリはRAMのことで、レジスタは特別なクラスの記憶場所として別に扱います。⟦s000185-s000186⟧"}, {"type": "code", "code_string": "ld  T1, 34   # 即値ロード: T1 に定数34を入れる", "language": "text", "explanation": "`load immediate`は、即値（immediate value）と呼ばれる定数をレジスタに入れる命令です。今は『定数をそのまま入れる』と覚えればOK。⟦s000187-s000188⟧"}, {"type": "paragraph", "text": "数値に進数の指定がなければ10進数として扱われます。⟦s000199⟧ 命令は一つずつ、プログラムカウンタ（program counter）が次の場所を指しながら進んでいきます。⟦s000279-s000282⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🐛", "title": "`.text`を忘れると命令がデータ扱い！", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "`.text`を書き忘れると、アセンブラは命令をただのデータだと思い込んでしまいます。⟦s000300-s000302⟧"}, {"type": "paragraph", "text": "何も書かなくても、アセンブラは『命令だろう』と推測して組み立てを続けてしまいます。つまり、エラーが出ないまま動きがおかしくなるのが一番厄介なところです。⟦s000303-s000308⟧"}, {"type": "callout", "alert_type": "info", "text": "教授の教え：セクションの宣言は、コードの『置き場所』を決める大事な一行。省略すると、後で大きなバグの原因になります！⟦s000312-s000314⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "命令が動く仕組みを覗いてみよう", "content_blocks": [{"type": "paragraph", "text": "今回は、プログラムが『データ』と『命令』に分けてメモリに置かれること、そして即値ロード命令で定数をレジスタに入れることを学びました。命令は一つずつ順番に読み込まれ、実行されていきます。"}, {"type": "paragraph", "text": "もう少し深く学びたい人のために、次の項目も自習しておくと役立ちます。"}, {"type": "list", "items": ["34を16進数に直す計算手順（16進数の変換） ⟦s000223-s000232⟧", "コメントを書くための記号『#』の使い方 ⟦s000261-s000263⟧", "プログラムカウンタと命令レジスタが命令を読み込む細かい流れ ⟦s000275-s000278⟧"]}, {"type": "paragraph", "text": "次の『算術命令とオペランド』では、加算命令（add instruction）や即値加算命令（add immediate）が登場します。そこでは、オペランド（operand）やオペコード（opcode）、そして算術論理演算装置（ALU）がどう働くのかを見ていきます。計算を実際に動かす場所がどこにあるのか、楽しみにしていてください！"}]}], "3": [{"card_type": "hook", "hero_emoji": "🧮", "title": "電卓のボタンを思い出そう", "content_blocks": [{"type": "quote", "text": "命令は「何をするか」と「何に対してするか」を並べた、CPUへの一行の指示書なんです！"}, {"type": "paragraph", "text": "電卓で「5 + 3」と打つとき、プラスボタンが操作、5と3が材料ですよね。アセンブリでも同じで、足し算という動作と、その材料になるレジスタや数字が並んでいます。"}]}, {"card_type": "core_why", "hero_emoji": "⚙️", "title": "加算命令のしくみ", "content_blocks": [{"type": "paragraph", "text": "まずは基本の加算命令から見ていきましょう。宛先のレジスタを先頭に書き、その後ろに足される2つの値を並べます。授業では、T2にゼロレジスタとT3の和を入れる例が使われました。⟦s000374⟧⟦s000375⟧"}, {"type": "code", "code_string": "add T2, zero, T3", "language": "asm", "explanation": "宛先T2に、zeroとT3の和を入れる。zeroレジスタの中身は常に0。⟦s000376⟧"}, {"type": "paragraph", "text": "ここで大事なのは、**ステップ実行で結果を目で確かめられること**です。T3に1を入れて足すと、T2の値が1になるのを確認できました。⟦s000405⟧⟦s000406⟧"}, {"type": "paragraph", "text": "次に、定数を直接書ける**即値加算命令（add immediate）**が登場します。最後のオペランドが数字そのもの、つまり**即値オペランド（immediate operand）**になるので、命令名にIが付きます。⟦s000477⟧⟦s000479⟧⟦s000496⟧⟦s000497⟧"}, {"type": "code", "code_string": "addi T4, T1, 1", "language": "asm", "explanation": "T1の値に1を足し、結果をT4に入れる。最後の1が即値オペランド。⟦s000488⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🚨", "title": "宛先は先頭、即値は最後", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "**宛先は必ず先頭**です。Tの順番を逆にすると、値の向きが逆になってしまいます。教授も「最初の書き方は宛先から」と何度も強調していました。⟦s000383⟧⟦s000386⟧⟦s000460⟧⟦s000461⟧"}, {"type": "paragraph", "text": "もう一つの落とし穴は、**即値同士の加算はできない**ことです。3 + 5をレジスタに入れるような書き方は、高級言語の感覚では自然ですが、アセンブリにはそんな命令はありません。⟦s000507⟧⟦s000509⟧⟦s000514⟧⟦s000516⟧"}, {"type": "callout", "alert_type": "info", "text": "覚え方のコツ：Iは「immediate（即値）」の頭文字。定数が混ざった瞬間にIを付けると考えると迷いません。⟦s000497⟧⟦s000499⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "次の一歩とまだ触れていない話", "content_blocks": [{"type": "paragraph", "text": "今回は、命令がオペコードとオペランドから成ることと、加算命令と即値加算命令の違いを学びました。レジスタに入る値をステップ実行で追えば、命令の動きがぐっと見えてきます。"}, {"type": "paragraph", "text": "今回は時間の都合で、以下の内容を詳しくは扱いませんでした。教科書や講義ノートで自習してみてください。"}, {"type": "list", "items": ["組み込み命令とマクロ命令の一覧（授業で扱ったものだけが使える点も含む）⟦s000331⟧⟦s000333⟧⟦s000339⟧", "レジスタ名の数字とわかりやすい名前の対応（組み込み命令の書き換え）⟦s000392⟧", "小数や浮動小数点数は後回しという点⟦s000502⟧⟦s000505⟧"]}, {"type": "paragraph", "text": "ところで、今の加算は全部レジスタ同士か、片方が定数でした。では、その値をメモリとどうやりとりするのでしょう？次のトピックで、レジスタの値交換と一時記憶の仕組みを見ていきましょう！"}]}], "4": [{"card_type": "hook", "hero_emoji": "🔄", "title": "二人で席を入れ替えよう", "content_blocks": [{"type": "quote", "text": "T0とT1の中身を入れ替える。たったこれだけなのに、アセンブリでは意外な落とし穴が待っています！"}, {"type": "paragraph", "text": "二人が同じ席に座っていて、席を入れ替えたいとします。片方が先に立ち上がると、もう一人の座る場所が消えてしまいますよね。レジスタの世界でも、同じことが起きるんです。"}]}, {"card_type": "core_why", "hero_emoji": "🧠", "title": "なぜ第三のレジスタが必要なのか", "content_blocks": [{"type": "paragraph", "text": "最初に思いつくのは、T1の中身をT0へ、T0の中身をT1へ、と二回`move`する方法です。でも、最初の`move`でT0の値をT1に入れた時点で、T1の元の値は消えてしまいます。⟦s000655⟧⟦s000656⟧"}, {"type": "code", "code_string": "move T1, T0   # T1 は上書きされ、元の値が消える\nmove T0, T1   # すでに元の値は失われている", "language": "text", "explanation": "二回のmoveだけでは、消えた値を取り戻せません。⟦s000648⟧⟦s000649⟧"}, {"type": "paragraph", "text": "だから、先にT1の値を退避させておく場所が必要です。教授の例ではT2を使い、三つのレジスタで二つの値を入れ替えます。⟦s000660⟧⟦s000661⟧"}, {"type": "callout", "alert_type": "info", "text": "二つの値を入れ替えるには、三つ目の退避場所が必要。これが今回の核心です。⟦s000662⟧⟦s000664⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "アセンブリは手間がかかる", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "高水準言語では一行で書ける入れ替えも、アセンブリでは複数の命令に分かれます。これがアセンブリ（assembly language）の大きな特徴です。⟦s000564⟧⟦s000565⟧"}, {"type": "paragraph", "text": "教授によると、人間はどの言語でもほぼ同じ量のコードを書くそうです。しかし、アセンブリは冗長なので、書くのに時間がかかります。だから大規模なシステムは高水準言語で作るのが基本です。⟦s000569⟧⟦s000573⟧⟦s000574⟧⟦s000575⟧"}, {"type": "paragraph", "text": "一方で、昔はメモリが限られていたため、アセンブリで命令数を減らす最適化が行われていました。しかし今ではコンパイラ最適化（compiler optimization）が進み、その必要性は小さくなっています。⟦s000582⟧⟦s000592⟧⟦s000593⟧"}, {"type": "paragraph", "text": "それでも、高水準のコードと実際に実行されるバイナリのズレはセキュリティ上の弱点になります。だから、仕組みを知ることが大切なんです。⟦s000594⟧⟦s000596⟧⟦s000597⟧⟦s000598⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩とさらなる探究", "content_blocks": [{"type": "paragraph", "text": "今回は、T0とT1の値を入れ替えるには三つ目のレジスタが必要だと学びました。また、アセンブリは細かい命令が多く、高水準言語が大規模開発に向いている理由も見えてきましたね。"}, {"type": "paragraph", "text": "授業で触れられたものの、カードでは詳しく扱えなかった内容です。ぜひ自分で調べてみてください。"}, {"type": "list", "items": ["一時レジスタ（temporary register）と保存レジスタ（saved register）の規約：Tレジスタは自由に書き換えてよく、Sレジスタは元の値に戻すという約束事です。⟦s000687⟧⟦s000690⟧", "アウトオブオーダー実行（out-of-order execution）：プロセッサが命令を順番通りでなく進めることがある仕組みです。⟦s000605⟧⟦s000609⟧"]}, {"type": "paragraph", "text": "次は、プロセッサの中で命令がどのように順番を入れ替えられ、さらにビット単位でどう計算されるのかを見ていきます。ビット論理演算（AND、OR、XOR、NOT）の世界が待っていますよ！"}]}], "5": [{"card_type": "hook", "hero_emoji": "🔄", "title": "ビットを一斉にひっくり返すスイッチ", "content_blocks": [{"type": "quote", "text": "0は1に、1は0に。NOTはビットをまとめて裏返す魔法のスイッチです！"}, {"type": "paragraph", "text": "2進数のビットを1つずつ見て反転させるのは大変ですよね。でも、CPUの命令ならレジスタの中身を一発で裏返せるんです。ANDやORと並んで、ビットを直接いじる道具箱の一員です。"}]}, {"card_type": "core_why", "hero_emoji": "🧩", "title": "NOTはないけどNORがある！", "content_blocks": [{"type": "paragraph", "text": "実は、このアセンブリには**NOT命令が組み込まれていません**。設計者は命令のビットを節約するために、NOTを命令セットに入れなかったのです。⟦s000753-s000754⟧"}, {"type": "paragraph", "text": "その代わりにあるのが**NOR命令（NOR instruction）**です。2つのソースレジスタの結果をORして、さらに反転したものを宛先レジスタに入れます。⟦s000757-s000759⟧"}, {"type": "code", "code_string": "nor $t3, $t1, $zero", "language": "asm", "explanation": "第2入力をゼロレジスタにすると、OR結果は$t1そのものになり、NORで反転されてNOTになります。⟦s000762-s000763⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "ゼロとのNORがNOTになる理由", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "教授の一言がカギ！Aと0のORはAそのもの。それをNORで反転すれば、Aの**NOT演算（NOT operation）**になります。⟦s000762-s000763⟧"}, {"type": "paragraph", "text": "教授は「A OR A」でも同じように動くと確認しました。ORしても値が変わらないので、そこからNORで反転すればやはりNOTになります。ここで、NORの前にORが先に計算されるという順番を意識するのがポイントです。⟦s000765-s000766⟧"}, {"type": "paragraph", "text": "実際のCPUの実装は、2番目の入力にゼロレジスタを使うNORです。宛先は3番のレジスタで、ゼロレジスタを使って「空の入力」を作る形になっています。⟦s000772-s000777⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "ビット反転を自分で試そう", "content_blocks": [{"type": "paragraph", "text": "今回は、AND演算とOR演算が3つのオペランドを取る形で紹介され、NOT演算がNOR命令とゼロレジスタで代用できることを学びました。ビットを裏返す発想が、命令セットの工夫につながることも見えてきましたね。"}, {"type": "paragraph", "text": "授業では触れたけれど、このカードでは深掘りしなかった内容です。ぜひ自分で復習してみてください。"}, {"type": "list", "items": ["AND即値命令（AND immediate）の使い方 ⟦s000722⟧", "ラボで複数の命令に分けて組み立てる複雑な式 ⟦s000821-s000823⟧", "反転したビット列を16進数に直す細かい手順 ⟦s000838-s000848⟧"]}, {"type": "paragraph", "text": "今日の授業では、レジスタや疑似命令から始まり、算術命令、レジスタ値の交換、そしてビット論理演算まで一気に進みました。CPUが限られた命令でどう計算とビット操作を組み立てるのか、その全体像がつかめてきたはずです。最後のNOTの話は、その工夫を象徴する良い例ですね。"}]}]}, "deep_notes": null, "fun_facts": null}, "ran": ["review_cards"], "checks": {"review_cards": {"calls": 5, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 6605, "exclamations": 13, "question_marks": 2, "citations": 85, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 24, "input_tokens": 67803, "output_tokens": 15322, "max_output_tokens_single_call": 4816, "sum_call_seconds": 77.9, "max_call_seconds": 23.84, "topics": 5, "topics_with_bad_card_sequence": 0}}, "errors": {}}, "v2": {"outputs": {"review_cards": {"2": [{"card_type": "hook", "hero_emoji": "🧳", "title": "知らずに詰めたスーツケース", "content_blocks": [{"type": "quote", "text": "Hello Worldのコードは、中身をよく知らないまま詰めたスーツケースのようなもの！でも大丈夫、旅が進めば全部わかってきます。"}, {"type": "paragraph", "text": "いきなり全部理解しなくていいんです。今回は『コードはどこに置かれて、どう動くのか』という全体像をつかむ回だよ。ここがわかると、書いた一行一行の意味が急にクリアに見えてきますよ！"}]}, {"card_type": "core_why", "hero_emoji": "🏗️", "title": "メモリの地図と実行の旅", "content_blocks": [{"type": "paragraph", "text": "アセンブリのプログラムは.dataと.textという2つのセグメントに分かれています。.dataはデータを置く場所、.textは命令を置く場所です。⟦s000182-s000183⟧"}, {"type": "paragraph", "text": "ここで大事なのは、どちらも最終的にはメモリ（RAM、主記憶）に入るということ。命令もデータも、みんなメモリという同じ大きな棚に並べられるんです。⟦s000183⟧ ちなみにレジスタもメモリの一種ですが、講義ではCPU内の特別な記憶場所としてレジスタと呼び分けます。⟦s000185-s000186⟧"}, {"type": "callout", "alert_type": "info", "text": "プログラムの実行は、まず命令がメモリから**命令レジスタ（instruction register）**に読み込まれ、実行されます。実行が終わると**プログラムカウンタ（program counter）**が1つ増え、次の命令を指すんです！⟦s000276-s000279⟧"}, {"type": "code", "code_string": "命令1 → 命令2 → 命令3 → 命令4 → ...（終わるまで順番に）", "language": "text", "explanation": "ふつうは上から順に1つずつ実行されます。ジャンプやループはまだ先の話ですよ。⟦s000280-s000287⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": ".textを忘れると大混乱！", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "ここが試験でも狙われる落とし穴！**.textを書き忘れると、アセンブラは全部をデータだと思い込み、命令がまったく置かれなくなってしまいます。** 先生の授業でも、この書き忘れがバグの原因になった学生がいました。⟦s000300-s000302⟧"}, {"type": "paragraph", "text": "さらに、.dataも.textも何も書かないと、アセンブラは『これはコードだ』と判断して、そのまま組み立ててしまいます。エラーが出ないぶん、気づきにくいのが厄介なところ。⟦s000303-s000307⟧"}, {"type": "paragraph", "text": "もう一つ大事なのが数値の扱いです。即値ロード命令（load immediate）は、T1レジスタに定数34を入れる命令ですが、何も指定しなければ34は10進数として扱われます。実行後にT1を見ると、34の16進表記である22が入っているように見えて驚きますよ！ ⟦s000187-s000199⟧⟦s000257-s000260⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩へ", "content_blocks": [{"type": "paragraph", "text": "今回は、Hello Worldのプログラムが.dataと.textの2つのセグメントでメモリに配置されること、そして命令はプログラムカウンタに従って1つずつ実行されることを学びました。即値ロード命令で数値をレジスタに入れる最初の一歩も見ましたね。"}, {"type": "paragraph", "text": "次の講義では、今回さらっと流した内容を自分で復習するための手がかりとして、以下を押さえておくと安心です。"}, {"type": "list", "items": ["16進数への変換の計算手順（34を16進数にする方法）⟦s000223-s000237⟧", "分岐やループによって実行順序がジャンプする仕組み⟦s000284-s000285⟧"]}, {"type": "paragraph", "text": "次は算術命令とオペランドに進みます。加算命令（add instruction）や即値加算命令（add immediate）では、オペコード（opcode）や、計算を担う算術論理演算装置（Arithmetic Logic Unit, ALU）が登場しますよ。即値オペランド（immediate operand）という言葉も出てくるので、今日の即値の話がそのまま役立つはずです！"}]}]}, "deep_notes": null, "fun_facts": {"title": "CPUの中で起きる“翻訳”の秘密 🖥️", "hook": "実は現代のCPUは、プログラマーが書いた命令をそのまま実行しておらず、動く直前に別の内部命令へ細かく分解しています。\n\nその分解後の小さな命令は「マイクロオプス（uOps）」と呼ばれ、ハードウェアの中で目に見えないまま高速に生成されています。", "body": "疑似命令が「書きやすい表記を本物の命令に置き換える」仕組みだと知ると、CPUの内部でも似たことが起きていると気づいて驚くはずです。\n\n intel系のx86プロセッサは、複雑な命令を一つずつ直接実行するのではなく、「uOps」と呼ばれる単純な内部操作に分解してから処理します⟦1⟧。\n\nこの分解結果はマイクロオプスキャッシュに保存され、同じ処理が繰り返されるときに、毎回翻訳し直さずに済むようになっています⟦1⟧。\n\nつまりCPUは、私たちが目にする命令セットを一種の“表向きの言語”として扱い、内部では効率のよい形へハードウェアがリアルタイムに作り替えているのです。\n\n普段何気なく書いているプログラムの一行が、CPUの中では何段階もの翻訳を経て動いている。その事実を思うと、ソフトウェアとハードウェアの境界がぐっと面白く見えてきます。", "sources": []}}, "ran": ["fun_facts", "review_cards"], "checks": {"review_cards": {"calls": 1, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 1496, "exclamations": 7, "question_marks": 0, "citations": 11, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 8, "input_tokens": 12688, "output_tokens": 2414, "max_output_tokens_single_call": 2414, "sum_call_seconds": 12.8, "max_call_seconds": 12.75, "topics": 1, "topics_with_bad_card_sequence": 0}, "fun_facts": {"calls": 1, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 511, "exclamations": 0, "question_marks": 0, "citations": 2, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 1, "input_tokens": 4025, "output_tokens": 518, "max_output_tokens_single_call": 518, "sum_call_seconds": 3.7, "max_call_seconds": 3.74, "fun_fact_sources": 0}}, "errors": {}}, "v3": {"outputs": {"review_cards": null, "deep_notes": null, "fun_facts": null}, "ran": [], "checks": {}, "errors": {}}, "v4": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🧑‍🍳", "title": "料理人の作業台", "content_blocks": [{"type": "quote", "text": "CPUのレジスタは、料理人の目の前にある作業台みたいなもの！材料をいったん置いて、すぐ手に取れる場所なんです！"}, {"type": "paragraph", "text": "想像してみてください。料理をするとき、冷蔵庫まで毎回取りに行っていたら、日が暮れちゃいますよね。だからこそ、よく使う材料は手元の作業台に並べておくんです。レジスタは、まさにその作業台なんですよ！"}]}, {"card_type": "core_why", "hero_emoji": "🗂️", "title": "名前で呼べる作業机", "content_blocks": [{"type": "paragraph", "text": "レジスタにはいくつか種類があり、それぞれ役割が決まっています。例えば、一時的な計算に使う**一時レジスタ（temporary register）**は、T0、T1、T2のように呼ばれます。Tは temporary の頭文字なんですね！⟦s000003⟧"}, {"type": "paragraph", "text": "関数の引数を渡すときには、**引数レジスタ（argument register）**のA0〜A3が使われます。Aは argument の頭文字です。⟦s000004⟧⟦s000006⟧"}, {"type": "callout", "alert_type": "info", "text": "そして、どんな時でも値が**0**に決まっている特別な**ゼロレジスタ（zero register）**があります。ここが今日のポイントです！⟦s000001⟧⟦s000002⟧"}, {"type": "code", "code_string": "$zero = 0 （常に）\n$t0 = 作業用（自由に使える）", "language": "text", "explanation": "ゼロレジスタだけは書き換えても値は0のまま、と覚えておきましょう。⟦s000003⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🎭", "title": "moveは実は足し算だった！", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "先生が声を大にして言っていました。『moveは組み込み命令ではない！』ここを押さえると、疑似命令の正体がスッと分かります。⟦s000102⟧⟦s000105⟧"}, {"type": "paragraph", "text": "疑似命令（pseudo-instruction）は、アセンブラが組み込み命令に変換してくれる便利な省略形です。例えば move $t0, $zero と書いたとき、アセンブラはこれを add 命令に翻訳します。⟦s000106⟧⟦s000107⟧"}, {"type": "code", "code_string": "add $8, $0, $0   # $8 = 0 + 0 = 0", "language": "mips", "explanation": "0と0を足して$8に入れると、結果は0。つまりT0に0を入れる、というmoveと同じ働きになります。⟦s000112⟧⟦s000113⟧⟦s000114⟧"}, {"type": "paragraph", "text": "ポイントは、『ゼロを足しても値は変わらない』という性質です。だからmoveは『何かのレジスタに別の値をそのまま複製する』働きを、加算で実現しているんですね。ハードウェアに専用の回路を作らなくても、既存の加算で代用できる。賢いと思いませんか？⟦s000114⟧⟦s000115⟧⟦s000158⟧⟦s000159⟧"}, {"type": "paragraph", "text": "さらに、レジスタは名前でも番号でも指定できます。$t0と$8は同じ場所を指す別の呼び方なんです。番号は識別子（register identifier）であって、中に入っている値ではない、という点に注意してくださいね！⟦s000120⟧⟦s000122⟧⟦s000123⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩へ", "content_blocks": [{"type": "paragraph", "text": "今回は、レジスタが計算のための作業机であること、ゼロレジスタの値が常に0であること、そしてmoveのような疑似命令がアセンブラによって組み込み命令へ翻訳されることを学びました。レジスタは名前で書くと覚えやすく、ミスも減らせます。"}, {"type": "paragraph", "text": "もう少し深く学びたい人のための自習リストです。授業では触れましたが、このカードでは詳しく扱っていない内容です。ぜひ自分で調べてみてください。"}, {"type": "list", "items": ["レジスタを番号で指定する仕組みと、数値との対応 ⟦s000029⟧⟦s000033⟧", "実機ではレジスタの初期値が前の値のまま残る理由 ⟦s000039⟧⟦s000040⟧"]}, {"type": "paragraph", "text": "次は、プログラムがメモリのどこに何を置くのかという話に進みます。データやプログラムの置き場所を知ると、いまの作業机の話がさらに立体的に見えてきますよ！"}]}], "2": [{"card_type": "hook", "hero_emoji": "🧳", "title": "スーツケースに何を詰めた？", "content_blocks": [{"type": "quote", "text": "プログラムは、中身を知らずに詰めたスーツケースみたいなもの！でも安心してください、ちゃんと中身がわかるようになります！"}, {"type": "paragraph", "text": "Hello Worldを写経したとき、「なんでこれで動くの？」と思った人も多いはず。実はプログラムは、データと命令という2種類の荷物をメモリという箱にきれいに詰めたものなんです。今日はその荷物の詰め方を一緒にのぞいていきましょう！"}]}, {"card_type": "core_why", "hero_emoji": "🗂️", "title": "命令とデータは同じ部屋に住んでいる", "content_blocks": [{"type": "paragraph", "text": "まず大事なのは、プログラムが2つのセグメントに分かれていることです。.data segment（データセグメント）はデータをメモリに置くための場所で、.text segment（テキストセグメント）は命令をメモリに置くための場所。どちらもメモリの中に入るので、『命令もデータも、結局は同じ箱の中』というイメージを持ってください。⟦s000181⟧⟦s000182⟧⟦s000183⟧"}, {"type": "paragraph", "text": "ここで「メモリとレジスタはどう違うの？」と思うかもしれません。ここではRAM（main memory、主記憶）をメモリと呼び、レジスタは特別な場所として分けて考えます。⟦s000184⟧⟦s000185⟧⟦s000186⟧"}, {"type": "paragraph", "text": "次に、load immediate（即値ロード）という命令を見てみましょう。これは、即値（immediate value）と呼ばれる定数を、デスティネーションレジスタに入れる命令です。例えばT1に34を入れると、T1の中身が34になります。⟦s000188⟧⟦s000216⟧⟦s000218⟧⟦s000219⟧⟦s000220⟧"}, {"type": "callout", "alert_type": "info", "text": "即値は『定数』と言い換えると分かりやすいです。ここで書いた34は、特に指定がなければ10進数として扱われます！⟦s000216⟧⟦s000221⟧⟦s000222⟧"}, {"type": "paragraph", "text": "プログラムの実行は、命令レジスタ（instruction register）とプログラムカウンタ（program counter）が担当します。今の命令が終わるとプログラムカウンタが1つ増え、次の命令が命令レジスタに読み込まれて実行されます。1、2、3と順番に進んでいくのがポイントです。⟦s000276⟧⟦s000278⟧⟦s000279⟧⟦s000281⟧⟦s000282⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💥", "title": ".textを忘れるとコードがデータになる！", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "セグメントの指定を忘れると、アセンブラは『これは全部データだ』と勘違いしてしまいます。コードが1行も生成されないので、要注意！⟦s000300⟧⟦s000301⟧"}, {"type": "paragraph", "text": "実際に、.dataだけ書いて.textを書き忘れた学生がいました。するとアセンブラは命令をデータとして扱い、コードが全く置かれない状態に。.textを書き足したら一発で直った、というのが教授の例です。⟦s000301⟧⟦s000302⟧"}, {"type": "paragraph", "text": "さらに不思議なのは、何も書かなくても動いてしまうこと。セグメント指定がない場合、アセンブラは『これはコード（.text）だ』と仮定して進みます。だからエラーが出ずに通ってしまい、あとで気づきにくいのが厄介なところです。⟦s000303⟧⟦s000305⟧⟦s000306⟧⟦s000309⟧⟦s000310⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "ここまでの振り返りと次への一歩", "content_blocks": [{"type": "paragraph", "text": "今回は、プログラムが.dataと.textの2つのセグメントに分かれ、データと命令がどちらもメモリに置かれることを学びました。さらに、即値ロード命令で定数をレジスタに入れられること、そして命令は1つずつ順番に実行されることを確認しました。"}, {"type": "paragraph", "text": "今回カードでは詳しく扱わなかった内容も、ぜひ自分で復習してみてください。"}, {"type": "list", "items": ["16進数と10進数の変換の計算手順 ⟦s000223⟧⟦s000232⟧", "レジスタの初期値やテスト実行の細かい動きについて ⟦s000257⟧⟦s000260⟧", "コメントの書き方（#を使う） ⟦s000261⟧⟦s000263⟧"]}, {"type": "paragraph", "text": "ここまでで『命令はメモリに並び、1つずつ実行される』という流れが見えてきたはず。次は、この命令たちがどうやって計算を進めるのか、加算命令（add instruction）や即値加算命令（add immediate）、そして算術論理演算装置（Arithmetic Logic Unit, ALU）の話へ進みます。さて、その計算はどんなオペランド（operand）を使うのでしょうか？"}]}], "5": [{"card_type": "hook", "hero_emoji": "🔄", "title": "ビットをひっくり返す魔法", "content_blocks": [{"type": "quote", "text": "0を1に、1を0に！コンピュータの中では、ビットを『ひっくり返す』操作が日常的に起きているんです。"}, {"type": "paragraph", "text": "今回は、ビットを単位にして計算する『ビット論理演算（bitwise logical operation）』の世界に入ります。AND、OR、XORといった命令が登場して、まるで回路のスイッチをパチパチ切り替えるように値を操作できるんですよ！"}, {"type": "paragraph", "text": "ちょっと待って、ここで一つ疑問が浮かびませんか？『NOT（否定）』の命令って、わざわざ専用の命令がありそうなのに…実はこれがないんです。さて、どうやって作るのでしょう？"}]}, {"card_type": "core_why", "hero_emoji": "🧩", "title": "NOTがない？でも大丈夫！", "content_blocks": [{"type": "paragraph", "text": "命令には『オペコード（opcode）』という、どの操作をするかを示す部分があります。NOTの専用命令を作るとビットを使ってしまうので、設計者は『NOTは作らない、その代わりにNORを使おう』と決めたんです。⟦s000753⟧⟦s000754⟧"}, {"type": "paragraph", "text": "NOR命令は、2つの入力を受け取り、そのORの結果をビット反転させたものを出力します。つまり、NORを使えば反転の働きをそのまま手に入れられるわけです。⟦s000757⟧⟦s000758⟧"}, {"type": "code", "code_string": "NOR T3, T1, T1   # T3 = NOT T1", "language": "text", "explanation": "同じ値を2回入れると、ORの結果がそのままAになり、そこから反転されるのでNOTになります。⟦s000763⟧⟦s000765⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "0とORの裏技で反転", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "教授からの重要なヒント：『Aとゼロ』をNORにかけると、Aの反転になります！ゼロレジスタとNORを組み合わせるのがポイントです。⟦s000759⟧⟦s000762⟧"}, {"type": "paragraph", "text": "なぜ『A と 0 のOR』が『A』になるのでしょう？0はどのビットを入れても元の値を変えないので、A ORゼロは必ずAになります。そこにNORの反転が加わるので、結果としてNOTになるわけです。⟦s000763⟧"}, {"type": "paragraph", "text": "実際のアセンブリでは、NOT命令は『NOR命令に出力先レジスタと、ゼロレジスタを入力として渡す』形で実装されます。こうして、専用の命令がなくても、NOTを既存の命令で完璧に再現できるんです！⟦s000772⟧⟦s000773⟧⟦s000774⟧⟦s000775⟧⟦s000776⟧⟦s000777⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "ビット反転を自分で試してみよう", "content_blocks": [{"type": "paragraph", "text": "今回は、AND・OR・XORといったビット論理演算を学び、NOT演算が専用命令ではなくNOR命令によって実現されることを確認しました。ビットを単位にした操作が、どのように値を変えるのかがイメージできたはずです。"}, {"type": "paragraph", "text": "ここからは、授業中に扱ったものの、カードでは深く解説しなかった内容です。ぜひ自分で確かめてみてください。"}, {"type": "list", "items": ["5や1などの値をビットごとに反転し、16進数で表す手順 ⟦s000834⟧⟦s000849⟧", "ラボで2つの整数を使い、AND・OR・XOR・NOTを組み合わせた複雑な式を組み立てる作業 ⟦s000814⟧⟦s000821⟧⟦s000822⟧"]}, {"type": "paragraph", "text": "今日の授業は、レジスタと疑似命令の基礎から始まり、プログラムの構成、算術命令、レジスタの値交換を経て、ついにビット論理演算にたどり着きました。小さな命令の組み合わせで複雑な動きが生まれることを、ぜひ実感してください。"}]}]}, "deep_notes": null, "fun_facts": null}, "ran": ["review_cards"], "checks": {"review_cards": {"calls": 3, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 4641, "exclamations": 20, "question_marks": 9, "citations": 78, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 14, "input_tokens": 43203, "output_tokens": 7335, "max_output_tokens_single_call": 2564, "sum_call_seconds": 37.6, "max_call_seconds": 13.54, "topics": 3, "topics_with_bad_card_sequence": 0}}, "errors": {}}}}, {"id": "666b2c9d-a997-451b-9318-98f98c9d29fa", "title": "関数型プログラミングとHaskellの基礎", "lang": "English → Japanese", "topics": [{"idx": "1", "title": "コンパイラとインタプリタの役割と違い"}, {"idx": "2", "title": "関数型プログラミングの基礎と数学的背景"}, {"idx": "3", "title": "副作用のない計算と遅延評価"}, {"idx": "4", "title": "Haskellの関数定義と型推論"}, {"idx": "5", "title": "Haskellの評価規則と条件分岐"}, {"idx": "6", "title": "再帰・局所定義と配列指向の考え方"}], "gemini": {"review_cards": {"1": [{"card_type": "hook", "title": "コンパイル？インタープリタ？", "hero_emoji": "🤔", "content_blocks": [{"text": "前回の講義では、ソースコードを直接実行する**インタープリターの実行モデル**について学びましたね。", "type": "paragraph"}, {"text": "「C++はコンパイル型、Pythonはインタープリタ型」って、みんなそう思ってるよね？でも、それって本当に絶対のルールなのかな？", "type": "quote"}, {"text": "実は、この常識には大きな落とし穴があるんです！言語の「種類」と「実行方法」は、私たちが思っているよりもずっと自由な関係なんです。", "type": "paragraph"}]}, {"card_type": "core_why", "title": "言語は実行方法を選ばない！", "hero_emoji": "💡", "content_blocks": [{"text": "多くの人が「C++はコンパイルされる言語、Pythonはインタープリタされる言語」と考えていますが、これは誤解です。**どんなプログラミング言語でも、コンパイルすることも、インタープリタすることも可能**なんです！ ⟦s000013-s000015⟧", "type": "paragraph"}, {"text": "言語の実行方式は、その言語の**実装（コンパイラやインタープリタ）の選択**によって決まるのであって、言語そのものの性質ではありません。 ⟦s000017-s000018⟧", "type": "callout", "alert_type": "info"}, {"text": "例えば、「動的型付け言語（dynamically typed languages）は常にインタープリタされる」というのもよく聞く話ですが、これも単なる**一般的な傾向**に過ぎません。ルールではないんです！ ⟦s000019-s000023⟧", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "「可能」と「簡単」は違う！", "hero_emoji": "🤯", "content_blocks": [{"text": "「どんな言語でもコンパイルもインタープリタも可能」と言っても、それが常に簡単だとは限りません。言語によっては、特定の実行方式が**非常に難しい**場合があります。 ⟦s000017-s000018⟧", "type": "paragraph"}, {"text": "C言語のようにポインタ（pointers）を多用する言語は、インタープリタで実行するのが**非常に複雑**になることがあります。しかし、それでも「根本的に不可能」というわけではありません！ ⟦s000030-s000031⟧", "type": "callout", "alert_type": "warning"}, {"text": "実際に、CERNでは1990年代にC/C++用のインタープリタ「Sint」が科学計算で使われていましたし ⟦s000028⟧、PythonをC言語に変換してコンパイルする「Cython」のようなツールも存在します。 ⟦s000029⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "次のステップへ！", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、プログラミング言語の実行方式が、その言語の性質ではなく、実装の選択によって決まるという、プログラミングの根幹を揺るがす事実を学びました。", "type": "paragraph"}, {"text": "さて、コンパイラやインタープリタがプログラムをどう扱うか理解したところで、次は**関数型プログラミング（functional programming）**という、全く異なるプログラミングパラダイムの世界へ飛び込みましょう！**ラムダ計算（lambda calculus）**や**不変性（immutability）**といったキーワードが、あなたのプログラミング観を大きく変えるかもしれませんよ！", "type": "paragraph"}]}], "2": [{"card_type": "hook", "title": "変数が変わらない世界？", "hero_emoji": "🤯", "content_blocks": [{"text": "「変数は一度初期化されたら二度と変更できない」って言われたら、どうやってプログラムを書くか想像できますか？", "type": "quote"}, {"text": "関数型プログラミング（Functional Programming, FP）の世界へようこそ！ここでは、変数は**定数**であり、一度値を設定したら、その値は永遠に変わりません。まるで時間の流れが止まったかのようです！", "type": "paragraph"}]}, {"card_type": "core_why", "title": "FPの3つの柱", "hero_emoji": "⚙️", "content_blocks": [{"text": "関数型プログラミングは、その名の通り「関数」を中心に据えたパラダイムです。その核となる特性は以下の3つ！", "type": "paragraph"}, {"type": "list", "items": ["**関数は第一級オブジェクト（First-Class Citizens）**：関数は変数に格納したり、引数として渡したり、他の関数から返したりできます。まるで整数や文字列と同じように扱えるんです！ ⟦s000202-s000211⟧", "**変数の不変性（Immutability）**：一度初期化された変数は、**絶対に**変更できません。`i = i + 1` のような操作は許されません！ ⟦s000212-s000214⟧", "**すべての関数は純粋（Pure Functions）**：これは最も重要な概念の一つ！純粋関数は、常に同じ入力に対して同じ出力を返し、外部の状態を一切変更しません。 ⟦s000215-s000220⟧"]}, {"text": "これらの制約が、一見するとプログラミングを難しくするようですが、実は驚くべきメリットをもたらします！", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "純粋関数と副作用の秘密", "hero_emoji": "💡", "content_blocks": [{"text": "「**純粋関数（Pure Function）**」とは、以下の2つの条件を完全に満たす関数のことです。これは「参照透過性（Referential Transparency）」とも呼ばれます。 ⟦s000236-s000238⟧", "type": "callout", "alert_type": "info"}, {"type": "list", "items": ["**常に同じ出力**：特定の入力 `x` に対して、関数 `f(x)` は常に同じ出力 `y` を返します。1を渡せば常に10、2を渡せば常に20、といった具合です。 ⟦s000240-s000244⟧", "**外部に依存しない**：関数の出力は、その入力パラメータのみに基づいて計算され、外部のデータ（現在の時刻、グローバル変数など）に依存したり、それらを変更したりしません。 ⟦s000245-s000250⟧"]}, {"text": "もし関数が外部の状態を変更したり、外部の状態に依存して結果が変わったりする場合、それは「**副作用（Side Effect）**」を持つ「不純な関数（Impure Function）」と呼ばれます。 ⟦s000264-s000265⟧", "type": "paragraph"}, {"type": "code", "code_string": "// 純粋関数 (Pure Function)\nint add(int x, int y) {\n    return x + y;\n}\n\n// 不純な関数 (Impure Function) - グローバル変数を変更する副作用\nint global_counter = 0;\nint increment_and_get() {\n    global_counter++;\n    return global_counter;\n}", "explanation": "純粋関数は常に予測可能ですが、不純な関数は呼び出すたびに異なる結果を返す可能性があります。 ⟦s000252-s000261⟧"}]}, {"card_type": "next_action", "title": "次へのステップ", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、関数型プログラミングの基本的な考え方、特に変数の不変性と純粋関数の概念、そしてそれがもたらすメリットについて学びました。", "type": "paragraph"}, {"text": "さらに深く掘り下げるには、これらも確認しておきましょう:", "type": "paragraph"}, {"type": "list", "items": ["コンパイラとインタプリタのより詳細な比較 ⟦s000050-s000063⟧", "アロンゾ・チャーチの**ラムダ計算（lambda calculus）**の具体的なメカニズム ⟦s000140-s000148⟧", "アラン・チューリングの**チューリングマシン（Turing machine）**の動作原理 ⟦s000159-s000160⟧", "LISPやHaskellの誕生に関する歴史的背景のさらなる詳細 ⟦s000168-s000184⟧"]}, {"text": "副作用のない計算は、プログラムの予測可能性を高め、多くの利点をもたらします。しかし、現実世界では状態の変更は避けられないことも。では、どのようにして「副作用のない計算」を維持しつつ、さらに効率的な「遅延評価（lazy evaluation）」を実現するのでしょうか？次回、その秘密に迫ります！", "type": "paragraph"}]}], "3": [{"card_type": "hook", "title": "命令型 vs. 関数型", "hero_emoji": "🔄", "content_blocks": [{"text": "命令型は「レシピ」、関数型は「変換」！", "type": "quote"}, {"text": "C++やPythonのような**命令型プログラミング**では、一連の「手順」や「状態変更」を記述します。変数を変更し、ループを回し、アルゴリズムをステップバイステップで実行します。まるで料理のレシピのようですね。⟦s000342-s000343⟧", "type": "paragraph"}, {"text": "一方、**関数型プログラミング**では、すべてが関数の呼び出しによる「変換」です。変数は定数で、ループも状態変更もありません。まるで数学の関数のよう！ ⟦s000344-s000349⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "副作用なしの魔法", "hero_emoji": "✨", "content_blocks": [{"text": "命令型言語では、関数が外部の状態（ファイルやグローバル変数など）を変更する**副作用（side effects）**を持つため、コードの実行順序が非常に重要になります。順序を間違えると、結果が全く変わってしまう可能性があります。⟦s000359-s000362⟧", "type": "paragraph"}, {"text": "関数型プログラミングの核心は、**すべての変数が定数**であり、**関数が副作用を持たない**ことです！ ⟦s000349⟧", "type": "callout", "alert_type": "info"}, {"text": "副作用がないということは、同じ入力に対しては常に同じ出力が保証される**純粋関数（pure function）**であるということです。これにより、いつ関数を呼び出しても結果は変わらないため、実行順序の重要性が格段に低くなります。⟦s000415-s000417⟧", "type": "paragraph"}, {"text": "この特性のおかげで、関数型プログラムは**マルチスレッド（multi-threading）**でのエラーが少なく、コンパイラはコードの実行順序を自由に最適化できるのです！ ⟦s000357⟧⟦s000421⟧", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "Haskellの秘密兵器：遅延評価", "hero_emoji": "🤯", "content_blocks": [{"text": "Haskellは、この「副作用なし」という特性を最大限に活用し、**遅延評価（lazy evaluation）**という強力な最適化を行います！ ⟦s000504-s000505⟧", "type": "callout", "alert_type": "info"}, {"text": "C++のようにコードを上から順に実行するのではなく、Haskellは**変数の値が実際に必要になるまで、その計算を先延ばしにします**。 ⟦s000428-s000434⟧", "type": "paragraph"}, {"text": "例えば、ある`if`文の条件がすぐに満たされ、特定の変数の値が不要になった場合、Haskellはその変数の計算を**完全にスキップ**します。必要ないものは計算しない！これは驚くべき効率化です。 ⟦s000436-s000442⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "次へのステップ", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、関数型プログラミングが副作用のない計算と遅延評価によって、命令型プログラミングとは全く異なるアプローチで効率と安全性を実現することを見てきました。", "type": "paragraph"}, {"text": "好奇心旺盛なあなたへ、これらも深掘りしてみましょう:", "type": "paragraph"}, {"type": "list", "items": ["C++とHaskellの具体的なコード例における実行順序の違い ⟦s000368-s000383⟧", "遅延評価の内部メカニズムである「サンク（thunk）」とは何か ⟦s000477-s000478⟧", "Haskellの初期バージョンで入出力（I/O）がサポートされていなかった理由 ⟦s000509-s000517⟧"]}, {"text": "さて、Haskellで実際にコードを書くにはどうすればいいのでしょうか？次回は、Haskellの**関数シグネチャ（function signature）**や**型推論（type inference）**といった、Haskellの強力な機能について掘り下げていきます！", "type": "paragraph"}]}], "4": [{"card_type": "hook", "title": "Haskellの魔法の第一歩", "hero_emoji": "✨", "content_blocks": [{"text": "Haskellの構文は超シンプル！まるで魔法の呪文みたいに、最小限の言葉で最大の効果を発揮するんだ！", "type": "quote"}, {"text": "OCamlの構文が「イタい」と言われる中、Haskellは**超シンプルな構文**で関数型プログラミングの世界へ誘います。まずは、対話型インタープリタGHCI（ジーエイチシーアイ）で、その魔法を体験してみましょう！ ⟦s000518-s000525⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "関数定義の「秘密のレシピ」", "hero_emoji": "📝", "content_blocks": [{"text": "Haskellの関数定義は、まるで数学の式のように直感的です。でも、いくつかの**ユニークなルール**があります。 ⟦s000565-s000571⟧", "type": "paragraph"}, {"type": "list", "items": ["**型シグネチャ（Type Signature）**：関数の名前の後に`::`をつけ、引数の型と戻り値の型を`->`で繋いで宣言します。最後の型が戻り値です。 ⟦s000594-s000603⟧", "**括弧なし**：引数も関数呼び出しも、**括弧は不要**！関数名の後にスペースで区切って引数を並べます。 ⟦s000580-s000581, s000650, s000714-s000715⟧", "**暗黙の戻り値（Implicit Return）**：`return`キーワードは使いません。関数の本体の**最後の式がそのまま戻り値**になります。 ⟦s000617-s000624⟧", "**ホワイトスペース（Whitespace）**：セミコロンや波括弧の代わりに、**改行とインデント**が構文の区切りとなります。 ⟦s000607-s000615, s000627-s000631, s000713-s000714⟧"]}, {"type": "code", "code_string": "poly :: Double -> Double  -- 型シグネチャ\npoly x = 3 * x^2          -- 関数定義（括弧なし、returnなし）\n\nisGreater :: Int -> Int -> Bool\nisGreater first second = first > second -- 複数引数もスペース区切り", "explanation": "これがHaskellの関数定義の基本形です。シンプルでしょう？ ⟦s000647-s000654, s000659-s000660⟧"}]}, {"card_type": "gotcha", "title": "Haskellの「賢い探偵」：型推論", "hero_emoji": "🕵️", "content_blocks": [{"text": "Haskellの最もクールな機能の一つが**型推論（Type Inference）**です。なんと、**型シグネチャを書かなくても、Haskellが自動で関数の型を推測してくれる**んです！ ⟦s000748-s000751, s000799-s000802⟧", "type": "paragraph"}, {"type": "code", "code_string": "isOld age hasAches = age > 30 || hasAches", "explanation": "この関数には型シグネチャがありませんが、Haskellは`isOld :: Integer -> Bool -> Bool`と推論します。 ⟦s000734-s000737, s000747⟧"}, {"text": "Haskellは、`age`が`30`と比較されていることから`Integer`だと推測し、`hasAches`が`||`演算子で使われていることから`Bool`だと推測します。そして、`||`の結果が`Bool`なので、関数の戻り値も`Bool`だと推測するんです！ ⟦s000756-s000768, s000808-s000817⟧", "type": "callout", "alert_type": "info"}, {"text": "ただし、Haskellは**非常に厳格（strict）**です。自動的な型変換は一切行いません。C++のように`53.5`を`Int`に自動変換して関数に渡したり、`0`を`False`として扱ったりすることはできません。型が合わないと即エラーです！ ⟦s000770-s000775, s000852-s000860⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "次なるステップへ", "hero_emoji": "🚀", "content_blocks": [{"text": "このセグメントでは、Haskellのシンプルで直感的な関数定義の構文と、型シグネチャがなくても型を自動で推論してくれる賢い型推論の仕組みを学びました。", "type": "paragraph"}, {"text": "Curious? Dig into these too:", "type": "paragraph"}, {"type": "list", "items": ["**カリー化（Currying）**と**部分関数適用（Partial Function Application）**が、なぜ複数の引数を持つ関数の型シグネチャが`Type -> Type -> ReturnType`のような形式になるのかを理解する上で重要である理由 ⟦s000668-s000671, s000697⟧", "数値リテラルの型が型推論に与える影響（例: `30`が`Integer`ではなく、より一般的な`Num`型と推論されるケース） ⟦s000786-s000789⟧"]}, {"text": "Haskellの関数定義の基本をマスターしたところで、次は**関数適用の左結合**や**演算子の優先順位**、そして**条件式**や**ガード**といった、より複雑な評価規則と条件分岐の世界へ飛び込みましょう！", "type": "paragraph"}]}], "5": [{"card_type": "hook", "title": "Haskellの「常識」は非常識!?", "hero_emoji": "🤯", "content_blocks": [{"text": "Haskellの関数呼び出しは、あなたが思っているのと違うかもしれない！", "type": "quote"}, {"text": "もしHaskellで `f g 2` と書いたら、直感的には `g 2` が先に評価されて、その結果が `f` に渡されると思いますよね？ ⟦s000918-s000920⟧ でも、Haskellはちょっと変わったルールで動くんです！", "type": "paragraph"}]}, {"card_type": "core_why", "title": "左から右へ、関数が最優先！", "hero_emoji": "➡️", "content_blocks": [{"text": "Haskellの評価規則はシンプルだけど強力！", "type": "paragraph"}, {"type": "list", "items": ["**関数適用（Function Application）**は**左結合（Left-Associative）**で、左から右へ評価されます。 ⟦s000915-s000916⟧", "**関数呼び出し**は、**数学演算子（Mathematical Operators）**よりも**高い優先順位（Precedence）**を持ちます。 ⟦s000965-s000967⟧"]}, {"text": "だから、`f g 2` は `(f g) 2` と解釈され、`f 5 * 10` は `(f 5) * 10` と解釈されるんです。 ⟦s000923-s000929⟧", "type": "paragraph"}, {"type": "code", "code_string": "f x = x * x\ng x = 3 * x\n\n-- y = f (g 2) のつもりで `f g 2` と書くと...\n-- Haskellは `f` に `g` を渡し、その結果を `2` に適用しようとするためエラー！\n-- 正しくは `f (g 2)` と括弧で明示する必要がある。⟦s000947-s000949⟧", "explanation": "Haskellでは関数も引数として渡せるため、`f g` は有効な式と見なされます。 ⟦s000924-s000925⟧"}]}, {"card_type": "gotcha", "title": "「すべてが式」の哲学とガード", "hero_emoji": "💡", "content_blocks": [{"text": "Haskellでは、`if` も `5 + 3` も `f 7` も、すべて**式（Expression）**です。そして、すべての式は**必ず何らかの値を返す**必要があります！ ⟦s001097-s001099⟧", "type": "callout", "alert_type": "info"}, {"text": "この「すべてが式」という哲学があるため、Haskellの `if` 式には**必ず `else` 句が必要**です。 `else` がないと、条件が偽だった場合に何を返せばいいか分からなくなってしまうからです。 ⟦s001087-s001091⟧", "type": "paragraph"}, {"text": "複数の条件分岐を扱う際、ネストされた `if-else` は読みにくくなりがちです。そこで登場するのが**ガード（Guards）**！ ⟦s001133-s001134⟧", "type": "paragraph"}, {"type": "code", "code_string": "exam score professor\n  | score >= 90 = \"A\"\n  | score >= 80 = \"B\"\n  | otherwise   = \"C\"", "explanation": "ガードは `|` で始まり、条件が真になった最初の行が評価されます。 ⟦s001140-s001142⟧ `otherwise` は `else` のようなデフォルト条件です。 ⟦s001197-s001200⟧"}, {"text": "ガードは、複雑な `if-else` をよりシンプルに書くための**糖衣構文（Syntactic Sugar）**の一種。 ⟦s001206-s001211⟧ 人間にとって読みやすく、言語の複雑さを隠してくれる賢い仕組みなんです！", "type": "paragraph"}]}, {"card_type": "next_action", "title": "さらに深く掘り下げよう！", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、Haskellの関数適用の評価規則、演算子の関数化、そして「すべてが式」という哲学に基づく `if` 式とガードによる条件分岐の基本を学びました。", "type": "paragraph"}, {"text": "自習リスト:", "type": "paragraph"}, {"type": "list", "items": ["`f (g 2)` や `f 5 * 10` のような具体的な式の評価ステップを自分で追跡してみる。 ⟦s000868-s000869⟧", "`f a (sqrt (a + 1))` のような関数定義で、括弧の有無がどのように評価に影響するかを試す。 ⟦s000991-s000995⟧", "演算子を関数として利用する例 (`(+) 2 4 * 5`) の詳細な評価順序を理解する。 ⟦s001029-s001048⟧", "階乗関数（factorial）の `if` 式バージョンとガードバージョンを比較し、それぞれのメリット・デメリットを考察する。 ⟦s001224-s001236⟧"]}, {"text": "Haskellの強力な機能は、まだ始まったばかり！ 次回は、**再帰（recursion）**や**局所定義（local binding）**、そして`where`節と局所関数（where clause and local function）を使って、より洗練されたコードを書く方法を探求します。スコープとクロージャ的な参照（scope and closure-like access）も登場しますよ！", "type": "paragraph"}]}], "6": [{"card_type": "hook", "title": "Haskellの「待て」の美学", "hero_emoji": "⏳", "content_blocks": [{"text": "Haskellは、本当に必要になるまで計算をしない怠け者なんです！", "type": "quote"}, {"text": "他の言語ではすぐに計算されるような式でも、Haskellは「後でね！」と計算を先延ばしにします。これを**遅延評価（lazy evaluation）**と呼びます。まるで、宿題を提出期限ギリギリまでやらない学生みたいですね！ ⟦s001262-s001263⟧", "type": "paragraph"}, {"text": "例えば、階乗関数で`n-1`を計算する際も、その値が本当に必要になるまで、計算自体を**サンク（thunk）**という「未評価の計算の約束」として渡すんです。 ⟦s001314-s001316⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "コードを整理する局所定義", "hero_emoji": "📝", "content_blocks": [{"text": "Haskellでは、関数内で一時的な値やヘルパー関数が必要な場合、**局所定義（local binding）**を使ってコードを整理できます。これにより、関数本体のロジックがすっきりし、可読性が格段に向上します。 ⟦s001361-s001362⟧", "type": "paragraph"}, {"text": "主な局所定義の方法は2つ！", "type": "paragraph"}, {"type": "list", "items": ["`let`式: 式の途中で局所変数（定数）を定義し、`in`キーワードでそのスコープを指定します。 ⟦s001355-s001371⟧", "`where`節: 関数定義の最後に局所変数やヘルパー関数をまとめて定義します。可読性を高めるのに役立ちます。 ⟦s001413-s001428⟧"]}, {"type": "code", "code_string": "circleArea r = let piValue = 3.14159 in piValue * r * r\n\n-- または\n\ncircleAreaR r = piValue * r * r\n  where piValue = 3.14159", "explanation": "`let`と`where`はどちらも局所的な値を定義できます。 ⟦s001406-s001407, s001434-s001435⟧"}]}, {"card_type": "gotcha", "title": "Haskellのスコープの秘密", "hero_emoji": "💡", "content_blocks": [{"text": "Haskellでは、**ガード（guards）**を使う場合は**`where`節**しか使えません。これは言語設計上の決定であり、特別な理由はありません！ ⟦s001470-s001478⟧", "type": "callout", "alert_type": "info"}, {"text": "そして、Haskellのネスト関数（関数内で定義された関数）は、外側の関数の**すべての変数や引数にアクセスできます**。これはまるで、親の財布の中身を自由に見られる子供のようですね！ ⟦s001561-s001566⟧", "type": "paragraph"}, {"type": "code", "code_string": "whatsTheBehaviorOf name = \n  if name == \"Kerry\" \n    then behaveLike \"12-year-old\"\n    else behaveLike \"grown-up\"\n  where\n    behaveLike what = name ++ \" behaves like a \" ++ what ++ \"!\" -- 'name'は外側の引数\n", "explanation": "`behaveLike`関数は、引数として渡されていない`name`にアクセスしています。これは**副作用（side effect）**ではなく、定数へのアクセスなので問題ありません。 ⟦s001575-s001581⟧"}]}, {"card_type": "next_action", "title": "本日のまとめ", "hero_emoji": "🎓", "content_blocks": [{"text": "このセグメントでは、Haskellの遅延評価の仕組みを再確認し、`let`式と`where`節による局所定義、そしてネスト関数が外側のスコープにアクセスできる強力な機能について学びました。", "type": "paragraph"}, {"text": "さらに深く掘り下げたい方は、こちらも確認してみましょう:", "type": "paragraph"}, {"type": "list", "items": ["`isPrime`関数の詳細な実装ステップ ⟦s001592-s001635⟧", "APLのQuicksortコードの具体的な読み解き ⟦s001643-s001646⟧", "APLの発明者について ⟦s001651⟧"]}, {"text": "本日の講義では、コンパイラとインタプリタの違いから始まり、関数型プログラミングの基礎、副作用のない計算、Haskellの型推論、評価規則、そして再帰や局所定義といった概念を深く掘り下げました。特に、配列指向プログラミングがNumPyやTensorFlowといった現代の機械学習ライブラリに与えた影響は、今日の学びが未来の技術にどう繋がるかを示しています。", "type": "paragraph"}]}]}, "deep_notes": {"1": "## 🔍 コンパイラとインタプリタの基本的な役割\n**コンパイラ (compiler)** は、プログラム全体を一度に機械語に変換するプログラムです。⟦s000050⟧この変換された機械語は、コンピュータが直接実行できる形式です。一方、**インタプリタ (interpreter)** は、プログラムの実行を逐次的にシミュレートし、コードを一行ずつ解釈して実行します。⟦s000051⟧\n\n## ⚙️ 処理方式の違いと実行への影響\nコンパイラとインタプリタは、プログラムの実行速度と開発の反復速度に異なる影響を与えます。\n\n*   **コンパイラ**:\n    *   プログラム全体を機械語に変換するため、一般的に実行速度は速くなります。⟦s000050⟧\n    *   しかし、コードを変更するたびに、完全な再コンパイルやリンクが必要になることが多く、開発における試行錯誤の速度が遅くなります。⟦s000052-s000053⟧\n*   **インタプリタ**:\n    *   コードを逐次的に解釈して実行するため、コンパイルされたコードに比べて一般的に実行速度は遅くなります。⟦s000051, s000055⟧\n    *   最適化や実際のコンパイルが行われないことが多いため、変更をすぐに試すことができ、開発の反復速度は速くなります。⟦s000054-s000055⟧\n\n## 💡 言語と処理方式の誤解：コンパイルか解釈か\n多くの人は、C++のような言語は**コンパイル (compiled)** され、Pythonのような言語は**インタプリタ (interpreted)** されると固定的に考えています。⟦s000002-s000003⟧しかし、これは誤解です。実際には、**どのプログラミング言語もコンパイルすることも、インタプリタで解釈することも可能**です。⟦s000013, s000018, s000024-s000025⟧\n\n言語がコンパイルされるか解釈されるかは、その言語自体の性質ではなく、その言語を実装する**処理方式 (implementation method)** の違いに過ぎません。⟦s000027⟧\n\n## 📚 具体例：異なる処理方式の実装\n言語と処理方式の独立性を示す具体的な例がいくつかあります。\n\n*   **C++やC言語のインタプリタ**:\n    *   かつてはC++やC言語のインタプリタ版が存在しました。⟦s000014⟧\n    *   例えば、**Sint**は1990年代にCERNで科学技術計算のために使用されたCおよびC++のインタプリタです。⟦s000028⟧\n    *   ポインタなどの機能があるため、C言語をインタプリタで解釈するのは難しい場合もありますが、根本的に不可能ではありません。⟦s000030-s000031⟧\n*   **Pythonのコンパイラ**:\n    *   Pythonのコンパイル版も存在します。⟦s000015⟧\n    *   **Cython**は、PythonコードをC言語に**トランスパイル (transpile)** し、その後C++コンパイラを使用して機械語にコンパイルするツールです。⟦s000029⟧\n\n## ⚠️ 動的型付け言語に関する注意点\n「動的型付け言語 (dynamically typed languages) は常にインタプリタで解釈され、静的型付け言語 (statically typed languages) はコンパイルされる」という考え方も、よくある誤解の一つです。⟦s000019-s000021⟧これは「ルール」ではなく、単に「典型的な傾向」に過ぎません。⟦s000022-s000023⟧動的型付け言語（例えばPython）が常にインタプリタで解釈されなければならないという要件はありません。⟦s000032-s000034⟧\n\n## 🎯 主要なポイント\n*   **言語と処理方式の分離**: プログラミング言語自体がコンパイル型かインタプリタ型かを決定するわけではありません。どの言語もコンパイルまたはインタプリタで解釈することが可能です。⟦s000013, s000024-s000025⟧\n*   **実行速度と開発速度のトレードオフ**: コンパイラは一般に実行速度が速いですが、変更時の再コンパイルに時間がかかります。インタプリタは実行速度が遅い傾向がありますが、変更をすぐに試せるため開発の反復速度が速いです。⟦s000052-s000055⟧\n*   **動的型付け言語の誤解**: 動的型付け言語が常にインタプリタで解釈されるという規則はなく、コンパイルすることも可能です。⟦s000022-s000023, s000032-s000034⟧", "2": "## 🚀 関数型プログラミングへの導入\nこの講義では、まずコンパイラとインタプリタの基本的な違いをまとめます。**コンパイラ（compiler）**はプログラムを機械語に翻訳し、**インタプリタ（interpreter）**はプログラムの実行を逐次シミュレートします。コンパイラは変更時の再コンパイルが必要なため反復速度が遅いですが、実行速度は一般的に速く、最適化された機械語を生成します。一方、インタプリタは反復速度が速く、対話的なデバッグが容易ですが、実行速度は遅い傾向があります。⟦s000049-s000063⟧\n\n今後数週間にわたり、**関数型プログラミング（functional programming）**について学びます。主に**Haskell**を使用しますが、これはおそらく最も単純な関数型言語であるためです。⟦s000077-s000079, s000084⟧ 関数型言語は主に学術分野で使われていますが、そのパラダイムはPython、C++、Java、Goといったほとんどの現代言語に影響を与えています。⟦s000089-s000090, s000097-s000098, s000103-s000104⟧ そのため、関数型言語の核となる概念を理解することは、他の多くの言語がどのように機能するかを理解するのに役立ちます。⟦s000099-s000100, s000102⟧ Haskellは数少ない**純粋関数型言語（pure functional language）**の一つであり、主要なアイデアを説明するのに適しています。⟦s000106-s000107⟧\n\n関数型プログラミング、特にHaskellのような純粋なバージョンでは、変数の**ミューテーション（mutation）**、つまり変数の変更は許されません。一度初期化された変数は変更できず、すべての変数は**定数（constant）**として扱われます。⟦s000109-s000112, s000117-s000118⟧ 今後の目標は、関数型プログラミングの原則を学び、関数的な方法で問題を解決し、他の言語への影響を理解することです。⟦s000119-s000123⟧\n\n## 📜 関数型プログラミングの歴史と数学的基盤\n関数型プログラミングのルーツは、1930年代に**アロンゾ・チャーチ（Alonzo Church）**が開発した**ラムダ計算（lambda calculus）**にあります。⟦s000137-s000138⟧ ラムダ計算は、チューリング機械で解決できるあらゆる計算可能な問題が、1つ以上の関数の**合成（composition）**によって解決できるという考え方に基づいています。⟦s000140-s000142⟧ これは、`y = f(g(h(x)))` のように、ある関数の出力を別の関数の入力として渡すことを意味します。⟦s000143-s000145⟧ ラムダ計算では、各関数は最大で1つの引数しか持ちません。⟦s000146-s000147⟧\n\n1937年、**アラン・チューリング（Alan Turing）**は、チャーチが研究していたラムダ計算と、彼自身が考案した**チューリング機械（Turing machine）**が計算能力において等価であることを証明しました。⟦s000157-s000160⟧ これは**チャーチ＝チューリングの提唱（Church-Turing thesis）**として知られています。⟦s000163⟧\n\n1958年、**ジョン・マッカーシー（John McCarthy）**は、チャーチのラムダ計算に基づいて最初の関数型言語である**LISP**を開発しました。⟦s000168-s000170⟧ 彼はまた、**ガベージコレクション（garbage collection）**や**クロージャ（closure）**といった概念も導入しました。⟦s000171-s000172⟧\n\n1987年には、FPCA（Functional Programming Conference）会議で、複数の関数型言語に共通するオープンな標準が必要であると決定され、新しい言語の定義が始まりました。⟦s000176-s000180⟧ これが**Haskell**であり、形式的なプログラム動作評価方法を開発した数学者**ハスケル・カリー（Haskell Curry）**にちなんで名付けられました。⟦s000182-s000184⟧\n\n## ✨ 関数型プログラミングの主要原則\n関数型プログラミングにはいくつかの重要な原則があります。\n\n*   **関数の入出力の厳格性:**\n    *   すべての関数は少なくとも1つの引数を取り、必ず値を返さなければなりません。値を返さない関数は、関数型プログラミングでは有効な関数とは見なされません。⟦s000194-s000197⟧\n    *   純粋な関数型プログラミングでは、関数は1つの引数のみを取ります。⟦s000198-s000199⟧\n    *   引数を全く取らない関数は、純粋な関数型言語では許されません。⟦s000201⟧\n\n*   **関数は第一級オブジェクト（first-class citizens）:**\n    *   関数は、整数や文字列のような他のデータと同様に扱われます。⟦s000202, s000206⟧\n    *   関数を変数に格納したり、他の関数の引数として渡したり、関数の戻り値として返したりすることができます。⟦s000204-s000205, s000209-s000211⟧\n\n*   **不変性（Immutability）:**\n    *   すべての変数は**不変（immutable）**であり、初期化された後は変更できません。⟦s000212⟧\n    *   `i = i + 1` や `i++` のような変数のミューテーション（変更）は、真の関数型プログラミングでは一切許されません。⟦s000213-s000214⟧\n\n*   **純粋関数（Pure Functions）:**\n    *   すべての関数は**純粋（pure）**でなければなりません。⟦s000215⟧\n\n## 🎯 純粋関数とは何か\n**純粋関数（pure function）**とは、以下の2つの特性を持つ関数です。**参照透過性関数（referentially transparent function）**とも呼ばれます。⟦s000237-s000238⟧\n\n1.  **決定論的出力:** 特定の入力 `x` に対して、関数 `f(x)` は常に同じ出力 `y` を返します。⟦s000216-s000220, s000240-s000244⟧\n    *   例えば、入力として1を渡すと常に10を返し、2を渡すと常に20を返すような関数です。⟦s000220, s000242-s000243⟧\n    *   C++で乱数を生成して返す関数のように、呼び出すたびに異なる値を返す関数は純粋ではありません。⟦s000221-s000223⟧\n\n2.  **外部状態への非依存性:** 関数は、その出力を入力パラメータのみに基づいて計算し、外部の変更可能なデータに依存したり、それを変更したりしません。⟦s000224-s000229, s000245-s000246⟧\n    *   これには、現在のタイムスタンプ、変更される可能性のあるグローバル変数などが含まれます。⟦s000217-s000218, s000247-s000248⟧\n    *   純粋関数は、パラメータと内部計算のみを使用して結果を生成します。⟦s000249-s000250⟧\n\n<!-- FIGURE: type=\"code\" title=\"純粋関数の例\" description=\"入力パラメータのみに基づいて計算を行い、常に同じ結果を返す関数を示すコード。例えば、`addFive(x)` のような関数で、`x` に5を加えて返す。\" -->\n```\n-- 純粋関数の例 (Haskell風)\naddFive :: Int -> Int\naddFive x = x + 5\n```\nこの `addFive` 関数は、入力 `x` にのみ基づいて計算を行い、常に同じ結果を返します。⟦s000252-s000254⟧\n\n<!-- FIGURE: type=\"code\" title=\"不純関数の例\" description=\"グローバル変数を読み書きする関数を示すコード。例えば、`global_var` というグローバル変数があり、関数がそれを変更したり、その値に依存して異なる結果を返したりする。\" -->\n```\n-- 不純関数の例 (擬似コード)\nglobal_var = 0\n\nimpureFunction x =\n    global_var = global_var + 1  -- 外部状態の変更\n    return x + global_var        -- 外部状態に依存\n```\n上記の例のように、グローバル変数を変更する関数は**不純な関数（impure function）**です。この関数は呼び出されるたびに異なる結果を返す可能性があります。⟦s000257-s000261⟧\n\n関数外の状態を変更する行為は**副作用（side effect）**と呼ばれます。純粋関数は副作用を持ちません。⟦s000264-s000265⟧ ただし、関数内で定数を使用したり、変更されないグローバル変数（定数）を参照したりすることは問題ありません。⟦s000271-s000273⟧\n\n## 💡 純粋関数の利点\n純粋関数を作成することには、多くの重要な利点があります。\n\n*   **デバッグの容易さ:** 参照する状態が変化しないため、デバッグが非常に容易になります。プログラムの別の部分によって変数が変更される心配がありません。⟦s000285-s000288, s000332⟧\n*   **形式的な推論と数学的表現:** 純粋関数は、数学的および形式論理的に非常に簡単に表現できます。これにより、言語について形式的に推論することが可能になります。⟦s000231-s000232, s000290-s000291, s000322-s000323⟧\n    *   入力が与えられたときに何が出力されるかを正確に予測でき、プログラムの**証明（proof）**を構築できます。⟦s000324-s000326⟧\n    *   Leanのような数学的証明に使用される言語が関数型言語であるのはこのためです。⟦s000327-s000331⟧\n*   **並列化の容易さ:** 変更可能な変数が存在しないため、**競合状態（race conditions）**について心配する必要がありません。これにより、非常に効率的で容易に並列化可能な関数型コードを書くことができます。⟦s000293-s000297, s000333⟧\n*   **決定論的（Deterministic）:** 純粋関数は常に同じ入力に対して同じ出力を返すため、その動作は非常に予測しやすく、理解しやすいです。⟦s000301-s000302⟧\n*   **コンパイラの最適化:** コードの動作が非常に予測可能であるため、コンパイラは大幅な最適化を行うことができます。ある変更が別の変更の前に発生するかどうかを心配する必要がありません。⟦s000333-s000335⟧\n\nこれらの利点により、純粋関数はコードの推論、デバッグ、テストを容易にし、並列処理やコンパイラの最適化を可能にし、プログラムに関する形式的な分析や証明を可能にします。⟦s000332-s000337⟧\n\n## ⚠️ 純粋関数の課題\n純粋関数型プログラミングの大きな課題の一つは、**再帰（recursion）**を非常にうまく使いこなす必要があることです。⟦s000339⟧", "3": "## 🆚 命令型プログラミングと関数型プログラミング\n\nプログラミングパラダイムには、主に**命令型プログラミング (imperative programming)**と**関数型プログラミング (functional programming)**の2種類があり、そのアプローチは大きく異なります。\n\n*   **命令型プログラミング**（C++やPythonなど）は、アルゴリズム的であり、一連の文、変数の変更、ループなどによって処理が進められます。⟦s000342-s000343, s000350⟧\n    *   変数の状態変更が必須であり、ループなどで変数を変更します。⟦s000347-s000348⟧\n    *   コードの実行順序が非常に重要です。なぜなら、**副作用 (side effect)**がある場合、何が最初に実行され、何が次に実行されるか、また競合状態（race condition）が発生しないかなど、順序に細心の注意を払う必要があるからです。⟦s000359-s000362⟧\n    *   マルチスレッド処理は複雑で、エラーが発生しやすい傾向があります。⟦s000356⟧\n*   **関数型プログラミング**は、関数呼び出しによる値の変換を通じて処理を行います。⟦s000344⟧\n    *   ループ、可変変数、文は存在しません。⟦s000346, s000351⟧\n    *   すべての変数は定数であり、変更は許可されません。⟦s000349⟧\n    *   逐次的な手順の「レシピ」ではなく、一連の関数と再帰呼び出しの合成によって計算が行われます。⟦s000352-s000355⟧\n    *   実行順序の重要性は低いです。⟦s000363, s000366⟧\n    *   マルチスレッド処理が容易です。⟦s000357⟧\n\n## 🚫 副作用とは何か、なぜ問題なのか\n\n**副作用**とは、関数が計算結果を返すこと以外に、関数の外部にある状態を変化させる作用のことです。⟦s000394⟧\n\n*   **副作用の例:**\n    *   ハードドライブ上のファイルを変更する。⟦s000395⟧\n    *   グローバル変数を変更する。⟦s000397⟧\n    *   例えば、`func1`がグローバル変数をインクリメントし、`func2`がそのグローバル変数を使用する場合、`func2`を`func1`の前に実行すると全く異なる結果が得られます。⟦s000400-s000402⟧\n*   **実行順序への影響と最適化の制限:**\n    *   命令型言語では、コンパイラは`func1`が外部の状態を変更する可能性があるため、`func1`を`func2`の前に呼び出す必要があります。⟦s000390-s000391, s000394-s000398⟧\n    *   このような副作用があるため、コンパイラは特定の最適化を行うことができません。なぜなら、正しい順序で実行する必要があるため、処理が煩雑になるからです。⟦s000408-s000414⟧\n*   **関数型言語における副作用の排除:**\n    *   関数型言語では、定義上、同じ入力に対しては常に同じ出力が返されます。⟦s000415-s000417, s000423-s000425, s000449-s000450, s000459⟧\n    *   そのため、いつ関数を呼び出しても、あるいは呼び出す順序を変えても、常に正しい値が得られます。これにより、コンパイラは自由に処理の順序を変更したり、不要な呼び出しを省略したりして最適化を行うことができます。⟦s000418-s000422⟧\n    *   Haskellの初期バージョンでは、入出力（I/O）をサポートしていませんでした。これは、入出力がシステムの状態を変更し、同じ入力に対して異なる値を返す可能性があるため、副作用を引き起こすからです。例えば、入力関数を呼び出すたびにユーザーが異なる値を入力する可能性があるため、これは関数型の原則に反します。⟦s000511-s000516⟧\n\n## ⏱️ 遅延評価の仕組み\n\nHaskellのような関数型言語は、コードを最適化するために**遅延評価 (lazy evaluation)**という手法を使用します。⟦s000427, s000504⟧\n\n*   **変数の値は必要になるまで計算されない:**\n    *   C++のように上から下へ式を評価するのではなく、Haskellは変数の値が実際に参照され、使用される場合にのみその値を計算します。⟦s000428-s000434⟧\n    *   つまり、Haskellは、何らかの決定を下したり値を返したりするために、その値が絶対に必要になるまで計算を待ちます。⟦s000443-s000444, s000505-s000506⟧\n*   **条件分岐の例:**\n    ```haskell\n    someFunc arg = if z == 7 then 0 else y\n      where y = func1 arg\n            z = func2 arg\n    ```\n    *   この例で、もし`z`（`func2 arg`の結果）が7に等しいとします。この場合、`if`文はすぐに`0`を返します。⟦s000436-s000440⟧\n    *   このとき、`y`の値は使用されないため、Haskellは`y`を計算するために`func1`を呼び出すことすら行いません。⟦s000440-s000442, s000460-s000461⟧\n*   **関数の引数としての遅延評価（サンク）:**\n    *   関数の引数も同様に遅延評価されます。例えば、`f(g(x))`という式がある場合、Haskellは必ずしも`g(x)`を評価してからその結果を`f`に渡すわけではありません。⟦s000468-s000470, s000480-s000481⟧\n    *   代わりに、`g(x)`の計算自体を後で評価できる形式で保持し、これを**サンク (thunk)**と呼びます。⟦s000477-s000478⟧\n    *   もし`f`がその引数（`g(x)`の結果）を実際に使用しない場合、`g(x)`は決して評価されません。⟦s000475-s000476, s000479, s000506⟧\n    *   この評価は、何段階も深い関数呼び出しの内部で値が必要になったときに初めて行われる可能性があります。⟦s000482-s000483⟧\n*   **論理演算での応用:**\n    *   例えば、`true || (高コストな計算)`のような論理式の場合、左側のオペランドが`true`であれば、右側の高コストな計算は評価されません。Haskellは、プログラムを実行するために絶対に必要となるものだけを評価します。⟦s000497-s000503⟧\n*   **Haskellの基本原則:**\n    *   遅延評価はHaskellの基本的な原則の一つであり、関数型プログラミング全般でこの特性を持たせることが可能です。⟦s000507-s000508⟧\n\n## 🎯 副作用のない計算と遅延評価の利点\n\n副作用のない計算と遅延評価は、プログラミングにおいて多くの利点をもたらします。\n\n*   **推論、デバッグ、テストの容易さ:**\n    *   関数型コードは可変状態を持たないため、その動作を正確に予測し、形式的な分析や証明を行うことがはるかに容易になります。⟦s000322-s000326, s000329-s000332⟧\n*   **並列処理の容易さ:**\n    *   共有される可変状態がないため、マルチスレッド環境での競合状態やエラーのリスクが大幅に減少します。これにより、並列処理の実装が容易になります。⟦s000333, s000357⟧\n*   **コンパイラ最適化の可能性:**\n    *   副作用がないため、コンパイラはコードの実行順序を自由に並べ替えたり、不要な計算を省略したりするなど、積極的な最適化を行うことができます。⟦s000333-s000335, s000418-s000422⟧\n*   **効率性の向上:**\n    *   遅延評価により、実際に必要となる値のみが計算されるため、不要な計算が省かれ、プログラムの実行効率が向上します。⟦s000441-s000442, s000501-s000503⟧\n*   **適切な関数型プログラミングスタイルの習得:**\n    *   Haskellは真の関数型言語であり、そのシンプルな構文は適切な関数型プログラミングスタイルを学ぶのに役立ちます。⟦s000509-s000510, s000518⟧", "4": "## 📝 Haskellの基本的な関数定義\nHaskellは非常にシンプルな構文を持つ言語です。⟦s000518⟧関数は、数学の式のように定義され、その結果が関数の戻り値となります。\n\n### `area`関数の例\n円の面積を計算する関数`area`の定義は以下のようになります。⟦s000522⟧\n```haskell\narea radius = 3.14 * radius * radius\n```\nこの関数は、`radius`という引数を受け取り、`3.14 * radius * radius`という式を評価してその結果を返します。⟦s000522⟧\n\n### `poly`関数の例\n`3x^2`を計算する関数`poly`の定義は次のようになります。⟦s000565-s000566⟧\n```haskell\npoly x = 3 * x * x\n```\nこの定義における等号（`=`）は、C++のような代入ではなく、Pythonのコロン（`:`）のように「`poly`関数は`x`というパラメータを受け取り、`3x^2`という式を実行して結果を返す」という意味で解釈されます。⟦s000567-s000570⟧\n\n### GHCIでの実行と再読み込み\nHaskellプログラムは、対話型インタープリタであるGHCI（GHC Interactive）で実行できます。⟦s000525⟧\n1.  **ファイルの読み込み**: `area.hs`のようなHaskellファイルをGHCIに読み込むには、`:l area`と入力します。`.hs`拡張子は省略可能です。⟦s000527-s000528⟧\n2.  **関数の呼び出し**: 関数を呼び出す際は、関数名の後に引数を空白で区切って記述します。括弧は不要です。⟦s000530, s000593, s000653-s000654, s000714-s000715⟧\n    ```haskell\n    area 10  -- 半径10の円の面積を計算\n    poly 2   -- x=2の場合の3x^2を計算\n    ```\n    インタープリタは計算結果を表示します。⟦s000531-s000532, s000572⟧\n3.  **プログラムの変更と再読み込み**: プログラムに変更を加えた場合（例: `3.14`を組み込みの`pi`定数に変更）、ファイルを保存した後、GHCIで`:r`と入力することで変更を再読み込みできます。⟦s000533-s000536⟧\n\n## ✍️ 関数シグネチャと構文規則\nHaskellの関数定義には、特定の構文規則があります。\n\n### 関数シグネチャの構造\nHaskellでは、関数本体の前に**関数シグネチャ (function signature)**を記述することが一般的です。⟦s000647⟧\n*   関数シグネチャは、関数の引数の型と戻り値の型を示します。⟦s000594-s000599, s000648-s000649⟧\n*   シグネチャの行の**最後の項目が戻り値の型**です。⟦s000600, s000603, s000712⟧\n*   関数名は、シグネチャと関数定義本体の両方で2回記述されます。⟦s000637-s000640⟧これは言語設計者の決定であり、必須の理由はありません。⟦s000641-s000646⟧\n\n### 複数の引数を持つ関数シグネチャ\n複数の引数を持つ関数の場合、すべての引数の型と戻り値の型が1行に`->`で区切られて記述されます。⟦s000601-s000603, s000681⟧\n例えば、2つの数値を比較する`isGreater`関数のシグネチャは次のようになります。\n```haskell\nisGreater :: Double -> Double -> Bool\n```\nこの場合、最初の`Double`が1番目の引数の型、2番目の`Double`が2番目の引数の型、そして最後の`Bool`が戻り値の型を示します。⟦s000711-s000712⟧Haskellでは、引数の型と戻り値の型を明確に区別する構文はありません。⟦s000678-s000681, s000689-s000690⟧\n\n### 暗黙の戻り値\nHaskellでは、C++やJavaのような明示的な`return`文は不要です。⟦s000617-s000619, s000652⟧関数本体に記述された式が評価され、その結果が関数の戻り値となります。⟦s000569-s000570, s000620-s000622, s000624⟧\n\n### 関数呼び出しの構文\n関数を呼び出す際、引数は関数名の後に空白で区切って並べます。⟦s000530, s000653-s000654, s000715⟧\n*   引数を括弧で囲んだり、カンマで区切ったりする必要はありません。⟦s000580, s000650, s000654, s000688, s000714-s000715⟧\n    ```haskell\n    isGreater 12.8  -- 12が8より大きいか判定\n    ```\n\n### 空白とインデントの役割\n*   Haskellでは、改行と空白が区切り文字として機能し、セミコロンのような明示的な区切り文字はほとんど使用されません。⟦s000607-s000610, s000614-s000615⟧\n*   関数定義が複数行にわたる場合、後続の行はインデントする必要があります。インデントのスペース数は、一貫していれば特に指定はありません。⟦s000676-s000677, s000713-s000714⟧\n*   関数シグネチャ内の空白は、型の視覚的な位置合わせのために使用されることがありますが、必須ではありません。⟦s000719-s000727⟧\n\n## 🧠 型推論の仕組み\nHaskellは**型推論 (type inference)**という強力な機能を備えており、開発者が明示的に型を指定しなくても、コンパイラが自動的に型を導き出すことができます。⟦s000748-s000751, s000801-s000802, s000844-s000847⟧\n\n### `isOld`関数の例\n以下の`isOld`関数は、年齢と「痛みがあるか」というブール値を受け取り、その人が「年寄り」かどうかを判断します。\n```haskell\nisOld age hasAches = age > 30 || hasAches == True\n```\nこの関数には型シグネチャが明示されていません。⟦s000738-s000739⟧しかし、GHCIで`:t isOld`と入力すると、Haskellが`isOld :: Int -> Bool -> Bool`という型を推論したことがわかります。⟦s000743-s000747⟧\n\n### 型推論のプロセス\nHaskellは、関数の本体で値がどのように使用されているかに基づいて型を推論します。`isOld`関数の場合、以下の手順で型が導き出されます。\n1.  **`age`の型**: `age`が整数値`30`と比較されているため、Haskellは`age`が整数型（`Int`）であると推論します。文字列や浮動小数点数を整数と比較することはできないためです。⟦s000756-s000758, s000808-s000812⟧\n2.  **`hasAches`の型**: `hasAches`がブール値`True`と比較されているため、`hasAches`はブール型（`Bool`）であると推論されます。⟦s000760-s000761, s000814⟧\n3.  **戻り値の型**: 論理OR演算子（`||`）が使用されており、この演算子は常にブール値を返すため、関数の戻り値もブール型（`Bool`）であると推論されます。⟦s000765-s000768, s000815-s000817⟧\n\n### 型シグネチャの省略と必要性\nHaskellでは、型シグネチャを明示的に記述することは必須ではありません。⟦s000801⟧しかし、学習目的や、コードの可読性を高めるために、型シグネチャを記述することが推奨される場合があります。⟦s000805-s000807⟧\n\n## 🛡️ 静的型付けと厳密な型検査\nHaskellは**静的型付け (static typing)**言語であり、**厳密な型検査 (strict type checking)**を行います。⟦s000771-s000772, s000842-s000843, s000852-s000853⟧\n\n### 暗黙の型変換の禁止\n*   Haskellは、異なる型間の暗黙的な型変換を**一切行いません**。⟦s000772-s000775, s000843, s000854⟧\n*   例えば、C++では`float`を`int`が必要な引数に渡すと自動的に変換されることがありますが、Haskellではそのような自動変換は行われず、エラーになります。⟦s000777-s000778, s000853-s000854, s000857-s000860⟧\n*   `0`を`false`として、`1`を`true`として扱うような変換も行われません。⟦s000773-s000774, s000839-s000841⟧整数は整数と、ブール値はブール値としか比較できません。⟦s000774-s000775, s000810, s000840-s000841⟧\n\n### 型の不一致によるエラー\n*   Haskellでは、すべての値、変数、関数が固定された型を持っています。⟦s000849-s000851⟧\n*   もし明示的な型シグネチャが、Haskellが推論した型と異なる場合、コンパイル時にエラーが発生します。⟦s000837⟧\n*   例えば、`isOld`関数に`isOld 53.5 False`のように`Float`値を渡そうとすると、`age`パラメータが`Int`型であると推論されているため、エラーとなります。⟦s000778, s000857-s000860⟧\n*   ただし、もし`age`が特定の整数と比較されていなければ、Haskellはより一般的な`Num`型（`Int`や`Float`のスーパタイプ）を推論し、異なる振る舞いをする可能性もあります。⟦s000786-s000789, s000822-s000825⟧", "5": "## 🔍 Haskellの関数適用と評価規則\nHaskellでは、関数呼び出しの評価順序に特定の規則があります。\n\n### 関数適用の左結合性\nHaskellは関数呼び出しを左から右へと評価します。⟦s000915-s000916⟧ この性質は、関数適用 (function application) が**左結合**であると呼ばれます。⟦s000916-s000917⟧\n\n例えば、`f g 2`という式があった場合、直感的には`g`に`2`を渡し、その結果を`f`に渡す（つまり`f (g 2)`）と考えるかもしれません。⟦s000918-s000922⟧ しかし、Haskellではこれを`f`に`g`を引数として渡し、その結果に`2`を渡す、と解釈します。⟦s000923-s000927⟧\n\n*   **Haskellの解釈**: `(f g) 2` ⟦s000929⟧\n    *   これは、`f`が`g`（関数）を引数として受け取り、その結果がさらに`2`を引数として受け取れる関数である場合にのみ有効です。⟦s000928, s000938-s000940⟧\n    *   もし`f`が`g`を引数として受け取れない場合や、`f g`の結果が`2`を受け取れる関数ではない場合、この式はエラーになります。⟦s000886-s000887, s000914⟧\n*   **意図した評価順序**: `f (g 2)`\n    *   この評価順序を実現するには、明示的に括弧を使用する必要があります。⟦s000946-s000949, s000953-s000954⟧\n\n### 演算子よりも高い関数適用の優先順位\nHaskellでは、関数呼び出しは数学演算子よりも高い優先順位で評価されます。⟦s000963-s000965, s001040-s001041, s001047-s001048⟧\n\n例えば、`f 3 * 10`という式は、`f`が`3`を引数として受け取り、その結果に`10`を掛ける、と解釈されます。⟦s000966-s000967⟧\n\n*   **Haskellの解釈**: `(f 3) * 10` ⟦s000966-s000967⟧\n    *   `f 3`が先に計算され、その結果が`10`と乗算されます。⟦s000966-s000967⟧\n    *   もし`f(x) = x^2`であれば、`f 3 * 10`は`(3^2) * 10 = 9 * 10 = 90`となります。⟦s000968-s000969⟧\n*   **意図した評価順序**: `f (3 * 10)`\n    *   この評価順序を実現するには、明示的に括弧を使用する必要があります。⟦s000970⟧\n\n## 括弧の活用\nHaskellでは、意図した評価順序を明確にするために括弧を**使用しなければなりません**。⟦s000954⟧\n\n*   **関数呼び出しの入れ子**: `f (g 2)` ⟦s000947-s000948, s000974⟧\n    *   これにより、まず`g 2`が評価され、その結果が`f`に渡されます。⟦s000949⟧\n*   **演算子の優先順位の変更**: `f (3 * 10)` ⟦s000970⟧\n    *   これにより、まず`3 * 10`が評価され、その結果が`f`に渡されます。\n*   **例**: `f a (sqrt (a + 1))` ⟦s000998⟧\n    *   `f`が2つの引数を受け取る関数である場合、`f a sqrt a + 1`と書くと、`f`は`a`と`sqrt`関数を引数として受け取ろうとします。⟦s000993-s000994⟧\n    *   正しく`f`に`a`と`sqrt (a + 1)`の結果を渡すには、`sqrt (a + 1)`全体を括弧で囲む必要があります。⟦s000991-s000992, s000998⟧\n\n<!-- FIGURE: type=\"code\" title=\"Haskellにおける括弧の使用例\" description=\"数学的な表現とHaskellでの対応する記述を示す。f(x)はf x、f(x,y)はf x y、f(g(x))はf (g x)、f(x)g(y)はf x (g y)、f(x)*g(y)はf x * g yと記述されることを示す。\" -->\n\n## ⚙️ 前置形式の二項演算子 (Prefix Form of a Binary Operator)\nHaskellでは、すべての二項演算子 (binary operator) に対応する関数ベースのバージョンが提供されています。⟦s001012⟧\n\n*   **変換方法**: 二つのオペランドの間に置かれる中置演算子 (infix operator) を括弧で囲むと、それは2つの引数を受け取る標準的なHaskell関数呼び出しに変換されます。⟦s001016-s001020, s001023⟧\n    *   例: `x * 10` は `(*) x 10` と書くことができます。⟦s001015-s001018, s001024⟧\n    *   他の例: `6 - 5` は `(-) 6 5`、`a <= b` は `(<=) a b`、`boolean1 && boolean2` は `(&&) boolean1 boolean2` と書けます。⟦s001025-s001028⟧\n*   **優先順位**: 括弧で囲まれた演算子（関数として扱われる）は、通常の関数呼び出しと同様に、数学演算子よりも高い優先順位を持ちます。⟦s001040-s001041, s001047-s001048⟧\n    *   例: `(+) 2 4 * 5` は、まず`(+) 2 4`が評価され、その結果`6`が`5`と乗算されるため、`30`になります。⟦s001029-s001030, s001034, s001039-s001045, s001062-s001064⟧\n    *   これは、`+`が`*`よりも低い優先順位を持つにもかかわらず、関数呼び出しの優先順位が最も高いためです。⟦s001046-s001048⟧\n*   **利点**: この機能により、演算子を他の関数に引数として渡すことが可能になります。⟦s001065-s001067⟧\n\n## 📝 条件式 (If Expression)\nHaskellの`if`は、他の命令型言語の`if`文 (if statement) とは異なり、**式 (expression)** です。⟦s001070-s001071, s001093-s001097⟧\n\n*   **常に値を返す**: すべての式は、何らかの値に評価される必要があります。⟦s001077-s001079, s001098-s001101⟧\n*   **`else`句の必須性**: このため、Haskellの`if`式には常に`else`句が必須です。⟦s001071-s001074, s001087-s001090, s001102-s001103⟧\n    *   もし`else`句がなければ、条件が偽の場合に式が値を返せなくなり、Haskellの要件に違反します。⟦s001087-s0001090, s001105-s001107⟧\n*   **例**: 価格に基づいて割引率を計算する関数`calcDiscount`では、価格が100ドルを超える場合は20%割引、それ以外の場合は10%割引を返すように、`if`と`else`の両方のケースで値を返す必要があります。⟦s001073-s001074⟧\n\n## 🛡️ ガード (Guards)\nガードは、複数の条件分岐を記述するためのHaskellの構文です。⟦s001110-s001111, s001133-s001134⟧\n\n*   **動作**:\n    *   ガードは上から下へと順に評価されます。⟦s001129-s001130, s001140, s001149-s001150⟧\n    *   最初に真となった条件に対応する結果が返され、それ以降のガードは評価されません。⟦s001126, s001129-s001130⟧\n*   **構文**:\n    *   各ガード句はパイプ文字 (`|`) で始まります。⟦s001118, s001144⟧\n    *   その後に評価する条件が続き、イコール記号 (`=`) の後に、条件が満たされた場合に返す式が続きます。⟦s001145-s001148⟧\n    *   関数の定義行にはイコール記号を付けません。⟦s001201-s001204⟧\n*   **`if-else`の代替**: ガードは、複数の入れ子になった`if-else`式をより簡潔に記述するための代替手段です。⟦s001133-s001134, s001141-s001143, s001193-s001195⟧\n*   **`otherwise`句**: どの条件も一致しなかった場合のデフォルトのケースとして、`otherwise`句を使用できます。これは最後の`else`のような役割を果たします。⟦s001197-s001200⟧\n*   **例**: 階乗関数を`if`式とガードで記述した場合の比較。\n    *   **`if`式による階乗**:\n        ```haskell\n        factorialIf :: Int -> Int\n        factorialIf n = if n == 0\n                        then 1\n                        else n * (factorialIf (n - 1))\n        ```\n        *   `n * (factorialIf (n - 1))` の部分で括弧が必要です。これは、関数適用が演算子よりも優先されるため、`n * factorialIf n - 1` と書くと `(n * factorialIf n) - 1` と解釈されてしまうからです。⟦s001226-s001230⟧\n    *   **ガードによる階乗**:\n        ```haskell\n        factorialGuard :: Int -> Int\n        factorialGuard n\n          | n == 0    = 1\n          | otherwise = n * (factorialGuard (n - 1))\n        ```\n        *   ガードを使用すると、同じロジックをより簡潔で読みやすい形式で表現できます。⟦s001233-s001235⟧\n\n## 🍬 構文糖衣 (Syntactic Sugar)\nガードは**構文糖衣**の優れた例です。⟦s001206⟧\n\n*   **定義**: 構文糖衣とは、プログラミング言語において、より複雑な構文を隠蔽し、より単純で読みやすい構文を提供することで、プログラマの記述を容易にする機能のことです。⟦s001210-s001211, s001214-s001215⟧\n*   **目的**: ガードは、複数の`if-else`文を記述するよりも、キーワードや行数を減らし、コードをよりシンプルに理解しやすくします。⟦s001212-s001213, s001221⟧\n*   **等価性**: 構文糖衣によって提供される簡潔な構文は、より複雑な元の構文と機能的に100%等価です。⟦s001216, s001241-s001242⟧\n    *   ガードは、本質的には入れ子の`if-else`式に変換できます。⟦s001141-s001143⟧\n    *   Haskellのすべての機能は、最終的には単純な関数合成 (function composition) に還元されます。⟦s001217-s001220, s001222-s001223⟧", "6": "## 🔄 再帰のトレースと遅延評価\n再帰（recursion）とは、関数が自分自身を呼び出すことで問題を解決するプログラミング手法です。講義では、ガード（guards）を用いた階乗（factorial）関数の例を通して、再帰の動作が示されました。⟦s001248-s001249⟧\n\n階乗関数 `factorial n` の定義は以下の通りです。\n```haskell\nfactorial n\n  | n == 0    = 1\n  | otherwise = n * factorial (n - 1)\n```\nこの関数を `factorial 2` として呼び出した場合のトレースは次のようになります。\n\n1.  `factorial 2` が呼び出される。`n` は `2`。⟦s001253-s001256⟧\n2.  `n == 0` の条件は偽なので、`otherwise` の節が実行される。⟦s001257-s001259⟧\n3.  `2 * factorial (2 - 1)`、つまり `2 * factorial 1` が計算される。⟦s001259⟧\n4.  `factorial 1` が呼び出される。`n` は `1`。⟦s001276⟧\n5.  `n == 0` の条件は偽なので、`otherwise` の節が実行される。⟦s001275⟧\n6.  `1 * factorial (1 - 1)`、つまり `1 * factorial 0` が計算される。⟦s001276-s001277⟧\n7.  `factorial 0` が呼び出される。`n` は `0`。⟦s001277⟧\n8.  `n == 0` の条件は真なので、`1` が返される。⟦s001280-s001282⟧\n9.  `factorial 0` の結果 `1` が `1 * factorial 0` に戻り、`1 * 1 = 1` が計算され、`factorial 1` の結果として `1` が返される。⟦s001283-s001284⟧\n10. `factorial 1` の結果 `1` が `2 * factorial 1` に戻り、`2 * 1 = 2` が計算され、`factorial 2` の最終結果として `2` が返される。⟦s001285-s001286⟧\n\n### 💡 Haskellにおける遅延評価 (Lazy Evaluation)\nHaskellのような純粋関数型言語では、**遅延評価（lazy evaluation）**が採用されています。これは、式が必要になるまで評価を遅らせるという特性です。⟦s001262-s001263, s001272, s001290⟧\n\n*   **`n - 1` の評価:** 上記の階乗の例では、`factorial (n - 1)` の `n - 1` は、すぐに計算されて値が渡されるわけではありません。代わりに、**サンク（thunk）**と呼ばれる「計算の遅延表現」が渡されます。⟦s001263, s001270-s001271, s001314-s001315, s001327-s001328⟧\n*   **評価のトリガー:** このサンクは、その値が実際に必要になったときに初めて評価されます。例えば、`n == 0` のような条件分岐で `n` の値と比較する必要がある場合、その時点で `n - 1` の計算が実行されます。⟦s001292-s001295, s001320-s001323⟧\n*   **利点:** この遅延評価により、不要な計算を避け、無限リストのような概念を扱うことが可能になります。ただし、プログラマは通常、この詳細を意識する必要はありません。言語が自動的に処理し、結果は同じになります。⟦s001351-s001353⟧\n\n## 📝 局所定義: `let`式\n**`let`式（let expression）**は、関数や式の内部で局所的な変数（local variables）や束縛（bindings）を定義するために使用されます。⟦s001356-s001357, s001362, s001367⟧\n\n*   **構文:**\n    ```haskell\n    let 変数1 = 式1\n        変数2 = 式2\n        ...\n    in 使用する式\n    ```\n    `let`キーワードの後に一つ以上の変数定義が続き、`in`キーワードの後にそれらの変数が使用される式が続きます。⟦s001370-s001371, s001403-s001405⟧\n*   **特徴:**\n    *   **局所的なスコープ:** `let`で定義された変数は、`in`キーワードの後の式内でのみ参照可能です。⟦s001361, s001371-s001373⟧\n    *   **定数（Constants）:** `let`で定義された値は定数であり、一度初期化されると変更することはできません。⟦s001365, s001412⟧\n    *   **相互参照:** 局所変数は、他の局所変数や外側の関数のパラメータを参照できます。⟦s001363-s001364⟧\n    *   **ネスト:** `let`式の中に別の`let`式をネストして定義することも可能です。⟦s001366⟧\n    *   **遅延評価:** `let`で定義された変数は、`in`の後の式で実際に使用されるまで評価されません。⟦s001379-s001380, s001398, s001400-s001401⟧\n\n### 💡 `let`式の例\n```haskell\ncircleArea r =\n  let piValue = 3.14159\n  in piValue * r * r ⟦s001406-s001407⟧\n\nsumOfSquares x y =\n  let squareX = x * x\n      squareY = y * y\n  in squareX + squareY ⟦s001408⟧\n```\n\n## 📍 局所定義: `where`節\n**`where`節（where clause）**も`let`式と同様に、関数内で局所的な変数や関数を定義するために使用されます。⟦s001389-s001390, s001413-s001414⟧\n\n*   **構文:**\n    ```haskell\n    関数定義 = 式\n      where\n        変数1 = 式1\n        変数2 = 式2\n        ...\n    ```\n    `where`節は、関数本体の後にインデントして記述されます。⟦s001414, s001424, s001431-s001433⟧\n*   **特徴:**\n    *   **局所的なスコープ:** `where`で定義された変数は、その`where`節が属する関数全体で参照可能です。⟦s001430-s001431⟧\n    *   **可読性:** `where`節は、関数の主要なロジックを先に記述し、補助的な計算の詳細を後回しにすることで、コードの可読性を高めることができます。⟦s001425-s001428, s001434-s001435, s001438⟧\n    *   **定数と不変性:** `let`と同様に、`where`で定義された値も定数であり、変更できません。\n    *   **遅延評価:** `let`と同様に、`where`で定義された値も、実際に使用されるまで評価されません。\n\n### 💡 `where`節の例\n```haskell\ngetNerdStatus gpa studyHours =\n  if nerdScore > 100\n    then \"Super Nerdy\"\n    else \"Nerd Pose\"\n  where\n    nerdScore = gpa * 10 + studyHours ⟦s001416-s001418, s001424, s001426⟧\n\ncircleAreaR r = piValue * r * r\n  where\n    piValue = 3.14159 ⟦s001434-s001436⟧\n```\n\n## 🆚 `let`と`where`の使い分け\n`let`と`where`は多くの点で似ており、多くの場合、どちらを使っても同じ結果が得られます。選択は個人の好みやコードの可読性によることが多いです。⟦s001454-s001455⟧\n\n*   **単一の式の場合:** 関数が単一の式を返す場合（例：`piValue * r * r`）、`let`と`where`のどちらを使っても構いません。⟦s001457-s001468⟧\n*   **複数の式（ガード）の場合:** 関数が複数のガード（guards）を持つ場合、**`where`節を使用する必要があります**。`let`式はガードと組み合わせて使用することはできません。これは言語設計上の決定であり、特定の論理的な理由があるわけではありません。⟦s001469-s001471, s001473-s001475, s001478, s001481-s001482, s001498-s001499⟧\n    *   ガードは技術的にはネストされた単一の式に還元できますが、構文上は複数の式として書かれるため、`where`が必須とされています。⟦s001483-s001487, s001490-s001492⟧\n\n## 🧩 局所関数とスコープ\n`let`式や`where`節の中には、局所的なデータ束縛だけでなく、**局所関数（local functions）**を定義することもできます。⟦s001503-s001505, s001513-s001514, s001517⟧\n\n*   **定義と使用:** 局所関数は、それを囲む関数内でのみ使用できます。⟦s001519-s001522⟧\n*   **スコープとクロージャ的な参照:** 局所関数は、それを囲む関数のスコープ内のすべての変数（パラメータを含む）にアクセスできます。これは、外側の変数を「キャプチャ」する**クロージャ（closure）**のような振る舞いです。⟦s001561-s001563, s001565-s001566, s001572-s001573, s001584-s001585⟧\n    *   このアクセスは、外側の変数を読み取るだけで変更しないため、純粋関数型言語の制約（副作用がないこと）に違反しません。⟦s001575-s001581⟧\n    *   ネストされた関数がさらにネストされた関数を持つ場合、最も内側の関数は、その外側のすべてのスコープの変数にアクセスできます。⟦s001589-s001590⟧\n\n### 💡 局所関数の例\n```haskell\nwhatsTheBehaviorOf name =\n  if name == \"Kerry\"\n    then behaveLike name \"12-year-old\"\n    else behaveLike name \"grown-up\"\n  where\n    behaveLike n what = n ++ \" behave like a \" ++ what ++ \"!\" ⟦s001507-s001516⟧\n```\nこの例では、`behaveLike`という局所関数が`whatsTheBehaviorOf`関数の`where`節内で定義されています。`behaveLike`は`whatsTheBehaviorOf`のパラメータ`name`にアクセスできます。\n\nさらに、`behaveLike`関数は、外側の`name`パラメータを明示的に引数として受け取らなくても、直接参照できます。\n```haskell\nwhatsTheBehaviorOf name =\n  if name == \"Kerry\"\n    then behaveLike \"12-year-old\"\n    else behaveLike \"grown-up\"\n  where\n    behaveLike what = name ++ \" behave like a \" ++ what ++ \"!\" ⟦s001567-s001571, s001582-s001583⟧\n```\nこの場合、`behaveLike`は`name`を直接参照し、`what`のみを引数として受け取ります。\n\n## 🔢 素数判定の例\n再帰と局所関数を組み合わせた例として、素数（prime number）を判定する`isPrime`関数を考えます。\n\n```haskell\nisPrime n = checkDivisors n (n - 1)\n  where\n    checkDivisors num divisor\n      | divisor == 1          = True ⟦s001609-s001613⟧\n      | num `mod` divisor == 0 = False ⟦s001615-s001617⟧\n      | otherwise             = checkDivisors num (divisor - 1) ⟦s001620-s001625⟧\n```\nこの`isPrime`関数は、`checkDivisors`という補助関数を`where`節で定義しています。\n*   `checkDivisors`は、`num`（判定対象の数）と`divisor`（現在の除数）を引数に取ります。\n*   **基底ケース1:** `divisor`が`1`になった場合、`1`以外の数で割り切れるものがなかったため、`num`は素数であると判断し`True`を返します。⟦s001611-s001613, s001632-s001633⟧\n*   **基底ケース2:** `num`が`divisor`で割り切れる（`num mod divisor == 0`）場合、`num`は素数ではないと判断し`False`を返します。⟦s001617-s001618, s001633-s001634⟧\n*   **再帰ケース:** どちらの条件も満たさない場合、`divisor`を`1`減らして`checkDivisors`を再帰的に呼び出し、次の除数でチェックを続けます。⟦s001620-s001625, s001634-s001635⟧\n\n**注意点:** この実装には、`n`が`1`の場合のバグがあります。`n=1`は素数ではありませんが、このコードでは`checkDivisors 1 0`が呼び出され、`divisor == 1`の条件が満たされないまま進む可能性があります。`n=0`や`n=1`などのエッジケースに対する追加のガードが必要です。⟦s001626-s001631⟧\n\n## 📊 配列指向プログラミング (Array-Oriented Programming)\n**配列指向プログラミング（Array-Oriented Programming, APL）**は、要素を個別にループ処理するのではなく、配列や行列全体に対する操作として計算を記述するプログラミングパラダイムです。⟦s001658-s001660⟧\n\n*   **起源:** APLは1957年に、配列を含む数学的表現を記述するための表記法（notation）として発明されました。その後、1966年にプログラミング言語として発展しました。⟦s001648-s001650, s001653-s001654, s001657⟧\n*   **特徴:**\n    *   **ループの排除:** 明示的なループを使用せず、配列全体に対する演算を記述します。⟦s001658-s001660⟧\n    *   **特殊な記号:** APLは、ドット積（dot products）、行列乗算（matrix multiplication）、回転（rotation）、転置（transposition）などの複雑な配列操作を単一の非ASCII記号（funky non-ASCII symbols）で表現します。⟦s001661-s001663, s001668-s001669, s001672⟧\n    *   **簡潔性:** これらの記号により、非常に簡潔なコードで複雑な数学的演算を表現できます。\n*   **現代への影響:** APLは、その複雑さや難解な記号体系から直接的に広く普及したわけではありませんが、その**配列指向設計（array-oriented design）**の考え方は、現代の多くの技術に間接的な影響を与えています。⟦s001665-s001666, s001685-s001686⟧\n    *   特に、**機械学習（machine learning）**や**人工知能（AI）**の分野で広く使われているライブラリやフレームワーク（例: **NumPy**、**TensorFlow**、**PyTorch**）は、行列やテンソル（tensors）に対する効率的な操作を重視しており、APLの思想を受け継いでいます。⟦s001675-s001682, s001684⟧\n    *   これらの現代のツールは、APLのような難解な記号ではなく、より読みやすい関数名を使用していますが、行列演算の基本的なアイデアはAPLに由来しています。⟦s001683-s001684⟧"}, "fun_facts": {"title": "エリクソンの「9つのナイン」🛜", "hook": "年間わずか31ミリ秒しか停止しない通信システムが、純粋関数によって支えられていると聞いたら信じられますか？", "body": "今日の講義で学んだ純粋関数という概念が、実は世界で最も信頼性の高いシステムの心臓部を動かしているんです。\n\nそれは、かつてエリクソンが開発した電話交換機「AXD301」で、この巨大な通信インフラは、驚異的な「9つのナイン」（99.9999999%）という稼働率を達成しました⟦1⟧。\n\nこの驚くべき信頼性の秘密は、200万行以上ものErlangコードにありました⟦2⟧。Erlangは純粋関数型プログラミングを強制し、システム内のすべての操作が数学的な変換として行われます⟦3⟧。\n\nそのため、ハードウェア障害が発生しても、副作用なしにプロセスを自動的に再試行または「リプレイ」できるのです⟦4⟧。エラーが起きてもシステム全体が停止するのではなく、障害が発生した小さなプロセスだけが瞬時に再開され、わずか31ミリ秒程度のダウンタイムで済むように設計されているのです⟦5⟧。\n\nあなたが将来、ソフトウェアとハードウェアの両方に関わるものづくりを目指すなら、純粋関数がもたらすこの「絶対に止まらない」という設計思想は、きっと大きなヒントになるでしょう。", "metadata": {"sources": ["https://www.erlang-factory.com/upload/presentations/243/ErlangFactorySFBay2010-MatsCronqvist.pdf", "https://www.reddit.com/r/programming/comments/2fwl5g/osgi_alliance_blog_the_unbearable_uncoolness_of/", "https://ijsrm.net/index.php/ijsrm/article/view/7139", "https://exchangetuts.com/erlangs-999999999-nine-nines-reliability-1639509254802735", "https://medium.com/fullstackhacks/erlang-no-process-was-harmed-in-the-making-of-this-post-247a80223f19"]}, "created_at": "2026-10-06T22:57:58.528912+00:00"}}, "haiku": {"v0": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🎭", "title": "通訳か、翻訳か？", "content_blocks": [{"type": "paragraph", "text": "前回は、プログラムを木構造に変換して順番に走らせる**インタプリタ**(interpreter)の仕組みを見ました。今回はその続きで、「コンパイル型」と「インタプリタ型」の違いについて考えます。"}, {"type": "quote", "text": "スピーチを、その場で同時通訳するのか、先に台本を全部翻訳しておくのか。言語の方ではなく、やり方の選択なんです！"}]}, {"card_type": "core_why", "hero_emoji": "🔀", "title": "どの言語も両方できる", "content_blocks": [{"type": "paragraph", "text": "C++のような言語はコンパイル、Pythonのような言語はインタプリタで動かすもの、と思われがちです。しかし、どんな言語でもコンパイルもインタプリタも可能だと言えます。⟦s000013⟧"}, {"type": "callout", "alert_type": "info", "text": "難しさは言語によって違っても、**原理的には不可能ではない**のがポイントです。⟦s000017-s000018⟧"}, {"type": "paragraph", "text": "つまり、インタプリタ方式の言語をコンパイルすることも、コンパイル方式の言語にインタプリタを作ることもできます。⟦s000024-s000027⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "「動的型付け＝インタプリタ」は思い込み", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "「動的型付けはインタプリタ、静的型付けはコンパイル」は**規則ではなく、よくある傾向**にすぎません。⟦s000019-s000023⟧"}, {"type": "paragraph", "text": "実際に、Cython(サイソン)はPythonをCに変換し、そのあとC++コンパイラで機械語にします。Pythonがコンパイルされる例です。⟦s000029⟧"}, {"type": "paragraph", "text": "ただし、ポインタなどを持つCのような言語はインタプリタにするのが難しくなりがちです。それでも、原理的に不可能な理由はありません。⟦s000030-s000031⟧"}, {"type": "paragraph", "text": "Pythonも「必ず解釈される」わけではなく、インタプリタ方式は**必須ではない**と考えるのが正しい見方です。⟦s000032-s000034⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "深掘りしてみよう", "content_blocks": [{"type": "paragraph", "text": "今回は、コンパイル型とインタプリタ型は言語の性質ではなく実装の選択だと学びました。どの言語も両方の方式で実装できるという視点が大切です。"}, {"type": "paragraph", "text": "Curious? Dig into these too:"}, {"type": "list", "items": ["C/C++向けインタプリタ **Cint**(シント)の歴史と使われ方 ⟦s000028⟧", "**Cython**がPythonをCに変換してからコンパイルする具体的な流れ ⟦s000029⟧", "ポインタがインタプリタ化を難しくする理由"]}, {"type": "paragraph", "text": "では、動的型付けの言語は本当にインタプリタに向いているのでしょうか？型の扱い方が実行方式にどう影響するのか、次の話題で見ていきましょう。"}]}], "2": [{"card_type": "hook", "hero_emoji": "🎰", "title": "自販機のような関数", "content_blocks": [{"type": "quote", "text": "純粋関数（pure function）は、同じボタンを押せば必ず同じ飲み物が出てくる自販機のようなもの！"}, {"type": "paragraph", "text": "今日の天気や誰かが書き換えた変数によって結果が変わったら、プログラムは怖くて使えません。関数型プログラミング（functional programming）は、その予測できなさを徹底的に取り除く考え方です。"}]}, {"card_type": "core_why", "hero_emoji": "🧮", "title": "なぜ『同じ入力、同じ出力』なのか", "content_blocks": [{"type": "paragraph", "text": "純粋関数には2つの条件があります。1つ目は、同じ入力 x に対して必ず同じ出力 y を返すこと。2つ目は、外部の変わりうるデータに頼らず、引数だけで結果を決めることです。⟦s000239-s000246⟧"}, {"type": "code", "language": "latex", "code_string": "f(1) = 10 \\quad f(1) = 10 \\quad f(1) = 10", "explanation": "何回呼んでも結果が同じ、というのが純粋関数の約束です。⟦s000219-s000220⟧"}, {"type": "callout", "alert_type": "info", "text": "ポイントは、変数を変更しないことです。関数の中で変数を書き換えたり、グローバル変数を更新したりすると、その関数はもう純粋ではなくなります。⟦s000212-s000214⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💣", "title": "副作用という隠れた爆弾", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "外の世界を書き換える行為は副作用（side effect）と呼ばれ、関数の予測可能性を壊す最大の原因です。⟦s000264-s000265⟧"}, {"type": "paragraph", "text": "副作用がないと、推論や証明が格段に楽になります。また、データ競合を気にせず処理を並列化しやすく、コンパイラも安心して最適化できます。⟦s000287-s000297⟧⟦s000333-s000336⟧"}, {"type": "paragraph", "text": "ただし、代償として、変数を書き換えずに繰り返しを表現する再帰（recursion）を使いこなす必要があります。⟦s000339⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩", "content_blocks": [{"type": "paragraph", "text": "関数型プログラミングでは、関数を値として扱い、変数を変更せず、副作用のない純粋関数を書くことが基本です。この考え方が、C++やJavaなどの多くの言語にも影響を与えています。"}, {"type": "paragraph", "text": "ここで取り上げきれなかった内容も、興味があればぜひ調べてみてください。"}, {"type": "paragraph", "text": "Make sure to cover these:"}, {"type": "list", "items": ["ラムダ計算（lambda calculus）とチューリング機械の同等性という数学的背景", "LISPにおけるガベージコレクションやクロージャ（closure）の仕組み", "Haskellという名前の由来やFPCA会議での言語標準化の経緯", "OCamlやLeanなど他の関数型言語との比較", "コンパイラとインタプリタの詳細なトレードオフ"]}, {"type": "paragraph", "text": "では、副作用がない世界で計算はどう進むのでしょうか？次回は副作用のない計算と遅延評価（lazy evaluation）、そして評価を先送りする
