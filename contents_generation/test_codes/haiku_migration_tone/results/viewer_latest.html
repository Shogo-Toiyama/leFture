ragraph", "text": "でも、ここで一つ疑問が残りますよね。型が違う値を渡したら、Haskellはどうやって間違いを見つけるのでしょうか？次回は関数シグネチャと型推論を使って、その仕組みを見ていきましょう！"}]}], "4": [{"card_type": "hook", "hero_emoji": "🧮", "title": "数学の式を書くだけで関数ができる！", "content_blocks": [{"type": "quote", "text": "Haskellでは「式を書けば、それが答えになる」。returnという言葉は要りません！"}, {"type": "paragraph", "text": "ノートに y = 3x² と書くとき、わざわざ「返す」とは書きませんよね。Haskellの関数もまさにそれと同じ感覚で書けます。最初は「本当にこれだけ？」と驚くかもしれませんが、その驚きがこの回のスタートです。"}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "型の行と式の行、この2行が関数の正体", "content_blocks": [{"type": "paragraph", "text": "Haskellの関数は、まず関数シグネチャ（function signature）と呼ばれる型の行を書き、その下に本体を書きます。型の行では、最初に引数の型、最後に戻り値の型を並べます。最後に並ぶものだけが戻り値だと覚えておくと迷いません。 ⟦s000594-s000603⟧"}, {"type": "code", "language": "haskell", "code_string": "poly :: Double -> Double\npoly x = 3 * x * x", "explanation": "1行目が型の行、2行目が本体です。関数名は両方に書きます。 ⟦s000637-s000640⟧"}, {"type": "paragraph", "text": "本体は「=」の右側の式だけです。ここには return がありません。式の答えがそのまま関数の結果になるので、これを暗黙の戻り値（implicit return）と呼びます。 ⟦s000620-s000624⟧"}, {"type": "paragraph", "text": "呼び出し方もシンプルです。関数名の後ろに引数を空白で並べるだけで、括弧もカンマもいりません。poly 2 と書けば、答えの 12 が返ってきます。 ⟦s000653-s000654⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🕵️", "title": "型を書かなくても、Haskellは全部見抜いている！", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "型を書かなくても大丈夫！Haskellは型推論（type inference）で、引数や戻り値の型を自分で推測してくれます。 ⟦s000748-s000751⟧"}, {"type": "paragraph", "text": "例えば isOld age hasAches = age > 30 || hasAches という関数では、age を 30 と比べているので、age は整数だと推測できます。hasAches は || の片側に置かれているので、真偽値だと分かります。そして || の結果も真偽値なので、戻り値も真偽値になります。 ⟦s000757-s000766⟧"}, {"type": "callout", "alert_type": "error", "text": "ただし、Haskellは静的型付け（static typing）で、型の扱いにとても厳しい言語です。0 と False を勝手に変換することは一切ありません。 ⟦s000772-s000775⟧"}, {"type": "paragraph", "text": "たとえ C++ なら通ってしまう isOld 53.5 False のような呼び出しも、Haskellではエラーになります。小数を整数に黙って切り捨てることもしません。「推論はしてくれるが、ごまかしは許さない」、これがHaskellの本当の性格です。 ⟦s000857-s000859⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "ここまでの振り返りと、次への扉", "content_blocks": [{"type": "paragraph", "text": "今回は、関数シグネチャで型を宣言し、式そのものが戻り値になる書き方を学びました。型を書かなくてもHaskellが推論してくれますが、値の型は常に厳密に決まっていて、自動変換は行われません。"}, {"type": "paragraph", "text": "ここからは、今回あえて深掘りしなかった項目を自分で調べてみてください。どれも次の回への良い準備になります。"}, {"type": "list", "items": ["引数を1つだけ渡した関数（カリー化と部分適用, currying and partial function application）の仕組み ⟦s000697⟧", "型を書かないときに数値が既定の型に決まる仕組み（数値型のデフォルト）⟦s000786-s000789⟧", "引数と戻り値を一行に並べる書き方の設計理由 ⟦s000686-s000691⟧"]}, {"type": "paragraph", "text": "でも、引数を並べて書けるなら、2つ以上の演算が混ざったときはどの順番で計算されるの？ 次の回では、関数適用の左結合（left associativity）と演算子の優先順位（operator precedence）を見ていきましょう。"}]}], "5": [{"card_type": "hook", "hero_emoji": "🚂", "title": "列車は先頭から走る", "content_blocks": [{"type": "quote", "text": "Haskellは『いちばん左の関数から順に食べていく』ルールで式を読みます！"}, {"type": "paragraph", "text": "f of g of 2 を見たとき、あなたは『まず g に 2 を入れるよね？』と思ったはずです。実はそれがHaskellの罠なんです。ここから、その理由を一緒にほどいていきましょう。"}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "左から読む、関数は最優先", "content_blocks": [{"type": "paragraph", "text": "Haskellは式を左から評価します。そのため、関数適用は**左結合(left associativity)**になります。 ⟦s000915-s000917⟧ 教授の例では、f of g of 2 は『g の 2 を先に計算する』ではなく、『f に g を渡し、その結果に 2 を渡す』と解釈されてエラーになりました。 ⟦s000914-s000915⟧"}, {"type": "callout", "alert_type": "info", "text": "正しく2乗の答えを出したいなら、必ず括弧で『g of 2 を先に』と書きます。 ⟦s000947-s000953⟧"}, {"type": "code", "language": "haskell", "code_string": "f (g 2)   -- 36: 先に g 2 を計算し、その結果を f に渡す\nf 5 * 10  -- 250: 関数呼び出し f 5 が先に実行され、その後に * 10 が続く", "explanation": "Haskellでは、関数呼び出しは演算子より常に先に行われます。 ⟦s000962-s000969⟧"}, {"type": "paragraph", "text": "ただし、この順序は『関数呼び出し』と『普通の四則演算』の間だけの話です。演算子同士の優先順位は、これまで通り（掛け算は足し算より先など）に従います。 ⟦s001057-s001059⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "elseがないと式にならない", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Haskellのifは文(statement)ではなく式(expression)です。式である以上、どんな場合も必ず値を返す必要があります。 ⟦s001093-s001098⟧"}, {"type": "paragraph", "text": "例えば『価格が100より大きければ割引20%』だけで、else がなかったら？ 条件が偽のときに返す値がなくなってしまいます。そのため、Haskellでは else を省略できません。 ⟦s001087-s001090⟧"}, {"type": "paragraph", "text": "ガード(guards)は、この if-else の連続を上から順に読む書き方です。最初に真になった条件の結果を返し、残りは見ません。ifの入れ子より読みやすく、同じ意味を持つ構文糖衣(syntactic sugar)です。 ⟦s001137-s001143⟧"}, {"type": "callout", "alert_type": "info", "text": "ガードを使うときは、関数名の後の = は書きません。各ガード条件の後ろに = を置きます。 ⟦s001201-s001205⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩と自習リスト", "content_blocks": [{"type": "paragraph", "text": "今回は、Haskellが式を左から評価し、関数呼び出しを演算子より優先することを見ました。また、条件分岐はifが式であるため必ずelseが必要で、ガードはそれを読みやすく書く方法だとわかりました。"}, {"type": "paragraph", "text": "授業中には触れられたけれど、このカードでは扱わなかった話題もあります。興味があれば、ぜひ自分で試してみてください。"}, {"type": "list", "items": ["前置形式の二項演算子を、比較や論理演算子も含めて使い分ける細かい書き方 ⟦s001025-s001028⟧", "ガードを関数の途中の式にネストして使えるかどうか（教員自身も確信がなく、試すよう促された） ⟦s001168-s001173⟧", "次回扱われるとされるパターンマッチ(pattern matching) ⟦s001237⟧"]}, {"type": "paragraph", "text": "今日の階乗の例では、関数が自分自身を呼び出していましたね。次の授業では、その再帰(recursion)を、where節と局所関数(where clause and local function)で整理する方法を見ていきます。どうやって局所的な定義を書くのか、楽しみにしていてください！"}]}], "6": [{"card_type": "hook", "hero_emoji": "🗒️", "title": "付箋で作る自分専用のメモ", "content_blocks": [{"type": "quote", "text": "関数の中だけで使える『付箋』を貼るイメージで考えてみよう！"}, {"type": "paragraph", "text": "教室で自分の机にだけ貼る付箋を想像してみてね。外の人には見えないけど、自分の作業には大活躍する。Haskellの局所束縛（local binding）もこれと同じで、関数の中だけで使える名前付きの値のことなんだ。"}]}, {"card_type": "core_why", "hero_emoji": "🔁", "title": "自分を呼び出す再帰と、関数の中の名前", "content_blocks": [{"type": "paragraph", "text": "まずは再帰（recursion）から。再帰とは、関数が自分自身を呼び出す仕組みのことだよ。階乗を例にすると、n=2 のとき『n が 0 かどうか』を調べて、違えば n-1 で自分を呼び出す。この呼び出しが0に到達すると1が返り、そこから掛け算で答えが戻ってくるんだ。 ⟦s001256-s001259⟧⟦s001280-s001282⟧"}, {"type": "code", "language": "haskell", "code_string": "fact 0 = 1\nfact n = n * fact (n - 1)", "explanation": "階乗の再帰の形。自分自身を小さい値で呼び直し、基底の値で止まる。 ⟦s001248-s001259⟧"}, {"type": "paragraph", "text": "次に、局所束縛（local binding）の出番だよ。let式を使うと、関数の中だけで使う変数を定義できる。たとえば『pi の値』を決めてから、その値を使って円の面積を計算できるんだ。 ⟦s001367-s001370⟧⟦s001406-s001407⟧"}, {"type": "callout", "alert_type": "info", "text": "ここで大事なのは、局所束縛で作った変数は、いったん決めたら変えられない定数だということ。値を後から書き換えることはできないよ！ ⟦s001364-s001365⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🧭", "title": "where節は『下に書いて、上で使う』", "content_blocks": [{"type": "paragraph", "text": "ふつうのプログラミングでは、変数は使う前に定義するのが当たり前だよね。でもHaskellのwhere節は、関数の本体の後ろ（下）に変数を書くことができる。上から読んだときに『この変数って何？』となっても、下を見ればすぐ分かる仕組みなんだ。 ⟦s001413-s001415⟧⟦s001419-s001421⟧"}, {"type": "callout", "alert_type": "warning", "text": "教授のポイント：where節は、ガード（複数の条件式）と組み合わせるときに必須になる。単一の式だけなら let でも where でも書けるけど、ガードを使うなら where を選ぶ必要があるんだ！ ⟦s001469-s001471⟧⟦s001498-s001499⟧"}, {"type": "paragraph", "text": "さらに、where節の中で定義した関数（局所関数）は、外側の関数の引数や変数をそのまま使える。これをスコープ（scope）と呼び、クロージャのような参照（closure-like access）とも言えるね。外側の値は変わらない定数なので、読み取るだけなら安全なんだ。 ⟦s001561-s001566⟧⟦s001576-s001578⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "関数の中の名前を使いこなそう", "content_blocks": [{"type": "paragraph", "text": "今回は、再帰で同じ処理を繰り返しながら答えを組み立てる仕組みを学んだよ。また、let式とwhere節を使って、関数の中だけで使える局所束縛を定義する方法も確認した。where節と入れ子の関数は、外側の変数をそのまま参照できる点がポイントだったね。"}, {"type": "paragraph", "text": "ここからは、自分で復習してほしい内容も残しておくね。ぜひ時間を見つけて触れてみて！"}, {"type": "list", "items": ["遅延評価で引数の計算がいつ行われるか、より細かい仕組み（thunkの動き） ⟦s001290-s001296⟧", "isPrimeの穴埋め演習。素数判定の補助関数を自分で組み立てる練習 ⟦s001592-s001635⟧", "APLの歴史と、記号で行列やベクトルを操作する配列指向プログラミングの詳細 ⟦s001642-s001686⟧"]}, {"type": "paragraph", "text": "今日の講義は、コンパイラとインタプリタの違いから始まり、関数型プログラミングの数学的な背景、副作用のない計算と遅延評価、Haskellの関数定義と型推論、評価規則と条件分岐と進んできたよね。最後に学んだ再帰と局所定義は、その全体を支える『関数の中の名前』の考え方につながっているんだ。お疲れさま！"}]}]}, "deep_notes": null, "fun_facts": null}, "ran": ["review_cards"], "checks": {"review_cards": {"calls": 6, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 9193, "exclamations": 20, "question_marks": 9, "citations": 87, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 30, "input_tokens": 84937, "output_tokens": 27584, "max_output_tokens_single_call": 4890, "sum_call_seconds": 127.1, "max_call_seconds": 23.99, "topics": 6, "topics_with_bad_card_sequence": 0}}, "errors": {}}, "v1c": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🍳", "title": "作り置きか、注文ごとか", "content_blocks": [{"type": "paragraph", "text": "前回は、インタープリター（interpreter）が構文木をたどって命令を順番に実行する仕組みを見ましたね。今日はその続きで、そもそも「コンパイル型」と「インタプリタ型」は言語の種類なのか？という問いから始めます。"}, {"type": "quote", "text": "料理店が料理を作り置きするか、注文が来るたびに作るかは、店の都合であってメニューの種類では決まりません。プログラミング言語も同じなんです！"}]}, {"card_type": "core_why", "hero_emoji": "🔧", "title": "言語ではなく実装の話", "content_blocks": [{"type": "paragraph", "text": "コンパイラー（compiler）は、プログラム全体を機械語（machine code）に変換して保存します。一方インタプリター（interpreter）は、命令を読みながらその場で実行します。どちらも同じ言語のプログラムを動かすための道具なんです。 ⟦s000017-s000018⟧"}, {"type": "paragraph", "text": "ここが大事なポイントです。どの言語も、コンパイルもインタプリタもできます。難しいかどうかの違いはあっても、不可能な言語は一つもありません。 ⟦s000013-s000015⟧"}, {"type": "paragraph", "text": "そのため「C++はコンパイル型」「Pythonはインタプリタ型」という言い方は、言語の本質ではなく、よく見られる実装の傾向を述べたものにすぎません。 ⟦s000002-s000003⟧"}, {"type": "quote", "text": "言語の名前ではなく、どんな変換方式を選んだかが「コンパイル型」か「インタプリタ型」かを決めるのです。"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "型付けと混同しないで", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "「動的型付けの言語はインタプリタ、静的型付けの言語はコンパイル」は、ルールではなく典型的な流れにすぎません。 ⟦s000019-s000023⟧"}, {"type": "paragraph", "text": "動的型付け（dynamically typed）と静的型付け（statically typed）は、変数の型をいつ決めるかという話です。一方、コンパイルとインタプリタは処理の方式の話です。この二つは別の軸なので、混ぜて考えないようにしましょう。 ⟦s000019-s000027⟧"}, {"type": "paragraph", "text": "実例もあります。1990年代にCERNの科学計算で使われたC/C++のインタプリタがありました。また、Cythonは、PythonをCに変換してから、C++のコンパイラで機械語を作ります。 ⟦s000028-s000029⟧"}, {"type": "callout", "alert_type": "info", "text": "ポインタ（pointer）のようにインタプリタで扱いにくい機能を持つ言語もあります。でも「難しい」と「できない」は全く別物ですよ。 ⟦s000030-s000031⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "言語と実装を切り分けよう", "content_blocks": [{"type": "paragraph", "text": "今日は、コンパイルとインタプリタは言語の種類ではなく実装の選択であることを学びました。どの言語もどちらの方式でも動かせる可能性があり、型付けの仕組みとは別の軸で考える必要があります。 ⟦s000013-s000018⟧"}, {"type": "paragraph", "text": "このカードでは詳しく扱わなかった内容も、授業で触れられたので、ぜひ自分で調べてみてください。"}, {"type": "list", "items": ["Cythonが PythonをCに変換してから機械語を作る具体的な流れ（トランスパイル） ⟦s000029⟧", "ポインタを含むCをインタプリタで実行するときに何が難しくなるのか ⟦s000030⟧"]}, {"type": "paragraph", "text": "では、言語の性質そのものとは何でしょうか？ 次は関数型プログラミング（functional programming）の世界をのぞき、不変性（immutability）や純粋関数（pure function）といった考え方が、言語の設計にどうつながるのかを見ていきましょう！"}]}], "2": [{"card_type": "hook", "hero_emoji": "🍳", "title": "同じレシピなら同じ料理", "content_blocks": [{"type": "quote", "text": "純粋関数（pure function）は、同じ材料を入れたら必ず同じ料理が出てくるレシピのようなものです！"}, {"type": "paragraph", "text": "今日は、関数型プログラミング（functional programming）の考え方を一緒に見ていきます。最初は「変数が変わらない」「関数が外の世界に頼らない」という少し不思議なルールに戸惑うかもしれません。でも、そのルールこそが大事なポイントなんです。"}]}, {"card_type": "core_why", "hero_emoji": "🔒", "title": "変えられない変数と予測できる関数", "content_blocks": [{"type": "paragraph", "text": "関数型言語では、変数は一度初期化したら変更できません。Haskellのような純粋な言語では、すべての変数が定数のように扱われます。 ⟦s000109-s000112⟧"}, {"type": "callout", "alert_type": "info", "text": "純粋関数には2つの条件があります。同じ入力に対して必ず同じ出力を返すこと、そして外部の変わる可能性があるデータに頼らないことです。 ⟦s000239-s000246⟧"}, {"type": "paragraph", "text": "例えば、1を入れると必ず10が返ってくる関数なら、何度呼んでも結果は変わりません。一方で、呼ぶたびに乱数を返すような関数は、この条件を満たさないので純粋ではありません。 ⟦s000219-s000223⟧"}, {"type": "code", "code_string": "f(1) = 10 // 何回呼んでも必ず10", "language": "python", "explanation": "同じ入力で同じ出力になるのが純粋関数の本質です。 ⟦s000219-s000220⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💥", "title": "副作用が起こす混乱", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "外の世界の状態を読んだり変えたりすることを副作用（side effect）と呼びます。副作用があると、同じ呼び出しでも結果が変わってしまいます。 ⟦s000264-s000265⟧"}, {"type": "paragraph", "text": "グローバル変数を書き換える関数は、呼ぶたびに結果が変わる典型例です。そのため、関数を読んだだけでは動きが予測できません。 ⟦s000257-s000261⟧"}, {"type": "paragraph", "text": "ここが大事なポイントです。定数は外から読んでも値が変わらないので、純粋関数の中で使ってもかまいません。問題になるのは、変わる可能性のあるデータに頼ることです。 ⟦s000271-s000273⟧"}, {"type": "callout", "alert_type": "info", "text": "純粋性が保証されると、デバッグが楽になり、並列処理もしやすくなります。コンパイラによる最適化も進めやすくなります。 ⟦s000287-s000296⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩", "content_blocks": [{"type": "paragraph", "text": "今回は、関数型プログラミングが「変えられない変数」と「同じ入力なら同じ出力を返す純粋関数」を土台にしていることを学びました。副作用を避けることで、コードが読みやすく、テストしやすく、並列化もしやすくなります。"}, {"type": "paragraph", "text": "この他にも、授業で触れた話題がいくつかあります。興味があれば、自分で調べてみてください。"}, {"type": "list", "items": ["ラムダ計算、LISP、Haskellの歴史的な背景 ⟦s000137-s000191⟧", "OCamlとHaskellの文法の違いや、言語を比べる視点 ⟦s000080-s000090⟧", "Leanなど、形式的な証明に使われる関数型言語の例 ⟦s000327-s000331⟧"]}, {"type": "paragraph", "text": "次回は、副作用をどう扱うかという問題と、計算をいつ行うかを決める遅延評価（lazy evaluation）について考えていきます。副作用をどう扱うかが、次の大きな鍵になりそうですね！"}]}], "3": [{"card_type": "hook", "hero_emoji": "🍳", "title": "注文が入るまで料理しない店", "content_blocks": [{"type": "quote", "text": "Haskellは「本当に必要になるまで、絶対に料理を始めない」お店みたいなものなんです！"}, {"type": "paragraph", "text": "普通のプログラムは、注文を受けたら順番に全部作り始めますよね。でもHaskellは、お客さんが実際に料理を食べようとした瞬間に初めて作り始めるんです。"}]}, {"card_type": "core_why", "hero_emoji": "🧮", "title": "同じ入力なら同じ答え", "content_blocks": [{"type": "paragraph", "text": "命令型の言語では、関数が外のファイルや全体変数を書き換えることがあります。⟦s000394⟧⟦s000397⟧ そのため、func1とfunc2の呼び出し順を入れ替えると結果が変わってしまい、コンパイラは順番を慎重に守らなければなりません。⟦s000408⟧"}, {"type": "callout", "alert_type": "info", "text": "関数型の世界では、いつ呼んでも同じ入力には必ず同じ出力が返ります。だから順番を入れ替えても、呼ぶのをやめても安全なんです！⟦s000415⟧⟦s000420⟧"}, {"type": "paragraph", "text": "Haskellは、この性質を利用して計算の順番を自由に決めます。上から順に実行するC++とは違い、**本当に値が必要になるまで計算を待つ**のがポイントです。⟦s000428⟧⟦s000431⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⏳", "title": "使わない値は計算しない", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "ここが一番のポイント！ 変数に値が入っていても、使われなければHaskellは計算すらしません。⟦s000439⟧⟦s000442⟧"}, {"type": "paragraph", "text": "例えば、z が7だったらすぐに0を返すif文を考えてみましょう。このとき y は一度も使われないので、func1 は呼ばれません。⟦s000436⟧⟦s000440⟧"}, {"type": "paragraph", "text": "引数も同じです。f(g(x)) と書いても、f の中で使われなければ g(x) は計算されず、**サンク(thunk)**と呼ばれる『必要になったら計算する約束』だけが渡されます。⟦s000476⟧⟦s000478⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "入出力はどうするの？", "content_blocks": [{"type": "paragraph", "text": "今回は、関数型では変数が変わらず、順番より結果が大事であることを学びました。Haskellは値が必要になるまで計算を遅らせる遅延評価を使い、そのために引数をサンクとして渡します。"}, {"type": "paragraph", "text": "以下は、講義で触れたものの、このカードでは詳しく扱わなかった内容です。ぜひ自分で調べてみてください。"}, {"type": "list", "items": ["コンパイラが関数呼び出しの順番を並べ替えて最適化する具体的な仕組み ⟦s000408⟧⟦s000422⟧", "入力や出力を純粋な関数の中でどう扱うか（初期Haskellに入出力がなかった理由の続き） ⟦s000511⟧⟦s000517⟧"]}, {"type": "paragraph", "text": "ところで、入力が毎回違う値になるなら、純粋な関数の世界で入力はどうやって扱うのでしょう？ 次の回では、型を使ってこの問題に立ち向かう方法を見ていきましょう！"}]}], "4": [{"card_type": "hook", "hero_emoji": "🔍", "title": "型を書かなくても分かる名探偵", "content_blocks": [{"type": "quote", "text": "Haskellは「このコードの使われ方を見れば、型は全部分かるよ」と言える名探偵みたいな言語なんです！"}, {"type": "paragraph", "text": "普通のプログラミング言語では、変数や関数の型をいちいち宣言するのが当たり前ですよね。でもHaskellでは、コードの中身を見るだけで型を自分で見抜いてくれます。まずはその不思議さを一緒に体験してみましょう！"}]}, {"card_type": "core_why", "hero_emoji": "🧩", "title": "関数の書き方はシンプルなルールだけ", "content_blocks": [{"type": "paragraph", "text": "Haskellの関数定義は、型シグネチャ（function signature）と本体の2行で書きます。たとえば3x二乗の関数なら、最初の行で入力と出力の型を書き、次の行で本体の式を書くわけです。⟦s000594⟧⟦s000647⟧"}, {"type": "code", "code_string": "poly :: Double -> Double\npoly x = 3 * x * x", "language": "haskell", "explanation": "型の行で入力はDouble、出力もDouble。本体は式をそのまま書けばOKで、returnは要りません。⟦s000566⟧⟦s000620⟧"}, {"type": "paragraph", "text": "一番大事なポイントは、**暗黙の戻り値（implicit return）**です。returnと書かなくても、最後に評価された式がそのまま結果になります。⟦s000620⟧⟦s000624⟧"}, {"type": "paragraph", "text": "呼び出し方も超シンプル。関数名の後に引数をスペースで並べるだけで、括弧もカンマも要りません。poly 2と書けば4の二乗の3倍で12が返ります。⟦s000653⟧⟦s000572⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "型は推論され、変換は一切しない", "content_blocks": [{"type": "paragraph", "text": "ここからが本当に重要なところです。isOld関数には型シグネチャがないのに、Haskellは型を推論できました。どうやって？答えは「関数の中身の使われ方」を見ているからです。⟦s000748⟧⟦s000751⟧"}, {"type": "list", "items": ["ageと整数を比べている → ageは整数型と分かる ⟦s000757⟧⟦s000758⟧", "hasAchesとtrueを比べている → hasAchesは真偽値型と分かる ⟦s000761⟧", "orの結果を返している → 戻り値は真偽値型と分かる ⟦s000766⟧"]}, {"type": "callout", "alert_type": "warning", "text": "Haskellは型の変換（type conversion）を自動ではやりません。0と1をFalseやTrueとして扱うことも、整数に小数を渡すことも許しません。isOld 53.5 Falseのような呼び出しは、C++なら通ってしまいますが、Haskellではエラーになります。⟦s000772⟧⟦s000857⟧⟦s000859⟧"}, {"type": "paragraph", "text": "つまり、Haskellは「型を書かなくていい（推論してくれる）」けれど「型には厳しい（厳格な型検査、static typing）」という二段構えの言語なんです。⟦s000799⟧⟦s000811⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "型のルールを自分の手で確かめよう", "content_blocks": [{"type": "paragraph", "text": "今回は、円の面積関数の読み込み、3x二乗の関数の型シグネチャと暗黙の戻り値、isGreaterのような複数引数の書き方、そしてisOld関数による型推論を学びました。Haskellは型を推論し、しかも厳格に守る言語だと分かりましたね。"}, {"type": "paragraph", "text": "さらに深く知りたい項目はこちらです。"}, {"type": "list", "items": ["カリー化（currying）と部分適用（partial function application）：複数引数の型シグネチャが一本の矢印で書かれている理由 ⟦s000695⟧⟦s000697⟧", "インデントのルール：複数行の関数定義で、どれくらい字下げすればよいか ⟦s000676⟧⟦s000677⟧"]}, {"type": "paragraph", "text": "次回は、Haskellの評価規則と条件分岐に進みます。関数適用は左から結合するって本当？括弧や演算子の優先順位はどう働くの？そしてif式やガードはどんな形で書くの？楽しみにしていてくださいね！"}]}], "5": [{"card_type": "hook", "hero_emoji": "🎯", "title": "Haskellは順番にうるさい先生", "content_blocks": [{"type": "quote", "text": "Haskellでは『関数呼び出しが最優先』『左から順番に読む』、このルールさえ掴めば迷子にならない！"}, {"type": "paragraph", "text": "「f of g of 2」を見ると、多くの人は先に g 2 を計算してから f に渡したくなりますよね。でも実はHaskellはまったく逆のことをします。最初は少し戸惑うけど、ルールが分かると一気に楽になります！"}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "左から読む関数適用", "content_blocks": [{"type": "paragraph", "text": "Haskellは関数呼び出しを左から順に評価します。だから f g 2 と書くと、まず f に g を渡そうとしてしまうんです。これを関数適用の左結合（left associativity）と呼びます。 ⟦s000915⟧⟦s000917⟧"}, {"type": "code", "code_string": "f g 2   -- まず f に g を渡そうとする\n(f (g 2)) -- 括弧で書くと、g 2 を先に計算する", "language": "haskell", "explanation": "括弧を付けることで、どの順番で評価するかを明示できます。 ⟦s000947⟧⟦s000953⟧"}, {"type": "paragraph", "text": "さらに関数呼び出しは、掛け算などの数学演算子より優先されます。だから f 3 * 10 は、f 3 を先に計算してから10を掛ける形になります。 ⟦s000963⟧⟦s000967⟧"}, {"type": "paragraph", "text": "演算子を括弧で囲むと、(+) のように前置の関数として扱えます。(+) 2 4 * 5 が 30 になるのは、関数呼び出しが先に行われるからです。 ⟦s001042⟧⟦s001044⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "ifはelseが必須の式", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Haskellでは『すべての式は必ず値を返す』。だから if には必ず else が必要です！ ⟦s001096⟧⟦s001098⟧"}, {"type": "paragraph", "text": "他の言語のifは文なので、条件を満たさないと何もしないことがあります。でもHaskellのifは式なので、『値を返すか？』が常に問われます。elseがないと、価格が100未満のときに何を返すのか分からなくなってしまいますよね。 ⟦s001087⟧⟦s001090⟧"}, {"type": "paragraph", "text": "ガードは上から順に条件を調べ、最初に当てはまったものを返して止まります。これはif-else の連鎖と同じ意味で、読みやすく書くための構文糖衣（syntactic sugar）です。 ⟦s001126⟧⟦s001133⟧⟦s001141⟧"}, {"type": "callout", "alert_type": "info", "text": "ガードでは関数名の後の = は書かず、各条件の後ろに = を置きます。otherwise は最後の『それ以外』になります。 ⟦s001197⟧⟦s001201⟧⟦s001205⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "評価規則を自分で確かめよう", "content_blocks": [{"type": "paragraph", "text": "今回は、Haskellが関数呼び出しを左から評価すること、関数呼び出しが数学演算子より優先されること、if式には必ずelseが必要なこと、そしてガードが上から順に評価される構文糖衣であることを学びました。"}, {"type": "paragraph", "text": "もう少し深く学びたい人のために、次の内容は自分で確認してみると良いでしょう。"}, {"type": "list", "items": ["演算子の優先順位表と、C言語との細かな違い ⟦s000960⟧⟦s000961⟧", "ガードを入れ子の関数や式の中で使えるかどうかの詳細 ⟦s001168⟧⟦s001173⟧", "階乗をガードで書いた場合と if 式で書いた場合の細かな比較 ⟦s001224⟧⟦s001234⟧"]}, {"type": "paragraph", "text": "次は、再帰（recursion）を使ってこの階乗のような関数をもっと自然に書く方法を見ていきます。では、関数の中で局所束縛（local binding）や where 節を使うと、どんな表現ができるのでしょうか？"}]}], "6": [{"card_type": "hook", "hero_emoji": "🧩", "title": "関数の中に作業台をつくる", "content_blocks": [{"type": "quote", "text": "関数の中に、一時的な作業台をつくる。それが局所定義（local binding）です！"}, {"type": "paragraph", "text": "料理をするとき、調理台の上に小皿をいくつも並べますよね。小皿は料理が終わればすぐ片づけます。局所定義も、その関数の中だけで使う一時的な変数だと思ってください。"}]}, {"card_type": "core_why", "hero_emoji": "🔁", "title": "再帰と局所定義で関数を整理する", "content_blocks": [{"type": "paragraph", "text": "再帰（recursion）は、関数が自分自身を呼び出して問題を少しずつ小さくしていく書き方です。教授は階乗を例に、nが2から1、そして0へと減っていく流れを追いました。⟦s001253-s001259⟧"}, {"type": "paragraph", "text": "ここで大事なのは、n-1の計算が本当に必要になるまで後回しにされる点です。最初に0と比べる場面で、初めて値が求められます。⟦s001292-s001296⟧"}, {"type": "paragraph", "text": "let式（let expression）は、一時的な変数を定義する仕組みです。定義した変数は、inの後の式でだけ使えます。⟦s001367-s001370⟧"}, {"type": "code", "code_string": "circleArea r = piVal * r * r\\n  where piVal = 3.14159", "language": "haskell", "explanation": "whereの中で決めた値を、上の式から参照しています。⟦s001434-s001436⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "whereは末尾に書けるのが強み", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "教授の強調ポイント：letとwhereはほぼ同じ働きですが、ガード（guards）を使うときはwhereを使わなければなりません。⟦s001469-s001471⟧"}, {"type": "paragraph", "text": "変数を定義する場所が、使う場所より後ろでも大丈夫です。Haskellは、下に書いた定義も上の式から見えるようにしてくれます。⟦s001429-s001431⟧"}, {"type": "paragraph", "text": "入れ子の関数は、外側の関数の引数や変数を見ることができます。値を書き換えず読むだけなので、副作用（side effect）は起きません。⟦s001572-s001581⟧"}, {"type": "callout", "alert_type": "warning", "text": "スコープの罠：局所関数は、それを定義した関数の中でしか呼べません。外から呼ぼうとすると、見つからないエラーになります。⟦s001521-s001523⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "局所定義をつかんで次へ進もう", "content_blocks": [{"type": "paragraph", "text": "今回は、再帰で関数が自分を呼ぶ流れを追い、letやwhereで局所変数と局所関数を定義する方法を学びました。内側の関数は、外側の変数を読むだけなら安全に使えます。"}, {"type": "paragraph", "text": "授業では扱ったけれど、カードには載せなかった細部です。ぜひ自分で掘り下げてみてください。"}, {"type": "list", "items": ["遅延評価のとき、thunkがどの変数を指しているかの細かい仕組み ⟦s001326-s001336⟧", "isPrimeで、nが1のときに起きる境界条件の問題と、括弧の正しい書き方 ⟦s001620-s001631⟧", "APLの成立史と、特殊記号が表す操作の意味 ⟦s001647-s001664⟧"]}, {"type": "paragraph", "text": "今日の講義は、コンパイラとインタプリタの違いから始まり、関数型プログラミングの土台、Haskellの関数定義と評価規則、そして再帰と局所定義へと進んできました。関数を小さな部品に分けて読みやすくするという考え方が、そのすべてをつなぐ鍵になります。配列指向プログラミング（array-oriented programming）も、この延長線上で見ると理解しやすくなるでしょう。"}]}]}, "deep_notes": null, "fun_facts": null}, "ran": ["review_cards"], "checks": {"review_cards": {"calls": 6, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 7954, "exclamations": 15, "question_marks": 10, "citations": 96, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 30, "input_tokens": 93967, "output_tokens": 19927, "max_output_tokens_single_call": 5909, "sum_call_seconds": 99.4, "max_call_seconds": 27.13, "topics": 6, "topics_with_bad_card_sequence": 0}}, "errors": {}}, "v2": {"outputs": {"review_cards": null, "deep_notes": {"4": "# 4. Haskellの関数定義と型推論\n\nHaskellでは、関数の型を書く行と関数の本体を書く行の2行で関数を定義します。型は引数の型を並べ、最後に戻り値の型を書きます。さらに、型を省略してもコンパイラが型を推論してくれますが、型の不一致は決して自動では直されません。\n\n## 🔍 関数定義の基本形\n\nHaskellの関数は、まず**型宣言**(型シグネチャ、function signature)を定義の上に書きます。そのあとに、関数名と引数名を並べた**本体**を書きます。講義では、この型宣言が関数の入力と出力の型を示す仕組みだと説明されました。⟦s000594, s000647⟧\n\nたとえば、講義の`poly`関数は次のように書きます。\n\n```haskell\npoly :: Double -> Double\npoly x = 3 * x * x\n```\n\n- **1行目** `poly :: Double -> Double` は型宣言です。最初の`Double`が引数の型で、最後の`Double`が戻り値の型です。⟦s000595, s000598-s000600⟧\n- **2行目** `poly x = 3 * x * x` は本体です。等号の右側の式が、そのまま関数の結果になります。⟦s000651⟧\n\nここで大事なのは、関数名を2回書く点です。型宣言と本体の両方に名前が現れます。これはHaskellの設計上の決まりで、他にも書き方はあるけれど、言語の癖(quirk)として採用されたものだと説明されました。⟦s000638-s000646⟧\n\n> 注意: 講義では、`poly x = 3x^2`のような式の`=`を「xに3x²を代入している」と読まないよう強調されました。Pythonのコロン`:`のように「`poly`はxを受け取り、この式を計算する」と読みます。⟦s000567-s000571⟧\n\n## ⚙️ 関数の呼び出しと暗黙の戻り値\n\nHaskellでは、関数を呼び出すときに**括弧もカンマも不要**です。関数名のあとに引数を空白で並べるだけで済みます。⟦s000530, s000653-s000654⟧\n\n```haskell\npoly 2      -- 結果は 12 (3 × 2 × 2)\narea 10     -- 半径10の円の面積\n```\n\nここで`poly 2`の結果は12になります。`poly`の本体は`3 * x * x`なので、x=2を代入すると3×2×2=12です。⟦s000572⟧\n\nHaskellには`return`文がありません。式をそのまま書けば、その値が結果になります。講義では、この仕組みを**暗黙の戻り値**(implicit return)と呼んでいました。⟦s000617-s000624⟧\n\n> 補足: 講義の`area`の例は、半径10で結果が314と表示されるものでした。本体を書く行は講義では示されなかったため、ここでは円周率を3.14とした場合の例として、`area r = 3.14 * r * r`と読んでおくと理解しやすいです。⟦s000522, s000530-s000532⟧\n\nまた、Haskellでは**区切りが改行と空白だけ**です。セミコロンもなく、括弧で囲む必要もありません。講義では、この「空白に基づく書き方」が大きな特徴だと説明されました。⟦s000607-s000615, s000627-s000631⟧\n\n## 🧩 複数引数と型宣言の読み方\n\n引数が複数ある場合も、型は同じ並びで書きます。引数の型を左から順に並べ、最後の型だけが戻り値の型です。講義では、「最初のn-1個の型が引数で、最後の1つが戻り値」とまとめられました。⟦s000601-s000603, s000711-s000712⟧\n\n2つの数を比べる`isGreater`を例にすると、次のようになります。\n\n```haskell\nisGreater :: Double -> Double -> Bool\nisGreater first second = first > second\n```\n\n- 型宣言の`Double -> Double -> Bool`は、「Doubleを2つ受け取り、Boolを返す」という意味です。\n- 最後の`Bool`が戻り値で、`>`の結果が真偽値なので、この型になります。⟦s000708-s000709⟧\n\n呼び出しは次のように書きます。引数はカンマではなく空白で区切ります。⟦s000714-s000715⟧\n\n```haskell\nisGreater 2.5 12.8    -- False\nisGreater 12.8 2.5    -- True\n```\n\n複数行に分けて書くこともできます。その場合は行頭のインデント(字下げ)を揃えます。インデントの幅は何スペースでも構いませんが、同じ関数の中では一貫させる必要があります。⟦s000676-s000677⟧\n\n講義では、引数と戻り値の型を1行にまとめる書き方について「見た目が分かりにくい」と感想が出ていました。この形の理由は、後で**カリー化**(currying)と**部分適用**(partial function application)を学ぶと分かるとされています。⟦s000680-s000681, s000695-s000697⟧\n\n## 🕵️ 型推論: isOldの例\n\n型宣言を書かなくても、Haskellは型を決めてくれます。これを**型推論**(type inference)と呼びます。講義の`isOld`の例で確かめてみましょう。⟦s000734-s000738, s000748-s000750⟧\n\n```haskell\nisOld age hasAches = age > 30 || hasAches == True\n```\n\nこの関数には型宣言がありません。それでも、`:t`コマンドで型を聞くと、Haskellは`Int -> Bool -> Bool`と答えます。⟦s000743-s000747⟧\n\n型は次のような手がかりから推論されます。\n\n1. **`age > 30`**: `age`は整数と比べられているので`Int`になります。文字列や真偽値と整数は比べられないため、ほかの型にはなりえません。⟦s000757-s000758, s000808-s000810⟧\n2. **`hasAches == True`**: `hasAches`は`True`と比べられているので`Bool`になります。⟦s000761, s000814⟧\n3. **`||`の結果**: 論理和の結果は真偽値なので、戻り値は`Bool`になります。⟦s000766-s000767, s000815-s000816⟧\n\n講義では、`hasAches == True`は`hasAches`だけに書き換えられることも示されました。`True`との比較を省いても、`hasAches`は式として単独で使われるため、同じ`Bool`として推論されます。⟦s000792-s000793, s000832-s000833⟧\n\nもう1つ大事な点があります。型宣言を省略しても、すべての値・変数・関数には**必ず1つの固定された型**があります。Haskellは型を書かせないことはあっても、型の厳しさを緩めることはありません。⟦s000848-s000852⟧\n\n> 補足: 型宣言を書かずに数値を扱うと、Haskellは整数に限定せず、より広い数値型(Integer、Doubleなどを含む型)として扱うことがあると説明されました。型を省略すると型が広めに決まることがある、という点を覚えておくと役立ちます。⟦s000785-s000789⟧\n\n## 🚫 厳密な型検査: 自動変換はしない\n\nHaskellは**厳密な型検査**(strict type checking)を行います。整数と浮動小数点数のような異なる型を、自動で変換して合わせることはありません。講義では、C++との違いとしてこの点が強調されました。⟦s000771-s000775, s000842-s000843⟧\n\nたとえば、`isOld`に小数の`53.5`を渡すと、C++では小数が整数に変換されて動くかもしれません。しかしHaskellでは、型が合わないためエラーになります。⟦s000857-s000859⟧\n\n```haskell\nisOld 53.5 False    -- エラー: 整数型の引数に小数を渡している\nisOld 53 False      -- OK\n```\n\n変換したいときは、プログラマが明示的に変換する必要があります。講義では、`casting`ではなく正式には`conversion`と呼ぶと補足されました。⟦s000779, s000820-s000821⟧\n\n## 🎯 Key Takeaway\n\n- **型宣言**は「引数の型…、最後に戻り値の型」の順で書き、関数名の定義の上に置きます。⟦s000647-s000649, s000603⟧\n- **呼び出し**は関数名のあとに空白で引数を並べ、**return文は不要**です。⟦s000653, s000620-s000622⟧\n- **型推論**により、型宣言は省略できますが、すべての値に固定の型があります。⟦s000799-s000802, s000849⟧\n- **型の不一致**は自動変換されず、エラーになります。⟦s000853-s000854, s000860⟧", "6": "# 6. 再帰・局所定義と配列指向の考え方\n\n関数を小さく分けて組み立てる再帰（recursion）と、名前を局所的に束縛する仕組み、そして配列全体をまとめて扱う配列指向の考え方を扱います。どれも「必要なものを、必要なときだけ計算する」「繰り返しを明示的に書かない」という関数型言語らしい発想につながっています。⟦s001238, s001241, s001659-s001660⟧\n\n## 🔁 再帰で階乗を書く\n\n階乗は、`n` が 0 のときに 1 を返し、それ以外は `n` に `(n - 1)` の階乗を掛ける、という形で定義できます。まずは `if` 式で書いた版を見てみましょう。⟦s001226-s001229⟧\n\n```haskell\nfactorial :: Integer -> Integer\nfactorial n = if n == 0\n              then 1\n              else n * (factorial (n - 1))\n```\n\nここで `(factorial (n - 1))` の括弧がとても大切です。括弧がないと、先に `factorial n` を計算してから 1 を引いてしまうためです。⟦s001230-s001231⟧\n\n同じ処理をガード（guard）で書くと、次のようになります。型の宣言は同じままです。⟦s001233-s001234⟧\n\n```haskell\nfactorial :: Integer -> Integer\nfactorial n\n  | n == 0    = 1\n  | otherwise = n * factorial (n - 1)\n```\n\nガード版は `n == 0` のときの答えと、それ以外のときの答えを縦に並べて書けるので、読みやすくなります。関数型言語で問題を解くときは、この書き方が典型的だと説明されました。⟦s001235-s001236⟧\n\n### 🪜 階乗 2 を実際にたどる\n\n`factorial 2` を例に、呼び出しを順番にたどってみます。\n\n1. `n` は 2 です。`n == 0` は偽なので、otherwise の側に進みます。⟦s001256-s001259⟧\n2. `factorial (n - 1)` を呼びます。ここで `n - 1` は 1 です。⟦s001265, s001276⟧\n3. 新しい呼び出しでは `n` が 1 です。`n == 0` は偽なので、今度は `factorial 0` を呼びます。⟦s001276-s001277⟧\n4. `factorial 0` では `n == 0` が真になり、1 を返します。⟦s001280-s001281⟧\n5. 戻った先で `1 * 1` を計算し、1 を返します。さらに戻った先で `2 * 1` を計算し、答えの 2 になります。⟦s001283-s001287⟧\n\nここでは分かりやすくするために `n - 1` を先に計算した値（1）として書きました。実際の Haskell では、この計算はもう少し遅らされます。次のセクションで説明します。⟦s001261-s001264⟧\n\n## ⏳ 遅延評価（lazy evaluation）とサンク（thunk）\n\nHaskell では、`n - 1` の値をその場で計算しません。代わりに「あとで必要になったら `n - 1` を計算する」という約束のようなものを渡します。この約束をサンク（thunk）と呼びます。⟦s001262-s001263, s001314-s001317⟧\n\n- **すぐには計算しない**：`factorial (n - 1)` の呼び出し時には、`n - 1` の値はまだ作られません。⟦s001266-s001272⟧\n- **本当に必要になったときに計算する**：`n == 0` の判断をする瞬間に、初めて `n - 1` が評価されます。⟦s001292-s001294⟧\n- **判断には値が必要**：関数型言語では、「x をするか y をするか」を決めるときには引数を評価しなければなりません。だからこの遅延が解けるのは、判断が必要になった瞬間です。⟦s001295-s001296⟧\n\nサンクは「変数をつかまえた関数」のようなもので、その中で `n` を参照すると、もとの値を指すことになります。⟦s001327-s001335⟧ 講義では、この仕組みは通常は隠されているので、一般的な考え方を理解しておけば十分だと説明されました。⟦s001348-s001353⟧\n\n> 💡 遅延評価の要点は、「使われるまで計算しない」ことです。使われない値は、最後まで計算されないこともあります。⟦s001379-s001384⟧\n\n## 🧱 局所束縛（local binding）と let 式\n\n局所束縛（local binding）は、関数や式の中だけで有効な「名前と値のペア」です。`let` 式を使うと、この名前を複数定義できます。⟦s001367-s001369⟧ 定義した名前は `in` の後の式で使えます。⟦s001369-s001371⟧\n\n書き方は次のとおりです。⟦s001403-s001405⟧\n\n```haskell\nlet 変数1 = 値1\n    変数2 = 値2\nin  変数1 と変数2 を使った式\n```\n\n円の面積の例で見てみましょう。⟦s001406-s001407⟧\n\n```haskell\ncircleArea r =\n  let piValue = 3.14159\n  in  piValue * r * r\n```\n\n- `piValue` は関数の中だけで使える定数です。`r` は関数の引数です。⟦s001371-s001372⟧\n- 局所変数は、ほかの局所変数を参照することもできます。たとえば二乗を計算する `squareX` と `squareY` を定義して、その和 `sumOfSquares` を作るような書き方ができます。⟦s001363, s001407-s001408⟧\n- 局所変数は定数です。一度だけ値を与えることができ、あとから変えることはできません。⟦s001364-s001365⟧\n\n`let` の中の `let` も書けます。⟦s001366⟧ また、`let` の定義は「使われたときに」評価されるため、`in` の後の式が使わない定義は計算されません。⟦s001396-s001401⟧\n\n## 📝 where 節と使い分け\n\n`where` 節は、関数の本体の**後ろ**に局所変数をまとめて書く方法です。`let` と似ていますが、定義を式の後ろに置きます。⟦s001414-s001416⟧ 次の例は、ネットの「ナード度」を判定する関数です。⟦s001416-s001418⟧\n\n```haskell\ngetNerdStatus :: Int -> Int -> String\ngetNerdStatus gpa studyHours\n  | nerdScore > 100 = \"super nerdy\"\n  | otherwise       = \"just a nerd\"\n  where\n    nerdScore = gpa * studyHours\n```\n\n本体のガードでは `nerdScore` を使っていますが、定義は `where` の中にあります。Haskell では、後ろに書いた定義も前から参照できます。⟦s001419-s001420, s001429-s001431⟧ 読む人は、まず関数の論理を見て、詳細が必要になったら `where` の下を見ればよいので、読みやすくなります。⟦s001424-s001428⟧\n\n### 🆚 let と where の違い\n\n- **似ている点**：どちらも局所的な定義に使えます。単一の式を返すだけの関数なら、どちらを使ってもかまいません。⟦s001429, s001457-s001462⟧\n- **違う点**：複数のガードがある場合は、`where` を使わなければなりません。`let` はガードと組み合わせられない、というのがこの言語の決まりです。⟦s001469-s001471, s001498-s001499⟧\n- **理由**：特別な理由があるわけではなく、言語の設計で決められたものです。ほかの言語を設計するなら、`let` をガードと組み合わせることもできます。⟦s001472-s001477⟧\n\n> ⚠️ ガードは一見複数の式に見えますが、コンパイル時には入れ子の `if` 式として一つにまとめられます。そのため「式が一つか複数か」は、見た目と内部の扱いで違って見えることがあります。⟦s001482-s001486⟧\n\n## 🪆 ネストした関数とスコープ\n\n関数の中に、もう一つの関数を定義することもできます。Python の入れ子関数のような考え方です。⟦s001503, s001514⟧ 次の例では、`whatsTheBehaviorOf` の中で `behavesLike` を `where` で定義しています。⟦s001506-s001513⟧\n\n```haskell\nwhatsTheBehaviorOf :: String -> String\nwhatsTheBehaviorOf name\n  | name == \"Kerry\" = behavesLike name \"12-year-old\"\n  | otherwise       = behavesLike name \"grown-up\"\n  where\n    behavesLike n what = n ++ \" behaves like a \" ++ what ++ \"!\"\n```\n\n- `behavesLike` は `n` と `what` の二つの引数を取り、文字列をつなげて返します。⟦s001514-s001516⟧\n- この関数は外側の関数の中でだけ見えます。外から呼び出すことはできません。⟦s001521-s001523⟧\n\n### 🔍 外側の変数が見える理由\n\nネストした関数は、囲んでいる関数の引数や局所変数にアクセスできます。⟦s001561, s001566⟧ そのため、`behavesLike` の引数から `name` を取り除き、外側の `name` を直接使うこともできます。⟦s001567-s001573⟧\n\n```haskell\nwhatsTheBehaviorOf :: String -> String\nwhatsTheBehaviorOf name\n  | name == \"Kerry\" = behavesLike \"12-year-old\"\n  | otherwise       = behavesLike \"grown-up\"\n  where\n    behavesLike what = name ++ \" behaves like a \" ++ what ++ \"!\"\n```\n\nこの書き方は問題ありません。内側の関数は外側の値を読むだけで、書き換えていないからです。外側の値を変更しないかぎり、純粋関数の制約には違反しないと確認されました。⟦s001575-s001580⟧ 内側の関数の中で、さらに別の関数を定義した場合も、その外側すべての変数が見えます。⟦s001589-s001591⟧\n\n## 🔢 演習: 素数判定（isPrime）\n\n素数判定は、ネストした関数と再帰を組み合わせる良い練習です。`isPrime` は整数を受け取り、真偽値を返します。⟦s001593-s001596⟧ 補助関数 `checkDivisors` を使い、`n` と、確認中の除数を渡します。除数は `n - 1` から始めて、1 まで順に減らしていきます。⟦s001596-s001599⟧\n\n```haskell\nisPrime :: Int -> Bool\nisPrime n = checkDivisors n (n - 1)\n  where\n    checkDivisors n divisor\n      | divisor == 1          = True\n      | n `mod` divisor == 0  = False\n      | otherwise             = checkDivisors n (divisor - 1)\n```\n\n- **除数が 1 のとき**：ほかに割り切れる数がなかったので、素数だと判断して `True` を返します。⟦s001611-s001613⟧\n- **割り切れたとき**：`n` を 1 以外の数で割り切れたので、素数ではなく `False` を返します。⟦s001616-s001618⟧\n- **そうでないとき**：次に小さい除数で再帰的に確認します。⟦s001634-s001635⟧\n- **括弧の重要性**：`checkDivisors n (divisor - 1)` の括弧を忘れると、`checkDivisors n divisor` の結果から 1 を引くという誤った式になってしまいます。⟦s001620-s001624⟧\n\n講師は、この実装には既知の不具合があると認めています。`n` が 1 のときは正しく動かず、基底条件の追加が必要だという指摘がありました。⟦s001626-s001627⟧ 学習のために、このような不完全さも含めて確認すると理解が深まります。\n\n## 🧮 配列指向プログラミング（array-oriented programming）と APL\n\n配列指向プログラミングは、要素を一つずつループで処理するのではなく、配列や行列全体への演算として計算を書く考え方です。⟦s001658-s001660⟧ その代表例が APL です。⟦s001642, s001658⟧\n\n- **誕生**：APL は 1957 年に、配列を含む数式を表す記法として生まれました。その後、プログラミング言語になりました。⟦s001647-s001653⟧\n- **特徴**：ループを明示的に書かず、行列やベクトルを一つのまとまりとして扱います。⟦s001658-s001660⟧\n- **記号**：関数は ASCII ではない独特の記号で表されます。それぞれの記号に意味があり、言語を読むには記号の意味を覚える必要があります。⟦s001661-s001664⟧\n- **一文字の強み**：内積、行列積、回転、転置といった複雑な演算が、一つの記号で書けます。⟦s001668-s001669, s001671-s001672⟧\n\nAPL の記号は難しく、現在の基準では読みにくいと認められています。それでも、この考え方は現代の技術に影響を与えました。⟦s001664-s001666, s001685⟧ GPU で行列演算を行う近代的な言語の基礎には APL の発想があり、NumPy、TensorFlow、PyTorch などの機械学習関連技術にも間接的に影響を与えたと説明されました。⟦s001679-s001682⟧ 現在では記号名がより読みやすくなっていますが、テンソルや行列を一度に扱うという考え方は APL に由来します。⟦s001683-s001684⟧\n\n## 🎯 Key Takeaway\n\n- **再帰**：自分自身を小さな問題に対して呼び出し、基底条件で止まります。階乗や素数判定は、この形で書けます。⟦s001249, s001628-s001630⟧\n- **遅延評価**：値は本当に必要になるまで計算されず、判断の瞬間に評価されます。⟦s001290-s001296⟧\n- **let と where**：局所束縛を作る方法です。単一の式なら どちらでもよく、ガードを使うときは `where` が必要です。⟦s001457-s001471⟧\n- **ネストした関数**：外側の引数や局所変数を読むことができ、外側の値を書き換えなければ問題ありません。⟦s001584-s001585, s001577-s001580⟧\n- **配列指向**：ループを書かずに、行列やベクトル全体を一つの記号で計算します。この発想は現代の機械学習技術にもつながっています。⟦s001659-s001660, s001680-s001682⟧"}, "fun_facts": null}, "ran": ["deep_notes"], "checks": {"deep_notes": {"calls": 2, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 10952, "exclamations": 2, "question_marks": 0, "citations": 94, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 24, "input_tokens": 32413, "output_tokens": 10549, "max_output_tokens_single_call": 6145, "sum_call_seconds": 50.4, "max_call_seconds": 28.54}}, "errors": {}}, "v3": {"outputs": {"review_cards": null, "deep_notes": {"4": "# 4. Haskellの関数定義と型推論\n\nHaskellでは、関数の型を書いたうえで、等号の右側に式をそのまま書くだけで関数を定義できます。型を省略しても、Haskellはプログラムの使われ方から型を推論し、型の整合性を厳しく検査します。\n\n## 🔍 Haskellの基本的な書き方\n\nHaskellは構文がとてもシンプルで、C++のようにかっこやセミコロンに頼らない言語です。まずは、GHCi（Haskellの対話型インタプリタ）で円の面積を求める関数を動かしてみるところから始めます。⟦s000518-s000524⟧\n\nGHCiは対話的に一行ずつ式を評価できる環境（REPL）です。ファイルに関数を書いて保存し、GHCiで読み込めば、その関数を呼び出せます。⟦s000525-s000528⟧ 読み込んだあとに関数を呼ぶときは、関数名の後ろに引数を空白で並べるだけでよく、括弧は要りません。⟦s000529-s000531⟧\n\n```haskell\narea :: Double -> Double\narea r = 3.14 * r * r\n```\n\nこの例では、`area 10` と入力すると、半径10の円の面積として314が表示されます。`3.14` の代わりに組み込みの定数 `pi` を使うように書き換えたら、ファイルを保存して `:r`（リロード）を入力すると、変更が反映されます。⟦s000532-s000536⟧ 変更後の結果は、より多くの桁数で表示されるようになります。⟦s000540-s000541⟧\n\n## ⚙️ 関数定義の構成要素\n\nHaskellの関数定義は、大きく分けて次の2つの部分からできています。\n\n1. **関数シグネチャ（function signature）**：関数の引数の型と戻り値の型を宣言する行です。関数本体より上に、関数名と型をまとめて書きます。⟦s000647-s000649⟧\n2. **関数本体（function body）**：引数を使って計算し、結果を返す式です。等号の右側に式だけを書きます。⟦s000651⟧\n\n### 型シグネチャの読み方\n\n型シグネチャでは、引数の型を左から順に並べ、最後に戻り値の型を書きます。引数が1つでも複数でも、並びの最後の型が戻り値を表すという点は同じです。⟦s000594-s000600, s000603⟧\n\nたとえば、次の関数は2つの引数を取り、Bool（真偽値）を返します。引数の型の後ろには `->`（矢印）が続き、その後に戻り値の型が来る、と考えると読みやすくなります。⟦s000680-s000681, s000711-s000712⟧\n\n```haskell\nisGreater :: Double -> Double -> Bool\nisGreater first second = first > second\n```\n\n- 最初の `Double` は `first` の型です。\n- 2番目の `Double` は `second` の型です。\n- 最後の `Bool` は戻り値の型です。\n- 関数本体の `first > second` は、比較の結果（TrueかFalse）をそのまま返します。⟦s000708-s000709⟧\n\n### 戻り値の書き方（暗黙の戻り値）\n\nHaskellには `return` 文がありません。関数本体に評価したい式を書けば、その値がそのまま関数の結果になります。これを暗黙の戻り値（implicit return）と呼びます。⟦s000617-s000624⟧\n\nたとえば、3x²を計算する関数は次のように書けます。`return 3 * x ^ 2` のように書く必要はなく、数式をそのまま並べるだけです。⟦s000620-s000622⟧\n\n```haskell\npoly :: Int -> Int\npoly x = 3 * x ^ 2\n```\n\nこの定義で `=` は代入ではありません。「poly という関数は、引数 `x` を受け取り、式 `3 * x ^ 2` を評価して結果を返す」という意味です。Pythonのコロン（`:`）に近い読み方をすると理解しやすくなります。⟦s000566-s000571⟧ `poly 2` と入力すると、`3 * 2 ^ 2` が計算され、12が返ります。⟦s000572⟧\n\n### 区切り方（空白・改行・インデント）\n\nHaskellでは、セミコロンや括弧で区切るのではなく、改行と空白で構造を表します。⟦s000607-s000610, s000614-s000615⟧\n\n- **括弧は不要**：関数の引数を括弧で囲んだり、カンマで区切ったりしません。呼び出しも `isGreater 2.5 12.8` のように空白で並べるだけです。⟦s000627-s000631, s000653-s000654, s000714-s000715⟧\n- **インデント**：関数の本体が1行に収まらないときは、2行目以降を字下げして書きます。字下げの幅は何スペースでもかまいませんが、同じ関数の中では揃えておく必要があります。⟦s000676-s000677⟧\n- **型の位置合わせ**：引数の型と名前を縦に揃えると対応関係が見やすくなりますが、この空白は文法上必要ありません。⟦s000719-s000727⟧\n\n### 関数名を2回書く理由\n\n関数の型シグネチャと関数の定義の両方に、関数名を書きます。関数名が2回出てくるのはHaskellの設計上の選択であり、論理的に必ずそうしなければならないわけではありません。⟦s000637-s000646⟧\n\n## 🔗 Partial Application（部分適用）への入り口\n\n引数が2つある関数に、引数を1つだけ与えて呼ぶと、残りの引数を待つ新しい関数が作られます。たとえば `isGreater 1` は、`second` を1つ受け取って `1 > second` を判定する関数になります。この仕組みは、関数の型が「引数1つを受け取り、戻り値を返す」という形で一貫していることと関係しています。⟦s000669-s000671, s000695-s000697⟧\n\n> 詳しい仕組み（カリー化と部分適用）は後のトピックで扱います。ここでは「引数が少ない呼び出しでも、エラーにはならず新しい関数が返る」という点だけ覚えておけば十分です。\n\n## 🔎 型推論（Type Inference）\n\n### 型シグネチャを書かなくても型がわかる\n\n型シグネチャを書かなくても、Haskellは関数の中身から引数と戻り値の型を推論できます。次の関数を例にします。⟦s000734-s000738⟧\n\n```haskell\nisOld age hasAches = age > 30 || hasAches == True\n```\n\nこの関数には型シグネチャがありません。ところが、GHCiで `:t isOld`（型を調べるコマンド）と入力すると、次のように表示されます。⟦s000743-s000747⟧\n\n```haskell\nisOld :: Int -> Bool -> Bool\n```\n\n型が推論される過程を、関数の中身から順に追ってみましょう。⟦s000748-s000751⟧\n\n1. `age > 30` では、`age` を整数と比べています。Haskellは文字列や真偽値を整数と比べられないので、`age` は整数（`Int`）でなければなりません。⟦s000757-s000758, s000808-s000812⟧\n2. `hasAches == True` では、`hasAches` を `True` と比べています。比べられるのは真偽値どうしだけなので、`hasAches` は真偽値（`Bool`）でなければなりません。⟦s000761, s000813-s000814⟧\n3. `||`（論理和）は真偽値を返すので、関数全体の戻り値は真偽値（`Bool`）になります。⟦s000766-s000767, s000815-s000816⟧\n\nここで重要なのは、型を省略しても型が決まっていないわけではない、という点です。すべての値・変数・関数には必ず固定された型があり、Haskellはそれを使って整合性を確かめています。⟦s000844-s000851⟧\n\n### 型推論の使いどころ\n\n型推論は、現代の多くの言語が採用している仕組みで、プログラマが型を毎回書かなくてもよくなります。ただし、型推論がすべての型を自動で決めてくれるので、Haskellでは基本的に型シグネチャを書く必要はありません。仕事として書く場合でも、必要なときだけ書けば十分とされています。⟦s000799-s000807, s000845-s000848⟧\n\n型シグネチャを書くと、読み手に型を明示できるうえ、コンパイラが推論結果と照らし合わせて間違いを見つけてくれます。たとえば、`isOld` の戻り値に間違った型を書くと、エラーになります。⟦s000836-s000837⟧\n\n### 型推論と `== True` の関係\n\n`hasAches == True` の `== True` は、実は省略できます。`hasAches` だけを `||` の一方の項として書いても、`hasAches` が真偽値でなければならないことは同じように推論されます。講義の説明では、この部分を明確に示すために `== True` を書いていたという扱いです。⟦s000792-s000794, s000832-s000833⟧\n\n同じく、型シグネチャを削除すると、Haskellは既定の型（数全体を表す `Num` 型のような広い型）を選ぶことがあります。その場合、整数だけでなく浮動小数点数も受け付ける関数になります。⟦s000786-s000789⟧\n\n## ⚠️ 厳密な型検査（Strict Type Checking）\n\n### 自動変換は行われない\n\nHaskellは非常に厳格で、異なる型どうしを自動的に変換して合わせることは基本的にありません。たとえば、`0` を `False` として扱ったり、`1` を `True` として扱ったりすることはありません。⟦s000771-s000775⟧\n\n```haskell\n-- 次の式はどれもエラーになります\n0 == False      -- 整数と真偽値は比べられない\n1 == True       -- 同じ理由でエラー\n```\n\n同様に、整数を受け取る関数に浮動小数点数（`Double`）を渡すこともできません。C++であれば自動的に整数へ変換されて動いてしまうような場面でも、Haskellはエラーを出します。⟦s000777-s000779, s000857-s000859⟧\n\n```haskell\nisOld 53.5 False   -- 53.5 は整数ではないのでエラー\n```\n\n### 型推論と厳密さは両立する\n\n型推論によって型の書き込みを省略できることと、型の不一致を許さないことは、矛盾しません。推論はあくまで「型を見つける」仕組みであり、見つけた型に合わない値を黙って変換することはありません。⟦s000852-s000854⟧ 型を変換したい場合は、プログラマが明示的に変換を書く必要があります。⟦s000820-s000821⟧\n\n> 型を変える必要がある場面では、Haskellは何も言わずに型を変えないので、「なぜエラーになったのか」を型の不一致から読み取る習慣をつけておくと役立ちます。\n\n## 🎯 Key Takeaway\n\n- Haskellの関数は、型シグネチャ（引数の型を並べ、最後に戻り値の型）と、等号の右側の式（暗黙の戻り値）で定義します。⟦s000647-s000652⟧\n- 関数呼び出しは、括弧もカンマも使わず、関数名の後ろに引数を空白で並べます。⟦s000653-s000654⟧\n- 型シグネチャは省略でき、Haskellは関数の中身から型を推論します。ただし、すべての値に型は固定されています。⟦s000799-s000802, s000849-s000851⟧\n- 型の自動変換は行われないため、型が合わない引数を渡すとエラーになります。⟦s000852-s000853, s000859-s000860⟧", "6": "# 6. 再帰・局所定義と配列指向の考え方\n\n関数が自分自身を呼び出す**再帰**(recursion)、関数の中だけで使える名前を作る**局所束縛**(local binding)、そして配列全体に対して計算を書く**配列指向プログラミング**(array-oriented programming)を扱います。どれも「小さく分けて考える」「必要になるまで計算しない」という関数型言語らしい発想につながっています。⟦s001226-s001229, s001403-s001405, s001642-s001645⟧\n\n## 🔍 再帰で階乗を考える\n\n再帰は、大きな問題を同じ形の小さな問題に分け、最後に基底条件(base case)と呼ばれる止まる条件に到達させる方法です。階乗を例に見てみましょう。⟦s001226-s001229⟧\n\nまずは`if`式で書いた版です。`n`が0なら1を返し、それ以外なら`n * factorial (n - 1)`を返します。\n\n```haskell\nfactorial :: Integer -> Integer\nfactorial n = if n == 0 then 1 else n * (factorial (n - 1))\n```\n\n- `factorial :: Integer -> Integer` は、整数を受け取って整数を返す、という型の宣言です。⟦s001227⟧\n- `n == 0` が基底条件で、ここで再帰が止まります。⟦s001228⟧\n- `(factorial (n - 1))` の括弧は必須です。括弧がないと、`factorial n` を先に計算してから1を引いてしまいます。⟦s001230-s001231⟧\n\n同じ処理をガード(guard)で書くと、次のようになります。ガードは条件ごとに縦に並べて書く書き方です。⟦s001233-s001234⟧\n\n```haskell\nfactorial :: Integer -> Integer\nfactorial n\n  | n == 0    = 1\n  | otherwise = n * factorial (n - 1)\n```\n\nガード版は、条件と返す値が縦に並ぶので読みやすくなります。関数型言語で問題を解くときに、よく使われる書き方です。⟦s001234-s001236⟧\n\n### 🪜 `factorial 2` の計算の流れ\n\n`factorial 2` を実際に追ってみましょう。\n\n1. `n` は2です。`n == 0` は偽なので、`2 * factorial 1` を計算しようとします。⟦s001256-s001259⟧\n2. `factorial 1` の `n` は1です。ここでも `n == 0` は偽なので、`1 * factorial 0` になります。⟦s001276-s001277⟧\n3. `factorial 0` では `n == 0` が真になり、1を返します。⟦s001280-s001281⟧\n4. 戻りながら計算します。`1 * 1 = 1`、そして `2 * 1 = 2` となり、答えは2です。⟦s001283-s001286⟧\n\n<!-- FIGURE: type=\"diagram\" title=\"factorial 2 の再帰呼び出しと戻り値\" description=\"上から下へ factorial 2 → factorial 1 → factorial 0 と呼び出しが進む縦の流れを描く。factorial 0 で基底条件に達し値 1 が返る。その後、下から上へ 1 * 1 = 1、2 * 1 = 2 と戻り値が積み上がる様子を矢印で示す。\" -->\n\nここで大切なのは、再帰が「呼び出しが深くなる段階」と「答えが戻ってくる段階」の2つでできていることです。基底条件がないと、呼び出しが止まらなくなります。⟦s001281-s001288⟧\n\n## ⚙️ 遅延評価と「サンク」\n\nHaskellでは、`n - 1` のような引数をすぐに計算するとは限りません。これを**遅延評価**(lazy evaluation)と呼びます。値が本当に必要になるまで、計算を後回しにする仕組みです。⟦s001262-s001263, s001290-s001291⟧\n\nここで少し想像してみてください。`factorial 2` で `n - 1` を即座に計算して1を渡す、という見方は説明のための近似です。実際のHaskellでは、`n - 1` の計算を「あとで必要になったら実行してね」という予約として渡します。⟦s001263-s001264, s001270-s001272⟧\n\nこの予約のことを**サンク**(thunk)と呼びます。サンクは、必要になったときに計算を実行するための関数のようなものです。⟦s001315-s001317, s001327-s001328⟧\n\n### 🔑 いつ評価されるのか\n\n遅延評価された `n - 1` は、「どちらへ進むかを決める」瞬間まで評価されません。ガードで `n == 0` を調べる時点で、初めて `n - 1` の値が必要になります。⟦s001292-s001296, s001318-s001323⟧\n\n- 関数型言語では、何かを判断する(どちらの分岐に進むかを決める)ときには、引数を評価しなければなりません。⟦s001294-s001296⟧\n- 判断が必要になった時点で、サンクの中の計算が実行されます。⟦s001320-s001323⟧\n- 中身の細かい評価タイミングは、基本的には意識しなくても大丈夫です。全体の考え方(必要になるまで計算しない)を理解しておけば十分です。⟦s001351-s001354⟧\n\nなお、サンクが参照する `n` は、外側の関数で受け取った値そのものを指しています。つまり、外側の変数を読み取るだけで、値を変えてはいません。⟦s001329-s001336⟧\n\n## 🧩 局所束縛: `let` 式\n\n**局所束縛**(local binding)とは、ある関数や式の中だけで有効な「名前と値の結び付け」のことです。名前と値の組を束縛(binding)と呼びます。⟦s001367-s001369⟧\n\n**`let` 式**(let expression)は、局所的な値を一つ以上定義するための式です。定義した値は `in` の後ろの式で使われます。⟦s001369-s001371⟧\n\n```haskell\ncircleArea :: Double -> Double\ncircleArea r =\n  let piValue = 3.14159\n      sq x = x * x\n  in piValue * sq r\n```\n\nこの例では、次のことが起きています。\n\n- `piValue` と `sq` という2つの局所定義を作ります。⟦s001406-s001408⟧\n- `in` の後ろで、`piValue` と `sq r` を組み合わせて面積を返します。⟦s001370-s001371⟧\n- 局所定義は、関数の引数や他の局所定義を参照できます。例えば、ある局所値が別の局所値を使って定義されることもあります。⟦s001363-s001364, s001372-s001373⟧\n\nここで重要な点がいくつかあります。\n\n- 局所定義された値は**定数**であり、一度だけ初期化されます。後から変更することはできません。⟦s001364-s001365⟧\n- `let` の中に `let` を入れ子にすることもできます。⟦s001366⟧\n- 局所定義は、実際に使われるまで評価されません。使われない部分は評価されないので、「必要なときだけ計算する」という遅延評価の考え方がここにも表れています。⟦s001379-s001384, s001396-s001401⟧\n\n### 🪄 `where` 節\n\n**`where` 節**(where clause)は、`let` と似ていますが、局所定義を関数の本体の後ろにまとめて書きます。先に関数の本体を読み、必要な詳細をあとで確認する、という読み方ができます。⟦s001414-s001416, s001431-s001433⟧\n\n```haskell\ncircleArea :: Double -> Double\ncircleArea r = piValue * sq r\n  where\n    piValue = 3.14159\n    sq x = x * x\n```\n\n- 関数の本体では `piValue` と `sq` を普通に使えます。定義が本体の下にあっても、Haskellでは参照できます。⟦s001419-s001420, s001430-s001431⟧\n- 定義を下にまとめると、関数のロジックだけを上から読めます。⟦s001424-s001428⟧\n\n## 🆚 `let` と `where` の違い\n\nどちらも局所定義を作るという点では似ています。違いは、書く場所と、使える場面です。⟦s001429, s001457-s001461⟧\n\n- **似ている点**: 局所定義を作れる、定義を参照できる、遅延評価される、という性質は同じです。⟦s001429-s001430, s001396-s001401⟧\n- **書く場所の違い**: `let` は式の中で、`where` は関数定義の後ろで使います。⟦s001414, s001369-s001370⟧\n- **使える場面の違い**: 式が1つだけの場合は、`let` と `where` のどちらを使ってもかまいません。好みで選んで大丈夫です。⟦s001453-s001457, s001465-s001468⟧\n- **ガードとの組み合わせ**: ガードのように複数の式が並ぶ場合は、`where` を使わなければなりません。`let` はガードと組み合わせられません。⟦s001469-s001471, s001498-s001499⟧\n\nガードと `where` の例を示します。`nerdScore` は `where` の中で定義し、ガードの条件から参照しています。\n\n```haskell\nnerdStatus :: Double -> Double -> String\nnerdStatus gpa studyHours\n  | nerdScore > 100 = \"super nerdy\"\n  | otherwise       = \"nerd\"\n  where\n    nerdScore = gpa * 10 + studyHours\n```\n\nガードの条件 `nerdScore > 100` は、`where` で定義された値をそのまま使っています。ガードを使う関数では、このように `where` が自然な選択になります。⟦s001416-s001418, s001470-s001471⟧\n\n### ⚠️ なぜ `where` だけがガードに使えるのか\n\nガードと `where` だけを組み合わせられるのは、言語の設計上の決まりです。そこに必然的な理由があるわけではありません。⟦s001472-s001475, s001480-s001481⟧\n\n別の言語では、`let` とガードを組み合わせる仕組みを作ることもできます。ある言語が何を許すかは、その言語を作った人の選択なのです。⟦s001476-s001478, s001480⟧\n\nまた、ガードは見た目上は複数の式に見えますが、内部では入れ子になった1つの `if` 式として扱われます。だから、式が1つだとも言えます。ただし、書き方としてはガードを使うので、`where` が必要になります。⟦s001482-s001492⟧\n\n## 🪆 入れ子関数とスコープ\n\n関数の中に、さらに関数を定義することもできます。これを入れ子関数(nested function)と呼びます。Pythonで関数の中に関数を書くのと同じ発想です。⟦s001503-s001505, s001513-s001514⟧\n\n**スコープ**(scope)とは、名前が参照できるプログラム上の範囲のことです。入れ子関数は、外側の関数の引数や局所定義を参照できます。⟦s001561-s001566, s001584-s001585⟧\n\n次の例では、`behavesLike` という入れ子関数を `where` で定義しています。\n\n```haskell\nwhatsTheBehaviorOf :: String -> String -> String\nwhatsTheBehaviorOf name age\n  | name == \"carry\" = behavesLike name \"12-year-old\"\n  | otherwise       = behavesLike name \"grown-up\"\n  where\n    behavesLike n what = n ++ \" behaves like a \" ++ what ++ \"!\"\n```\n\n- `behavesLike` は2つの引数 `n` と `what` を受け取ります。文字列をつなげて、結果を返します。⟦s001513-s001516⟧\n- 名前が `carry` のときは12歳として、それ以外は大人として振る舞うと判定します。⟦s001506-s001511⟧\n- `behavesLike` は `whatsTheBehaviorOf` の中でだけ見えます。外側からは使えません。⟦s001519-s001523⟧\n\n### 🔗 外側の値を読むことはできる\n\n入れ子関数は、外側の関数の引数を直接参照することもできます。たとえば、`behavesLike` が `name` を直接使うように書き換えても、正しく動きます。⟦s001565-s001570⟧\n\n```haskell\nwhatsTheBehaviorOf :: String -> String\nwhatsTheBehaviorOf name\n  | name == \"carry\" = behavesLike \"12-year-old\"\n  | otherwise       = behavesLike \"grown-up\"\n  where\n    behavesLike what = name ++ \" behaves like a \" ++ what ++ \"!\"\n```\n\nこの書き方では、`behavesLike` は外側の `name` を参照しています。このとき、入れ子関数は外側の値を読み取るだけで、変更はしていません。だから純粋関数の制約には反しません。⟦s001571-s001573, s001577-s001580⟧\n\n入れ子はさらに何段でも重ねられます。内側の関数は、途中の関数と一番外側の関数の両方の変数を参照できます。⟦s001589-s001591⟧\n\n## 🔢 例: 素数判定 `isPrime`\n\nここでは、再帰と入れ子関数を組み合わせた例を見ます。`isPrime` は整数を受け取り、素数なら `True`、そうでなければ `False` を返します。⟦s001593-s001595⟧\n\n考え方は次の通りです。\n\n- 除数を `n - 1` から1まで順に減らしながら確かめます。⟦s001596-s001598, s001633-s001635⟧\n- 1 以外の除数で `n` が割り切れたら、素数ではありません。⟦s001633-s001634⟧\n- 1 まで来ても割り切れなければ、素数です。⟦s001611-s001613⟧\n\n```haskell\nisPrime :: Integer -> Bool\nisPrime n = checkDivisors n (n - 1)\n\ncheckDivisors :: Integer -> Integer -> Bool\ncheckDivisors n divisor\n  | divisor == 1         = True\n  | n `mod` divisor == 0 = False\n  | otherwise            = checkDivisors n (divisor - 1)\n```\n\n- `isPrime` は、補助関数 `checkDivisors` に `n` と `n - 1` を渡して開始します。⟦s001596-s001598⟧\n- `divisor == 1` のとき、ほかに割り切れる除数がなかったので `True` です。⟦s001611-s001613⟧\n- `n `mod` divisor == 0` のとき、1 以外で割り切れたので `False` です。⟦s001615-s001618⟧\n- どちらでもなければ、除数を1つ減らして再帰します。`(divisor - 1)` の括弧は必須です。括弧がないと、`checkDivisors n divisor` の結果から1を引いてしまいます。⟦s001620-s001624⟧\n\n`isPrime 7` の場合、`checkDivisors 7 6` から始まり、`7 mod 6`、`7 mod 5` と順に確かめていきます。どれでも割り切れず、除数が1に到達すると `True` になります。⟦s001633-s001635⟧\n\n### 🐞 注意: `n = 1` の扱い\n\nこの版には、`n` が1のときに正しく動かないという弱点があります。除数が0まで減ってしまい、正しい判定にならないからです。対策として、`n` が2より小さいときは素数ではないというガードを先に置く必要があります。⟦s001626-s001627, s001631-s001632⟧\n\n```haskell\nisPrime :: Integer -> Bool\nisPrime n\n  | n < 2     = False\n  | otherwise = checkDivisors n (n - 1)\n```\n\nこの追加ガードは、再帰の前に基底的な例外を取り除く役割を持ちます。⟦s001627⟧\n\n## 🧮 配列指向プログラミング\n\n**配列指向プログラミング**(array-oriented programming)は、要素を1つずつループで処理するのではなく、配列や行列全体に対する演算として計算を書く考え方です。⟦s001658-s001660⟧\n\nこの考え方を体現する言語の代表として、**APL**があります。APLは1957年に、配列を含む数学的な式を表すための記法として生まれました。その後、プログラミング言語として使われるようになりました。⟦s001647-s001653, s001657⟧\n\n### 🔣 APLの特徴\n\n- 明示的なループを書かず、行列やベクトルを1つのまとまりとして操作します。⟦s001658-s001660⟧\n- 関数には、ASCII以外の記号を使います。それぞれの記号が異なる意味を持つので、記号を覚えないと読めません。⟦s001661-s001664⟧\n- 内積、行列の掛け算、回転、転置といった複雑な操作が、1つの記号で書けます。⟦s001668-s001672⟧\n\n### 🌱 なぜ重要なのか\n\nAPLの発想は、今の機械学習の計算に広く影響しています。大量の行列計算を行う場面、たとえばAIや機械学習で、この考え方が使われています。⟦s001673-s001678⟧\n\nGPUで行列計算を行う現代の言語の多くは、APLの流れを受けています。NumPy、TensorFlow、PyTorchなども、配列指向の考え方から間接的に影響を受けています。これらは記号の名前がより読みやすくなっていますが、行列やテンソルを一度に扱うという発想はAPL由来です。⟦s001679-s001684⟧\n\nAPLは読みにくく、現代の感覚では扱いづらい言語です。それでも、「配列全体を一度に扱う」という考え方を広めたという点で、大きな影響を持っています。⟦s001664-s001666, s001685-s001686⟧\n\n## 🎯 Key Takeaway\n\n- **再帰**では、基底条件で止まり、呼び出しが戻ってきながら答えが組み立てられます。⟦s001281-s001288⟧\n- **遅延評価**では、計算は必要になるまで待たされ、その予約がサンクです。判断が必要になった瞬間に評価されます。⟦s001290-s001296⟧\n- **`let` と `where`** はどちらも局所定義を作ります。ただし、ガードと一緒に使えるのは `where` だけです。⟦s001457-s001471⟧\n- **入れ子関数**は外側の値を読めますが、変更はしないので純粋関数の制約を守れます。⟦s001577-s001581, s001584-s001585⟧\n- **配列指向プログラミング**は、ループの代わりに配列全体で計算を書く考え方で、APLから始まり、機械学習のライブラリにも影響しています。⟦s001658-s001660, s001681-s001682⟧"}, "fun_facts": null}, "ran": ["deep_notes"], "checks": {"deep_notes": {"calls": 2, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 14162, "exclamations": 3, "question_marks": 0, "citations": 111, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 28, "input_tokens": 33145, "output_tokens": 15381, "max_output_tokens_single_call": 9424, "sum_call_seconds": 69.6, "max_call_seconds": 40.94}}, "errors": {}}, "v4": {"outputs": {"review_cards": null, "deep_notes": null, "fun_facts": null}, "ran": [], "checks": {}, "errors": {}}}}, {"id": "ed333ded-2e09-464a-8224-11b7517fb709", "title": "論理結合子の記号化と真理値表", "lang": "English → Japanese", "topics": [{"idx": "1", "title": "論理結合子と否定の意味"}, {"idx": "2", "title": "英語表現と論理記号の対応"}, {"idx": "3", "title": "複合文の記号化と否定の範囲"}, {"idx": "4", "title": "記号化の語順規則とド・モルガンの法則"}, {"idx": "5", "title": "真理値表による論理結合子の定義"}], "gemini": {"review_cards": {"1": [{"card_type": "hook", "title": "論理を「話す」方法", "hero_emoji": "🗣️", "content_blocks": [{"text": "前回の講義では、日常言語の命題を論理記号で形式化する方法を学びましたね。これで論理の「文法」はバッチリ！", "type": "paragraph"}, {"text": "論理記号はわかったけど、じゃあそれを**英語でどう表現するの？** まるで外国語を学ぶみたいに、記号と日常の言葉を結びつけよう！", "type": "quote"}, {"text": "論理結合子（logical connectives）の記号とそれが表す論理的概念は理解したけど、実際にそれらの記号を翻訳するために使う**英語の言葉**はまだ見ていませんでしたね。⟦s000004-s000005⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "「否定」の英語表現", "hero_emoji": "🚫", "content_blocks": [{"text": "論理記号のチルダ（tilde）は、**否定（negation）**の概念を表します。では、英語ではどう表現するでしょう？", "type": "paragraph"}, {"type": "list", "items": ["**not** ⟦s000063⟧", "**is false that** （〜は偽である）⟦s000074-s000075⟧", "**is not true** （〜は真ではない）⟦s000119-s000121⟧"]}, {"text": "これらの英語表現は、チルダが表す論理的な意味と**同値（equivalent）**です。つまり、これらの表現を見たらチルダを使って翻訳できるということ！⟦s000069-s000071⟧", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "同値性と「反対」の罠", "hero_emoji": "🧐", "content_blocks": [{"text": "「チルダは『not』を意味する」と言うのは**間違い**です！チルダは『not』の**意味と同値**なのです。⟦s000067-s000071⟧", "type": "callout", "alert_type": "warning"}, {"text": "なぜこの区別が重要かというと、「not」と「is false that」は**論理的に同値**ですが、**全く同じ意味ではない**からです。もしチルダが「not」しか意味しないと定義したら、「is false that」を翻訳できなくなってしまいます！⟦s000077-s000082⟧", "type": "paragraph"}, {"text": "また、「opposite of（〜の反対）」という表現も注意が必要です。英語の「opposite」には2つの意味があります。一つは「〜ではない」という否定の意味ですが、もう一つは「北極と南極」のような**極端な対立（polar opposite）**です。南極は北極の否定ではありません。北極の否定は「北極以外のすべて」を指します。⟦s000109-s000117⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "さらに深く、そして次へ！", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、論理結合子、特に否定（チルダ）が英語の様々な表現とどのように対応し、論理的に同値であるかを学びました。この「論理的同値性」の考え方が、正確な翻訳の鍵となります。", "type": "paragraph"}, {"text": "自己学習リスト:", "type": "paragraph"}, {"type": "list", "items": ["他の論理結合子（連言、選言、条件文、双条件文）の具体的な英語表現 ⟦s000050⟧", "真理関数的（truth-functional）な結合子の正確な定義 ⟦s000156-s000158⟧", "「opposite」の2つの意味とその論理的な違いの深掘り ⟦s000110-s000117⟧"]}, {"text": "さて、否定以外の論理結合子、例えば**連言（conjunction）**や**包括的選言（inclusive disjunction）**、**条件文（conditional）**、**双条件文（biconditional）**は、英語でどのように表現され、どのように**英語表現の記号化（symbolization）**を行うのでしょうか？次回、その対応関係を徹底的に見ていきましょう！", "type": "paragraph"}]}], "2": [{"card_type": "hook", "title": "言葉の裏の論理", "hero_emoji": "🤔", "content_blocks": [{"text": "「and」と「but」は、日常会話では全然違うように聞こえるけど、論理の世界では**全く同じ意味**なんだ！", "type": "quote"}, {"text": "私たちは言葉のニュアンスで意味を読み取りますが、論理学では**真理条件（truth conditions）**が全て。表面的な違いに惑わされず、その裏にある論理的な「エンジン」を見抜くのがポイントです！", "type": "paragraph"}]}, {"card_type": "core_why", "title": "日常語が論理記号に！", "hero_emoji": "🔗", "content_blocks": [{"text": "「and」や「but」は、どちらも論理的には**連言（conjunction）**を表します。つまり、両方の要素が真である場合にのみ全体が真となる、という同じ概念です。⟦s000188-s000190⟧", "type": "paragraph"}, {"type": "code", "code_string": "A . B  // A and B (AかつB)", "explanation": "論理学では「ドット（.）」で表現されます。⟦s000183⟧"}, {"text": "一方、「or」は**選言（disjunction）**を表します。これは、どちらか一方、または両方が真であれば全体が真となる概念です。⟦s000205⟧", "type": "paragraph"}, {"type": "code", "code_string": "A v B  // A or B (AまたはB)", "explanation": "論理学では「ウェッジ（v）」で表現されます。⟦s000205⟧"}, {"text": "英語には、これら一つの論理概念を表すために、**驚くほど多くの言葉**があります。「also」「further」「furthermore」「moreover」なども連言に、「either」「else」「otherwise」なども選言に相当することがあります。⟦s000198-s000202, s000209-s000217, s000223-s000226, s000233⟧", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "条件文のトリッキーな表現", "hero_emoji": "⚠️", "content_blocks": [{"text": "「もし〜ならば、〜」という**条件文（conditional statement）**は、英語で表現するのが特にトリッキーです。論理学では「ホースシュー（⊃）」で表されます。⟦s000281-s000287⟧", "type": "paragraph"}, {"type": "list", "items": ["If A, then B (AならばB) ⟦s000286⟧", "A only if B (AであるのはBの場合に限る) ⟦s000290⟧", "B if A (AならばB) ⟦s000293⟧", "When A, B (Aの時、B) ⟦s000341-s000343⟧", "Provided that A, B (Aという条件で、B) ⟦s000347-s000348⟧", "Given that A, B (Aが与えられれば、B) ⟦s000348-s000350⟧"]}, {"text": "「unless」は特に注意！これは単純な選言ではなく、**「if not」（〜でなければ）**という二つの結合子を組み合わせたものとして機能します。論理的には選言（or）と等価になることもありますが、その構造はより複雑です。⟦s000255-s000257, s000266-s000274⟧", "type": "callout", "alert_type": "warning"}, {"text": "そして、**双条件文（biconditional）**は「if and only if (IFF)」で表され、論理的には「トリプルバー（≡）」で表現されます。これは「もしAならばB、そしてもしBならばA」という、条件文とその逆が両方真である状態を意味します。⟦s000316-s000317, s000325-s000327, s000334⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "次のステップ", "hero_emoji": "📚", "content_blocks": [{"text": "このセグメントでは、日常の英語表現がどのように論理的な結合子（連言、選言、条件文、双条件文）に対応するか、そして言葉のニュアンスと論理的意味の違いを学びました。", "type": "paragraph"}, {"text": "さらに深く掘り下げたい場合は、これらをチェック！", "type": "paragraph"}, {"type": "list", "items": ["「unless」が選言と論理的に同値になる**真理値表（truth tables）**での詳細な説明 ⟦s000262-s000265⟧", "条件文や双条件文を表す**より多くの英語表現**の例 ⟦s000353-s000354⟧", "英語が特定の論理概念を表現する多様な方法を発達させた**言語学的・歴史的背景** ⟦s000298-s000308⟧"]}, {"text": "さて、これらの論理記号を使って**複合文の記号化（symbolization of compound sentences）**をどう行うのでしょうか？特に**否定の作用域（scope of negation）**が絡むと、どうなるのか？次回、その謎を解き明かしましょう！", "type": "paragraph"}]}], "3": [{"card_type": "hook", "title": "隠れた意味を探せ！", "hero_emoji": "🕵️‍♀️", "content_blocks": [{"text": "日常会話の「否定」って、実は超あいまい！論理学では、その**否定がどこまで影響するのか**（否定の作用域）が超重要になるんだ。", "type": "paragraph"}]}, {"card_type": "core_why", "title": "「両方ではない」の罠", "hero_emoji": "🤯", "content_blocks": [{"text": "「アルとベティは**両方とも**町に行かないわけではない」ってどう訳す？これは「彼らが両方とも町に行く**わけではない**」ってこと。つまり、少なくともどちらか一方は町に行かないってことだね。⟦s000388-s000391, s000417-s000418⟧", "type": "paragraph"}, {"type": "code", "code_string": "~ (A • B)", "explanation": "これは「AとBが両方とも真であることはない」という意味。⟦s000390-s000391⟧"}, {"text": "じゃあ、「アルとベティは**両方とも**町に行かない」はどう？これは「アルも町に行かないし、ベティも町に行かない」ってことだよね。⟦s000395, s000419⟧", "type": "paragraph"}, {"type": "code", "code_string": "~ A • ~ B", "explanation": "これは「Aが真ではない、かつBが真ではない」という意味。⟦s000400-s000401⟧"}]}, {"card_type": "gotcha", "title": "否定の作用域（scope of negation）が命！", "hero_emoji": "💡", "content_blocks": [{"text": "この2つの表現、似てるけど全然違う意味を持つんだ！教授が「みんなここでつまずく！」って言ってたよね。**否定の作用域**（scope of negation）が、文全体の意味をガラッと変えちゃうんだ。⟦s000385-s000386, s000408⟧", "type": "callout", "alert_type": "warning"}, {"text": "`~ (A • B)` が真になるのは、3つのパターンがあるよ。アルもベティも町にいない、アルだけ町にいてベティはいない、ベティだけ町にいてアルはいない、のいずれかだね。⟦s000507-s000514⟧", "type": "paragraph"}, {"text": "でも、`~ A • ~ B` が真になるのは、たった1つのパターンだけ！アルもベティも町にいない、の場合のみだよ。⟦s000515-s000516⟧", "type": "paragraph"}, {"text": "ほら、真になる条件が全然違うでしょ？だから、この2つは**論理的に異なる**んだ。⟦s000517⟧", "type": "paragraph"}, {"text": "**プロのヒント！** 否定記号（チルダ `~`）が**どこにかかっているか**を常に意識しよう！カッコの外にあるのか、個々の命題にかかっているのかで、意味が大きく変わるからね。⟦s000423-s000425⟧", "type": "callout", "alert_type": "info"}]}, {"card_type": "next_action", "title": "次のステップへ！", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、日常会話の曖昧な否定表現が、論理学の記号化においていかに異なる意味を持つか、そして**否定の作用域**（scope of negation）がいかに重要かを学んだね。", "type": "paragraph"}, {"text": "深掘りリスト", "type": "paragraph"}, {"type": "list", "items": ["`~ (A • B)` と `~ A ∨ ~ B` が**論理的に等価**（logically equivalent）であることを真理値表で確認してみよう。⟦s000445-s000446, s000498-s000500⟧", "**逐語訳**（literal translation）と**言い換え**（paraphrase）の違いについて、もう一度考えてみよう。⟦s000447-s000455⟧"]}, {"text": "さて、この「否定の作用域」のルールをさらに深く掘り下げていくよ。次回は、**記号化の語順規則**と**ド・モルガンの法則**（De Morgan's laws）を使って、複雑な否定表現をどうシンプルに変換できるか、そして**整式**（well-formed formula）の秘密に迫るからお楽しみに！", "type": "paragraph"}]}], "4": [{"card_type": "hook", "title": "日常会話の「忖度」", "hero_emoji": "🤝", "content_blocks": [{"text": "私たちは日常会話で、相手の言葉を**文脈で補って理解する**という「忖度（そんたく）」を無意識に行っています。これにより、多少曖昧でもスムーズにコミュニケーションが取れますよね。⟦s000541-s000556⟧", "type": "paragraph"}, {"text": "でも、論理の世界では「忖度」は通用しません！", "type": "quote"}, {"text": "この「忖度」の美徳が、**厳密な論理的思考**の邪魔になることがあるんです。特に、コンピュータはあなたの意図を「察する」ことはできませんからね！⟦s000558-s000561⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "なぜ精密さが必要？", "hero_emoji": "🔍", "content_blocks": [{"text": "日常言語の曖昧さは、論理学では大きな問題になります。例えば、「AlもBettyも町に行かない」という文は、**「Alが行かない AND Bettyが行かない」**という特定の意味を持ちます。⟦s000587-s000588⟧", "type": "paragraph"}, {"text": "しかし、私たちはしばしば「どちらも行かない」と「両方が行くわけではない」を混同しがちです。この違いは、論理的な推論において致命的な間違いにつながります。⟦s000595-s000597⟧", "type": "paragraph"}, {"text": "この混乱を避けるため、論理学では**意味（semantics）**だけでなく、**規則（syntax）**に基づいたアプローチも用います。意味で迷ったら、規則に頼るべし！⟦s000608-s000611⟧", "type": "callout", "alert_type": "info"}]}, {"card_type": "gotcha", "title": "語順が命！翻訳の秘訣", "hero_emoji": "💡", "content_blocks": [{"text": "英語の「not」と「both/either」の語順が、記号論理の「チルダ（~）」と「左括弧（(）」の語順を決定する！これが翻訳の**超重要ルール**です。⟦s000666-s000669⟧", "type": "callout", "alert_type": "warning"}, {"text": "例えば、「**not both**」と「**both not**」では、記号化の仕方が全く異なります。英語の語順がそのまま記号の語順になるんです。⟦s000714-s000715⟧", "type": "paragraph"}, {"type": "code", "code_string": "「not both」→ ~ (A ・ B)  // チルダが括弧の前に来る\n「both not」→ ( ~A ・ ~B ) // 括弧がチルダの前に来る（両方に否定がかかる）", "explanation": "「not」と「both」の順序が、「~」と「(」の順序と一致します。⟦s000717-s000725⟧"}, {"text": "同様に、「not either」と「either not」もこの規則に従います。英語の「either」は論理和（or）をグループ化する言葉なので、左括弧に対応します。⟦s000728-s000730⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "次のステップへ！", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、日常言語の「忖度」が論理では通用しないこと、そして「not both」や「not either」のような表現を正確に記号化するための語順規則を学びました。", "type": "paragraph"}, {"text": "さらに深く掘り下げたい方は、こちらもチェック！", "type": "paragraph"}, {"type": "list", "items": ["「neither nor」の真理条件の具体的なケース（真になるのは1通り、偽になるのは3通り）⟦s000598-s000604⟧", "様々な英文例における語順規則の適用練習（例: 「どちらも町に行かない」の記号化）⟦s000643-s000659⟧"]}, {"text": "この語順規則は、将来学ぶ**ド・モルガンの法則 (De Morgan's Law)** と深く関連しています。次回は、**真理値表（truth table）**を使って、**論理結合子（logical connectives）**がどのように定義されるのか、その**真理関数性（truth-functionality）**に迫ります！", "type": "paragraph"}]}], "5": [{"card_type": "hook", "title": "論理結合子の「真の」意味", "hero_emoji": "💡", "content_blocks": [{"text": "論理結合子（logical connectives）の「真の」意味は、英語の言い換え（paraphrase）ではなく、真理値（truth value）によって定義されるんだ！", "type": "quote"}, {"text": "これまで論理的同値（logical equivalence）な英語表現を使ってきたけど、いよいよ「〜ではない（not）」や「〜かつ〜（and）」といった結合子が、**真理値の世界でどう機能するのか**をハッキリさせよう！ ⟦s000743-s000747⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "否定の定義と真理関数性", "hero_emoji": "🔄", "content_blocks": [{"text": "否定（negation）の記号「~（チルダ）」は、たった1つの文に作用する**単項結合子（unary connective）**だ。その意味はシンプルに、**真理値を反転させる**こと！ ⟦s000754-s000761⟧", "type": "paragraph"}, {"type": "code", "code_string": "P | ~P\n--|---\nT | F\nF | T", "explanation": "文Pが真なら~Pは偽、Pが偽なら~Pは真となる。 ⟦s000760-s000761⟧"}, {"text": "「〜かつ〜（and）」のような結合子は、2つの文を繋ぐ**二項結合子（binary connectives）**だ。2つの文の真理値の組み合わせは、**真理関数性（truth-functionality）**のおかげで常に4通りしかないよ！ ⟦s000771-s000792⟧", "type": "paragraph"}, {"type": "list", "items": ["両方真 (T, T)", "1つ目が真、2つ目が偽 (T, F)", "1つ目が偽、2つ目が真 (F, T)", "両方偽 (F, F)"]}]}, {"card_type": "gotcha", "title": "連言と選言の真理条件", "hero_emoji": "🤝", "content_blocks": [{"text": "論理結合子の定義は、英語表現に「一致する」ように作られているんだ。だから、直感とズレないはず！ ⟦s000777-s000781⟧", "type": "callout", "alert_type": "info"}, {"text": "連言（conjunction）の記号「・（ドット）」は、英語の「and」に対応する。全体が真になるのは、**両方の文が真のときだけ**！それ以外は全部偽だ。 ⟦s000820-s000825⟧", "type": "paragraph"}, {"type": "code", "code_string": "P | Q | P・Q\n--|---|-----\nT | T | T\nT | F | F\nF | T | F\nF | F | F"}, {"text": "包括的選言（inclusive disjunction）の記号「∨（ウェッジ）」は、英語の「or」に対応する。全体が真になるのは、**どちらか一方、または両方の文が真のとき**！両方が偽のときだけ偽だ。 ⟦s000861-s000870⟧", "type": "paragraph"}, {"type": "code", "code_string": "P | Q | P∨Q\n--|---|-----\nT | T | T\nT | F | T\nF | T | T\nF | F | F"}]}, {"card_type": "next_action", "title": "今日のまとめ", "hero_emoji": "🎓", "content_blocks": [{"text": "このセグメントでは、論理結合子（logical connectives）の真の定義が、真理値表（truth table）によってどのように与えられるかを学びました。否定（negation）、連言（conjunction）、包括的選言（inclusive disjunction）の真理条件（truth conditions）を明確にすることで、論理が機械的に処理できる「真理関数性（truth-functionality）」を持つことが理解できました。", "type": "paragraph"}, {"text": "今日の講義では、論理結合子と否定の意味（negation）、英語表現と論理記号の対応（symbolization）、複合文の記号化と否定の範囲（scope of negation）、記号化の語順規則とド・モルガンの法則（De Morgan's laws）を学び、最終的に真理値表による論理結合子の定義にたどり着きました。これにより、複雑な文の真理値を、その構成要素の真理値から機械的に決定できるという強力なツールを手に入れたことになります。", "type": "paragraph"}]}]}, "deep_notes": {"1": "## 🔍 論理結合子とは何か\n論理結合子とは、文と文をつなぎ合わせたり、文の意味を変化させたりする論理的な概念を表す記号や言葉のことです。これらは、否定（negation）や条件性（conditionality）といった論理的な操作を表現するために用いられます。⟦s000004⟧\n\n講義では、以下の記号が論理結合子として紹介されました。⟦s000049-s000050⟧\n*   **チルダ**（tilde）: `~`\n*   **ドット**（dot）: `.`\n*   **ウェッジ**（wedge）: `v`\n*   **ホースシュー**（horseshoe）: `⊃`\n*   **トリプルバー**（triple bar）: `≡`\n\nこれらの記号には特定の論理的な順序はありませんが、チルダは1つの単位にのみ付加される**1項結合子**（one-place connective）であるため、通常は最初に挙げられます。⟦s000051-s000055⟧ 一方、トリプルバーは「if and only if（〜の場合に限り、かつその場合にのみ）」を意味し、「if-then（もし〜ならば）」が両方向に作用し、「and（かつ）」と結合したような複合的な結合子であるため、最後に挙げられることがあります。⟦s000056-s000059⟧\n\n### 真理関数的結合子\nこれらの論理結合子は、**真理関数的結合子**（truth-functional connectives）と呼ばれる特定の種類の結合子です。⟦s000035, s000155-s000156⟧ 真理関数的結合子とは、その結合子を含む複合文全体の真偽が、構成要素となる個々の文の真偽のみによって決定される結合子を指します。⟦s000158-s000159⟧\n\n## ⚙️ 否定（Tilde）の概念と表現\nチルダ（`~`）は、英語の「not」という言葉が持つ意味と同等の論理的概念を表現するために使用されます。⟦s000063, s000069-s000071⟧ ただし、チルダが「not」を**意味する**と直接的に言うのは正確ではありません。チルダは「not」という英単語の**意味**と論理的に同等である、と表現するのが適切です。⟦s000067-s000071⟧\n\n否定の概念を表現する英語のフレーズは「not」以外にも存在します。例えば、「is false that（〜は偽である）」というフレーズもチルダで翻訳できます。⟦s000074-s000076⟧ また、「is not true（〜は真ではない）」も否定の概念を捉える表現です。⟦s000119-s000121⟧\n\n<!-- FIGURE: type=\"table\" title=\"否定を表す英語表現の例\" description=\"チルダ記号と、それが翻訳できる英語の表現の例をリストにした表。not、is false that、is not true、is the opposite of（注意点あり）を含む。\" -->\n\n## 🆚 「意味」と「論理的同値」の区別\n「not」と「is false that」は、厳密には同じ意味ではありません。⟦s000077⟧ もしチルダの意味を「not」と定義してしまうと、「is false that」を翻訳するためにチルダを使用できなくなってしまいます。⟦s000078-s000082⟧\n\nこの問題を解決するために、私たちは**論理的同値**（logical equivalence）という観点から考えます。⟦s000084⟧ 現時点では、論理的同値とは、ある文の**言い換え**（paraphrase）であると捉えることができます。⟦s000090-s000093⟧ 言い換えられた文は元の文と全く同じではありませんが、論理的には同等です。したがって、「not」や「is false that」といった表現は、互いに論理的に同等な表現であり、いずれもチルダで翻訳できるのです。⟦s000094-s000095⟧\n\n### 逐語訳との違い\n将来的には、「言い換え」と**逐語訳**（literal rendition）を厳密に区別することが重要になります。⟦s000096-s000100⟧ 論理結合子の意味を理解した上で、英語から記号言語へ**逐語的に**翻訳することを目指します。単に論理的に同等なものを翻訳するだけでは不十分な場合があります。⟦s000100-s000102⟧\n\n## ⚠️ 否定表現の曖昧さと注意点\n否定の概念を捉える英語表現として「is the opposite of（〜の反対である）」が挙げられることもありますが、これには注意が必要です。⟦s000109⟧ 英語の「opposite」には2つの異なる意味があるためです。⟦s000110⟧\n\n1.  **単なる否定:** 「〜ではない」という意味での反対。例えば、「それはそのものの反対だ」という場合。⟦s000111⟧\n2.  **極性的な反対**（polar opposite）: 北極と南極のように、互いに反対の極にあるもの。⟦s000112⟧ 南極は北極の反対ですが、北極の否定ではありません。北極の否定は、南極を含む「北極以外のすべて」を意味します。⟦s000113-s000114⟧ これは集合論における**集合の補集合**（set complement）の概念に似ています。⟦s000115-s000116⟧\n\nしたがって、「opposite」という言葉を使う際には、それが単なる否定（「〜は真ではない」）を意味するのか、それとも特定の「極性的な反対」を意味するのかを区別する必要があります。⟦s000117-s000118⟧\n\n### 英語における否定表現の少なさ\n英語には否定を表す言葉がそれほど多くありません。⟦s000125⟧ これは、言語が発展してきた歴史的状況、すなわち**歴史的偶然**（accidents of history）によるものと考えられます。⟦s000126, s000139-s000140⟧ 例えば、イヌイットの人々が雪に対して多くの異なる言葉を持っているのは、彼らの生活において雪の種類を区別することが非常に重要だったためです。⟦s000126-s000138⟧ 英語話者にとって、否定の概念を細かく区別する必要性が、歴史的にそれほど高くなかったのかもしれません。⟦s000127-s000138⟧\n\n## 🎯 論理結合子の普遍性\nなぜ特定の言葉や記号が「論理結合子」として選ばれるのかという疑問が生じることがあります。⟦s000151-s000154⟧ その答えの一つは、これらの結合子が**分野固有**（discipline-specific）ではないという点にあります。⟦s000162, s000167⟧\n\n例えば、「フットボール」という言葉は、フットボールについて話すときにのみ重要な用語であり、核物理学のような全く異なる分野では関連性がありません。⟦s000163-s000166, s000172-s000175⟧ しかし、論理結合子は、どのような話題について話しているかに関わらず、あらゆる分野で現れる**普遍的**（universal）な概念です。⟦s000168-s000170⟧ 推論が必要なあらゆる探求分野において、これらの結合子を使用することは適切であり、関連性があります。⟦s000171, s000177-s000179⟧ この普遍性が、これらが論理結合子として認識される重要な理由の一つです。⟦s000180⟧", "2": "__SKIPPED_PLAN_LIMIT__", "3": "__SKIPPED_PLAN_LIMIT__", "4": "__SKIPPED_PLAN_LIMIT__", "5": "__SKIPPED_PLAN_LIMIT__"}, "fun_facts": {"title": "CPUの秘密兵器：NANDゲート 🤔", "hook": "現代のコンピューターの驚くべき能力は、たった一つのシンプルな論理回路であるNANDゲートが、あらゆる複雑な計算をこなせる「万能ゲート」として機能していることにあります。", "body": "今日学んだ真理関数性の原理こそが、まるで魔法のようにコンピュータが「思考」できる秘密なのです。\n\n7400シリーズNAND論理チップのような標準的な電子部品は、入力される電圧信号をバイナリの0か1とみなし、その真理値に基づいて出力値を決定します。\n\nこのNANDゲートは、入力信号の由来や「意味」を全く考慮せず、ただ厳格な真理関数的なルールに従って動作します。\n\n驚くべきことに、たった一つのNANDゲートの構成を繰り返すだけで、加算器やメモリ、さらにはCPU全体といった、あらゆる種類の計算回路を物理的に構築できてしまうのです。\n\nつまり、プロセッサは意味を理解することなく、この純粋な機械的電圧状態の組み合わせだけで、どんな複雑な論理も「推論」できるのです。\n\nこのシンプルな真理関数的な振る舞いが、あなたのPCやスマートフォンの内部で、想像を絶する複雑なデジタル世界を築き上げているのですね。", "metadata": null, "created_at": "2026-10-07T15:39:28.829816+00:00"}}, "haiku": {"v0": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🧩", "title": "Translating Logic, One Word at a Time", "content_blocks": [{"type": "paragraph", "text": "Last time we saw how sentences like 'It is raining and it is cold' can be turned into symbols, with letters standing for simple claims and connectives tying them together."}, {"type": "quote", "text": "Logic symbols are like a universal translator: the same little squiggle has to fit 'not', 'it is false that', and 'it's not the case that' without losing its meaning!"}]}, {"card_type": "core_why", "hero_emoji": "🔁", "title": "The Symbol-English Matching Game", "content_blocks": [{"type": "paragraph", "text": "Each connective has a symbol, and each symbol has an English equivalent that captures its meaning. The chart is arranged by structure, not alphabetically, with the one-place tilde at the top and the compound connectives at the bottom. ⟦s000050⟧⟦s000054-s000056⟧"}, {"type": "callout", "alert_type": "info", "text": "The tilde (negation, ~) is the easiest example. Its meaning matches the English word 'not', and also phrases like 'it is false that' or 'it is not the case that'. ⟦s000069-s000076⟧"}, {"type": "paragraph", "text": "Here's the key: a translation doesn't need the exact same words, only **logical equivalence** (論理的同値, logical equivalence), meaning the sentences always have the same truth value. ⟦s000084⟧"}, {"type": "code", "language": "latex", "code_string": "\\sim P \\;\\equiv\\; \\text{it is false that } P", "explanation": "Two different English phrasings can be equivalent to the same symbol. ⟦s000093-s000094⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "Don't Fall for the 'Opposite' Trap", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Careful! The tilde doesn't mean 'the opposite'. English 'opposite' has two senses, and only one of them matches negation. ⟦s000109-s000111⟧"}, {"type": "paragraph", "text": "The **polar opposite** (極対, polar opposite) is not the negation. The South Pole is the opposite of the North Pole, but 'not North Pole' includes everything else, not only the South Pole. ⟦s000112-s000114⟧"}, {"type": "callout", "alert_type": "info", "text": "Professor's rule: translate **literally** (直訳, literal translation) from English into symbols, rather than swapping in some other logically equivalent sentence. ⟦s000099-s000102⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Lock It In & Look Ahead", "content_blocks": [{"type": "paragraph", "text": "We learned that each connective, especially the tilde, has an English equivalent, and that you must translate literally while using logical equivalence to check meaning."}, {"type": "paragraph", "text": "Make sure to cover these:"}, {"type": "list", "items": ["The formal definition of **logical equivalence** (論理的同値, logical equivalence) using **truth tables** (真理表, truth table) ⟦s000085-s000089⟧", "The **set complement** (補集合, set complement) idea as a more precise picture of negation ⟦s000115-s000116⟧"]}, {"type": "paragraph", "text": "So how do we turn full English sentences, including 'and', 'or', 'if...then', and 'if and only if', into these symbols? We'll find out next!"}]}], "2": [{"card_type": "hook", "hero_emoji": "🎭", "title": "and と but は双子説", "content_blocks": [{"type": "quote", "text": "「and」と「but」は、服装だけ違う双子のようなもの。論理の世界では、同じ人物として扱われる！"}, {"type": "paragraph", "text": "「but」には少し意外性や気持ちのニュアンスが乗っている。でも、中身の真偽を判定する場面では、そのニュアンスは気にしなくていい。"}]}, {"card_type": "core_why", "hero_emoji": "🧩", "title": "言葉は違っても、働きは同じ", "content_blocks": [{"type": "paragraph", "text": "英語の表現を記号に変えるときは、単語の見た目ではなく、**論理的な働き（logical concept）**で対応を決める。⟦s000189⟧⟦s000190⟧"}, {"type": "list", "items": ["**連言（conjunction）**：and、but、also、moreover など。記号は \\( \\cdot \\) ⟦s000182⟧⟦s000198⟧", "**選言（disjunction）**：or、either、or else、otherwise など。記号は \\( \\lor \\) ⟦s000205⟧⟦s000233⟧", "**条件文（conditional）**：if-then、only if、provided that など。記号は \\( \\supset \\) ⟦s000287⟧⟦s000290⟧", "**双条件文（biconditional）**：if and only if、when and only when など。記号は \\( \\equiv \\) ⟦s000316⟧⟦s000334⟧"]}, {"type": "code", "language": "latex", "code_string": "A \\text{ and } B \\;\\Rightarrow\\; A \\cdot B \\qquad A \\text{ or } B \\;\\Rightarrow\\; A \\lor B", "explanation": "同じ論理の働きを持つ表現は、どれも同じ記号で訳す。⟦s000195⟧⟦s000196⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "unless の罠と、単語ではなく概念で訳す", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "「unless」は「or」と同じ意味に見えるけど、実は**単語のまま等しいわけではない**。\\( \\lor \\) と対応させるには、もう一段の理解が必要。⟦s000251⟧⟦s000255⟧"}, {"type": "paragraph", "text": "「unless」は、およそ「if not」にあたる二つの結合子が組み合わさったものとして扱われる。だから、単純に「or」と一対一で置き換えると、ずれが生じる可能性がある。⟦s000256⟧⟦s000257⟧"}, {"type": "callout", "alert_type": "info", "text": "教授の結論はシンプル：**単語を探すのではなく、英語の中にどの論理概念が入っているかを見抜け！** そうすれば、対応する記号が自然に決まる。⟦s000355⟧⟦s000357⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "英語を論理記号に翻訳する力を育てよう", "content_blocks": [{"type": "paragraph", "text": "今回は、and や but、or の仲間、if の三つの型などの英語表現を、対応する論理記号に結びつける考え方を学んだ。コツは単語ではなく論理の働きを見ること。"}, {"type": "paragraph", "text": "ぜひ次も掘り下げてみよう："}, {"type": "list", "items": ["「unless」が「if not」の二つの結合子に分解される理由", "包含的な or として \\( \\lor \\) を使うことの正当性（真理表で確認予定）", "when and only when など、双条件文の多様な言い回し", "provided that や given that など、条件表現のバリエーション"]}, {"type": "paragraph", "text": "でも、翻訳がうまくいっても、否定が絡むとまた落とし穴が出てくる。そのまま訳すだけで本当に意味が保たれるのか？次回は、否定がどこまでかかるのかを一緒に見ていこう！"}]}], "3": [{"card_type": "hook", "hero_emoji": "🚧", "title": "否定はどこまで届く？", "content_blocks": [{"type": "quote", "text": "同じ単語が並んでいても、否定の「ない」がどこまでかかるかで、文の意味はガラッと変わる！"}, {"type": "paragraph", "text": "「全員が来ない」と「全員は来ない」は似ているけど別物ですよね。論理でも、否定という門番が通る場所に注意が必要です。"}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "both と not の順番がすべて", "content_blocks": [{"type": "paragraph", "text": "「Al and Betty do not both go to town」は、二人が両方行くことを否定する文です。否定は二人が一緒に行く全体にかかります。 ⟦s000388-s000391⟧"}, {"type": "paragraph", "text": "一方「Al and Betty both do not go to town」は、二人がそれぞれ行かないという文です。否定が一人ずつにかかっています。 ⟦s000395-s000399⟧"}, {"type": "code", "language": "latex", "code_string": "\\sim(A \\cdot B) \\quad \\text{と} \\quad (\\sim A \\cdot \\sim B)", "explanation": "上が「both not」ではなく「not both」の形。かっこの位置が否定の範囲を決める。 ⟦s000416-s000418⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "言い換えても意味は同じ", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "教授のポイントは、「both と not の順番」を記号化で正確に区別すること。直訳を崩さないのが大切です。 ⟦s000420-s000423⟧"}, {"type": "paragraph", "text": "「not both」は「A is not there or B is not there」、つまり「どちらかが来ない」と言い換えられます。記号では \\( \\sim A \\vee \\sim B \\) です。 ⟦s000442-s000445⟧"}, {"type": "paragraph", "text": "二つは論理的同値（logical equivalence）の関係にあり、\\( \\sim(A \\cdot B) \\equiv \\sim A \\vee \\sim B \\) と書けます。 ⟦s000446-s000447⟧ ただし、\\( (\\sim A \\cdot \\sim B) \\) とは別物です。 ⟦s000505-s000506⟧"}, {"type": "callout", "alert_type": "warning", "text": "真になる場面を数えると一目瞭然。「not both」は真になる場面が三つあるのに、「both not」は一つだけ。 ⟦s000509-s000516⟧"}]}, {"card_type": "next_action", "hero_emoji": "🧭", "title": "否定の範囲を攻略しよう", "content_blocks": [{"type": "paragraph", "text": "今回は、A、B、Cを使った基本的な記号化と、both と not の語順による否定の範囲の違いを学びました。"}, {"type": "paragraph", "text": "Curious? Dig into these too:"}, {"type": "list", "items": ["真理値表で論理的同値を確かめる方法", "真になる三つのケースと偽になる三つのケースの数え上げ", "「もしAならBでない」型の条件文の記号化（A ⊃ ∼B）"]}, {"type": "paragraph", "text": "ところで、かっこの位置ひとつで意味が変わるなら、どこまでが正しい式として認められるのでしょうか。次は整式（well-formed formula）の考え方と、ド・モルガンの法則（De Morgan's laws）につながっていきますよ！"}]}], "4": [{"card_type": "hook", "hero_emoji": "🗣️", "title": "会話は察し合いで成り立つ", "content_blocks": [{"type": "quote", "text": "日常会話は『言いたいことを察する』優しさで回っている。でも論理の世界では、その優しさが誤解の原因になる！"}, {"type": "paragraph", "text": "相手が少し言い間違えても、私たちは文脈から本当の意味を汲み取って話を進める。⟦s000541-s000553⟧ 論理記号を扱うときは、この『察し』を一度オフにする必要があるんです。"}]}, {"card_type": "core_why", "hero_emoji": "🏠", "title": "neither の真理条件と語順の秘密", "content_blocks": [{"type": "paragraph", "text": "『neither Al nor Betty goes to town』は、『Al が行く』『Betty が行く』のどちらも成り立たない、つまり両方とも行かない場合だけ真になる。⟦s000587-s000588⟧"}, {"type": "paragraph", "text": "一方で『either Al or Betty does not go』は『どちらかが行かない』という意味で、真になる場合が三通りある。⟦s000598-s000600⟧ 二つは似て見えるが、真になる場面がまったく違うのがポイントです。"}, {"type": "code", "language": "latex", "code_string": "\\neg(A \\lor B) \\quad \\text{(neither A nor B)}", "explanation": "『両方とも行かない』は、『A または B』の否定として表せる。⟦s000587-s000588⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🔑", "title": "語順は規則で決める", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "意味から『たぶんこういう順序だろう』と推測しないこと！英語の not と both（either）の語順を見て、記号の順序を機械的に決めるのが正解。⟦s000608-s000610⟧"}, {"type": "paragraph", "text": "ルールはシンプルで、英語で not と both が出てきた順番を、そのままチルダ（~）と左括弧 \\( ( \\) の順番に写す。⟦s000714-s000715⟧ たとえば『not both』は『~(』、『both do not』は『(~』と並ぶ。⟦s000716-s000725⟧"}, {"type": "paragraph", "text": "『either』は『or』をまとめて表す言葉なので、not と either の組み合わせも同じ発想で扱う。⟦s000727-s000730⟧ 規則を先に覚えておけば、テストで迷ったときも安心です。⟦s000737-s000738⟧"}]}, {"card_type": "next_action", "hero_emoji": "🧭", "title": "次は推論規則へ", "content_blocks": [{"type": "paragraph", "text": "今回は、英語の『neither』や『not both』の意味の違いを確かめ、語順のルールで記号化する方法を学びました。意味で考えるのではなく、規則で処理するのがポイントです。"}, {"type": "paragraph", "text": "Self-Study List：細かい語順変換の練習や、ド・モルガンの法則の具体的な形も、ぜひ自分で確認してみてください。"}, {"type": "list", "items": ["『both do not』や『not both』など、語順の変換練習 ⟦s000643-s000646⟧", "ド・モルガンの法則の二つの形（推論規則としての使い方） ⟦s000680-s000691⟧"]}, {"type": "paragraph", "text": "次は、真理表による判定から推論規則による証明へ移ります。ド・モルガンの法則が、その強力な道具になるのでお楽しみに！"}]}], "5": [{"card_type": "hook", "hero_emoji": "🎛️", "title": "真理値の自動販売機", "content_blocks": [{"type": "quote", "text": "A logical connective is like a vending machine for truth values: you insert T or F, and it spits out a new T or F by a fixed rule!"}, {"type": "paragraph", "text": "Forget the English word 'not' for a moment. The real meaning of a connective is just a rule that says what comes out for every possible thing you put in."}]}, {"card_type": "core_why", "hero_emoji": "🧮", "title": "すべての入力を網羅する", "content_blocks": [{"type": "paragraph", "text": "The professor defines the tilde (negation, 否定) not by saying 'it means not', but by flipping truth values: a true statement becomes false, and a false one becomes true. ⟦s000759-s000761⟧"}, {"type": "code", "language": "text", "code_string": "p  | ~p\nT  |  F\nF  |  T", "explanation": "This small table is the whole definition of the tilde. ⟦s000760-s000761⟧"}, {"type": "paragraph", "text": "A binary connective (二項結合子) joins two statements, and two statements have exactly four truth-value combinations: TT, TF, FT, FF. There are no other possibilities and no gaps. ⟦s000785-s000792⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🔍", "title": "英語に合わせて設計する", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "Professor's Pro-Tip: The definitions are not arbitrary. The logicians designed each truth table to match one English word, so 'and' maps to the dot and 'or' maps to the wedge. ⟦s000777-s000781⟧"}, {"type": "paragraph", "text": "For 'and' (連言, conjunction), only one of the four rows is true: when both statements are true. Any other row gives false. ⟦s000820-s000825⟧"}, {"type": "paragraph", "text": "For 'or' (包括的選言, inclusive disjunction), three rows are true and only one is false: when both disjuncts are false. Since 'and' and 'or' behave differently in English, their truth tables must differ too. ⟦s000872-s000879⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "真理値表で定義を完成させる", "content_blocks": [{"type": "paragraph", "text": "We learned that each connective is defined by a truth table, which covers all four input combinations and matches an English word. Because every case is covered, a machine can compute any compound statement by following the rules."}, {"type": "paragraph", "text": "Make sure to cover these:"}, {"type": "list", "items": ["The truth table for the triple bar (三本線, biconditional), which the professor called hard to grasp ⟦s000884-s000888⟧", "The systematic row-ordering convention (TT, TF, FT, FF) and why the order matters for consistency"]}, {"type": "paragraph", "text": "Today's lecture started with 論理結合子 and 否定の意味, moved through 英語表現と論理記号の対応, and wrapped up with 真理関数性 and 真理値表 as the foundation for defining each connective."}]}]}, "deep_notes": {"1": "# 1. 論理結合子と否定の意味\n\n論理結合子（logical connectives）は、推論のあらゆる分野で共通して使える表現であり、そのうち真理関数的なもの（truth-functional connectives）は構成要素の真偽によって働きが決まります。否定（negation）は、否定される文の真理値を反転させる操作として捉えられます。\n\n## 🔍 記号と英語表現の対応を考える\n\n講義では、論理結合子を記号の名前と、それが表す論理的操作の両方で整理しました。⟦s000001-s000004⟧ 記号そのものとしては、チルダ（~）、ドット（·）、ウェッジ（∨）、ホースシュー（⊃）、トリプルバー（≡）が挙げられており、これらには論理的な優劣の順序はありません。⟦s000049-s000051, s000060⟧ ただし、チルダは一項結合子（one-place connective）であり一つの単位にだけ付くため上に置かれ、トリプルバーは「if and only if」にあたる複合的な結合子であるため下に置かれている、という配置上の理由はあります。⟦s000052-s000059⟧\n\n英語の対応語を考えるときには、記号を英語の「単語」に機械的に結びつけるのではなく、記号が表す**論理的な操作**に注目することが重要です。⟦s000005, s000042-s000044⟧ 例えば、チルダに対応する最も明白な英語は \"not\" ですが、\"it is false that\" も同じ記号で翻訳されます。⟦s000063, s000074-s000076⟧\n\n## ⚙️ なぜ「not の意味」ではなく「同値」で考えるのか\n\nここで重要なのは、チルダが「not」という単語の意味そのものである、と言い切らないことです。⟦s000067-s000071⟧ \"not\" と \"it is false that\" は厳密には同じ意味ではないため、もしチルダを「not」の意味として定義してしまうと、\"it is false that\" を翻訳に使えなくなり、表現の幅を自ら狭めてしまいます。⟦s000074, s000077-s000082⟧ そこで、英語表現が記号と**論理的同値（logical equivalence）**の関係にあるかどうかで考えます。⟦s000083-s000084⟧\n\n論理的同値の厳密な定義は真理表を扱う段階で与えられますが、ここではまず**言い換え（paraphrase）**として直感をつかむのがよいとされています。⟦s000085-s000091⟧ 言い換えとは、ある文と全く同一ではないものの、その文と同値な表現のことです。⟦s000092-s000093⟧ 同値な表現同士は互いに置き換え可能なので、それらを翻訳に用いることができます。⟦s000094-s000095⟧\n\n### ⚠️ 言い換えと直訳の違い\n\n講義では、ここでの言い換えの説明は後で精密化されると予告されています。⟦s000096-s000098⟧ 英語を記号言語へ翻訳する際には、論理的に同値なものに置き換えるのではなく、英語を記号言語へ**文字どおりに（literally）**翻訳することが求められます。⟦s000099-s000102⟧ 具体的な例は後で示されます。⟦s000103-s000104⟧\n\n## 🆚 \"opposite\" の二つの意味\n\n否定を表す他の英語表現として \"opposite\" が挙がりましたが、この語には二つの異なる意味があるため注意が必要です。⟦s000109-s000110⟧\n\n- **否定としての opposite**：「その事柄ではない」という意味です。⟦s000111, s000118⟧\n- **極性的な opposite（polar opposite）**：北極と南極のように、互いに反対側にあるという意味です。⟦s000112⟧\n\n北極の否定は、北極以外のすべて（南極も含む）です。⟦s000113-s000114⟧ これは集合の補集合（set complement）、つまり集合の外側のすべてに相当します。⟦s000115-s000116⟧ したがって、南極だけを指す極性的な opposite は、否定の意味とは一致しません。⟦s000117⟧ 否定の意味で \"opposite\" を使う場合は、「これは真ではない（is not true）」ということになります。⟦s000118-s000120⟧\n\n## 💡 英語に否定を表す語が少ない理由\n\n講義では、英語に否定を表す語彙が多くない理由について触れられていますが、これは論理的な必然ではなく、言語が発達した歴史的な事情によるものとされています。⟦s000125-s000126, s000140⟧ 例えば、ある言語で雪を表す語が多いのは、生活における必要性の違いによるものであり、そうした偶然の歴史的事情（accidents of history）が語彙を決めるのです。⟦s000134-s000140⟧ 同様に、ある言語に否定を一語で表す単語がなくても、規則を組み合わせて \"it is false that\" のように表現できるはずです。⟦s000141-s000148⟧ その意味で、これらの結合子の働きは普遍的（universal）です。⟦s000149⟧\n\n## 🎯 真理関数的結合子が特別な理由\n\n「なぜこれらだけが論理結合子なのか」という問いに対して、講義では次のように答えられています。⟦s000150-s000155⟧\n\n- **真理関数的結合子は論理結合子の部分集合である**：論理結合子のうち、真理関数的であるものだけが扱われます。⟦s000156-s000158⟧\n- **分野に依存しない**：「football」のような語は特定の分野（領域）の中で現れる専門語ですが、真理関数的な結合子はあらゆる分野で推論に使えます。⟦s000161-s000170⟧\n- **どの分野でも適切に使える**：推論が必要なあらゆる領域で、これらの概念を用いることができます。⟦s000171-s000179⟧\n\n<!-- FIGURE: type=\"diagram\" title=\"論理結合子の分類\" description=\"全体の集合として論理結合子（logical connectives）を大きな円で描き、その内部に真理関数的結合子（truth-functional connectives）を部分集合として配置する。真理関数的結合子の例として、否定（~）、連言（·）、選言（∨）、条件法（⊃）、双条件法（≡）を内部に示し、それぞれが分野に依存せず一般的に使えることを注記する。\" -->\n\n## ⚠️ 連言 \"and\" と \"but\" の関係\n\n連言（conjunction）に当たる記号ドット（·）の最も明白な英
