* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.75; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }

.blk-p { margin: 0; }

.col.gemini .blk-quote { border-left-color: var(--ref); }

.blk-callout.info { background: var(--info-soft); } .blk-callout.warning { background: var(--warn-soft); } .blk-callout.error { background: var(--err-soft); }
.blk-callout .tag { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.blk-callout.info .tag { color: var(--info); } .blk-callout.warning .tag { color: var(--warn); } .blk-callout.error .tag { color: var(--err); }
.blk-list { margin: 0; padding-left: 1.3em; }
.blk-code { display: grid; gap: 4px; }
pre { margin: 0; background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; }
.blk-code .expl { font-size: 13px; color: var(--muted); }
code { font-family: var(--font-mono); font-size: .9em; background: var(--code-bg); border-radius: 4px; padding: 0 4px; }
pre code { background: none; padding: 0; }
.cite { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); background: var(--code-bg); border-radius: 4px; padding: 0 4px; white-space: nowrap; vertical-align: 1px; }
.math { font-family: var(--font-mono); font-size: .92em; color: var(--info); }

.note { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px 14px; min-width: 0; overflow-wrap: anywhere; }
.note h1 { font-family: var(--font-display); font-size: 19px; margin: 14px 0 6px; }
.note h2 { font-family: var(--font-display); font-size: 16.5px; margin: 18px 0 4px; }
.note h3 { font-size: 15px; margin: 14px 0 4px; }
.note p, .note ul, .note ol { margin: 6px 0; }
.note blockquote { margin: 8px 0; border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
.note .figure { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--muted); margin: 8px 0; }
.note table { border-collapse: collapse; font-size: 13.5px; display: block; overflow-x: auto; }
.note th, .note td { border: 1px solid var(--line); padding: 4px 8px; }

.ff { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.ff .t { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.4; }
.ff .h { font-weight: 500; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.col.gemini .ff .h { background: var(--ref-soft); }
.ff .b p { margin: 0 0 10px; }
.ff .src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

"model": "anthropic/claude-haiku-5-5", "reasoning_effort": "low", "max_tokens": 32000, "prompts_used": {"topic_details_generation_prompt.txt": "prompts/v3/topic_details_generation_prompt.txt"}, "code_patches": {}, "lectures": ["666b2c9d-a997-451b-9318-98f98c9d29fa"], "tasks": ["deep_notes"], "wall_seconds_total": 69.6, "token_cost_usd_total": 0.011, "created_at": "20261105_145646"}}, {"name": "v4", "meta": {"mode": "run", "prompt_version": "v4", "model": "anthropic/claude-haiku-5-5", "reasoning_effort": "low", "max_tokens": 32000, "prompts_used": {}, "code_patches": {"rc_cached_service": true}, "lectures": ["a028aad6-07ba-4e3f-ac39-7494e9d7f062"], "tasks": ["review_cards"], "wall_seconds_total": 38.4, "token_cost_usd_total": 0.0072, "created_at": "20261105_152813"}}], "lectures": [{"id": "a028aad6-07ba-4e3f-ac39-7494e9d7f062", "title": "アセンブリ命令とレジスタ演算の基礎", "lang": "English → Japanese", "topics": [{"idx": "1", "title": "レジスタと疑似命令によるアセンブリ入門"}, {"idx": "2", "title": "プログラムの構成と命令の実行"}, {"idx": "3", "title": "算術命令とオペランド"}, {"idx": "4", "title": "レジスタの値交換とアセンブリの利用"}, {"idx": "5", "title": "ビット論理演算とNOTの実現"}], "gemini": {"review_cards": {"1": [{"card_type": "hook", "title": "CPUの「作業台」", "hero_emoji": "🗄️", "content_blocks": [{"text": "前回の講義では、コンピュータシステムがどのように命令セット（instruction set）とレジスタ（register）を使ってプログラムを実行するかを学びましたね。", "type": "paragraph"}, {"text": "レジスタは、CPUが超高速でデータを出し入れできる、まさに**CPU専用の「作業台」**のようなもの！", "type": "quote"}, {"text": "プログラムが動くとき、CPUはメモリから直接計算するのではなく、まず必要なデータをこの「作業台」に持ってきてから処理します。だから、レジスタの使い方は超重要なんです！", "type": "paragraph"}]}, {"card_type": "core_why", "title": "レジスタの二つの顔と疑似命令の理由", "hero_emoji": "🧠", "content_blocks": [{"text": "レジスタには、人間が覚えやすい**英数字名**（例: `T0`, `A0`, `S0`）と、コンピュータが識別するための**番号**（例: `$8`, `$9`）の二つの呼び方があります。どちらを使っても同じレジスタを参照できますが、**名前の方がずっと分かりやすい**ですよね！ ⟦s000029-s000032, s000123-s000132⟧", "type": "paragraph"}, {"text": "シミュレータではレジスタはゼロに初期化されますが、**実際のハードウェアでは初期値は不定**です！ゼロにしたいなら、自分でゼロを代入する必要があります。 ⟦s000001-s000002, s000038-s000041⟧", "type": "callout", "alert_type": "info"}, {"text": "そして、`move`のような命令は、実は**疑似命令（pseudo-instruction）**と呼ばれます。これは、ハードウェアが直接実装している**組み込み命令（built-in instruction）**ではないんです。人間がコードを書きやすくするために作られた「便利機能」のようなものですね！ ⟦s000102-s000104⟧", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "アセンブラの「裏技」: `move`の正体", "hero_emoji": "🎭", "content_blocks": [{"text": "アセンブラ（assembler）は、私たちが書いた疑似命令を、CPUが理解できる**組み込み命令**に「翻訳」する魔法使いです！ ⟦s000105-s000106⟧", "type": "callout", "alert_type": "warning"}, {"text": "例えば、`move T0, $zero`という命令は、アセンブラによって`add $t0, $zero, $zero`という組み込み命令に変換されます。つまり、`T0`に`$zero`レジスタ（常にゼロ）と`$zero`レジスタを足した結果（つまりゼロ）を代入しているんです！ ⟦s000097-s000100, s000112-s000114⟧", "type": "paragraph"}, {"type": "code", "code_string": "move $t0, $zero   # 疑似命令 (Pseudo-instruction)\n# アセンブラがこれを変換する\nadd $t0, $zero, $zero # 組み込み命令 (Built-in instruction)", "explanation": "「移動」という便利な操作は、実は「ゼロを加算する」という組み込み命令で実現されています。 ⟦s000114-s000116, s000157-s000159⟧"}]}, {"card_type": "next_action", "title": "次のステップへ", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、CPUの「作業台」であるレジスタの基本的な使い方と、人間が書きやすい疑似命令がアセンブラによってどのように組み込み命令に変換されるのか、その舞台裏を学びました。", "type": "paragraph"}, {"text": "Curious? Dig into these too:", "type": "paragraph"}, {"type": "list", "items": ["各レジスタ（T, A, Sなど）の具体的な番号マッピング ⟦s000003-s000008, s000116⟧", "`add unsigned`命令における`unsigned`の意味 ⟦s000110⟧"]}, {"text": "さて、アセンブリコードを書く準備が整いましたね！次回は、**プログラムの構成と命令の実行**について深く掘り下げていきます。**データセグメント（.data segment）**や**テキストセグメント（.text segment）**がどのように使われ、**即値（immediate value）**や**即値ロード（load immediate）**が命令レジスタ（instruction register）やプログラムカウンタ（program counter）とどう連携するのか、お楽しみに！", "type": "paragraph"}]}], "2": [{"card_type": "hook", "title": "コードの「住所」", "hero_emoji": "📝", "content_blocks": [{"text": "Hello Worldコードをコピーしたとき、まるでスーツケースに荷物を詰めるように、中身をよく知らないままコードを動かしましたね！", "type": "quote"}, {"text": "アセンブリコードには、大きく分けて2つの「住所」があります。それが **.dataセグメント** と **.textセグメント** です。 ⟦s000181-s000182⟧", "type": "paragraph"}, {"text": "これらは、コードの異なる部分がメモリのどこに格納されるかをアセンブラに伝えるための、大切な目印なんです！", "type": "paragraph"}]}, {"card_type": "core_why", "title": "コードとデータの住み分け", "hero_emoji": "🧠", "content_blocks": [{"text": "アセンブリコードの **.dataセグメント** は、プログラムが使用するデータを格納する場所です。例えば、`Hello World`のような文字列データはここに置かれます。 ⟦s000183, s000293-s000295⟧", "type": "paragraph"}, {"text": "一方、** .textセグメント** は、プログラムの命令（実行されるコード）を格納する場所です。CPUが実際に実行する「指示」がここに並びます。 ⟦s000183, s000292, s000296⟧", "type": "paragraph"}, {"text": "メモリと言えば、主に **RAM（メインメモリ）** を指します。レジスタも技術的にはメモリですが、非常に特殊なクラスなので「レジスタ」と呼び分けます。 ⟦s000185-s000186⟧", "type": "callout", "alert_type": "info"}, {"text": "そして、今日学んだ重要な命令が **load immediate (即値ロード)** です！これは、指定された **即値（immediate value）**、つまり定数を、宛先レジスタに直接ロードする命令です。 ⟦s000187-s000188, s000217-s000220⟧", "type": "paragraph"}, {"type": "code", "code_string": "li t1, 34 # t1レジスタに即値34をロード", "explanation": "この命令は、レジスタt1に定数34を格納します。 ⟦s000202-s000204⟧"}]}, {"card_type": "gotcha", "title": "即値の落とし穴と実行順序", "hero_emoji": "💡", "content_blocks": [{"text": "ここが重要！ `load immediate`で10進数の「34」を指定しても、レジスタにはその16進数表現である「22」が格納されます！ ⟦s000259-s000260⟧", "type": "callout", "alert_type": "warning"}, {"text": "普段は10進数で考えがちですが、CPU内部ではすべてがバイナリ（そして表示上は16進数）で扱われます。この変換から逃れることはできません！ ⟦s000260-s000261⟧", "type": "paragraph"}, {"text": "また、アセンブリ命令は書かれた順序で実行されます。これは非常に重要で、プログラムの動作を決定します。 ⟦s000266, s000270, s000272-s000273⟧", "type": "paragraph"}, {"text": "コメントアウトは `#` (ハッシュタグ) を使います。これ以降の行はアセンブラに無視されます。 ⟦s000262-s000263⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "次のステップへ！", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、アセンブリコードがデータと命令に分かれていること、そして`load immediate`命令を使って定数をレジスタに格納する方法を学びました。特に、値が内部で16進数として扱われる点が重要でしたね。", "type": "paragraph"}, {"text": "Curious? Dig into these too:", "type": "paragraph"}, {"type": "list", "items": ["10進数「34」を16進数「22」に変換する詳細な手順 ⟦s000223-s000232⟧", "プログラムカウンタが命令の実行後にどのようにインクリメントされるか ⟦s000279-s000282⟧", ".dataや.textセグメントを省略した場合のアセンブラの挙動 ⟦s000303-s000308⟧"]}, {"text": "さて、レジスタに値をロードする方法は分かりましたが、これらの値を使って実際に計算するにはどうすればいいのでしょうか？次回は、**算術命令（add instruction）** や **即値加算命令（add immediate）** といった **オペコード（opcode）** を使って、**オペランド（operand）** を操作する **算術論理演算装置（ALU）** の世界に飛び込みます！", "type": "paragraph"}]}], "3": [{"card_type": "hook", "title": "レジスタのダンス", "hero_emoji": "⚙️", "content_blocks": [{"text": "CPUのレジスタ（register）は、まるで一時的な付箋のよう！命令は、これらの付箋に値を書き込んだり、別の付箋に移動させたりして、データを素早く操ります。まずは、その基本の「ダンス」を見てみましょう！", "type": "paragraph"}, {"type": "code", "code_string": "li T1, 34      # T1に16進数22 (10進数34)をロード\nmove T0, T1    # T1の内容をT0にコピー", "explanation": "`li` (load immediate)は即値（immediate value）をレジスタにロードし、`move`はレジスタ間で値をコピーします。常に**デスティネーション（destination）が最初**に来るのがポイント！ ⟦s000322-s000324, s000384-s000386⟧"}]}, {"card_type": "core_why", "title": "`add`命令の心臓部", "hero_emoji": "➕", "content_blocks": [{"text": "アセンブリ言語（assembly language）で数値を足し算するには、`add`命令を使います。これは、CPUの**ALU (Arithmetic Logic Unit)**に「足し算してね！」と指示する魔法の呪文のようなものです。 ⟦s000526-s000527⟧", "type": "paragraph"}, {"text": "アセンブリ命令の多くは、結果を格納する**デスティネーションレジスタ（destination register）**が常に最初に指定されます。これは超重要！ ⟦s000385-s000386, s000463-s000466⟧", "type": "callout", "alert_type": "info"}, {"type": "code", "code_string": "add T2, T0, T3  # T0とT3の内容を足し、結果をT2に格納", "explanation": "この命令は、T0レジスタとT3レジスタの値を足し合わせ、その合計をT2レジスタに格納します。 ⟦s000357-s000361, s000418-s000422⟧"}]}, {"card_type": "gotcha", "title": "`add`と`addi`の秘密", "hero_emoji": "💡", "content_blocks": [{"text": "`add`命令は、**2つのレジスタ**の値を足し合わせるのに使います。でも、「レジスタの値に直接定数を足したい！」という時もありますよね？そんな時に登場するのが`addi`命令です！ ⟦s000506-s000507, s000517-s000523⟧", "type": "paragraph"}, {"text": "`addi`の 'i' は「**即値（immediate value）**」の 'i'！これは、レジスタではなく、命令自体に埋め込まれた定数値を意味します。 ⟦s000484-s000485, s000496-s000497⟧", "type": "callout", "alert_type": "warning"}, {"type": "code", "code_string": "addi T4, T1, 1  # T1の内容に定数1を足し、結果をT4に格納", "explanation": "この命令は、T1レジスタの値に直接1を足し、その結果をT4レジスタに格納します。`li` (load immediate)も同様に即値を使いますね！ ⟦s000482-s000483, s000498-s000501⟧"}, {"text": "命令の各部分は、`add`や`addi`のような「**ニーモニック（mnemonic）**」（操作コードの覚えやすい名前）、そして操作の対象となる「**オペランド（operand）**」と呼ばれます。デフォルトでは、オペランドはすべてレジスタですが、`addi`のように即値を使う場合は 'i' が付きます。 ⟦s000526, s000529, s000547-s000548⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "次のステップへ", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、アセンブリ言語における基本的なレジスタ操作と算術命令、特に`add`と`addi`の違い、そして即値の概念を学びました。デスティネーションレジスタが常に最初に来るというルールも押さえましたね！", "type": "paragraph"}, {"text": "自己学習リスト:", "type": "paragraph"}, {"type": "list", "items": ["様々な`li`, `move`, `add`命令の組み合わせにおける**レジスタ値の具体的な変化**をステップ実行で追跡する練習 ⟦s000390-s000406, s000434-s000446⟧"]}, {"text": "さて、レジスタの値を交換する（register swapping）ような、もっと複雑な操作はどうすればいいのでしょう？一時記憶（temporary storage）や、一時レジスタ規約（temporary-register convention）、保存レジスタ規約（saved-register convention）といった概念が、アセンブリ言語（assembly language）やコンパイラ最適化（compiler optimization）においてどのように役立つのか、次回詳しく見ていきましょう！", "type": "paragraph"}]}], "4": [{"card_type": "hook", "title": "レジスタ交換チャレンジ！", "hero_emoji": "🤝", "content_blocks": [{"text": "T0とT1の値を交換するコードを書いてみよう！高レベル言語なら一瞬だけど、アセンブリではどうなるかな？", "type": "quote"}, {"text": "プログラミングでよくある「2つの変数の値を交換する」というシンプルなタスク。高レベル言語（High-level language）なら簡単ですが、アセンブリ言語（Assembly language）の世界では、ちょっとしたパズルになります。⟦s000553-s000554⟧", "type": "paragraph"}]}, {"card_type": "core_why", "title": "アセンブリの「なぜ」", "hero_emoji": "⚙️", "content_blocks": [{"text": "高レベル言語で簡単にできることが、アセンブリでは**多くの命令に分解**されます。これがアセンブリの**冗長性（verbose）**です。⟦s000564-s000565⟧", "type": "paragraph"}, {"text": "だから、大規模なシステム開発には高レベル言語が向いています。アセンブリは、**小さな最適化（optimization）**や**セキュリティ（security）**の分析、ファームウェア（firmware）のような**メモリが非常に限られた環境**で力を発揮します。⟦s000574-s000585⟧", "type": "paragraph"}, {"text": "現代では、コンパイラ（compiler）が非常に賢くなったため、アセンブリによる手動最適化の必要性は減っています。しかし、システムを深く理解するためには不可欠です！⟦s000592-s000598⟧", "type": "callout", "alert_type": "info"}]}, {"card_type": "gotcha", "title": "レジスタ交換の落とし穴", "hero_emoji": "🤯", "content_blocks": [{"text": "T0とT1の値を交換しようとして、こんなコードを書いていませんか？", "type": "paragraph"}, {"type": "code", "code_string": "move T1, T0 # T1にT0の値を移動\nmove T0, T1 # T0にT1の値を移動", "explanation": "これだと、T1の元の値が失われてしまいます！"}, {"text": "レジスタの値を直接移動すると、**元の値が上書きされて消えてしまう**のが落とし穴！一時的に値を保存する場所が必要です。⟦s000555-s000562, s000650-s000657⟧", "type": "callout", "alert_type": "warning"}, {"text": "正解は、**一時レジスタ（temporary register）**を一つ使うこと！これで3つのレジスタと3つの命令で安全に交換できます。⟦s000660-s000663⟧", "type": "paragraph"}, {"type": "code", "code_string": "move T2, T1 # T1の値をT2に一時保存\nmove T1, T0 # T0の値をT1に移動\nmove T0, T2 # T2（元のT1の値）をT0に移動", "explanation": "これでT0とT1の値が正しく交換されます！"}]}, {"card_type": "next_action", "title": "次のステップへ！", "hero_emoji": "🚀", "content_blocks": [{"text": "今回は、アセンブリ言語でのレジスタ値交換の課題を通して、低レベルプログラミングの複雑さと、高レベル言語との違いを学びました。一時レジスタを使うことで、見かけよりも多くの命令が必要になることが分かりましたね。", "type": "paragraph"}, {"text": "さらに深く掘り下げたいなら、これらをチェック！", "type": "paragraph"}, {"type": "list", "items": ["コンパイラの進化とパイプライン処理がアセンブリの役割に与えた影響の具体的な議論 ⟦s000603-s000626⟧", "TレジスタとSレジスタの**レジスタ使用規約（register convention）**の詳細 ⟦s000688-s000691⟧"]}, {"text": "さて、レジスタの値を交換するだけでなく、ビット単位で操作するにはどうすればいいのでしょうか？次回は、**AND演算（AND operation）**や**OR演算（OR operation）**といった**ビット論理演算（Bitwise Logical Operation）**の世界に飛び込み、**NOT演算（NOT operation）**がどのように実現されるのかを探ります！", "type": "paragraph"}]}], "5": [{"card_type": "hook", "title": "ビットの魔法使い！", "hero_emoji": "💡", "content_blocks": [{"text": "論理演算は、まるでビットを操る魔法！AND、OR、XORでデータを自在に組み合わせたり、NOTでひっくり返したり。デジタル世界の基本中の基本だよ。", "type": "quote"}, {"text": "CPUは、レジスタ内の個々のビットを直接操作する命令を持っているんだ。これらは、条件分岐やデータマスク処理など、プログラムの「もしも」を判断するために欠かせないツールだよ。", "type": "paragraph"}]}, {"card_type": "core_why", "title": "CPUの「もしも」スイッチ", "hero_emoji": "⚙️", "content_blocks": [{"text": "CPUは、ANDやORといった**論理演算命令**（logical instructions）を使って、レジスタ（register）内のビットを直接操作するよ。これらは、条件分岐やデータマスク処理など、プログラムの**「もしも」を判断する**ための超重要ツールなんだ。⟦s000718⟧", "type": "paragraph"}, {"text": "例えば、`AND T3, T1, T0` は、T1とT0の各ビットをAND演算して、結果をT3に入れるよ。これは `T3 = T1 & T0` と同じ意味だね。⟦s000723-s000724⟧", "type": "paragraph"}, {"type": "code", "code_string": "AND destination_register, source_register1, source_register2\nOR  destination_register, source_register1, source_register2", "explanation": "ANDやOR命令は、宛先レジスタ（destination register）と2つのソースレジスタ（source register）という3つのオペランド（operand）を取るよ。⟦s000723-s000727⟧"}, {"text": "ORも同じ構造で、`OR T3, T1, T0` なら `T3 = T1 | T0` になるんだ。これらの命令は、CPUの**算術論理演算装置**（Arithmetic Logic Unit, ALU）が担当するよ。⟦s000725-s000736⟧", "type": "paragraph"}]}, {"card_type": "gotcha", "title": "NOT命令の意外な真実！", "hero_emoji": "🤯", "content_blocks": [{"text": "「NOT演算（NOT operation）は、実は組み込み命令（built-in instruction）じゃない！」⟦s000753⟧", "type": "callout", "alert_type": "warning"}, {"text": "CPUの設計者は、オペコード（opcode）のビットを節約するために、NOT命令を直接実装しなかったんだ。じゃあ、どうやってNOTを実現するかって？秘密兵器は**NOR命令**（NOR instruction）だよ！⟦s000754-s000756⟧", "type": "paragraph"}, {"text": "NOR命令は2つのソースレジスタのNOR演算結果をデスティネーションレジスタに入れる。つまり `Dest = ~(Src1 | Src2)` だね。⟦s000757-s000758⟧", "type": "paragraph"}, {"text": "このNORを使ってNOTを作るには、どうすればいいと思う？答えは、**片方のソースレジスタをゼロレジスタ（zero register）にすること！**⟦s000762⟧", "type": "paragraph"}, {"type": "code", "code_string": "NOR T3, T1, $zero", "explanation": "`NOR T3, T1, $zero` と書くと、`T3 = ~(T1 | 0)` となり、`T3 = ~T1` と同じ結果になるんだ！⟦s000763⟧"}, {"text": "もう一つの方法として、`NOR T3, T1, T1` もあるよ。`T3 = ~(T1 | T1)` なので、これも `T3 = ~T1` になるね！⟦s000765-s000766⟧", "type": "paragraph"}, {"text": "実際のMIPSアセンブリでは、`NOR T3, T1, $zero` の形式が使われることが多いよ。ゼロレジスタは常に0なので、NOT演算をスマートに実現できるんだ。⟦s000772-s000777⟧", "type": "paragraph"}]}, {"card_type": "next_action", "title": "今日を振り返る！", "hero_emoji": "🎓", "content_blocks": [{"text": "今日は、AND、OR、XORといった基本的なビット論理演算命令と、特に組み込み命令ではないNOTをNOR命令で賢く実現する方法を学んだね。", "type": "paragraph"}, {"text": "Curious? Dig into these too:", "type": "paragraph"}, {"type": "list", "items": ["NOT演算における**ビット表現**（binary representation）と**16進数**の具体的な変換ステップ ⟦s000829-s000849⟧", "論理演算を使った**ラボ課題**の具体的な実装 ⟦s000806-s000823⟧"]}, {"text": "今日の講義では、まず**レジスタと疑似命令**によるアセンブリの基礎を固め、**プログラムの構成と命令の実行**、そして**算術命令とオペランド**について深く掘り下げたね。さらに、**レジスタの値交換とアセンブリの利用**を学び、最後に今回の**ビット論理演算とNOTの実現**で、アセンブリ言語の強力な表現力を実感できたんじゃないかな。これで今日の講義は終わり！お疲れ様！", "type": "paragraph"}]}]}, "deep_notes": {"1": "## 🔍 レジスタの基本\n\nレジスタ（register）は、CPUが計算やデータ保存に使用する高速なメモリです。シミュレータ上ではほとんどのレジスタがゼロに初期化されますが、実際のハードウェアでは以前の値が残っているため、コード内でゼロであることを前提とすべきではありません。⟦s000001-s000002, s000038-s000040⟧ 唯一、**ゼロレジスタ（zero register）**だけは常にゼロの値を保持します。⟦s000002-s000003, s000050-s000052, s000073-s000075⟧ したがって、レジスタをゼロで初期化したい場合は、明示的にゼロを設定する必要があります。⟦s000041-s000042⟧\n\n### 主要なレジスタの種類\n\nアセンブリ言語プログラミングでは、特定の役割を持つレジスタが頻繁に使用されます。\n\n*   **Tレジスタ（Temporary Register）**: `$t0`, `$t1`, `$t2` などがあり、一時的な計算に使用されます。これらはプロシージャ（procedure）、メソッド（method）、または関数（function）の本体で頻繁に利用されます。⟦s000003, s000007⟧\n*   **Aレジスタ（Argument Register）**: `$a0`, `$a1`, `$a2`, `$a3` などがあり、プロシージャや関数の引数（argument）として使用されます。⟦s000004-s000006⟧\n*   **Sレジスタ**: `$s0`, `$s1`, `$s2` などがあり、グローバル変数（global variable）のような役割を果たします。⟦s000008⟧\n*   その他にも、`$t8`, `$t9`, `$k0`, `$k1`, `$gp`, `$fp`, `$ra`, `$pc`, `$at` など、様々なレジスタが存在し、計算やその他の目的に使用されます。⟦s000009-s000015⟧\n\n### レジスタの識別方法\n\nレジスタを参照する方法は主に2つあります。\n\n1.  **英数字の名前**: `$t0` のように、ドル記号と英数字の組み合わせで指定します。⟦s000030⟧\n2.  **番号**: `$0` や `$8` のように、ドル記号と数字の組み合わせで指定します。例えば、`$t3` は番号 `11` で参照できます。⟦s000031-s000032⟧\n\n学生が混同しやすい点として、レジスタの**値（value）**と**識別番号（identifying number）**があります。レジスタの識別番号は、そのレジスタを特定するためのインデックス（index）であり、レジスタに格納されている実際のデータ（値）とは異なります。⟦s000027-s000028, s000034-s000036, s000118-s000122⟧\n\nプログラミングにおいては、番号よりも英数字の名前を使用する方が一般的です。名前は「一時レジスタ0（temporary zero）」や「引数レジスタ0（argument zero）」のように意味を持つため、人間にとって覚えやすく、間違いを減らすことができます。⟦s000124-s000132, s000162-s000166⟧ アセンブラ（assembler）は、これらの名前を対応する番号に簡単にマッピング（変換）できます。⟦s000167-s000169⟧\n\n## ⚙️ 疑似命令（Pseudo-Instruction）の仕組み\n\nアセンブリ言語には、ハードウェアが直接実行できる**組み込み命令（built-in instruction）**と、アセンブラによって組み込み命令に変換される**疑似命令（pseudo-instruction）**の2種類があります。\n\n### 疑似命令とは\n\n疑似命令は、ハードウェアに専用のオペコード（opcode）や実装が組み込まれていない命令です。⟦s000102, s000105, s000153-s000154⟧ これらは、プログラマがアセンブリコードをより直感的で読みやすくするために作成されたもので、**マクロ（macro）**とも呼ばれます。⟦s000103-s000104⟧\n\nアセンブラは、ソースコードをバイナリコード（binary code）に変換する際に、これらの疑似命令を1つまたは複数の対応する組み込み命令に展開（マップ）します。⟦s000105-s000107⟧ ハードウェア設計者は、既存の組み込み命令の組み合わせで実現できる機能のために、わざわざ新しいハードウェア機能を実装する必要がないため、疑似命令が活用されます。⟦s000153-s000159⟧\n\n## 💡 例: `move` 疑似命令\n\n`move` 命令は、疑似命令の典型的な例です。例えば、`move $t0, $zero` という命令は、レジスタ`$t0`にゼロレジスタ`$zero`の値を移動させる（つまり`$t0`をゼロで初期化する）ことを意図しています。⟦s000049, s000053, s000072, s000076⟧\n\nこの`move`疑似命令は、アセンブラによって次のような組み込み命令に変換されます。\n\n```assembly\nadd unsigned $t0, $zero, $zero\n```\n⟦s000099-s000100, s000110-s000112⟧\n\nこの `add unsigned` 命令は、2つのソースレジスタ（ここでは両方とも`$zero`）の値を加算し、その結果をデスティネーションレジスタ（destination register）である`$t0`に格納します。⟦s000112-s000113⟧ `$zero`レジスタの値は常にゼロなので、`0 + 0 = 0` が計算され、その結果の`0`が`$t0`に格納されます。⟦s000113-s000114⟧ これにより、`move`命令が意図した「`$t0`に0を代入する」という機能が、`add unsigned`という既存の組み込み命令で実現されます。⟦s000114-s000116, s000150, s000159⟧\n\nレジスタの識別方法の柔軟性を示すために、`move $t0, $zero` はレジスタ番号を使って `move $8, $0` と記述することも可能です。どちらの形式で記述しても、アセンブラは同じバイナリコードを生成します。⟦s000134-s000140⟧ また、`move $t0, $t1` のように、`$t1`の値を`$t0`に移動させる場合も、アセンブラはこれを `add unsigned $8, $zero, $9` （`$t0`はレジスタ番号8、`$t1`はレジスタ番号9）に変換します。これは、`$t1`の値に`$zero`の値を加算しても`$t1`の値は変わらないため、結果的に`$t1`の値が`$t0`にコピーされることになります。⟦s000144-s000150⟧\n\n## 🎯 主要なポイント\n\n*   **レジスタの役割**: レジスタはCPUが高速にアクセスできるメモリであり、計算やデータの一時保存に不可欠です。ゼロレジスタは常にゼロを保持し、他のレジスタは初期化しない限り不定値です。⟦s000001-s000003, s000040-s000041⟧\n*   **レジスタの参照**: レジスタは英数字の名前（例: `$t0`）と番号（例: `$8`）の両方で参照できます。人間にとっては名前の方が覚えやすく、コードの可読性と保守性が向上します。⟦s000124-s000132, s000162-s000166⟧\n*   **疑似命令の機能**: 疑似命令は、ハードウェアに直接実装されていない命令ですが、アセンブラによって1つ以上の組み込み命令に変換されます。これにより、プログラマはより直感的で人間が理解しやすいアセンブリコードを記述でき、ハードウェアの複雑さを増すことなく高度な機能を実現できます。⟦s000103-s000107, s000151-s000159⟧", "2": "__SKIPPED_PLAN_LIMIT__", "3": "__SKIPPED_PLAN_LIMIT__", "4": "__SKIPPED_PLAN_LIMIT__", "5": "__SKIPPED_PLAN_LIMIT__"}, "fun_facts": {"title": "x86 CPUの秘密の翻訳者 🤫", "hook": "あなたが書いたプログラムの命令が、実はCPUによって内部でまったく別の「マイクロ命令」に分解されて実行されていることをご存知でしたか？", "body": "今日学んだ疑似命令の概念は、なんと現代のx86 CPUの内部でも、驚くべきハードウェアレベルで息づいているのです。\n\nかつて複雑な命令セット（CISC）で知られたIntelのx86プロセッサは、実は内部でこれらの複雑な命令を、より単純なRISCのような「マイクロオペレーション（uOps）」にリアルタイムで分解しているのです。\n\nこれは、プログラマーが書いた高レベルの命令を、CPUが効率的に実行できる内部形式に「コンパイル」する、ハードウェアによる疑似命令の拡張レイヤーのようなものと言えます。\n\nこの変換は「マイクロオペレーションキャッシュ（Micro-op cache）」と呼ばれる高速な内部メモリによって加速され、CPUはまるで命令セット自体が「疑似言語」であるかのように扱います。\n\nあなたが書いたコードは、見えないところでさらに最適化され、驚くべき速さで動いている。これはまさに、ハードウェアが提供する究極の抽象化なのです。", "metadata": null, "created_at": "2026-10-06T19:53:32.924229+00:00"}}, "haiku": {"v0": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🛠️", "title": "The Workbench Begins", "content_blocks": [{"type": "paragraph", "text": "前回は、人が読むアセンブリ言語が機械語のビット列に変換されて実行される流れを見ました。今回は、その作業台であるレジスタを覗いてみましょう。"}, {"type": "quote", "text": "Registers are the CPU's workbench: small, fast spots where every calculation actually happens, and you have to know what's already sitting on it!"}]}, {"card_type": "core_why", "hero_emoji": "🧠", "title": "The Desk, Not the Warehouse", "content_blocks": [{"type": "paragraph", "text": "Only the **zero register** is guaranteed to be zero, and the others are your own workspace. The T registers are for temporary work, A registers are for passing arguments to procedures, and S registers act like global variables. ⟦s000001-s000008⟧"}, {"type": "callout", "alert_type": "info", "text": "Every register has two names: a **number** (like 8) and a **word name** (like T0). Both point to the same register, and the name is the one humans should read and write. ⟦s000029-s000032⟧"}, {"type": "code", "language": "mips", "code_string": "move $t0, $zero   # assign zero to T0\n# is the same as: $8 = $zero", "explanation": "Zero is always the value in the zero register, so this line initializes T0 to 0. ⟦s000049-s000053⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🎭", "title": "move Is Really add", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "**move is not a real hardware instruction!** It is a pseudo-instruction (macro) that the assembler rewrites into an add. ⟦s000079-s000080⟧⟦s000102-s000106⟧"}, {"type": "paragraph", "text": "The line that looked like a move gets turned into add unsigned: T0 = zero + zero, which gives 0. Hardware designers never built a dedicated move circuit because add can already do the job. ⟦s000098-s000099⟧⟦s000112-s000114⟧⟦s000152-s000159⟧"}, {"type": "paragraph", "text": "Real hardware also won't clean up for you. Those registers keep whatever old value they had, so you must initialize them yourself. ⟦s000040-s000041⟧⟦s000043-s000045⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Own Your Registers", "content_blocks": [{"type": "paragraph", "text": "We learned that registers are the CPU's scratch desk, that you should write their names instead of numbers, and that move is secretly an add. Always set your starting values, because the hardware won't do it for you."}, {"type": "paragraph", "text": "Curious? Dig into these too:"}, {"type": "list", "items": ["The roles of the other special registers: K0, K1, GP, FP, RA, PC, and AT", "The unsigned version of add and why it's named that way", "How the assembler expands pseudo-instructions step by step into binary code"]}, {"type": "paragraph", "text": "Next, we'll move from registers into how a program is laid out in memory, with the .data and .text segments, and how values like immediate values get loaded. We'll see where the program counter and instruction register fit in!"}]}], "2": [{"card_type": "hook", "hero_emoji": "🧳", "title": "中身を知らずに詰めるスーツケース", "content_blocks": [{"type": "quote", "text": "今はよくわからないままコードを打ち込んでOK。スーツケースに何を入れたか知らなくても、旅の途中で必ず中身がわかる時が来る！"}, {"type": "paragraph", "text": "最初は『なぜこう書くのか』が見えなくても問題ありません。ひとつずつ動かしていくうちに、打ち込んだ一行一行の意味が自然とつながっていきます。"}]}, {"card_type": "core_why", "hero_emoji": "🏗️", "title": "メモリは『命令』と『データ』の二部屋構成", "content_blocks": [{"type": "paragraph", "text": "アセンブリのプログラムは、`.data`と`.text`という2つのセグメントに分かれています。`.data`はデータをメモリに置くための場所で、`.text`は命令をメモリに置くための場所です。⟦s000181-s000183⟧"}, {"type": "callout", "alert_type": "info", "text": "ここでいうメモリはRAM（主記憶）のことで、命令もデータもまずはこのRAMに並んで置かれます。レジスタは技術的にはメモリの一種ですが、特別な場所として区別して扱います。⟦s000185-s000186⟧"}, {"type": "code", "language": "asm", "code_string": ".data\n    # 文字列などのデータをメモリに置く\n.text\n    # ここから下が命令（コード）", "explanation": "`.data`の下がデータ、`.text`の下が命令という目印です。⟦s000292-s000293⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚡", "title": "10進数の34が22で届く理由と、CPUの実行順", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "数値を指定しない限り、即値（immediate）は10進数として扱われます。`34`と書けば10進数の34であり、レジスタに入った結果は16進数で表示すると`22`になります。⟦s000197-s000199⟧⟦s000258-s000260⟧"}, {"type": "paragraph", "text": "`load immediate`は、指定した即値を行き先のレジスタ（この例ではT1）に入れる命令です。ここでの即値は、高級言語でいう定数だと思うとイメージしやすくなります。⟦s000187-s000188⟧⟦s000216⟧"}, {"type": "paragraph", "text": "CPUは、プログラムカウンタが指す命令を命令レジスタに読み込み、実行し終わったらプログラムカウンタを1つ進めて次の命令へ進みます。だから命令の順番は結果に直接関わります。⟦s000276-s000279⟧⟦s000280-s000282⟧"}, {"type": "paragraph", "text": "`#`はコメントの始まりで、その行の残りを無視させるための記号です。ここでは`//`ではなく`#`を使う点に注意してください。⟦s000262-s000263⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "次の一歩と寄り道リスト", "content_blocks": [{"type": "paragraph", "text": "今回は、コードが『データ』と『命令』に分けてメモリに置かれること、そしてCPUが命令を1つずつ順番に実行することを学びました。ここで出てきた即値（immediate）が、次の話題の鍵になります。"}, {"type": "paragraph", "text": "今回は深く扱わなかった内容も、興味があればぜひ自分で調べてみてください。"}, {"type": "list", "items": ["10進数から16進数への変換計算（34を16進数にする手順）⟦s000223-s000232⟧", "分岐（branch）とループによる、プログラムカウンタの飛び越え⟦s000284-s000285⟧", "レジスタとメモリ（RAM）の具体的な違いと役割の差⟦s000185-s000186⟧"]}, {"type": "paragraph", "text": "次は、加算命令（add instruction）で2つの値を足す仕組みに進みます。さらに即値加算命令（add immediate）では、今回の即値がどのように命令の中へ組み込まれるのかが見えてきますよ！"}]}], "3": [{"card_type": "hook", "hero_emoji": "📝", "title": "書類の宛先欄は一番上", "content_blocks": [{"type": "quote", "text": "アセンブリの命令は『どこに入れるか』を一番最初に書く、宅配便の伝票のような世界です。"}, {"type": "paragraph", "text": "CPUは命令を一行ずつ読むだけなので、書き方のルールを外すと一気に迷子になります。まずは『宛先はいつも先頭』というお約束をつかみましょう。"}]}, {"card_type": "core_why", "hero_emoji": "🧮", "title": "add と addi の仕組み", "content_blocks": [{"type": "paragraph", "text": "まず 即値 (immediate value) を使ってレジスタに値を入れます。ここでは 10進数の 34 と 16進数の 22 が同じ値として扱われます。 ⟦s000399⟧"}, {"type": "paragraph", "text": "足し算の基本形は『宛先, ソース1, ソース2』です。たとえば T2 にゼロレジスタと T3 の和を入れると、T2 は 0 + T3 の結果になります。 ⟦s000374⟧⟦s000375⟧"}, {"type": "callout", "alert_type": "info", "text": "add i は最後のオペランドに定数を取る命令です。たとえば T4 に T1 + 1 を入れるなら、末尾の 1 が即値になります。 ⟦s000477⟧⟦s000499⟧"}, {"type": "code", "language": "asm", "code_string": "add  T2, zero, T3   # T2 = 0 + T3\naddi T4, T1, 1      # T4 = T1 + 1（即値）", "explanation": "ニーモニックは add と addi（add i）で、後者が定数を取る。 ⟦s000480⟧⟦s000526⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🚨", "title": "宛先の取り違えと即値の制約", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "最初に書くのは必ず宛先です。ソースと宛先を逆に読むと、移動の向きが反対になってしまいます。 ⟦s000383⟧⟦s000385⟧⟦s000460⟧⟦s000461⟧"}, {"type": "paragraph", "text": "教授が実際に書き間違えたのが『3』と『T3』の違いです。レジスタ名の T を忘れると、レジスタではなく定数として解釈されて計算結果が変わってしまいます。 ⟦s000365⟧⟦s000366⟧"}, {"type": "paragraph", "text": "即値は二つ同時には使えません。『3 + 5』のように定数同士を足す命令はないので、一方は必ずレジスタにしておく必要があります。 ⟦s000507⟧⟦s000513⟧⟦s000516⟧"}, {"type": "paragraph", "text": "ステップ実行は、どのレジスタにどの値が入ったかを確かめる最強の手段です。試験でも『この命令の後にレジスタに何が入っているか』はよく問われると言われています。 ⟦s000407⟧⟦s000408⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "命令の読み方を完成させよう", "content_blocks": [{"type": "paragraph", "text": "今回は、宛先を先頭に置く命令の書き方と、add と add i（即値）の違いを学びました。命令は『ニーモニック（オペコード）+ オペランド』という構造で読むと理解しやすくなります。"}, {"type": "paragraph", "text": "Make sure to cover these:"}, {"type": "list", "items": ["浮動小数点数（floating point）を扱う命令は、今回は扱わず後の話題として先送りされています ⟦s000502⟧⟦s000505⟧", "マクロ命令（macro instructions）とビルトイン命令の一覧は、講義ノートで確認するのがおすすめです ⟦s000332⟧⟦s000341⟧", "命令がどのようにバイナリで表現されるかは、今回は深入りしていません ⟦s000385⟧"]}, {"type": "paragraph", "text": "次は レジスタ値の交換（register swapping） を扱います。一つのレジスタの値を別のレジスタに移すとき、一時記憶（temporary storage） がどう役立つのか、そして一時レジスタ規約（temporary-register convention） や 保存レジスタ規約（saved-register convention） がどう関わるのかを見ていきましょう。"}]}], "4": [{"card_type": "hook", "hero_emoji": "☕", "title": "カップ交換パズル", "content_blocks": [{"type": "quote", "text": "2つのレジスタの中身を入れ替えるのは、空のカップが1個もない状態で2人のコーヒーを交換するようなものです！"}, {"type": "paragraph", "text": "まずは「T0とT1の値を入れ替えよう」というお題に挑戦してみましょう。紙に書いて考えるだけでも、意外な落とし穴が見えてきます。"}]}, {"card_type": "core_why", "hero_emoji": "🧺", "title": "第三のレジスタが救世主", "content_blocks": [{"type": "paragraph", "text": "2つのレジスタだけでは交換できません。一方を先に上書きすると、もう一方の元の値が消えてしまうからです。 ⟦s000652⟧⟦s000661⟧"}, {"type": "callout", "alert_type": "info", "text": "解決策は3ステップ！①避難させる、②上書きする、③避難先から戻す。これだけで交換は完成します。 ⟦s000664-s000665⟧"}, {"type": "code", "language": "mips", "code_string": "move $t2, $t1   # T1の値を一時避難\nmove $t1, $t0   # T0の値をT1へ\nmove $t0, $t2   # 避難した値をT0へ", "explanation": "第三のレジスタT2を退避用に使う、最短の交換パターンです。 ⟦s000660⟧⟦s000697⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "上書きの罠と使い分け", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "moveを2回だけ使うと、1回目で消えた値は二度と戻りません。「先に退避する」という発想が、この問題の核心です！ ⟦s000655-s000657⟧"}, {"type": "paragraph", "text": "退避用のレジスタを自由に使ってよいのは、Tレジスタが「壊してもよい」前提で使われるからです。 ⟦s000688-s000689⟧"}, {"type": "paragraph", "text": "一方、Sレジスタは「元の値に戻す」約束があります。今は気にしなくてよいですが、ここがとても重要なポイントになります。 ⟦s000690-s000691⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次のステップへ挑戦", "content_blocks": [{"type": "paragraph", "text": "今回は、2つのレジスタを交換するには第三のレジスタで値を一時避難する必要があることを学びました。テスト値を使って動作を確かめるのも大切な習慣です。"}, {"type": "paragraph", "text": "さらに深く知りたい人は、次のトピックも気にしてみてください。"}, {"type": "list", "items": ["アウトオブオーダー実行(out-of-order execution)が生まれた歴史的経緯とコンパイラの進歩", "関数呼び出しの際にSレジスタを元に戻す約束事(saved registers)の詳細", "ハノイの塔のパズルと今回の交換手順の対応関係"]}, {"type": "paragraph", "text": "ところで、CPUはAND、OR、XOR、NOTといったビット単位の計算をどうやって実現しているのでしょう？次回は、ビット論理演算とNOTの仕組みに迫ります！"}]}], "5": [{"card_type": "hook", "hero_emoji": "🔀", "title": "ビットの交通整理", "content_blocks": [{"type": "quote", "text": "CPUにとって、ビットは一つひとつが小さな信号機。ANDもORも、その信号機の組み合わせを読み替えるだけの仕事です。"}, {"type": "paragraph", "text": "数値をそのまま足したり引いたりするだけでなく、ビット単位で『両方オン？』『どちらかオン？』と判定する命令があります。今日はその仲間たちを使っていきます。"}]}, {"card_type": "core_why", "hero_emoji": "🧩", "title": "NOTがいない理由", "content_blocks": [{"type": "paragraph", "text": "AND や OR は組み込みの命令として用意されています。一方で、ビットを反転する **NOT** は専用の命令としては存在しません。 ⟦s000737-s000741⟧"}, {"type": "paragraph", "text": "理由は、オペコード（opcode）のビットを節約するという設計判断です。そのかわりに **NOR** 命令があり、2つの入力の OR を取ってさらに反転します。 ⟦s000753-s000758⟧"}, {"type": "code", "language": "asm", "code_string": "nor $t3, $t1, $zero   # $t3 = NOT $t1", "explanation": "一方の入力をゼロレジスタにすると、NOR は NOT と同じ働きになります。 ⟦s000759-s000763⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚡", "title": "ゼロレジスタが魔法を起こす", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "教授のポイント: 片方の入力を **ゼロレジスタ（zero register）** にするのがコツです。ゼロとの OR は元の値をそのまま残すので、結果として反転だけが残ります。 ⟦s000762-s000763⟧"}, {"type": "paragraph", "text": "逆に、もう一方の入力に 1 を入れてしまうと、結果が常に 0 になってしまい、NOT として使えません。どの入力を固定するかが大事です。 ⟦s000764⟧"}, {"type": "paragraph", "text": "NOR(A, A) でも同じ結果になるので、こちらも使えます。実際の実装では、destination レジスタにターゲットを置き、もう一方をゼロレジスタとして無視する方式が採用されています。 ⟦s000766-s000778⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "ビットを自分の手で動かそう", "content_blocks": [{"type": "paragraph", "text": "今回は、AND・OR の組み込み命令と、NOT が NOR とゼロレジスタで実現されることを学びました。ビット演算が、数値の見方を変える強力な道具であることもわかりました。"}, {"type": "paragraph", "text": "Make sure to cover these:"}, {"type": "list", "items": ["5 を反転させたときのビット列と16進数表現の変換（ビット表現（binary representation）の練習）", "XOR と NOT を組み合わせた、複数命令にわたる式の組み立て（ラボの課題）", "即値版の AND 命令（AND immediate）の仕組み"]}, {"type": "paragraph", "text": "今日のレジスタ、疑似命令（pseudo-instruction）、ゼロレジスタの話は、NOT を NOR とゼロレジスタで作るという今回の内容にそのままつながっています。ラボでは、この道具立てを使って自分の値を実際に計算してみてください。"}]}]}, "deep_notes": {"1": "# 1. レジスタと疑似命令によるアセンブリ入門\n\nレジスタ(register)は、計算に使う値を一時的に置いておく小さな記憶場所です。よく使う操作の中には専用のハードウェア命令がないものもあり、そうした操作は**疑似命令**(pseudo-instruction)として書けます。アセンブラは、この扱いやすい記述を一つ以上の組み込み命令に変換してから機械語を生成します。⟦s000001, s000102-s000106⟧\n\n## 🔍 レジスタの役割と種類\n\nレジスタには用途ごとに使い分けられる名前があります。**Tレジスタ**(T0, T1, T2など)は、手続きの本体で使う一時的な値を置くために使われます。Tは temporary の頭文字です。⟦s000003, s000007⟧ **Aレジスタ**(A0, A1, A2, A3)は、手続き(methodや関数に相当するもの)に渡す引数に使われ、Aは argument の頭文字です。⟦s000004-s000006⟧ **Sレジスタ**(S0, S1, S2など)は、グローバル変数のように広く保持したい値に使われます。⟦s000008⟧\n\n講義では、T8やT9も含め、これらはいずれも計算や作業に使えるレジスタだと説明されています。⟦s000009, s000011-s000012⟧ 一方、K0, K1, GP, SP, FP, RA, PCやATなども挙げられましたが、本講義で詳しく扱うのはRAとPCなど一部に限られます。⟦s000013-s000015⟧\n\n## 🏷️ 名前と番号による指定\n\nレジスタは**名前**と**番号**の二通りで参照できます。ゼロレジスタは、名前で書けば `$zero`、番号で書けば `$0` です。⟦s000029-s000031⟧ T3は番号で11とも表せるように、T0は8、T1は9に対応します。⟦s000032, s000135-s000137, s000144⟧\n\nここで大事なのは、**識別子**(identifier)と**値**(value)を区別することです。番号は、そのレジスタを指し示すための識別子であり、レジスタの中に入っている中身ではありません。⟦s000027-s000028, s000035-s000036⟧ 講義では、人間にとって覚えやすいTやAなどの名前を使うほうが一般的であり、ミスも減らせると説明されています。⟦s000131-s000132, s000162-s000166⟧\n\n## 0️⃣ ゼロレジスタと初期値の注意\n\n**ゼロレジスタ**(zero register)は、その名の通り常に値が0のレジスタです。他のレジスタは、実際のハードウェアでは以前の値が残っていることがあり、常に0とは限りません。⟦s000001-s000003⟧ シミュレータでは初期化されて0になって見えますが、実機ではそうならないため、0にしたい場合は明示的に0を代入しなければなりません。⟦s000039-s000041⟧\n\n高水準言語のような値の確認(エラーチェック)は、アセンブリにはないため、残っている値をそのまま使ってしまう危険があります。⟦s000043, s000045⟧\n\n## 🧩 疑似命令とは何か\n\n**疑似命令**(pseudo-instruction)は、よく使われる操作に対して、人間が扱いやすい名前をつけたものです。ハードウェアに専用の命令が実装されているわけではありません。⟦s000102-s000104⟧ 別名として**マクロ**(macro)とも呼ばれます。⟦s000079-s000080, s000104⟧\n\n疑似命令は組み込み命令(built-in instruction)ではないため、アセンブラがバイナリコードを作る前に、対応する一つ以上の組み込み命令へ置き換える必要があります。⟦s000105-s000107⟧ そのため、疑似命令は「書く側の便利さ」と「実際に動く命令」を分ける仕組みだと理解できます。⟦s000105-s000106⟧\n\n## ⚙️ moveが add unsigned に展開される仕組み\n\n講義で扱ったのは、ゼロレジスタの値をT0へ移す `move` です。シミュレータでアセンブルすると、この1行は**add unsigned**という組み込み命令に変換されていました。⟦s000092-s000099⟧ この命令は、加算先(デスティネーション)に `$8`(T0)を指定し、ゼロレジスタとゼロレジスタを足します。⟦s000112-s000113⟧\n\n0 + 0 の結果は0なので、T0に0が入ります。これは `move` が意図した動作と同じです。⟦s000113-s000116⟧ つまり `move` は、実質的に「任意のレジスタに0を足す」命令として働きます。⟦s000114-s000115⟧\n\n<!-- FIGURE: type=\"diagram\" title=\"move疑似命令の展開\" description=\"左側に人が書いた疑似命令 move（ゼロレジスタの値をT0へ移す）を置く。矢印でアセンブラを経由し、右側に組み込み命令 add unsigned の形（デスティネーントはT0・$8、ソースは$zeroと$zero）を置く。アセンブラが変換を担うことを示す。\" -->\n\n講義では、移動先をT1に変えても同じ仕組みで、T1($9)に0を足す命令に展開されると確認されました。⟦s000144-s000150⟧ また、Tレジスタは番号で指定しても、名前で指定しても、結果となる機械語は同じです。⟦s000133, s000137-s000140⟧\n\n## 🎯 重要ポイント\n\n- **レジスタ**は用途で名前が分かれており、T(一時用)、A(引数用)、S(保持用)、ゼロレジスタ(常に0)がある。⟦s000003-s000008, s000001-s000003⟧\n- **名前と番号**はどちらも同じレジスタを指す識別子であり、中身の値とは別物である。⟦s000033-s000035⟧\n- **疑似命令**は人間が扱いやすい表記であり、アセンブラが組み込み命令に展開する。⟦s000102-s000107⟧\n- **move**は専用ハードウェア命令ではなく、add unsignedへ置き換えられる疑似命令である。0を足すことで値を移すのと同じ結果が得られる。⟦s000099, s000113-s000116, s000153-s000159⟧", "2": "# 2. プログラムの構成と命令の実行\n\nアセンブリプログラムは、**データ**を置く領域と**命令**を置く領域に分かれています。定数は即値としてレジスタに直接読み込むことができ、命令は通常、メモリ上に並んだ順番に一つずつ実行されます。\n\n## 🗂️ データ領域と命令領域の役割\n\nアセンブリプログラムには、`.data` と `.text` という2つのセグメントがあります。`.data` はデータをメモリに置くための領域で、`.text` は命令をメモリに置くための領域です。⟦s000181-s000183⟧ 命令もデータも最終的にはメモリに格納されますが、どちらの領域に入るかは、この2つの指定によって決まります。⟦s000183⟧\n\nここでいうメモリは、**主記憶（main memory）**、つまりRAMを指します。⟦s000185⟧ 一方、**レジスタ（register）**も技術的にはメモリの一種ですが、講義では特別な種類のものとして区別して扱います。⟦s000186⟧\n\n> `.data` と `.text` の間に置かれたものはデータとしてメモリに格納されます。`.text` 以下はすべて命令です。⟦s000292-s000293⟧\n\nHello Worldプログラムを例にとると、`.data` の中に文字列 \"hello world\" が格納され、画面に表示するために使われます。⟦s000294-s000295⟧ `.text` 以下の行は、プログラムの命令そのものです。⟦s000296⟧\n\n## ⚡ 即値ロード（load immediate）で定数を読み込む\n\n**即値（immediate value）**とは、命令の中に直接書かれた定数のことです。高級言語でいう定数と同じ考え方で捉えると理解しやすくなります。⟦s000188, s000215-s000216⟧\n\n即値ロード（load immediate）は、指定した即値を**送り先のレジスタ（destination register）**に読み込む命令です。⟦s000188⟧ 例えば、即値34を `T1` に読み込むと、`T1` に値34が入ります。⟦s000202-s000204⟧ ここで送り先となるレジスタを指定する点が重要です。⟦s000217-s000218⟧\n\nなお、これは組み込み命令（built-in instruction）ではなく擬似命令（pseudo-instruction）として扱われる場合もあるという区別が講義で示されています。⟦s000187⟧ 一方、`move` についても、ハードウェアに専用の機能が組み込まれているわけではなく、加算命令で代用して実現されていると説明されています。⟦context: s000152-s000159⟧\n\n## 🔢 10進数と16進数の扱い\n\n即値は、特に指定がない限り**10進数（decimal）**として解釈されます。⟦s000199, s000221-s000222⟧ 16進数で書きたい場合は、表記で区別する必要があります。\n\n34を16進数に変換するには、16で割ります。34は16の2倍に2が余るので、16進数では `22` になります。⟦s000223-s000232⟧ 10進数の34と16進数の22は同じ値を表します。⟦s000235-s000239⟧\n\n実際にコードを実行すると、`T1` には34が格納されるものの、表示は16進数の `22` になります。⟦s000259-s000260⟧ つまり、値そのものは同じですが、レジスタの内容を確認するときは16進数で読む習慣が必要になります。⟦s000260-s000261⟧\n\n## 🔄 命令が実行される順序\n\nプログラムは、メモリに置かれた最初の命令から順番に実行されます。⟦s000275-s000276⟧ 流れは次のとおりです。\n\n1. 命令をメモリから**命令レジスタ（instruction register）**に読み込みます。⟦s000276-s000278⟧\n2. 読み込んだ命令を実行します。⟦s000278⟧\n3. 実行が完了すると、**プログラムカウンタ（program counter）**に1を加えて、次の命令の位置を指します。⟦s000279⟧\n4. 次の命令を読み込んで実行し、これを命令がなくなるまで繰り返します。⟦s000280-s000283⟧\n\n<!-- FIGURE: type=\"diagram\" title=\"命令の実行サイクル\" description=\"メモリ上の命令列から始まり、最初の命令を命令レジスタに読み込み、実行する流れを描く。実行後にプログラムカウンタを1増やし、次の命令を同様に読み込む循環を矢印で示す。命令がなくなった時点で終了する分岐を最後に示す。\" -->\n\nただし、この順番は常に固定されているわけではありません。ループや分岐を使えば、命令の並び順から外れて飛ぶことができます。⟦s000284-s000285⟧ 講義の時点ではまだそれらは扱われておらず、それまでは最初の命令から順に実行されると理解しておけば十分です。⟦s000286-s000287⟧\n\n## ⚠️ セグメント指定の落とし穴\n\n`.data` や `.text` を書き忘れると、アセンブラはコードをどう扱うべきか判断できなくなります。講義では、`.text` を書き忘れた学生の例が挙げられています。この場合、アセンブラはすべてをデータとみなしてしまい、コードがメモリに配置されませんでした。⟦s000300-s000301⟧ 修正として `.text` を追加すると、問題は解決しました。⟦s000301-s000302⟧\n\nさらに、どちらのセグメント指定も書かなくても、アセンブルは成功します。その場合、アセンブラは内容をテキスト（命令）とみなします。⟦s000303-s000307⟧ エラーが出ないため、気づきにくい問題です。⟦s000309-s000312⟧ データを扱うようになると、この誤認識は大きな不具合につながります。⟦s000313-s000314⟧\n\n## 🎯 Key Takeaway\n\n- **`.data`** にはデータを、**`.text`** には命令を配置します。どちらも最終的にはメモリに格納されます。⟦s000182-s000183, s000292-s000293⟧\n- **即値ロード**は、即値を送り先レジスタに読み込む命令です。即値は特に指定がなければ10進数として扱われます。⟦s000188, s000199⟧\n- 命令は、命令レジスタに読み込まれて実行され、プログラムカウンタの指す位置が1つずつ進むことで順番に処理されます。⟦s000276-s000282⟧\n- セグメント指定を忘れるとエラーなくアセンブルされ、コードが正しく配置されないことがあります。⟦s000301, s000307⟧", "3": "# 3. 算術命令とオペランド\n\n加算命令（add instruction）と即値加算命令（add immediate）を使うと、レジスタの値や定数を足し合わせる計算を書けます。命令は**ニーモニック**、**オペコード**、**オペランド**に分けて読むと、それぞれの役割が整理できます。\n\n## 🔍 加算命令（add）の基本形\n\n加算命令は、2つの値を足して結果を別のレジスタに書き込む命令です。アセンブリでは、**書き込み先（destination）が最初**に来る順序で書きます。⟦s000374⟧ たとえば `add T2, zero, T3` は、「`zero` と `T3` を足し、その結果を `T2` に入れる」という意味になります。⟦s000375-s000376⟧\n\nこの式は次のように表せます。\n\n\\[\nT2 = \\text{zero} + T3\n\\]\n\n`zero` レジスタには常に 0 が入っているため、この命令の結果は `T3` の値そのものになります。⟦s000405-s000406⟧ 途中経過の例では、`T3` に 1 を入れた後に `zero + T3` を計算し、`T2` に 1 が入りました。⟦s000381, s000406⟧\n\n## 🧩 命令の構成要素：ニーモニック・オペコード・オペランド\n\n命令は大きく3つの要素で読み取れます。\n\n- **ニーモニック（mnemonic）**：`add` のように、命令の名前を表す読みやすい記号です。⟦s000526⟧\n- **オペコード（opcode）**：算術論理演算装置（Arithmetic Logic Unit, ALU）に「加算をせよ」「XOR をせよ」「減算をせよ」などの動作を指示する制御情報です。ニーモニックはこのオペコードを人が読める形にしたものと位置づけられます。⟦s000526-s000527⟧\n- **オペランド（operand）**：命令が演算の対象とする値や場所です。書き込み先と、演算に使う入力の両方が含まれます。⟦s000529-s000530⟧\n\n<!-- FIGURE: type=\"diagram\" title=\"加算命令の構成要素\" description=\"左端にニーモニック（add）、その後ろにオペランドが並ぶ構造を示す。オペランドは先頭が書き込み先（destination）、続いて加数1、加数2の順に並ぶ。ニーモニックからALUへ『加算を実行』という制御が伝わるフローを矢印で表す。\" -->\n\n加数と和の呼び方も確認しておきましょう。数学では足される値を**加数（add-ins）**、結果を**和（sum）**と呼びます。アセンブリではこれらをまとめて**オペランド**と呼びます。⟦s000535-s000540⟧\n\n## ➕ 即値加算命令（addi）と即値オペランド\n\n即値加算命令（add immediate）は、最後のオペランドに定数を直接書ける命令です。⟦s000482⟧ 例として `addi T4, T1, 1` は、「`T1` に定数 1 を足し、その結果を `T4` に入れる」という意味になります。⟦s000487-s000488⟧\n\nこの定数を**即値オペランド（immediate operand）**、または単に**即値（immediate value）**と呼びます。⟦s000484, s000496⟧ 即値は書かれた値そのものを使うため、レジスタの名前ではありません。⟦s000499-s000501⟧ 命令名の末尾にある `I` は、最後のオペランドが即値であることを示しています。⟦s000495-s000497⟧ 同じ理由で、定数をレジスタに読み込む命令（load immediate）にも `I` が付いています。⟦s000498-s000499⟧\n\n即値のデフォルトは10進数です。16進数で書く場合は、その旨を明示する必要があります。⟦s000483⟧ 一方、1 のように10進数と16進数で値が同じ場合は、どちらで書いても同じ結果になります。⟦s000387-s000388⟧\n\n## 🆚 add と addi の違い\n\n2つの命令は、命令の動作の仕組みは同じで、**最後の入力がレジスタか即値か**が違います。\n\n- **add**：入力がすべてレジスタです。デフォルトの形式はこちらです。⟦s000525, s000547-s000548⟧\n- **addi**：最後の入力が定数です。定数を足したいときに使い、特に 1 を足す場面はコードで頻繁に現れます。⟦s000477-s000478, s000550⟧\n\n両者の違いについて、学生から「定数を使うかどうかだけの違いか」という質問がありました。これに対し、一方は即値を使い、もう一方はレジスタを使うという説明がなされています。⟦s000544-s000546⟧\n\n## ⚠️ 注意すべき制約\n\n即値加算には、次のような制約があります。\n\n1. **即値同士を足すことはできません。** 即値を2つ並べた命令（例：`addi` の中で定数を2つ使うこと）は存在せず、使えません。⟦s000507-s000510⟧\n2. **高水準の式をそのまま書くことはできません。** たとえば「3 + 5 を T4 に入れる」といった書き方は、アセンブリでは認められません。⟦s000514-s000516⟧\n3. **レジスタ同士の加算は `add` を使います。** `T1` と `T3` を足すなら `add` で書けます。ただし、即値用の命令は存在しないため、名前は `add` のままです。⟦s000517-s000523⟧\n\n浮動小数点数や小数は、この段階では扱いません。ここまでの内容はすべて整数の世界の話です。⟦s000502-s000505⟧\n\n## 🛠️ アセンブルと実行の流れ\n\nアセンブルの段階では、`add` は組み込み命令の一覧に含まれるため、特別な変換は行われません。変更がなければ、レジスタは番号付きの名前に置き換えられます。⟦s000391-s000392⟧\n\n値の移動は `move` 命令で行います。`move T0, T1` は「`T1` の値を `T0` にコピーする」という意味です。⟦s000401-s000402, s000459-s000461⟧ 書き込み先が先頭に来るという規則は、この命令でも同じです。⟦s000463-s000466⟧\n\nステップ実行では、各命令の後にレジスタの中身を確認できます。⟦s000407⟧ 例として、`T1` に 34（16進数で 0x22）を入れ、`T3` に 1 を入れた後、`T3 + T1` を計算すると 35 になります。16進数では 0x23 です。⟦s000435-s000442⟧\n\n\\[\n34 + 1 = 35 \\quad (\\text{16進数で } 0x22 + 1 = 0x23)\n\\]\n\n## 🎯 重要ポイント\n\n- 加算命令は `add 書き込み先, 加数1, 加数2` の順に書き、書き込み先が必ず先頭に来ます。⟦s000374, s000463⟧\n- 命令は、ニーモニック（命令名）、オペコード（ALU への制御）、オペランド（対象の値や場所）の3要素で理解できます。⟦s000526-s000530⟧\n- 即値加算（`addi`）は最後の入力に定数を書く命令で、`I` はその目印です。デフォルトの形式は、すべての入力がレジスタであることを覚えておきましょう。⟦s000496-s000497, s000525⟧\n- 即値同士の加算や高水準の式は、アセンブリでは書けません。⟦s000507, s000516⟧\n\n講義の続きでは、アセンブリで2つのレジスタの値を入れ替える課題が示されています。課題の前に高水準言語で手順を考えてからアセンブリに落とし込むことが勧められており、その過程で、高水準では簡単な操作がアセンブリでは複数の命令に分解されることが示唆されています。⟦s000553-s000554, s000564-s000565⟧", "4": "# 4. レジスタの値交換とアセンブリの利用\n\n二つのレジスタの値を入れ替えるには、どちらか一方の値を退避させておく**第三のレジスタ**が必要になります。このトピックでは、その必要性を命令の流れに沿って確かめます。あわせて、一時的に使うレジスタと値を元に戻す約束が必要なレジスタの違い、そしてアセンブリ言語が現在どのような場面で使われるかを扱います。\n\n## 🔍 課題：T0とT1の値を入れ替える\n\nここでの課題は、レジスタ **T0** に入っている値と **T1** に入っている値を入れ替えることです。具体的には、T0の値をT1へ、T1の値をT0へ移します。⟦s000551-s000553⟧\n\n本格的なアセンブリを書く前に、まず高水準言語でどう書くかを紙やコードのコメントに書き出しておくことが勧められています。⟦s000554⟧ 高水準での考え方を先に持っておくと、アセンブリの命令列を組み立てやすくなります。\n\n## ❌ 直接代入では入れ替えられない理由\n\n最初の試みは、`move` 命令を次の順に使うものでした。⟦s000646-s000649⟧\n\n1. T1 ← T0（T0の値をT1へコピーする）\n2. T0 ← T1（T1の値をT0へコピーする）\n\nこの方法は正しく動きません。⟦s000650-s000651⟧ 理由は、一つ目の命令で**T1の元の値が上書きされ、失われてしまう**からです。⟦s000655-s000657⟧ 二つ目の命令では、すでに失われたT1の値をT0へ書くことになるため、結果として両方のレジスタが同じ値になってしまいます。\n\nここから得られる結論は、**一方の値を別の場所に退避してから上書きする必要がある**ということです。⟦s000658⟧\n\n## ✅ 第三のレジスタを使う交換\n\n解決策は、退避用の**一時的な保管先**として三つ目のレジスタ（ここではT2）を使うことです。⟦s000660⟧ 二つのレジスタを交換するには三つのレジスタが必要であり、二つの命令だけで行う方法はありません。⟦s000661-s000663⟧\n\n具体的な手順は次のとおりです。⟦s000676-s000678⟧\n\n```\nmove T2, T1    # T1の値をT2に退避する\nmove T1, T0    # T0の値をT1へコピーする\nmove T0, T2    # 退避しておいたT2の値をT0へ戻す\n```\n\n各ステップで何が起きているかを整理すると、次のようになります。\n\n- **一つ目:** T1の元の値はT2に保存され、失われません。\n- **二つ目:** T0の値がT1に入るため、T1は新しい値を持ちます。\n- **三つ目:** T2に保存しておいた元のT1の値がT0に入り、交換が完了します。\n\n<!-- FIGURE: type=\"diagram\" title=\"三つのレジスタによる値の交換\" description=\"三つのレジスタ T0, T1, T2 を並べ、初期状態（T0=値A、T1=値B）から三つの move 命令を順に適用した状態遷移を示す。ステップ1で T1 の値 B が T2 へ退避され、ステップ2で T0 の値 A が T1 へコピーされ、ステップ3で T2 の値 B が T0 へ書き戻されて、最終的に T0=B、T1=A になることを矢印とともに描く。\" -->\n\n## 🧪 検証と補足の論点\n\n講師は、交換が正しく行われたかを確認するために、T0に3、T1に2といった**テスト用の値**を入れて動きを追う方法を示しました。⟦s000709-s000711⟧ 具体的な数字で追うと、入れ替わりが目で確認しやすくなるからです。\n\n学生の中には、退避用のレジスタを最後にゼロへ戻す命令を加えたり、テスト用の代入を加えたりして、四つの命令で書いた人もいました。⟦s000704-s000706⟧ 講師は、これは誤りではないものの、仕様上は必須ではなく余分であると述べています。⟦s000707⟧ さらに、T0とT1の両方を別の変数に退避させる書き方も「間違いではないが余分である」と扱われました。⟦s000679-s000681⟧\n\n## 📏 高水準言語とアセンブリの違い\n\nアセンブリでは、高水準言語で一行で書けるような操作が、多数の命令に分解されます。⟦s000564-s000565⟧ レジスタの交換にも専用の命令がなく、一つずつ手作業で値を移す必要がありました。⟦s000562-s000563⟧\n\n研究によると、人は高水準言語でもアセンブリでも、生成するコードの量はほぼ同じになるとされています。ただし、アセンブリは記述が非常に冗長になるため、同じ量のコードを書くのにより長い時間がかかります。⟦s000567-s000573⟧ このため、大規模なシステムを作る場合は高水準言語の方が扱いやすいと説明されました。⟦s000574-s000575⟧\n\n一方で、小さな最適化やセキュリティの確認などを行う場面では、アセンブリに踏み込むことに意味があります。⟦s000576-s000578⟧\n\n## ⚙️ アセンブリが使われる場面と歴史的背景\n\nかつては、メモリの使用量を減らし効率を高めるために、アセンブリでプログラムを最適化することが一般的でした。⟦s000580-s000582⟧ 講師は例として、メモリが非常に限られた補聴器を挙げ、命令の数やサイズを減らしたい場合に手で書く価値があったと説明しました。⟦s000583-s000589⟧\n\n現在はコンパイラの性能が大きく向上し、多くの人が高水準言語でコーディングしているため、アセンブリで最適化する必要性は小さくなっています。⟦s000581, s000592-s000593⟧ ただし、高水準のプログラマが書いたコードと、実際に実行されるバイナリコードとの間にずれがあり、そこから多くのセキュリティ上の弱点が生じるとされています。⟦s000594-s000596⟧\n\nこのトピックでは、アセンブリを学ぶ目的として次の三つが挙げられました。⟦s000597-s000599⟧\n\n- 高水準のプログラマとして、より良いコードを書けるようになること\n- 使っているシステムの仕組みを理解し、扱っている対象を把握すること\n- 少数ながら、実際にアセンブリプログラマとしてコードを書くこと\n\nアセンブリがあまり使われなくなった時期については、90年代頃に手書きで最適化するのが割に合わなくなったという見解が示されました。⟦s000622-s000624⟧ 講師は、コンパイラの影響を過小評価すべきではないとも付け加えています。⟦s000626⟧\n\n## 🎯 Key Takeaway：一時レジスタと保存レジスタの約束\n\n値を交換する際に使った一時的なレジスタ（T レジスタ）は、中身を自由に書き換えてもよいという**一時レジスタ規約（temporary-register convention）**に従うものです。⟦s000687-s000689⟧ 一方、保存レジスタ（S レジスタ）は、関数などの処理を終えた後に元の値へ戻しておくという**保存レジスタ規約（saved-register convention）**に従う必要があります。⟦s000690-s000691⟧ この約束事は手続き（procedure）を扱う段階で詳しく扱われます。⟦s000686, s000691⟧\n\n> 要点: 二つの値の交換には第三の記憶場所が必要であり、アセンブリでは一時レジスタと保存レジスタの扱いを規約として意識しなければなりません。", "5": "# 5. ビット論理演算とNOTの実現\n\nレジスタの中身を**ビット単位**で組み合わせるAND、OR、XORなどの論理演算を使うと、各ビットの0と1を独立に操作できます。専用のNOT命令がない場合でも、**NOR命令**とゼロレジスタ（zero register）を組み合わせればNOTを作ることができます。\n\n## 🔍 論理演算がレジスタに対して行うこと\n\nここで扱う論理演算は、レジスタに入っている値を**ビットごとに**処理するものです。数値全体を足し算するのではなく、各ビットの0と1を個別に見て結果を決めます。これらの演算は、ALU（算術論理演算装置）が担当する操作として扱われています。⟦s000733-s000736⟧\n\n学習の出発点として、既に扱った命令は次のとおりです。ロード即値（load immediate）、move、add immediate、addなどです。addの仲間であるadd unsignedも出てきましたが、これは認識しておくためのもので、今回は使わないと明示されています。⟦s000715-s000717⟧\n\n## ⚙️ 組み込みの論理命令：AND、OR、XOR\n\nANDは、宛先レジスタと2つのソースレジスタの3つのオペランドを取ります。例として、宛先をT3、ソースをT1とT0とすると、「T3の値はT1とT0の値のANDである」という意味になります。⟦s000722-s000724⟧ ORも同じ構造で、宛先レジスタと2つのソースレジスタを指定します。⟦s000725-s000727⟧ なお、AND immediate（即値を用いるAND）も存在しますが、ここでは通常のANDを基本として扱います。⟦s000721-s000722⟧\n\nXORは、授業の後半で作業課題に含まれる演算として登場します。ORとXORは、2つの値を組み合わせるという点でANDと同じ仲間ですが、各ビットの結果の出し方が異なるため、課題では両方を比較しながら試すことになります。⟦s000817-s000818⟧\n\n## 🧩 NOT演算が組み込まれていない理由\n\nNOTは、2つのオペランドを取る形で表されますが、これは組み込み命令ではありません。例えば「T3にT1のNOTを入れる」という意味になります。⟦s000742-s000744⟧ 専用のNOT命令が存在しないのは、設計者が命令コードのビットを節約し、NOTを別の命令として持たせなかったためだと説明されています。⟦s000753-s000755⟧\n\n代わりに存在するのがNOR命令です。NOR命令は、宛先レジスタに2つのソースレジスタのNORを格納します。NORは「2つの入力をORしてからNOTする」演算なので、この命令を工夫すればNOT相当の動作が得られます。⟦s000756-s000759⟧\n\n## 💡 NORでNOTを作る方法\n\nNOTを作るには、NORの2つの入力のうち一方を入力Aとし、もう一方を0とします。すると、A OR 0はAになり、その結果をNOTしたものがAのNOT、つまり\\(\\overline{A}\\)になります。\\[\\overline{A} = \\text{NOR}(A, 0)\\]この考え方は、NOR命令の入力に0を与えることで「OR相当の部分を無効化する」というものです。⟦s000760-s000763⟧\n\n別の方法として、2つの入力を両方ともAにする方法も挙げられています。A OR AはAになるため、NOR(A, A)もAのNOTを与えます。ここで、もう一方の入力を1にするとNOTではなく常に0になってしまうため、その方法は成り立たない点にも注意が必要です。⟦s000764-s000766⟧\n\n実際の実装では、NOTは**第2ソースにゼロレジスタを使うNOR**として実現されています。宛先レジスタを指定し、もう一方のソースにゼロレジスタを指定する形です。この組み込み命令が、マクロ命令の代わりに使われる本来の命令となります。⟦s000772-s000779⟧\n\n## 🧪 ラボ課題：2つの整数で論理演算を試す\n\n課題では、まず2つの整数をレジスタに保存します。どの値を選ぶかも課題の一部であり、テストに適した値を自分で考えることが求められています。⟦s000808-s000813⟧ 例として、T0に5、T1に8を入れる設定が挙がっています。⟦s000831⟧\n\n課題の内容は、ORとXORを計算し、さらに2つの値それぞれのNOTを求めることです。その後、T7でより複雑な式を計算するよう指示されており、これは複数の命令に分けて実行する必要があるとされています。⟦s000815-s000823⟧\n\n### 🔢 NOTの計算を16進数で確認する\n\nNOTの結果は、ビットを反転させたものとして考えます。0を4桁の2進数で表すと0000で、そのNOTは1111となり、16進数ではFです。⟦s000834-s000840⟧\n\n一方、5を4桁の2進数にすると0101で、そのNOTは1010になります。1010を16進数に直すと、標準的な表記ではAになります。授業の記録では「K」と聞こえる箇所がありますが、1010を表す16進数の数字はAなので、ここでは書き起こしの誤りとして扱います。⟦s000842-s000848⟧\n\n## 🎯 Key Takeaway\n\n- 論理演算（AND、OR、XOR、NOR）は、レジスタの値をビット単位で処理します。⟦s000733-s000736, s000756-s000757⟧\n- 専用のNOT命令がなくても、NOR命令の入力に0（ゼロレジスタ）を与えれば、NOT相当の動作を実現できます。⟦s000760-s000763, s000772-s000777⟧\n- ビット表現を理解しておくと、NOTの結果を16進数で正しく確認できます。⟦s000834-s000840⟧"}, "fun_facts": {"title": "CPUの中で起きている『翻訳』の魔法 ⚙️", "hook": "実は、あなたが書いた命令はCPUにそのまま届かず、チップの中で別の小さな命令群に組み替えられてから実行されているとしたら信じられますか？\n\nその裏側では、複雑な命令が一瞬でバラバラに分解される驚きの仕組みが毎秒何十億回も動いています。", "body": "今日学んだ疑似命令は、扱いやすい表記を裏で単純な命令へ置き換える発想でしたが、実はこれと同じ考え方がプロセッサの内部でも使われています。\n\nIntelのx86アーキテクチャを搭載したプロセッサは、プログラマが書いた複雑な命令を、そのまま実行するのではなく「マイクロオペレーション（uOp）」と呼ばれる小さな内部命令に高速で分解しています。\n\nこの分解結果は「マイクロオプキャッシュ」と呼ばれる専用の領域に保存され、同じ処理が繰り返される場面で再び翻訳をやり直さずに済むようになっています。\n\n つまり、ハードウェアそのものが命令を実行しやすい形へリアルタイムにコンパイルしているのです。\n\nソフトウェアエンジニアを目指すなら、目に見えない場所で命令がどう姿を変えているかを想像することが、より速く賢いプログラムを書く第一歩になるはずです。", "sources": []}}, "ran": ["deep_notes", "fun_facts", "review_cards"], "checks": {"review_cards": {"calls": 5, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 6756, "exclamations": 9, "question_marks": 4, "citations": 60, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 25, "input_tokens": 55521, "output_tokens": 20563, "max_output_tokens_single_call": 4427, "sum_call_seconds": 96.7, "max_call_seconds": 20.31, "topics": 5, "topics_with_bad_card_sequence": 0}, "deep_notes": {"calls": 5, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 14717, "exclamations": 4, "question_marks": 0, "citations": 142, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 45, "input_tokens": 48238, "output_tokens": 17143, "max_output_tokens_single_call": 4198, "sum_call_seconds": 83.9, "max_call_seconds": 20.45}, "fun_facts": {"calls": 1, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 509, "exclamations": 0, "question_marks": 1, "citations": 0, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 1, "input_tokens": 3878, "output_tokens": 512, "max_output_tokens_single_call": 512, "sum_call_seconds": 3.5, "max_call_seconds": 3.54, "fun_fact_sources": 0}}, "errors": {}}, "v1": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🧠", "title": "CPUの作業机の上", "content_blocks": [{"type": "paragraph", "text": "前回は、演算装置が主記憶を直接いじらず、レジスタに取り込んだ値で計算することを学びましたよね。今日はその作業机の上にある道具たちを、実際に手で触っていきます！"}, {"type": "quote", "text": "レジスタは、CPUの作業机に置かれた「手元の付箋」のようなものです。考えるときは、まず必要な値を手元に持ってくるんです！"}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "同じレジスタ、二つの呼び名", "content_blocks": [{"type": "paragraph", "text": "レジスタ（register）には、$0のような名前と、$8のような番号の二通りの呼び方があります。先生いわく、番号は覚えにくいので、普段はT0やA0のような意味のある名前を使うのがおすすめです。⟦s000029-s000033⟧"}, {"type": "callout", "alert_type": "info", "items": []}, {"type": "code", "language": "asm", "explanation": "どちらも同じレジスタを指しています。⟦s000131-s000133⟧", "items": []}, {"type": "paragraph", "text": "ここで大事なのは、番号は値ではなく識別子（identifier）だということです。値は別に入っていて、名前で呼んでも番号で呼んでも中身は同じです。⟦s000035-s000036⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "moveは本当は足し算！", "content_blocks": [{"type": "callout", "alert_type": "warning", "explanation": "", "items": []}, {"type": "paragraph", "text": "疑似命令（pseudo-instruction）とは、組み込みの命令ではなく、複数の命令の組み合わせに名前を付けたものです。ここで先生が言う「マクロ」とほぼ同じ意味です。⟦s000102-s000104⟧"}, {"type": "paragraph", "text": "たとえば move $t0, $0 は、ハードウェアにmoveという命令は存在しません。アセンブラがこれを add $8, $0, $0 に変換します。ゼロに0を足して結果をT0に入れるので、結果はT0に0が入るというわけです。⟦s000105-s000114⟧"}, {"type": "paragraph", "text": "なぜ足し算なの？と思うかもしれませんが、ハードウェアにすでにある加算命令で同じ働きができるから、わざわざmoveを作らなくて済むんです。⟦s000152-s000159⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩へ", "content_blocks": [{"type": "paragraph", "text": "今回は、レジスタにはゼロ、T、A、Sなどの役割があり、名前と番号の二通りで呼べることを学びました。そして擬似命令のmoveは、アセンブラによって加算命令に変換されることも分かりました。"}, {"type": "paragraph", "text": "ここからは、自分で掘り下げてみてほしい内容をまとめます。"}, {"type": "list", "items": ["残りの特殊レジスタ（K0、K1、GP、FP、RA、PC、AT）の役割 ⟦s000013-s000014⟧", "addのunsigned（符号なし）が何を意味するのか ⟦s000110-s000111⟧", "実行画面のChromeプロセス表示が切り替わる小さな不具合 ⟦s000020-s000024⟧"]}, {"type": "paragraph", "text": "次はデータセグメントやテキストセグメント、即値ロード（load immediate）など、プログラムの中身がどう配置されて実行されるのかを見ていきます。そこでは、今日のレジスタがどう関わってくるのか、楽しみにしていてくださいね！"}]}], "2": [{"card_type": "hook", "hero_emoji": "🧳", "title": "知らないものを詰めたスーツケース", "content_blocks": [{"type": "quote", "text": "Hello Worldのコードは、中身を知らずに詰めたスーツケースのようなもの！でも大丈夫、ちゃんと中身を全部説明してくれます。⟦s000178-s000179⟧"}, {"type": "paragraph", "text": "今はまだ一行一行の意味がつかめなくても安心してください。プログラムの『荷物』がメモリのどこに置かれ、どう動くのかを、これから一緒にほどいていきましょう。⟦s000172-s000175⟧"}]}, {"card_type": "core_why", "hero_emoji": "🗂️", "title": "データと命令は同じメモリの住人", "content_blocks": [{"type": "paragraph", "text": "アセンブリのプログラムは、.data（データセグメント）と.text（テキストセグメント）という2つの区画に分かれています。.dataには保存しておくデータ、.textには命令が書かれ、どちらもメインメモリ（RAM）に入ります。⟦s000181-s000183⟧"}, {"type": "callout", "alert_type": "info", "explanation": "", "items": []}, {"type": "paragraph", "text": "ここで大事なのは即値ロード命令（load immediate）です。これは指定したレジスタに定数値を入れる命令で、ここでの定数とは即値（immediate value）のことです。数値は指定がなければ10進数として扱われます。⟦s000187-s000199⟧"}, {"type": "code", "language": "assembly", "explanation": "T1レジスタに34（10進数）を入れる命令です。⟦s000202-s000204⟧", "items": []}, {"type": "paragraph", "text": "命令は、プログラムカウンタ（program counter）が次に実行する命令を指し示すことで、上から順番に進んでいきます。⟦s000275-s000279⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": ".textを忘れるとコードが死ぬ", "content_blocks": [{"type": "callout", "alert_type": "warning", "explanation": "", "items": []}, {"type": "paragraph", "text": "命令レジスタ（instruction register）は、いま実行する命令を入れておく場所です。プログラムカウンタが1ずつ増えるたびに、次の命令が命令レジスタに読み込まれて実行されます。⟦s000276-s000282⟧"}, {"type": "paragraph", "text": "ここで教授が強調したのは、.textを書き忘れるとアセンブラがすべてをデータとみなしてしまうという点です。コードが一行も生成されず、バグの原因になります。⟦s000300-s000308⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "命令の行き先をたどろう", "content_blocks": [{"type": "paragraph", "text": "今回は、.dataと.textがそれぞれメモリに何を入れるのか、即値ロード命令で定数をレジスタに入れること、そしてプログラムカウンタによって命令が順番に実行されることを学びました。"}, {"type": "paragraph", "text": "以下は、授業では扱ったものの、このカードでは深く触れなかった内容です。ぜひ自分で復習してみてください。"}, {"type": "list", "items": ["10進数と16進数の変換（34が16進数で22になる計算） ⟦s000223-s000240⟧", "ソースコードへのコメントの書き方（#を使う） ⟦s000261-s000263⟧", "ジャンプやループによる命令の飛び越え ⟦s000284-s000285⟧"]}, {"type": "paragraph", "text": "次の授業では、算術命令とオペランドを学びます。加算命令（add instruction）や即値加算命令（add immediate）が登場し、算術論理演算装置（ALU）がどのように計算を担当するのかが気になるところです。どんなオペコードが使われるのか、次回のお楽しみです！"}]}], "3": [{"card_type": "hook", "hero_emoji": "🧮", "title": "レジスタは電卓のメモ欄", "content_blocks": [{"type": "quote", "text": "CPUの中には、数字を書き込める小さなメモ欄（レジスタ）がたくさんあるんだ！"}, {"type": "paragraph", "text": "例えば電卓で『3に5を足す』とき、数字を一時的にメモしておくよね。アセンブリ言語では、その『メモ欄』に名前をつけて、直接命令で操作していくんだ。⟦s000322⟧ ⟦s000399⟧"}]}, {"card_type": "core_why", "hero_emoji": "🔧", "title": "add命令の3つのパーツ", "content_blocks": [{"type": "paragraph", "text": "アセンブリの命令は、まず『オペコード（opcode）』と呼ばれる動作の種類を表す部分から始まるんだ。たとえば add は『足し算をしろ』という合図だよ。⟦s000526⟧"}, {"type": "callout", "alert_type": "info", "items": []}]}], "4": [{"card_type": "hook", "hero_emoji": "🔄", "title": "ふたつのコップの水を入れ替えよう", "content_blocks": [{"type": "quote", "text": "コップAとコップBの水を入れ替えるとき、直接注ぎ込んだら片方の水が消えてしまう！"}, {"type": "paragraph", "text": "先生からの課題は、T0とT1の値を入れ替えるコードを書くことでした。一見かんたんに見えますが、レジスタを扱うときにはちょっとした落とし穴があるんです。⟦s000551⟧⟦s000553⟧"}]}, {"card_type": "core_why", "hero_emoji": "🧠", "title": "第三のレジスタが必要な理由", "content_blocks": [{"type": "paragraph", "text": "まず『T1をT0へ、T0をT1へ』と2つのmove命令を並べてみたくなりますが、これは失敗します。最初のmoveでT1の値が上書きされ、その古い値はもう二度と取り出せないからです。⟦s000648⟧⟦s000649⟧⟦s000652⟧⟦s000655⟧⟦s000656⟧"}, {"type": "callout", "alert_type": "info", "explanation": "", "items": []}, {"type": "paragraph", "text": "つまり、消える前に退避させておく場所が必要になります。そこでT2を一時置き場にすると、『T1をT2へ退避、T0をT1へ、T2をT0へ』の3命令で交換できます。⟦s000660⟧⟦s000664⟧⟦s000665⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "一時レジスタと保存レジスタの約束", "content_blocks": [{"type": "callout", "alert_type": "warning", "explanation": "", "items": []}, {"type": "paragraph", "text": "今回使ったT0からT2のような一時レジスタは、中身を自由に書き換えてよいという規約です。一方、Sレジスタは使ったあと元の値に戻すという規約があります。⟦s000688⟧⟦s000689⟧⟦s000690⟧"}, {"type": "paragraph", "text": "ちなみに、4命令で解いた学生の『使ったレジスタを0に戻す』という考えも間違いではありません。今回の仕様では必須ではないだけです。⟦s000704⟧⟦s000706⟧⟦s000707⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次はレジスタ規約の深掘りへ", "content_blocks": [{"type": "paragraph", "text": "今回は、2つのレジスタを入れ替えるには上書きを防ぐ第三のレジスタが必要であることを学びました。また、アセンブリは冗長だが、最適化やセキュリティ理解には今も役立つことも確認しました。"}, {"type": "paragraph", "text": "ここからは、今回カバーしきれなかった内容を自習リストとして挙げておきます。もっと知りたい項目から取り組んでみてください。"}, {"type": "list", "items": ["保存レジスタを元に戻す具体的な手順 ⟦s000690⟧⟦s000691⟧", "ハノイの塔との比較と、復元を含めた場合の難しさ ⟦s000692⟧⟦s000695⟧", "非順序実行がプログラムの順序に与える影響 ⟦s000603⟧⟦s000609⟧", "コンパイラ最適化の歴史的な移り変わり ⟦s000622⟧⟦s000626⟧"]}, {"type": "paragraph", "text": "次の授業では、ビット論理演算としてAND、OR、XOR、NOT、NOR命令とビット表現を扱います。ビット単位の計算が、このレジスタの世界とどうつながるのか、ぜひ楽しみにしていてください！"}]}], "5": [{"card_type": "hook", "hero_emoji": "🔀", "title": "ビットをひっくり返す魔法", "content_blocks": [{"type": "quote", "text": "コンピュータは数字を「0と1の並び」として見ている。だから論理演算はビットを一つずつ組み替える魔法なんだ！"}, {"type": "paragraph", "text": "ANDやORという名前は、実は「ビットの足し算」ではなく「ビットを見て判断する」操作なんだ。最初は「え、0と1で何ができるの？」と思うかもしれないけど、実はとてもシンプルなルールだけで動いているよ。"}]}, {"card_type": "core_why", "hero_emoji": "🧠", "title": "AND・OR・NOTの正体", "content_blocks": [{"type": "paragraph", "text": "論理命令の形は、加算と同じく「宛先レジスタ」と「2つのソースレジスタ」を取るスタイルだ。AND命令は宛先に2つのソースのANDを入れ、OR命令は2つのORを入れる。ALU（算術論理演算装置）という部品が、この計算をまとめて担当しているんだ。⟦s000723⟧⟦s000724⟧⟦s000726⟧⟦s000727⟧⟦s000733⟧⟦s000734⟧"}, {"type": "callout", "alert_type": "info", "items": []}, {"type": "paragraph", "text": "NOTは「1つの入力を反転する」操作だ。授業では「宛先にソースのNOTを入れる」という形で説明された。ここが大事なポイントで、ANDやORとは違って入力が1つだけになるんだ。⟦s000742⟧⟦s000743⟧⟦s000744⟧"}, {"type": "code", "language": "text", "explanation": "宛先レジスタT3に、ソースレジスタT1の反転を入れるイメージ。", "items": []}]}]}, "deep_notes": {"1": "# 1. レジスタと疑似命令によるアセンブリ入門\n\nレジスタ(register)は、CPUが計算に使う小さな記憶場所で、それぞれ番号と名前で指定できます。人が書きやすい **疑似命令(pseudo-instruction)** は、アセンブラが一つ以上の組み込み命令に置き換えることで実現されるため、専用のハードウェア命令がなくても使えます。\n\n## 🔍 レジスタの値と識別子\n\nレジスタには、今どんな値が入っているかを表す **値(value)** と、どのレジスタかを指す **識別子(identifier)** の二つの側面があります。画面に表示される値は16進数で示されます。⟦s000027⟧ 一方、各レジスタには固有の番号が付いており、これが識別子です。⟦s000028⟧ 学生は値と番号を混同しやすいので、「これが識別子で、これが値」と分けて考えることが大切です。⟦s000034-s000035⟧\n\n## 🗂️ レジスタの種類と役割\n\n授業で扱われたレジスタは、用途ごとに名前が付けられています。\n\n- **ゼロレジスタ(zero register)**：常に値が0であるレジスタです。⟦s000003⟧\n- **Tレジスタ(T0, T1, T2, ...)**：Tは temporary（一時的）の意味で、手続き(procedure)の本体で計算の途中結果を入れるのによく使われます。⟦s000003, s000007⟧\n- **Aレジスタ(A0, A1, A2, A3)**：引数(argument)を渡すのによく使われ、名前のAはここから来ています。⟦s000004, s000006⟧ 手続きは、他の言語でいうメソッドや関数に相当します。⟦s000005⟧\n- **Sレジスタ(S0, S1, S2)**：グローバル変数のようなものとして説明されました。⟦s000008⟧\n- **その他**：K0、K1、GP、FP、RA、PC、ATなどが挙げられました。RAとPCは後で扱うと予告され、特にPCは重要だと強調されました。⟦s000013-s000015⟧\n\n講師は、T8やT9も含め、これらのレジスタは計算などに自由に使えると述べています。⟦s000009-s000012⟧\n\n## 🔢 名前と番号による指定\n\n同じレジスタは、名前でも番号でも書けます。たとえばゼロレジスタは `$zero` のように名前で書くことも、`$0` のように番号で書くこともできます。⟦s000029-s000031⟧ T3は番号で11と書けます。⟦s000032⟧ 名前は人間にとって覚えやすく、ミスも減らせるため、実際のコーディングでは名前を使うのが一般的だと説明されました。⟦s000162-s000166⟧ 番号は、名前と機械的に対応しているので、置き換えは単純な対応表で済みます。⟦s000167-s000168⟧\n\n## 🧮 ゼロレジスタとシミュレータの初期値\n\nゼロレジスタの値は、常に0です。⟦s000050-s000052⟧ 他のレジスタは、シミュレータでは0に初期化されて表示されていましたが、実際のハードウェアでは以前入っていた値のままになることがあります。⟦s000039-s000040⟧ ゼロレジスタだけは、いつでも0であることが保証されています。⟦s000002-s000003⟧\n\nここで重要なのは、高水準言語と違って、値がすでに入っていてもエラーチェックは行われないという点です。⟦s000043⟧ 学生が初期値に頼ると、前の値をそのまま使ってしまうので、必要な値は自分で設定しなければなりません。⟦s000041, s000045⟧\n\n## 🔁 疑似命令 move の展開\n\n`move $t0, $zero` のような命令は、「ゼロレジスタの値をT0に移す」という意図を表します。⟦s000071-s000072⟧ しかし、この `move` には専用の機械語命令がありません。⟦s000102⟧ 人が便利だと感じた命令を、一つまたは複数の組み込み命令として定義したものが疑似命令で、マクロとも呼ばれます。⟦s000103-s000104⟧\n\nアセンブラは、バイナリコードを作る前に、疑似命令を対応する組み込み命令に置き換えます。⟦s000105-s000107⟧ `move` の場合は、組み込みの **add unsigned**（加算命令）に展開されました。⟦s000098-s000099, s000108-s000110⟧ 展開の中身は次のとおりです。\n\n- 加算命令は、宛先レジスタに「二つのソースレジスタの和」を入れる命令です。⟦s000112-s000113⟧\n- ゼロレジスタと別のレジスタを足すと、値は変わりません。つまり「0を足す」ことで、値を別のレジスタにコピーできます。⟦s000114-s000115⟧\n- 「0+0を8に入れる」と、T0(8番)に0が入るので、意図した動きと同じになります。⟦s000113-s000116⟧\n\nソースコードを `move` のまま書いても、アセンブル後は同じ内容の加算命令になります。⟦s000149-s000150⟧ 機械的な変換で済むので、人間にとって書きやすい `move` を使い、裏では加算で実現する、というのがポイントです。⟦s000159-s000160⟧\n\n> 補足（授業中の発言）：講師は、ロード即値(load immediate)という命令も紹介しました。これは指定したレジスタに、定数値（即値）をロードするための命令で、補足として「疑似命令と組み込み命令の区別を言い間違えた」と訂正されています。⟦s000187-s000188⟧\n\n<!-- FIGURE: type=\"diagram\" title=\"疑似命令 move の展開\" description=\"左端に書かれたソースコード 'move $t0, $zero' から、矢印でアセンブラの変換段階を示し、右端に機械的に対応する組み込み命令 'add unsigned' ($8 = $0 + $0) とその結果としてT0(レジスタ8)に0が入ることを示す。疑似命令は組み込みハードウェア命令ではない点を注記する。\" -->\n\n## ⚠️ よくある混乱\n\n- **値と番号の混同**：`8` は T0 のレジスタ番号（識別子）であり、そのレジスタに入っている値ではありません。⟦s000034-s000035, s000118-s000122⟧\n- **疑似命令を本物の命令だと思う**：`move` は専用の機械語が存在せず、組み込み命令の組み合わせで実現されています。⟦s000102-s000106⟧\n- **ゼロレジスタ以外の初期値を信じる**：シミュレータで0に見えても、実機では前の値が残っていることがあります。⟦s000001-s000002, s000040⟧\n\n## 🎯 Key Takeaway\n\n- レジスタには、**名前（$t0 など）**と**番号（$8 など）**の二つの指定方法があり、どちらも同じレジスタを指します。⟦s000029-s000033⟧\n- **ゼロレジスタ**は常に0で、これを利用すると値の移動を加算だけで表せます。⟦s000050-s000052, s000113-s000115⟧\n- **疑似命令**は、人にとって書きやすい表記で、アセンブラが組み込み命令に変換することで実現されます。⟦s000105-s000107⟧", "2": "# 2. プログラムの構成と命令の実行\n\nアセンブリプログラムは、**データ**と**命令**を別々の領域に分けて書きます。定数は即値(immediate value)として直接レジスタに読み込めます。プロセッサは命令をメモリから順番に取り出して実行し、その前段階としてアセンブラが機械語を生成します。\n\n## 🔍 プログラムの2つの領域\n\nHello Worldのコードには、`.data`セグメントと`.text`セグメントという2つの部分がありました。`.data`はメモリにデータを置くための領域で、`.text`は命令をメモリに置くための領域です。[s000181-s000182]\n\n講義で示された例では、`.text`の下に書かれた行がすべて命令、`.data`と`.text`の間に書かれた行がメモリに保存されるデータです。Hello Worldでは、`.data`の中に文字列`hello world`が置かれ、それを画面に表示するために使われています。[s000292-s000296]\n\n> 命令もデータも最終的にはメモリに入ります。違いは、どの領域に書かれているかです。[s000183]\n\nここでいうメモリとは、レジスタではなくRAM(メインメモリ)のことです。レジスタもメモリの一種ですが、特別な種類の記憶域として分けて扱います。[s000185-s000186]\n\n## 🧭 セグメントの書き忘れと既定の扱い\n\n`.text`を書き忘れると、アセンブラはコードをデータとして扱ってしまいます。ある学生は`.data`だけを書いて`.text`を書かなかったため、命令が1つも機械語として生成されませんでした。指定を直すと問題は解決しました。[s000300-s000302]\n\nセグメントの指定が何もない場合も、アセンブラは全体をコードとみなします。つまり`.text`として扱われ、アセンブルは通ってしまいます。そのため、ミスに気づきにくい点に注意が必要です。[s000303-s000310]\n\n> 将来メモリを扱うようになると、データとコードが混ざった場合に動作が崩れてしまうため、セグメントの指定は重要になります。[s000312-s000314]\n\n## ⚙️ 即値ロード(load immediate)の動き\n\n講義で紹介された命令は`load immediate`で、宛先レジスタ(ここでは`T1`)に即値を読み込みます。即値は高級言語でいう定数に相当します。[s000187-s000188]\n\nここで使われた例は次のとおりです。\n\n```asm\n# load immediate: T1 に即値 34 を入れる\nli T1, 34\n```\n\n- **宛先レジスタ**: `T1`(値を受け取る場所)\n- **即値**: `34`(定数)\n- **進数**: 指定がなければ10進数として解釈されます。[s000199, s000221-s000222]\n\n34を16進数で表すと`22`になります。講義では、34を2倍の16から2を引いた値として見て、商と余りの各桁がどちらも2になることを確認しました。その結果、34は16進数で`22`と書けることが示されました。[s000223-s000232]\n\n## 🧪 実行例: 34がT1に入るまで\n\nコードは`load immediate`の1行だけで、メモリには何も置かれていません。実行前、レジスタはすべて0です。[s000245, s000257-s000258]\n\nプログラムを実行すると、34は`T1`に入ります。ただし、レジスタの表示は16進数になっているため、`T1`には`22`と表示されます。値そのものは10進数の34と同じです。[s000258-s000260]\n\n> 表示が16進数であっても、中身は同じ数値です。講義でも、16進数での変換作業からは逃れられないと強調されていました。[s000260-s000261]\n\n## 🔁 命令の実行順序\n\n命令は、基本的に書かれた順番に1つずつ実行されます。プログラムはメモリに置かれ、最初の命令が命令レジスタ(instruction register)に読み込まれて実行されます。[s000275-s000278]\n\n実行が終わるとプログラムカウンタ(program counter)が1つ進み、次の命令を読み込んで実行します。この繰り返しを、最後の命令まで続けます。[s000279-s000283]\n\n```mermaid\nflowchart TD\n    A[メモリからプログラムを読む] --> B[命令を命令レジスタに読み込む]\n    B --> C[命令を実行する]\n    C --> D[プログラムカウンタを1つ進める]\n    D --> E{次の命令があるか}\n    E -->|ある| B\n    E -->|ない| F[終了]\n```\n\n<!-- FIGURE: type=\"diagram\" title=\"命令の実行サイクル\" description=\"メモリ上のプログラムから最初の命令を命令レジスタへ読み込み、実行後にプログラムカウンタを1つ進めて次の命令を読み込むループを示す。命令がなくなった時点で終了する流れを描く。\" -->\n\nただし、順番どおりに進むのは現時点の話です。ループや分岐を使うと実行の流れを飛ばせますが、講義ではまだ扱っていないと説明されました。[s000284-s000287]\n\n## ✍️ コメントと記述の順序\n\nアセンブリでは、`#`(ナンバーサイン、ハッシュ)が書かれた場所から行末までがコメントになります。`//`や`/* */`のような書き方ではない点に注意してください。[s000261-s000265]\n\nまた、文の並び順は実行結果に影響します。`load immediate`で`T1`に値を入れてから`move`で別のレジスタに移すような流れは、順番が逆だと意味が変わってしまいます。[s000266-s000272]\n\n## 🎯 Key Takeaway\n\n- **データと命令は別々の領域**に書き、`.data`がデータ、`.text`が命令です。[s000182-s000183]\n- **`load immediate`**は定数を宛先レジスタに入れる命令で、指定がなければ10進数です。[s000188, s000199]\n- **命令は順番に実行され**、プログラムカウンタが1つずつ進みます。[s000279-s000282]\n- **`.text`の書き忘れ**は、コードがデータ扱いになる典型的なミスです。[s000300-s000302]", "3": "# 3. 算術命令とオペランド\n\n加算命令（add instruction）を使うと、レジスタの値どうしを足し算できます。さらに即値加算命令（add immediate）を使えば、定数を足すこともできます。命令の名前（ニーモニック）、命令の種類を決めるオペコード（opcode）、そして計算に使う値を指定するオペランド（operand）の役割を区別することが、アセンブリを読み書きする第一歩になります。\n\n## 🔍 加算命令（add）の基本\n\n加算命令は、**destination（結果の格納先）を必ず最初に書く**という約束で並びます。例えば `add T2, zero, T3` は「`zero` と `T3` を足して、その答えを `T2` に入れる」という意味です。講師も、ほぼすべての命令で最初のレジスタが結果の格納先になると説明しています。⟦s000374-s000376, s000385-s000386⟧\n\nここで使われている `zero` はゼロレジスタ（zero register）と呼ばれ、常に値が0です。そのため `add T2, zero, T3` は実質的に「`T2` に `T3` の値をコピーする」働きをします。⟦s000375, s000405⟧\n\n## ⚙️ 例題をステップ実行で追う\n\n講師が示したコードを、1行ずつ追って確認してみましょう。\n\n1. `li T1, 34`：即値の34（16進数で `0x22`）を `T1` に入れます。⟦s000322, s000399⟧\n2. `move T0, T1`：`T1` の中身を `T0` にコピーします。⟦s000401-s000402⟧\n3. `li T3, 1`：`T3` に1を入れます。`0x1` と10進数の `1` は同じ値なので、どちらで書いても同じ結果になります。⟦s000381, s000387-s000388⟧\n4. `add T2, zero, T3`：`0 + 1` を計算し、`T2` に `1` が入ります。⟦s000405-s000406⟧\n\nここで大切なのは、`T2` に入るのは **足し算の答えであって、足し算に使った元のレジスタではない** という点です。`T3` の中身は1のまま変わりません。⟦s000470-s000472⟧\n\n### 変更版：`T1` と `T3` を足す\n\n講師はコードを変え、`zero` の代わりに `T1` を足す形にしました。\n\n- `li T1, 34` → `T1` は `0x22`\n- `li T3, 1` → `T3` は `1`\n- `add T2, T3, T1` → `1 + 0x22 = 0x23` が `T2` に入る\n\n結果は `0x23` になります。講師はこの結果を、ステップ実行で確認しながら追いました。⟦s000435-s000444⟧\n\n> 補足：`T3` を上書きしているのは「`li T3, 1`」の行だけです。加算の結果は常にdestinationに書かれ、ここでは `T2` になります。⟦s000470-s000472⟧\n\n## 🆚 加算命令（add）と即値加算命令（addi）の違い\n\n即値加算命令（add immediate）は、加算命令とほとんど同じ仕組みですが、**最後のオペランドが定数（即値）** になります。命令名は `add` に即値を表す `i` を付けて `addi` と書きます。⟦s000479-s000485, s000497⟧\n\n| 項目 | 加算命令 `add` | 即値加算命令 `addi` |\n|---|---|---|\n| 書き方 | `add T4, T2, T1` | `addi T4, T1, 1` |\n| 最後のオペランド | レジスタ | 即値（定数） |\n| 意味の例 | `T2 + T1` を `T4` へ | `T1 + 1` を `T4` へ |\n\n具体例として `addi T4, T1, 1` を考えます。これは「`T1` の値に1を足し、その結果を `T4` に入れる」という命令です。講師は、コードの中で「1を足す」という処理がよく登場するため、この命令は便利だと述べています。⟦s000476-s000478, s000488⟧\n\nなお、即値は特に指定がなければ **10進数として扱われます**。だから `addi T4, T1, 1` の `1` は10進数の1です。⟦s000483⟧\n\n### 名前の由来\n\n講師は、`i` が immediate（即値）の頭文字であることを説明しています。`li`（load immediate）も同じ理由で名前が付いています。最後のカンマの後に書く値がレジスタ名ではなく定数であることを、名前で示しているのです。⟦s000496-s000501⟧\n\n## 🧩 命令の構造：ニーモニック・オペコード・オペランド\n\n命令は、次の3つの部分に分けて考えると理解しやすくなります。\n\n- **ニーモニック（mnemonic）**：`add` のように、人間が読める命令名です。⟦s000526⟧\n- **オペコード（opcode）**：算術論理演算装置（Arithmetic Logic Unit, ALU）に「加算をしろ」「XORをしろ」「減算をしろ」などと指示する制御情報です。ニーモニックは、このオペコードを人間が読める名前で表したものです。⟦s000526-s000527⟧\n- **オペランド（operand）**：命令が計算に使う値や格納先を指定する部分です。⟦s000529⟧\n\nオペランドは、役割によって次のように分けられます。\n\n1. **格納先（destination）**：計算結果を書き込む場所です。加算では必ず書くものとして扱われます。⟦s000529-s000530⟧\n2. **加数（add-ins）**：足される値です。数学では加数、和（sum）と呼ばれるものが、アセンブリではそれぞれオペランドという名前で呼ばれます。⟦s000535-s000541⟧\n\nつまり `add T4, T2, T1` では、`add` がオペコードの名前、`T4` が格納先、`T2` と `T1` が加数（ソースのオペランド）にあたります。⟦s000526-s000533⟧\n\n## ⚠️ 注意すべき制約\n\n即値を扱うときには、いくつかのルールがあります。\n\n- **即値は最後のオペランドにしか置けません。** `addi` で即値が使えるのは、最後の位置だけです。⟦s000494-s000495⟧\n- **2つの即値を足すことはできません。** 例えば「3 + 5」を直接書くような命令は存在しません。これは高水準言語（high level code）の書き方で、アセンブリでは書けません。⟦s000507, s000514-s000516⟧\n- **即値とレジスタを組み合わせた命令は、即値を使う専用の名前が付いています。** 2つのレジスタを足したいなら、即値のない `add` を使います。⟦s000517-s000523⟧\n- **既定の動作はレジスタだけを扱うことです。** 即値は、明示的に指定されたときにだけ使われます。⟦s000525⟧\n\n講師は、学生の質問「`addi` と `add` の違いは、定数を使うかどうかだけか」に対して、その通りだと答えています。一方は即値オペランドを使い、もう一方はレジスタを使うという違いです。⟦s000544-s000547⟧\n\n## 🎯 Key Takeaway\n\n- **結果は最初のオペランドに入る**：`add` でも `addi` でも、destinationは最初に書きます。⟦s000374, s000385⟧\n- **`add` はレジスタどうし、`addi` は最後だけ即値**：即値を使うときは、命令名に `i` を付けます。⟦s000497, s000547-s000548⟧\n- **オペコードは計算の種類、オペランドは計算の材料**：ニーモニック、オペコード、オペランドの役割を分けて読むと、命令の意味がすぐわかります。⟦s000526-s000529⟧\n- **同じ計算でも、命令は細かく分かれる**：高水準言語で一文で書けることも、アセンブリでは複数の命令に分けて書く必要があります。⟦s000564-s000565⟧", "4": "# 4. レジスタの値交換とアセンブリの利用\n\n二つのレジスタの値を入れ替える処理は、一見すると命令2つで済みそうですが、実際には**一時的に値を退避させるための第三のレジスタ**が必要になります。この小さな課題を通して、アセンブリがどのような水準の処理を書く言語なのか、そして一時レジスタと保存レジスタの扱いがなぜ重要なのかを見ていきます。\n\n## 🔍 課題：T0 と T1 の値を入れ替える\n\n最初の課題は、`T0` に入っている値と `T1` に入っている値を**互いに入れ替える**コードを書くことです。具体的には、`T0` の値を `T1` へ、`T1` の値を `T0` へ移します。⟦s000552-s000553⟧\n\n実際にアセンブリで書く前に、高水準言語（high-level language）で手順を考えておくことが勧められています。紙に書くか、コメントとして残しておくと、後で誤りに気づきやすくなります。⟦s000554⟧\n\n## ❌ 直接 move で入れ替えると失敗する理由\n\n最初に思いつきやすいのは、次の2つの `move` を順番に実行する方法です。\n\n1. `move` で `T1` に `T0` の値を入れる\n2. `move` で `T0` に `T1` の値を入れる\n\nしかし、この方法では正しく入れ替わりません。1つ目の命令で `T1` に `T0` の値を書き込んだ時点で、**もともと `T1` にあった値は上書きされて失われる**からです。⟦s000646-s000649, s000655-s000657⟧\n\nつまり、2番目の命令が `T0` に書き込むべき元の `T1` の値は、もう存在しない状態になっています。ここでの核心は、**書き込みが上書きであり、消えた値は取り戻せない**という点です。⟦s000652, s000656⟧\n\n## ✅ 一時レジスタを使った正しい交換\n\n上書きを防ぐには、どこか別の場所に値を一時的に退避させる必要があります。講義では第三のレジスタ `T2` を使う方法が示されました。⟦s000658-s000660⟧\n\n手順は次のとおりです。\n\n1. `T1` の値を `T2` に退避する（保存先が一時記憶になる）\n2. `T0` の値を `T1` にコピーする\n3. `T2` に退避しておいた元の `T1` の値を `T0` にコピーする\n\n```\nmove T2, T1    # T1 の値を一時的に T2 へ退避\nmove T1, T0    # T0 の値を T1 へ\nmove T0, T2    # 退避していた元の T1 の値を T0 へ\n```\n\nこの3命令で、二つのレジスタの値は正しく入れ替わります。講義では「二つのレジスタを交換するには三つのレジスタが必要になる」とまとめられ、2命令では実現できないことが強調されました。⟦s000661-s000665⟧ ⟦s000697-s000698⟧\n\nなお、検証のために `T1` と `T0` に仮の値（例として 3 と 2）を読み込んでから交換を確かめる方法も示されました。これは交換そのものの一部ではなく、動作確認のためのテスト用の値です。⟦s000709, s000711⟧\n\n### 💡 4命令になるケースについて\n\n受講者の中には4命令で書いた人もいました。余分な1命令は、一時レジスタを使い終えた後に値を0にリセットするためのものです。講義ではこれは誤りではなく、課題の仕様上は必須ではないものの、害はないと説明されています。⟦s000704-s000707⟧\n\n## 📝 一時レジスタ規約と保存レジスタ規約\n\nここで重要になるのが、レジスタの使い方に関する**規約（convention）**です。講義で扱われた二種類の規約は次のとおりです。⟦s000687-s000691⟧\n\n- **一時レジスタ規約（temporary-register convention）**\n  - `T` 系のレジスタは、自由に値を書き換えてよいとされています。\n  - 今回の交換で `T` レジスタを使っているのは、この規約によって安全に扱えるためです。\n- **保存レジスタ規約（saved-register convention）**\n  - `S` 系のレジスタは、使い終えたら**元の値に戻す**ことが規約になっています。\n  - この扱いは手続き（procedure）を学ぶ段階で詳しく扱うと説明されました。\n\n受講者からは、一時レジスタを使ったあとにプログラム終了時の後始末が必要かという質問も出ました。これに対しては、その問題は手続きの話になると詳しく扱うという形で回答されています。⟦s000683-s000686⟧\n\nまた、3つのレジスタを使って入れ替えるという考え方は、ハノイの塔の手順と似ているという指摘もありました。ただし講義では、元の位置に戻す工程が今回の課題には含まれていないと補足されています。⟦s000692-s000695⟧\n\n## ⚙️ なぜアセンブリで書くのか：高水準言語との比較\n\n同じ処理でも、アセンブリでは高水準言語よりも多くの命令に分解されます。一つの操作が簡単に書ける高水準言語に比べ、アセンブリは非常に冗長（verbose）になるということです。⟦s000564-s000566⟧ ⟦s000571-s000572⟧\n\n講義で紹介された研究では、人間が書くコードの量は、高水準言語でもアセンブリでもほぼ同じだと報告されています。アセンブリは一行あたりの情報量が少ないため、同じ量のコードを書くのに時間がかかることになります。⟦s000567-s000570⟧ ⟦s000573⟧\n\nこの違いから、役割の使い分けが導かれます。\n\n- **大規模なシステムの開発**：高水準言語で書いた方が効率的です。⟦s000574-s000575⟧\n- **小さな最適化やセキュリティの確認**：アセンブリに降りて作業するのが有効です。⟦s000576-s000578⟧\n\n## 🕰️ アセンブリ利用の歴史と最適化\n\nかつてアセンブリは、メモリや命令数を節約するための最適化に使われていました。講義では、メモリが非常に限られた機器（例として補聴器が挙げられました）では、命令の数やサイズを減らしたいという要求があったと説明されました。⟦s000580-s000585, s000589-s000590⟧\n\nただし現在は、コンパイラ（compiler）の性能が大きく向上したため、手で最適化する必要性は小さくなっています。大多数の人が高水準言語で書いているため、コンパイラの改良に多くの努力が注がれてきたという背景もあります。⟦s000580-s000581, s000592-s000593⟧\n\n一方で、セキュリティ上の弱点の多くは、高水準プログラマが書いたコードと、実際に実行される機械語（バイナリ）との間の**ずれ**から生じると指摘されました。ここでアセンブリの知識が役立ちます。⟦s000594-s000596⟧\n\n講義では、アセンブリを学ぶ意義は3つに整理されました。⟦s000597-s000599⟧\n\n1. 高水準言語のプログラマとして、より良いコードを書けるようになること\n2. 扱っているシステムの仕組みを理解すること\n3. ごく一部の人がアセンブリプログラマとして実際にコードを書くこと\n\nなお、アセンブリから高水準言語へ移行した理由については、講義内で明確な結論が出ませんでした。講師は、パイプライン処理の改善よりも、手書きの最適化が難しくなったことやコンパイラの影響が大きいと考えていることを示しています。⟦s000621-s000626⟧\n\n## 🎯 Key Takeaway\n\n- **二つのレジスタの交換には、値を退避させる第三のレジスタが必要**です。直接 `move` を2回行うと、先に書き込んだ値が失われます。⟦s000652, s000661-s000663⟧\n- **`T` レジスタは自由に書き換えてよく、`S` レジスタは元に戻すのが規約**です。⟦s000688-s000690⟧\n- **アセンブリは冗長で書くのに時間がかかるため、大規模開発では高水準言語が適しており、アセンブリは小さな最適化やセキュリティ確認に向いています。**⟦s000574-s000578⟧", "5": "# 5. ビット論理演算とNOTの実現\n\nビット論理演算は、レジスタの値を**1ビットずつ**独立に組み合わせる命令です。専用のNOT命令が用意されていなくても、**NOR命令**と**ゼロレジスタ**を組み合わせればNOTと同じ結果を作れます。\n\n## 🔍 ビット論理演算の基本形\n\nAND、OR、XORなどの論理演算は、算術命令と同じく**3つのオペランド**を取ります。書式は「結果を入れる先のレジスタ」「1つ目のソースレジスタ」「2つ目のソースレジスタ」の順です。\n\n- **AND演算（AND operation）**: `AND T3, T1, T0` は、T3にT1とT0の値のANDを入れる命令です。⟦s000721-s000724⟧\n- **OR演算（OR operation）**: 書式はANDと同じで、宛先とソースレジスタ2つを取ります。⟦s000725-s000727⟧\n- **XOR演算（XOR operation）**: 演算子の一つとして扱われ、後半のラボで使います。⟦s000818⟧\n\nANDには、即値を使う**AND immediate**もあります。今回は通常のANDを中心に扱います。⟦s000722⟧\n\n> 補足: これらの命令のニーモニックは、ALU（算術論理演算装置）で演算を行うことを指示するオペコードに対応しています。⟦s000733-s000736⟧\n\n## 🚫 NOT命令がない理由\n\nNOT命令（NOT operation）は、組み込みの命令としては用意されていません。設計者はオペコードのビットを節約するため、NOT専用の命令を置かない方針を選びました。⟦s000753-s000754⟧\n\nその代わりに用意されているのが**NOR命令（NOR instruction）**です。NOR命令は、2つのソースレジスタの値をNORした結果を宛先レジスタに書き込みます。⟦s000756-s000758⟧\n\nここで重要なのは、NORが「2つの入力をORしてからNOTする」演算だという点です。つまりNOTが欲しければ、ORの結果がそのままNOTに変わるような入力の組み合わせを作ればよいことになります。⟦s000758-s000759⟧\n\n## ⚙️ NORを使ってNOTを作る\n\nNOTを作るには、NORの2つの入力のうち片方を工夫します。\n\n1. **A NOR A**: 両方の入力にAを使います。AのORはAそのものになるので、結果はAのNOT、つまり\\( \\overline{A} \\)になります。⟦s000765-s000766⟧\n2. **A NOR 0**: 片方の入力をゼロにします。Aと0のORはAなので、結果は同じくAのNOTになります。⟦s000761-s000763⟧\n\nどちらの方法でも、結果はNOTと同じになります。ただし、2つ目の入力に1を使うと結果がAに依存しなくなるため、NOTは作れません。⟦s000764⟧\n\n実装では、この考え方がそのまま使われています。NOTは「宛先レジスタを指定し、もう一方の入力にゼロレジスタを使うNOR」として実装されており、この形がマクロ命令の代わりに使われる組み込み命令になります。⟦s000772-s000779⟧\n\n```\nNOT T3, T1   ≡   NOR T3, T1, $zero\n```\n\n> 注意: 講義内では、ゼロレジスタを使う方法と、同じ値を二つ与える方法の両方が成り立つと確認されました。実装では前者（ゼロレジスタ）が採用されています。⟦s000769, s000772-s000777⟧\n\n## 💡 例: 5のNOTを16進数で確認\n\n講義では、具体的な値で「ビットを反転する」ことを確かめました。\n最初に0のNOTを考えると、0のビットはすべて1になり、16進数ではすべてFになります。⟦s000834-s000840⟧\n\n次に5を考えます。5を2進数で4桁にすると`0101`で、各ビットを反転すると`1010`になります。これを16進数に直すと**A**です。講義中の発話では一時的に「K」と聞こえましたが、`1010`の16進表記は**A**です。⟦s000842-s000848⟧\n\nこの例で伝えたかったポイントは、NOTは値そのものではなく**ビット表現（binary representation）**を反転する操作だということです。もとの値の先頭にある0も反転されるため、上位の桁はすべてFになります。⟦s000835-s000837⟧\n\n## 🧪 ラボ課題の進め方\n\nラボでは、自分で2つの整数を選んでレジスタに保存し、結果を確かめます。⟦s000808-s000813⟧\n\n- 2つの整数をレジスタに入れる。\n- その2つに対してORとXORを計算する。\n- それぞれの値のNOTを計算する。⟦s000814-s000819⟧\n- T7には、複数の命令が必要になるようなより複雑な式を書く。⟦s000821-s000823⟧\n\n整数の選び方も課題の一部です。テストに向いた値を選ぶことが、ビット演算の動きを確認するうえで重要になります。⟦s000812-s000813⟧\n\n## 🎯 重要ポイント\n\n- **AND、OR、XOR**は、宛先とソース2つを取る3オペランドの命令です。\n- **NOT専用命令は存在せず**、NOR命令を使って実現します。\n- NOTは**A NOR A**または**A NOR 0**で作れます。ゼロレジスタを使う形が実装として採用されています。\n- ビット反転は値ではなく**ビット表現**に対する操作なので、16進数で見ると結果が分かりやすくなります。"}, "fun_facts": {"title": "CPUの中で起きている「翻訳劇」 🖥️", "hook": "実はあなたのパソコンのCPUは、書かれた命令をそのまま実行していないのをご存知ですか？命令は見えない場所で、まったく別の形に次々と作り替えられています！", "body": "疑似命令が「書きやすい表記を本物の命令に置き換える」仕組みだと知ると、今の時点で既に、CPUの内部でも同じ発想が使われていると気づいて鳥肌が立つはずです。\n\n1970年代に生まれたx86という命令セットは、一つの命令で複雑な処理をこなせる反面、そのままでは高速に実行しにくいという弱点を抱えていました。\n\nそこでIntelなどのプロセッサは、複雑な命令を「uOps（マイクロオペレーション）」と呼ばれる単純な内部命令へ、実行中にリアルタイムで分解しています⟦1⟧。\n\nさらに一度分解した結果は「マイクロオペレーション・キャッシュ」に保存され、同じ処理が再び来たときには翻訳の手間を省いて一気に実行されます⟦1⟧。\n\nつまり、あなたがソフトウェアを書くたびに、その裏では小さな翻訳者たちが絶えず働いているのです。次の授業で「なぜ一つの命令で済むのか」を学ぶとき、この見えない翻訳劇を思い出してみてください。", "sources": []}}, "ran": ["deep_notes", "fun_facts", "review_cards"], "checks": {"review_cards": {"calls": 5, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 4211, "exclamations": 10, "question_marks": 2, "citations": 56, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 13, "input_tokens": 65378, "output_tokens": 11544, "max_output_tokens_single_call": 3533, "sum_call_seconds": 61.4, "max_call_seconds": 17.08, "topics": 5, "topics_with_bad_card_sequence": 2}, "deep_notes": {"calls": 5, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 15345, "exclamations": 2, "question_marks": 0, "citations": 110, "malformed_citations": 1, "placeholder_leak": 0, "english_gloss_parens": 46, "input_tokens": 49588, "output_tokens": 18801, "max_output_tokens_single_call": 4462, "sum_call_seconds": 92.0, "max_call_seconds": 21.29}, "fun_facts": {"calls": 1, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 499, "exclamations": 1, "question_marks": 1, "citations": 2, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 3912, "output_tokens": 511, "max_output_tokens_single_call": 511, "sum_call_seconds": 3.5, "max_call_seconds": 3.49, "fun_fact_sources": 0}}, "errors": {}}, "v1b": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🍳", "title": "CPUの作業台", "content_blocks": [{"type": "paragraph", "text": "前回は、命令がCPUに処理を伝える単位で、データは主記憶からレジスタに取り込んでから計算されるという話をしましたね。今日はその「レジスタ」を実際に手で触っていきます。"}, {"type": "quote", "text": "レジスタは、料理人の手元にある作業台のようなもの。材料を一時的に置いて、すぐ手を動かせる場所なんです！"}]}, {"card_type": "core_why", "hero_emoji": "🗂️", "title": "名前が付いた引き出し", "content_blocks": [{"type": "paragraph", "text": "レジスタ（register）は、CPUの中にある小さな保管場所です。ただし、どの引き出しにも同じように値が入っているわけではありません。特別なのは**ゼロレジスタ（zero register）**で、ここには常に0が入っています。他のレジスタは、前の値が残っていることもあるので注意が必要です。 ⟦s000001-s000003⟧"}, {"type": "paragraph", "text": "引き出しには、用途に応じた名前が付いています。**一時レジスタ（temporary register）**であるTは計算の途中で使い、**引数レジスタ（argument register）**であるAは手続きに値を渡すために使います。Sは、いわば広く共有される変数のような役割です。 ⟦s000004-s000008⟧"}, {"type": "callout", "alert_type": "info", "text": "先生のポイント：このレジスタは「どこかに値を置く場所」なので、計算のための作業はすべてここを経由する。名前は覚えやすさのためのものです！ ⟦s000011-s000012⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🎭", "title": "moveは本物の命令じゃない", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "moveのような命令は、CPUに最初から備わっている命令ではありません。こうした**疑似命令（pseudo-instruction）**は、既存の命令を組み合わせた「便利な呼び名」にすぎないのです。 ⟦s000079-s000081⟧"}, {"type": "paragraph", "text": "では、なぜmoveが動くのでしょうか。アセンブラは、moveを内部で「add命令」に置き換えています。0番レジスタと0番レジスタの値を足し、結果を8番（T0）に入れる、という形です。0を足しても値は変わらないので、結果として「0をT0に入れる」のと同じになります。 ⟦s000097-s000116⟧"}, {"type": "code", "language": "mips", "code_string": "move $t0, $zero   # 人間が書く疑似命令\nadd  $8, $0, $0   # アセンブラが変換した本物の命令", "explanation": "人間が読みやすい書き方を、CPUが実行できる形にアセンブラが変換しています。 ⟦s000097-s000116⟧"}, {"type": "paragraph", "text": "さらに、番号で書いても名前で書いても同じ意味になります。T0は8番のレジスタなので、どちらで書いても結果は変わりません。 ⟦s000117-s000133⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩へ", "content_blocks": [{"type": "paragraph", "text": "今回は、レジスタが名前付きの作業スロットであることと、ゼロレジスタだけが常に0である理由を学びました。疑似命令のmoveは、アセンブラがadd命令に置き換えていることも確認できましたね。"}, {"type": "paragraph", "text": "今回のカードでは触れきれなかった部分は、ぜひ自分で調べてみてください。"}, {"type": "list", "items": ["K0、K1、GP、SP、FP、RA、PC、ATといった特殊なレジスタの役割 ⟦s000013-s000014⟧", "add unsignedのunsignedが何を意味するのか ⟦s000110-s000111⟧"]}, {"type": "paragraph", "text": "次は、データセグメントやテキストセグメントといったプログラムの構成と、命令がどう実行されるかを見ていきます。プログラムカウンタや命令レジスタも登場するので、お楽しみに！"}]}], "2": [{"card_type": "hook", "hero_emoji": "🧳", "title": "知らないまま詰めた荷物", "content_blocks": [{"type": "quote", "text": "Hello Worldを「よくわからないまま打ち込んだ」あなたは、中身を知らずに荷物を詰めて旅に出た人と同じです！"}, {"type": "paragraph", "text": "安心してください。中身は今すぐわからなくて大丈夫。授業が進むにつれて、一行一行の意味がだんだん見えてきます。今日はその「荷物の中身」を少しずつ開けていきましょう！⟦s000172-s000179⟧"}]}, {"card_type": "core_why", "hero_emoji": "🗂️", "title": "プログラムは二つの区画に分かれる", "content_blocks": [{"type": "paragraph", "text": "アセンブリのプログラムは、大きく分けて**データセグメント（.data segment）**と**テキストセグメント（.text segment）**の二つでできています。⟦s000181-s000182⟧"}, {"type": "callout", "alert_type": "info", "text": "ポイントは、どちらも同じ主記憶（main memory）の中に置かれること。命令も、保存されるデータも、みんなメモリに入ります。⟦s000183-s000185⟧"}, {"type": "code", "language": "text", "code_string": ".data  -> 保存するデータ（文字列など）\n.text  -> 命令（コードそのもの）", "explanation": ".dataの下は「データを置く場所」、.textの下は「命令を並べる場所」だと覚えましょう。⟦s000292-s000296⟧"}, {"type": "paragraph", "text": "そして**即値（immediate value）**は、コードの中に直接書かれた定数のこと。**即値ロード（load immediate）**は、その定数をレジスタに入れる命令です。⟦s000187-s000188⟧ 特に指定がなければ、この数値は10進数として扱われます。⟦s000199⟧"}, {"type": "paragraph", "text": "ここからが大事なところ。プログラムは「命令の置き場所」から一行ずつ取り出されて実行されます。その途中で使われるのが**命令レジスタ（instruction register）**と**プログラムカウンタ（program counter）**です。⟦s000275-s000276⟧"}, {"type": "list", "items": ["① 次に実行する命令が主記憶から命令レジスタに読み込まれる ⟦s000276-s000277⟧", "② 命令が2進数として実行される ⟦s000278⟧", "③ 実行が終わるとプログラムカウンタを1つ進める ⟦s000279⟧", "④ 次の命令を読み込み、同じことを繰り返す ⟦s000281-s000282⟧"]}]}, {"card_type": "gotcha", "hero_emoji": "🚨", "title": ".textを忘れると命令がデータになる", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "教授いわく「よくあるミス」は、.dataだけ書いて.textを書き忘れること。アセンブラは命令をデータとして扱ってしまい、コードが一切並ばなくなります。⟦s000300-s000301⟧"}, {"type": "paragraph", "text": "では、区画の指定を何も書かなかったらどうなるでしょう？答えは「全部コードとみなされる」。エラーにもならずに組み立てが進んでしまうので、気づきにくいのが厄介です。⟦s000303-s000307⟧"}, {"type": "paragraph", "text": "これが、主記憶に置いたデータと命令の区別を、アセンブラが正しく理解する必要がある理由です。区切りを間違えると、プログラム全体がぐちゃぐちゃになってしまいます。⟦s000313-s000314⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩とこれから", "content_blocks": [{"type": "paragraph", "text": "今回は、プログラムが.dataと.textの二つの区
