ためのサンク（thunk）に迫ります。"}]}], "3": [{"card_type": "hook", "hero_emoji": "🍳", "title": "レシピか、材料の組み合わせか", "content_blocks": [{"type": "quote", "text": "手続き型は「次にこれをやって、その次はあれ」というレシピ、関数型は「材料を組み合わせて料理を作る」発想だ！"}, {"type": "paragraph", "text": "手続き型では変数を書き換えながらループや文を順番に実行していく。関数型では、関数を呼び出して結果を次の関数へ渡していく流れで計算が進む。"}]}, {"card_type": "core_why", "hero_emoji": "🧊", "title": "同じ入力なら、いつ呼んでも同じ答え", "content_blocks": [{"type": "paragraph", "text": "純粋関数（pure function）は、同じ入力に対して必ず同じ出力を返す関数だ。⟦s000415-s000417⟧"}, {"type": "callout", "alert_type": "info", "text": "答えが毎回同じなら、呼ぶ順番を入れ替えてもOK。使わないなら呼ばなくてもOKなんだ！⟦s000418-s000422⟧"}, {"type": "paragraph", "text": "だからコンパイラは、先に計算したほうが速いほうを選んだり、どうしても必要ない計算を丸ごと省いたりできる。⟦s000421-s000422⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⏳", "title": "C++は上から律儀に、Haskellは必要な時だけ", "content_blocks": [{"type": "paragraph", "text": "C++では、func1が外部のファイルやグローバル変数を書き換えるかもしれないので、func2より先に呼ぶ順番を守る必要がある。⟦s000390-s000398⟧"}, {"type": "paragraph", "text": "その結果、コンパイラは順番を入れ替える最適化をためらう必要がある。⟦s000408-s000410⟧"}, {"type": "callout", "alert_type": "warning", "text": "Haskellは上から順に計算しない。値が本当に必要になるまで計算を保留する遅延評価（lazy evaluation）が基本原理だ！⟦s000431-s000434⟧"}, {"type": "paragraph", "text": "例えばz==7なら、ifはyを使わずに0を返す。そのためfunc1は一度も呼ばれない。⟦s000436-s000442⟧"}, {"type": "paragraph", "text": "引数も同じで、g of xはまだ計算されず、「使われたら計算するメモ」のようなサンク（thunk）として渡される。使われなければ計算されない。⟦s000475-s000479⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "必要になるまで待つ計算", "content_blocks": [{"type": "paragraph", "text": "純粋関数だから呼ぶ順番は自由になり、Haskellは値が必要になるまで計算を遅らせる。この発想が関数型の強みの一つだ。"}, {"type": "paragraph", "text": "もっと深く知りたい人は、次のトピックも覗いてみてね:"}, {"type": "list", "items": ["マルチスレッドを関数型で扱いやすい理由 ⟦s000356-s000357⟧", "サンク（thunk）が内部でどう値を保持し、計算するかの仕組み ⟦s000477-s000478⟧", "初期Haskellが入出力を持たなかった理由と、その後の解決法 ⟦s000511-s000517⟧"]}, {"type": "paragraph", "text": "でも、関数の形を宣言する関数シグネチャ（function signature）や、型を自動で見抜く型推論（type inference）はどう関係してくるんだろう？次回の講義で一緒に見ていこう！"}]}], "4": [{"card_type": "hook", "hero_emoji": "🕵️", "title": "名探偵コンパイラ", "content_blocks": [{"type": "quote", "text": "Haskellは、関数の中身という『手がかり』だけで犯人（型）を見抜く名探偵のような言語です。"}, {"type": "paragraph", "text": "「この変数は比較されている、ならば整数に違いない」と推理を積み重ねていきます。だからプログラマが型を全部書かなくても、ちゃんと型は決まっているのです。"}]}, {"card_type": "core_why", "hero_emoji": "📐", "title": "数式みたいに書ける関数", "content_blocks": [{"type": "paragraph", "text": "Haskellの関数は、数学の式をそのまま書くイメージです。イコールは『代入』ではなく『これは〇〇を表す』という定義を意味します。 ⟦s000566⟧⟦s000567⟧⟦s000570⟧"}, {"type": "code", "language": "haskell", "code_string": "poly :: Double -> Double\npoly x = 3 * x ^ 2", "explanation": "1行目が型シグネチャ（引数の型 → 戻り値の型）、2行目が本体です。最後の型が戻り値の型になります。 ⟦s000594⟧⟦s000603⟧⟦s000637⟧⟦s000639⟧"}, {"type": "callout", "alert_type": "info", "text": "**returnは書きません。** 式をそのまま書けば、その値が自動的に返ります（暗黙のreturn）。また、引数は括弧なしで並べ、呼び出しもpoly 2のようにスペースで区切るだけです。 ⟦s000620⟧⟦s000624⟧⟦s000653⟧⟦s000654⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🚫", "title": "推理はするが、嘘は許さない", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "**型推論の鍵は『比較する相手』です。** isOldでは年齢を整数と比べているので年齢は整数、ハスキーの値をTrueと比べているので真偽値と推論されます。また、ORの結果は真偽値になるので戻り値も真偽値と決まります。 ⟦s000757⟧⟦s000758⟧⟦s000761⟧⟦s000766⟧⟦s000767⟧"}, {"type": "paragraph", "text": "ここで大事なのは、推論は『自動変換』ではないという点です。整数と真偽値を暗黙に変換することは絶対にせず、型が合わなければエラーになります。 ⟦s000772⟧⟦s000773⟧⟦s000774⟧"}, {"type": "callout", "alert_type": "info", "text": "**教授の教え：** 型シグネチャは基本的に書かなくてよく、Haskellは型を推論してくれます。ただし、どの値や関数にも型は必ず1つに決まっています。 ⟦s000799⟧⟦s000801⟧⟦s000849⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "関数定義の全体像をつかもう", "content_blocks": [{"type": "paragraph", "text": "今回は、GHCIで関数を読み込んで動かす流れから、型シグネチャと暗黙のreturnを含む関数定義の書き方、そして型推論と厳格な型チェックの仕組みまでを学びました。"}, {"type": "paragraph", "text": "Curious? Dig into these too:"}, {"type": "list", "items": ["カリー化と部分適用（is greater 1のような呼び出しが何を作るのか） ⟦s000695⟧⟦s000697⟧", "型シグネチャを省いたときに、数値の型がNumに既定される仕組み ⟦s000785⟧⟦s000789⟧", "型シグネチャがこの一列の書式になっている理由 ⟦s000686⟧⟦s000687⟧"]}, {"type": "paragraph", "text": "次は、演算子の優先順位や左結合、そしてif式やガードでどう条件分岐するかを見ていきます。推論された型と条件式の関係が、どこでどうつながるのか楽しみにしておいてください！"}]}], "5": [{"card_type": "hook", "hero_emoji": "🧭", "title": "左から順に読む機械", "content_blocks": [{"type": "quote", "text": "Haskellは関数の呼び出しを、まるで文章を読むように左から順に食べていく！"}, {"type": "paragraph", "text": "数学の感覚で \\(f\\ g\\ 2\\) を見ると「先に \\(g\\ 2\\) を計算してくれるはず」と思いたくなるけど、Haskellは一つずつ左から噛みしめていく。その癖を知っているかどうかで、結果が大きく変わるんです。"}]}, {"card_type": "core_why", "hero_emoji": "🔗", "title": "左結合と括弧のルール", "content_blocks": [{"type": "paragraph", "text": "Haskellは関数適用を左から評価するので、関数適用は左結合（left associative）になる。そのため \\(f\\ g\\ 2\\) は「fにgを渡し、その結果に2を渡す」と解釈され、fがgを受け取れないとエラーになる。⟦s000914⟧⟦s000915⟧⟦s000916⟧"}, {"type": "code", "language": "haskell", "code_string": "f (g 2)   -- 正しく 36 になる\nf g 2     -- 左から解釈されてエラー", "explanation": "やりたい順番を、括弧で明示するのが鉄則。⟦s000947⟧⟦s000954⟧"}, {"type": "paragraph", "text": "括弧は、評価の順番を意図どおりにするために使う。ただし必要な場所だけに付けるのがきれいな書き方です。⟦s000954⟧⟦s000955⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "関数呼び出しは演算子より強い", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Pro-Tip：Haskellでは関数呼び出しが、かけ算などの演算子より優先される！ \\(f\\ 3 * 10\\) は \\(f(3) \\times 10\\) として読まれる。⟦s000963⟧⟦s000965⟧⟦s000966⟧"}, {"type": "paragraph", "text": "演算子は、中置で書いた `+` を括弧で囲むと前置の関数呼び出しになる。`(+) 2 4` は2と4を受け取る普通の関数として働き、`(+) 2 4 * 5` は先に足し算を行うので 30 になる。⟦s001012⟧⟦s001015⟧⟦s001040⟧⟦s001042⟧"}, {"type": "paragraph", "text": "つまり、普段の算術の優先順位より、関数呼び出しが一段上にあると覚えておくと迷いません。⟦s001044⟧⟦s001047⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "if式とガードで分岐を書こう", "content_blocks": [{"type": "paragraph", "text": "今回は、Haskellが関数適用を左から評価することと、関数呼び出しが演算子より優先されることを学びました。さらに、ifは文ではなく式なので必ずelseが必要で、ガードはそれを読みやすくしたシンタックスシュガーだと分かりました。⟦s001093⟧⟦s001098⟧⟦s001133⟧⟦s001206⟧"}, {"type": "paragraph", "text": "Make sure to cover these:"}, {"type": "list", "items": ["部分適用（関数を引数として渡す具体例）", "ガードのネストや、ifとガードの併用可否", "階乗をifとガードで書き比べる詳細", "パターンマッチング"]}, {"type": "paragraph", "text": "次は、関数の引数の形で場合分けできるパターンマッチングという仕組みへ進みます。ガードで培った『上から順に条件を見る』感覚が、そのまま役立つはずです！"}]}], "6": [{"card_type": "hook", "hero_emoji": "🍳", "title": "下ごしらえのレシピ", "content_blocks": [{"type": "quote", "text": "関数の中に小さな部品を先に並べておくと、料理のレシピみたいにスッと読めるようになる!"}, {"type": "paragraph", "text": "料理本に「下ごしらえ」の欄があると、本文の手順が一気にわかりやすくなりますよね。Haskellの局所定義は、まさにその下ごしらえの役割を果たしてくれます。"}]}, {"card_type": "core_why", "hero_emoji": "🧱", "title": "部品を中に隠す発想", "content_blocks": [{"type": "paragraph", "text": "階乗の関数は、自分自身を呼び出して答えを少しずつ組み立てる再帰（recursion）で書けます。まずは「0かどうか」を確認し、違えば1つ小さい数で同じ処理を呼ぶ、という形です。⟦s001253-s001259⟧"}, {"type": "callout", "alert_type": "info", "text": "let式やwhere節は、その関数の中だけで使える局所変数（local binding）を作る道具です。⟦s001366-s001367⟧"}, {"type": "paragraph", "text": "円の面積の例では、円周率の値を別の名前で先に決めておき、本体はその名前を使うだけにできます。読む人は本体の計算ロジックに集中できるんです。⟦s001434-s001436⟧"}, {"type": "code", "language": "haskell", "code_string": "circleArea r = piVal * r * r\n  where piVal = 3.14159", "explanation": "本体は短く読め、細かい値の計算は下の where に隠れている。⟦s001431-s001436⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "whereとネストのルール", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "ガード（複数の条件分岐）を使うときは、必ずwhereを使う必要があります。letはガードと組み合わせられないので注意してください。⟦s001469-s001471⟧⟦s001498-s001499⟧"}, {"type": "paragraph", "text": "関数の中に作った関数（ネスト関数）は、外側の関数のパラメータや変数をそのまま参照できます。だから、外側の変数を呼び出し側から渡し直す必要がなくなります。⟦s001561-s001566⟧"}, {"type": "paragraph", "text": "参照しても問題ないのは、値を変えずに読むだけだからです。変数の中身を書き換えないので、純粋な計算のルールを壊さずに済みます。⟦s001577-s001578⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "今日のまとめと次の一歩", "content_blocks": [{"type": "paragraph", "text": "今回の講義では、再帰で関数を組み立てる流れと、let式やwhere節で局所変数を定義する考え方を見てきました。ネスト関数は外側の変数をそのまま参照できる、というのがポイントでした。"}, {"type": "paragraph", "text": "Make sure to cover these:"}, {"type": "list", "items": ["階乗の再帰で、遅延評価（lazy evaluation）の仕組みを使ったステップごとのトレース ⟦s001278-s001296⟧", "isPrime関数の完全な実装と、n equals 1 のときに起きる注意点 ⟦s001592-s001627⟧", "APLのQuicksortと、独特な記号の読み方 ⟦s001643-s001646⟧"]}, {"type": "paragraph", "text": "今日の講義は、コンパイラとインタプリタの違いから始まり、関数型プログラミングの考え方、遅延評価、Haskellの型と条件分岐を経て、再帰・局所定義と配列指向の話までたどり着きました。小さな部品を正しいスコープに置く感覚が、これからのHaskellコードの土台になりますよ!"}]}]}, "deep_notes": {"1": "# 1. コンパイラとインタプリタの役割と違い\n\nコンパイラ(compiler)とインタプリタ(interpreter)は、どちらもプログラムを計算機が実行できる形にする仕組みですが、そのやり方が異なります。さらに重要なのは、**コンパイルか解釈かは言語そのものの性質ではなく、その言語を実装する方式の違い**だという点です。\n\n## 🔍 コンパイラとインタプリタの基本的な役割\n\n**コンパイラ**は、プログラム全体を機械語(machine code)へ変換する仕組みです。変換が済むと、機械語のコードを直接実行できます。ここで言う機械語は、計算機の CPU が直接理解できる命令の列を指します。⟦s000050⟧\n\n**インタプリタ**は、プログラムを行ごとに読み、その実行を順に模倣して進める仕組みです。プログラム全体を先に機械語へ変換するのではなく、実行しながら解釈していきます。⟦s000051⟧ 多くの場合、インタプリタには本格的な最適化を伴うコンパイル工程が存在しません。⟦s000055⟧\n\n## ⚙️ 試行錯誤の速さと実行速度のトレードオフ\n\n両者の違いが最も目立つのは、**変更を加えてから結果を確かめるまでの速さ**です。コンパイラ方式では、変更のたびに全体の再コンパイル、あるいは再コンパイルとリンク(linking)が必要になることが多く、反復の速度が落ちます。⟦s000052-s000053⟧\n\n一方でインタプリタは、変更をすぐ実行に反映できるため、反復作業や対話的なデバッグ(debugging)に向いています。⟦s000052-s000054⟧ 逆に、実行時に解釈を行うため、一般に実行そのものはコンパイル済みのコードより遅くなります。⟦s000054⟧\n\n> 整理すると、**コンパイラは実行時の速さで有利であり、インタプリタは変更から結果までの速さで有利**です。どちらが適するかは、作業の目的によって変わります。\n\n## 🆚 コンパイル方式と解釈方式の対応関係\n\nよくある説明として「C++ のようにコンパイルされる言語」と「Python のように解釈される言語」という分け方があります。⟦s000002-s000003⟧ しかし、この対応は絶対的な規則ではありません。⟦s000022-s000023⟧\n\n- **コンパイルされる言語**: 機械語へ変換して実行するのが典型的な方式です。\n- **解釈される言語**: 実行時に行ごとに解釈するのが典型的な方式です。\n- **どちらも可能**: 原理的には、どの言語もコンパイルすることも解釈することもできます。⟦s000013, s000024-s000025⟧\n\n## ⚠️ 「言語の性質」と「実装方式」は別物\n\nよくある誤解は、動的型付け言語(dynamically typed language)は必ず解釈され、静的型付け言語(statically typed language)は必ずコンパイルされる、と考えることです。⟦s000019-s000021⟧ 講義で示された見方では、これは**規則ではなく、よくある傾向**にすぎません。⟦s000022-s000023⟧\n\nまた、コンパイルの難しさには差があります。C のようにポインタ(pointer)などを持つ言語は、解釈するのがやや難しい場合があります。⟦s000030⟧ ただし、その難しさは「原理的に不可能」という意味ではありません。⟦s000030-s000031⟧ したがって、言語の性質を判断するときは、「その言語の典型的な実装がどうなっているか」と「原理的に可能かどうか」を区別して考えることが大切です。\n\n## 💡 具体例: 実装方式の入れ替えが可能であること\n\n次の例は、コンパイルと解釈が言語に固定されていないことを示しています。\n\n- **C/C++ のインタプリタ**: 1990 年代に、科学計算用の C および C++ のインタプリタとして Sint が存在しました。⟦s000027-s000028⟧\n- **Python のコンパイル**: Cython は、Python を一度 C へ変換し、その後 C++ コンパイラを使って機械語を生成します。⟦s000029⟧\n\nこのように、「インタプリタを作ること」と「コンパイラを作ること」は、言語の種類に関係なく組み合わせて考えることができます。⟦s000027⟧\n\n## 🎯 重要ポイント\n\n- **コンパイラ**はプログラムを機械語へ変換して実行し、実行速度で有利です。⟦s000050, s000052-s000053⟧\n- **インタプリタ**は行ごとに解釈して実行し、変更の反映が速く、対話的な作業に向いています。⟦s000051, s000054⟧\n- **言語の性質と実装方式は別物**であり、「動的型付けなら解釈」「静的型付けならコンパイル」は傾向にすぎません。⟦s000019-s000023⟧\n- 原理的には、どの言語もコンパイルでも解釈でも実装できます。⟦s000024-s000025, s000031⟧", "2": "# 2. 関数型プログラミングの基礎と数学的背景\n\n関数型プログラミング(functional programming)は、状態を順に書き換える手続きではなく、関数の適用と合成によって値を変換することでプログラムを組み立てる考え方である。その中心にあるのが**純粋関数(pure function)**であり、同じ入力に対して常に同じ出力を返し、外部の変化する状態に依存しないという性質が、コードの理解・検証・並列化を大きく助ける。⟦s000049, s000109-s000112⟧\n\n## 📜 数学的背景: ラムダ計算とチャーチ=チューリングの考え方\n\n関数型プログラミングの出発点は、1930年代にアロンゾ・チャーチ(Alonzo Church)が発展させたラムダ計算(lambda calculus)である。ラムダ計算は、計算可能な問題はいくつかの関数を合成することで表現できるという考え方に基づき、関数の出力を別の関数の入力へ渡す合成が計算の基本操作になる。⟦s000138-s000145⟧\n\nラムダ計算では、どの関数も**パラメータが高々1つ**に限られる。⟦s000146-s000147⟧ 合成の形は例えば \\( y = f(g(h(x))) \\) のように書かれ、ある関数の出力が次の関数の入力になる構造を指す。⟦s000143-s000145⟧\n\n1937年にアラン・チューリング(Alan Turing)は、ラムダ計算とチューリングマシンが等価であることを証明した。⟦s000158-s000161⟧ つまり、チューリングマシンで計算できるものは、関数を合成する形で表せる。これがチャーチ=チューリングの考え方(Church–Turing thesis)として知られる。⟦s000161-s000163⟧\n\n## 🕰️ LISPとHaskellの成立\n\n1958年にジョン・マッカーシー(John McCarthy)がLISPを開発した。LISPは最初期の関数型言語であり、ラムダ計算の数学的枠組みを実装に用いている。⟦s000168-s000171⟧ また、ガベージコレクションやクロージャといった概念にも関わったと紹介された。⟦s000171-s000172⟧\n\n1987年にはFPCAカンファレンスで、関数型言語の共通のオープン標準を定めるため新しい言語の策定が始まり、その成果がHaskellである。⟦s000176-s000182⟧ Haskellは数学者ハスケル・カリー(Haskell Curry)にちなんで名付けられた。⟦s000183-s000184⟧\n\n## 🔒 不変性と関数の基本ルール\n\n関数型プログラミングでは、変数の**不変性(immutability)**が求められる。変数は初期化後に変更できず、`i = i + 1` のような更新は許されない。⟦s000212-s000214⟧ 純粋な関数型プログラミングでは、すべての変数が定数として扱われる。⟦s000111-s000112⟧\n\n関数は少なくとも1つの引数を受け取り、値を返す必要がある。⟦s000194-s000197⟧ 純粋な関数型言語では引数は1つに限られ、引数を持たない関数は許されない。⟦s000198-s000201⟧ また、関数はほかのデータと同様に変数に格納したり、引数として渡したり、返したりできる。⟦s000202-s000211⟧\n\n## ✅ Pure Function: 純粋関数の定義\n\n純粋関数は次の2つの性質を満たす関数である。⟦s000236-s000239⟧\n\n1. **同じ入力には同じ出力**: 与えられた入力 \\(x\\) に対して、\\(f(x)\\) は常に同じ \\(y\\) を返す。例えば入力1に対して常に10を返し、入力2に対して常に20を返す。⟦s000240-s000244⟧\n2. **入力のみに基づく計算**: 出力は入力パラメータだけから決まり、呼び出しごとに変わりうる外部データ(現在時刻やグローバル変数など)に依存したり変更したりしない。⟦s000245-s000250⟧\n\n純粋関数は**参照透過な関数(referentially transparent function)**とも呼ばれ、両者は同じ意味である。⟦s000237-s000238⟧ 定数を関数内で使うことは、それが変更されないものであれば問題ない。⟦s000271-s000274⟧\n\n### 💡 例: 純粋関数と不純な関数\n\n- **純粋な例**: 1つの引数を受け取り、計算して変数に格納し、その値を返す関数は、同じ入力に対して常に同じ結果を返す。⟦s000252-s000254⟧\n- **不純な例**: グローバル変数を持ち、呼び出すたびにその変数を変更する関数は、呼び出しごとに異なる結果を返す。⟦s000257-s000260⟧ 乱数を返すC++の関数も、呼び出すたびに異なる値になるため純粋ではない。⟦s000221-s000223⟧\n\n不純な関数が外部の状態を変更することは**副作用(side effect)**と呼ばれ、関数の外側の状態を変えることを指す。⟦s000264-s000265⟧\n\n## ⚖️ Why Pure Functions Matter: 純粋関数の利点\n\n純粋関数を使う理由は、変化する状態を追跡する必要がなくなる点にある。⟦s000285-s000288⟧ 具体的には次の利点が挙げられた。⟦s000332-s000337⟧\n\n- **デバッグ**: 別の箇所が変数を書き換えることがないため、原因を追いやすい。⟦s000287-s000288⟧\n- **並列化**: 共有された可変状態がなければ、ミューテックスや競合状態(race condition)を心配せずに並列実行できる。⟦s000292-s000297⟧\n- **決定性と形式的推論**: 入力から出力を予測でき、証明を組み立てることができる。⟦s000301-s000302, s000322-s000326⟧\n- **最適化**: 値が途中で変わらないと保証されるため、コンパイラによる最適化がしやすい。⟦s000333-s000335⟧\n\nなお、モジュール性については、単に関数の集まりであっても必ずしも良いモジュール構造になるとは限らないと補足された。⟦s000307-s000313⟧ 一方、関数型プログラミングの欠点として、再帰を使いこなす必要があることが挙げられた。⟦s000338-s000339⟧\n\n## 🆚 命令型と関数型の違い\n\n命令型プログラミング(imperative programming)は、C++やPythonに見られるように、文の並びや変数の変更、ループによってアルゴリズムを記述する。⟦s000342-s000343⟧ 一方、関数型プログラミングは関数呼び出しによる変換を基本とし、ループや変更可能な変数、文は使わない。⟦s000344-s000346⟧\n\n| 観点 | 命令型 | 関数型 |\n|---|---|---|\n| 計算の捉え方 | 順次的な手続き（レシピ） | 関数の合成と変換 |\n| 変数 | 状態変化を伴う | 定数（不変） |\n| 繰り返し | ループ | 再帰 |\n| マルチスレッド | 誤りが起きやすい | 扱いやすい |\n\n命令型では変数状態の変化が必要であり、ループや変数の更新を行う。⟦s000347-s000348⟧ 関数型では関数の合成と再帰呼び出しによって計算が組み立てられる。⟦s000350-s000355⟧ 命令型ではマルチスレッドが難しく誤りを起こしやすい一方、関数型では扱いやすい。⟦s000356-s000357⟧\n\n## 🎯 Key Takeaway\n\n純粋関数は、入力だけで出力が決まり、外部状態に依存も変更もしない関数である。この性質により、デバッグ、並列化、形式的な証明、最適化が容易になる一方、状態を変えずに問題を解くため再帰的な思考が必要になる。⟦s000236-s000251, s000332-s000339⟧\n\n<!-- FIGURE: type=\"diagram\" title=\"純粋関数と不純関数の比較\" description=\"入力パラメータから出力へ向かう矢印を持つ純粋関数の箱と、外部のグローバル変数や乱数源と双方向に結ばれ副作用を示す矢印を持つ不純関数の箱を並べて描く。純粋関数では外部との接続がないことを示す。\" -->", "3": "# 3. 副作用のない計算と遅延評価\n\n関数型プログラミングは、手順を順に実行して変数を書き換える命令型とは違い、関数呼び出しによって値を変換していく考え方です。関数が外部の状態を変えない(副作用がない)ため、計算の順序を入れ替えたり、必要な分だけ計算したりでき、この自由さを支えるのが**遅延評価**(lazy evaluation)です。\n\n## 🔍 命令型と関数型の違い\n\n**命令型プログラミング**(imperative programming)は、C++やPythonのように、文・ループ・変数の変更を順番に積み重ねて処理を進める方式です。講義では、命令型は「一連の文と変数の変化とループ」によるアルゴリズム的な書き方と説明されました。⟦s000342-s000343⟧\n\n一方、**関数型プログラミング**(functional programming)では、処理は関数呼び出しによる変換として表現されます。文もループも変更可能な変数も使わず、関数呼び出しと再帰で計算を組み立てます。⟦s000344-s000346, s000350-s000351⟧\n\n講義では、これを「手順のレシピではなく、関数で計算する」と言い換えています。つまり、順番に実行するステップを並べるのではなく、関数の合成と再帰呼び出しを組み合わせるのが関数型の発想です。⟦s000352-s000355⟧\n\n命令型では変数の状態変化が前提になっています。ループのために変数を書き換えるのが普通ですが、関数型ではすべての変数が定数で、変更は許されません。⟦s000347-s000349⟧\n\n## 🧩 副作用(side effect)が問題になる理由\n\n**副作用**とは、関数が計算結果を返すこと以外に、関数の外側の状態を変化させる作用のことです。例として、関数がファイルを書き換えたり、グローバル変数を変更したりする場合が挙げられました。⟦s000394-s000397⟧\n\n副作用があると、呼び出す順序で結果が変わってしまいます。たとえば`func1`がグローバル変数をインクリメントし、`func2`がその変数を読むなら、`func2`を先に呼ぶか後に呼ぶかで答えが変わります。⟦s000400-s000402⟧\n\nこのため命令型言語では、コンパイラは呼び出し順序を厳密に守らなければなりません。その結果、命令の並べ替えや一部の最適化を行えず、処理が煩雑になります。⟦s000408-s000412⟧\n\n同じ理由で、命令型では複数スレッドの処理が難しくなり、実行順序や競合状態(race condition)に注意が必要になります。⟦s000356, s000359-s000362⟧\n\n## ⏳ 実行順序の自由と純粋関数\n\n関数型では、順序が重要ではない(low importance)と説明されます。その根拠は、**純粋関数**(pure function)の性質です。同じ入力に対しては、いつ呼び出しても必ず同じ出力を返します。⟦s000415-s000417, s000423⟧\n\n例として、`f(x) = 5x` という関数では、入力に`1`を与えれば常に`5`が返ります。講義では、このような関数の性質が「ある入力に対して出力が一意に決まる」ことを意味すると確認されました。⟦s000449-s000452⟧\n\nこの性質があるため、次のような自由が生まれます。\n\n- 2つの値の計算を、コンパイラが都合のよい順序で行ってよい。⟦s000418-s000422⟧\n- 使わない値は、そもそも計算しなくてよい。⟦s000418-s000419, s000421-s000422⟧\n\nこの点で、C++のようにコードを上から順に実行する動きと、Haskellの評価の仕方は大きく異なります。⟦s000428-s000430⟧\n\n## 🔀 Haskellの例で見る遅延評価\n\n講義で示された2つのプログラムは、同じ処理を表しています。命令型の擬似コードでは、`y = func1(arg)`、`z = func2(arg)` の後に、条件で結果を返します。⟦s000369-s000371⟧ ただし、口頭説明では判定が`y`と述べられていた一方、Haskellのコードでは`z`が7かどうかを判定しています。⟦s000371, s000379-s000381⟧\n\nHaskellでは、`y`と`z`を条件分岐の後に局所変数として定義していますが、この書き方は意味を変えません。⟦s000380-s000383⟧\n\n講義では、`z`が`func2`の結果として7になった場合を想定しました。このとき`if`文は即座に`0`を返し、`y`は一度も使われません。⟦s000436-s000440⟧ そのため、Haskellは`func1`をまったく呼び出しません。値が必要ないからです。⟦s000441-s000442⟧\n\nここから、Haskellは「決定や戻り値に本当に必要になるまで待ち、必要になった時点で初めて値を計算する」と説明されました。値はいつでも計算できるため、待つことが安全なのです。⟦s000443-s000444⟧\n\n## 🧵 遅延評価(lazy evaluation)とサンク(thunk)\n\n**遅延評価**とは、値が必要になるまで式を評価しない方式です。Haskellは変数を定義しただけでは計算せず、その変数が実際に使われたときにだけ評価します。⟦s000431-s000434, s000504-s000506⟧\n\n講義では、`f(g(x))`の形でも、`f`の中で引数が使われなければ`g(x)`は評価されないと説明されました。⟦s000468-s000471, s000506⟧ たとえば、引数を無視して常に`0`を返す関数`f`に`g(x)`を渡しても、`g(x)`は呼ばれません。⟦s000473-s000479⟧\n\nこの仕組みで、引数の渡し方も従来の感覚とは異なります。引数は先に値へ計算されて渡されるのではなく、**サンク**(thunk)と呼ばれる、後で評価できる計算として渡されます。必要になればそこで計算され、使われなければ計算されません。⟦s000477-s000482⟧\n\n講義では、この引数の計算が5階層ほど深い式の内部で行われる場合もあると補足されました。つまり、評価は呼び出し箇所からは見えにくいところで、必要になった時点で起こります。⟦s000482-s000483⟧\n\n遅延評価は、条件分岐にも効きます。`if`式が左右どちらに進むかを決めるためには条件の評価が必要ですが、結果が決まれば使われない側の式は評価されません。⟦s000497-s000502⟧\n\n## ⚠️ 補足: 入出力と初期のHaskell\n\nHaskellでは関数型の原則が徹底されているため、初期バージョンには入出力機能がありませんでした。入出力は副作用を起こし、システムの状態を変えるからです。⟦s000511-s000514⟧\n\nたとえば、入力関数を呼ぶたびにユーザーが違う値を入力するなら、同じ入力でも毎回違う結果が返ります。これは純粋な関数の性質に反します。⟦s000514-s000516⟧\n\n講義では、この問題を後で扱う方法があると予告されました。⟦s000516-s000517⟧\n\n## 🎯 重要ポイント\n\n- **関数型**では、変数を変更せず、関数呼び出しと再帰で値を変換します。⟦s000344-s000351⟧\n- **副作用**があると、呼び出し順序が結果に影響し、最適化や並列化が難しくなります。⟦s000408-s000412, s000356-s000362⟧\n- **純粋関数**は、同じ入力に対して常に同じ出力を返すため、計算順序を自由に変えられます。⟦s000415-s000421⟧\n- **遅延評価**では、値は必要になるまで計算されず、使われない式は呼び出されません。⟦s000431-s000444⟧\n- **サンク**は、まだ計算されていない式を保持し、必要になったときに評価するための仕組みです。⟦s000477-s000482⟧", "4": "# 4. Haskellの関数定義と型推論\n\nHaskellでは、関数の型を宣言する**関数シグネチャ**(function signature)を定義の上に書き、関数呼び出しは括弧もカンマも使わずに引数を空白で並べて書きます。さらに、型を省略してもコンパイラが**型推論**(type inference)によって各値の型を導き出し、その型は厳密に検査されます。⟦s000518-s000521, s000594-s000597⟧\n\n## 🔍 関数シグネチャの読み方\n\n関数シグネチャは、関数が受け取る引数の型と、返す値の型を表す宣言です。Haskellでは、関数名の型宣言を関数の定義本体より上に置きます。⟦s000647⟧ 型の並びは「引数の型をすべて並べ、最後に戻り値の型を書く」というルールで読みます。⟦s000594-s000603⟧\n\n```haskell\npoly :: Double -> Double\npoly x = 3 * x * x\n```\n\n上の例では、1行目の`Double -> Double`が「Doubleを受け取ってDoubleを返す」ことを示します。最初の`Double`は引数`x`の型、最後の`Double`は戻り値の型です。⟦s000595-s000599, s000648-s000649⟧ 引数が複数ある場合も、先頭から順に引数の型が並び、最後の型だけが戻り値を表します。⟦s000601-s000603, s000711-s000712⟧\n\nまた、型宣言の`::`は「型は次のとおり」という意味で読みます。`poly x = ...`の`=`は代入ではなく、「`poly`という関数は`x`を受け取り、右側の式を計算する」という定義を表します。⟦s000566-s000570⟧ そのため、Pythonのコロンに近いイメージで読むと理解しやすくなります。⟦s000568-s000569⟧\n\n> 注意: 関数名を型宣言と定義本体の両方に書く必要があるのは、言語設計者が選んだ仕様であり、理論上の必然ではありません。⟦s000639-s000646⟧\n\n## ⚙️ 関数定義と呼び出しの文法\n\nHaskellの文法は、C++のような括弧やセミコロンに頼らず、空白と改行で構造を表します。ここでは主要な規則を整理します。\n\n- **暗黙の戻り値**: `return`文は書きません。等号の右側に式を書くと、その式の値が自動的に結果になります。⟦s000620-s000624⟧\n- **括弧・カンマの不使用**: 関数定義の引数にも、関数呼び出しの引数にも括弧やカンマは使いません。引数は空白で区切ります。⟦s000650-s000654, s000714-s000715⟧\n- **区切りは改行と空白**: セミコロンのような記号は不要で、改行と空白が区切りの役割を担います。⟦s000607-s000615, s000631⟧\n- **複数行の定義**: 関数定義を複数行に分けるときは、インデント(字下げ)を使います。字下げの幅は自由ですが、下の行どうしで一貫している必要があります。⟦s000676-s000677⟧\n\n呼び出しの例として、`poly 2`は`poly`に2を渡す式であり、結果は12になります。⟦s000572⟧ 括弧を使わないため、`poly 2`の形で書くのが基本です。⟦s000653-s000654⟧\n\n### 💡 例: 2つの引数をもつ関数\n\n2つの引数を比較する`isGreater`は、型シグネチャで「第1引数の型」「第2引数の型」「戻り値の型(Bool)」を順に並べます。⟦s000658-s000659, s000708-s000709⟧ 呼び出しでは`isGreater`の後に2つの値を空白で並べ、その結果としてTrueかFalseが返ります。⟦s000661-s000663, s000714-s000715⟧\n\n型宣言の`::`の位置や型名を縦に揃える書き方は、見やすさのための任意の工夫であり、文法上は必要ありません。⟦s000721-s000727⟧\n\n## 🧩 多引数関数と部分適用の予告\n\n`isGreater`の定義と型シグネチャは、引数の数が増えても「型の並びの最後が戻り値」という同じ規則で読めます。⟦s000680-s000681, s000711-s000712⟧ 一方で、型シグネチャがすべての引数の型と戻り値の型を一列に並べる形になっているため、初学者には読みにくく感じられます。⟦s000681-s000685⟧\n\nこの形式の理由は、カリー化(currying)と部分適用(partial function application)という考え方と深く関係しています。引数を1つだけ与えた呼び出し(たとえば`isGreater 1`)は、残りの引数を受け取る新しい関数を作る式として扱われます。⟦s000669-s000671, s000695-s000697⟧ この詳細は後の学習で扱うため、今は「型の並びが一列になっている理由がある」と理解しておけば十分です。⟦s000697-s000698⟧\n\n## 🔎 型推論の仕組み\n\n型推論は、プログラム内で値がどのように使われているかを手がかりにして、コンパイラが型を導き出す仕組みです。⟦s000748-s000750⟧ 型宣言を書かなくても、各値の型は必ず1つに決まっています。⟦s000849-s000851⟧\n\n### 💡 例: `isOld`関数\n\n`isOld`は、年齢を受け取り、30歳より上か、または痛みがあれば「年寄り」と判定する関数です。⟦s000734-s000737⟧ この関数には型シグネチャがありません。⟦s000738⟧ それでも`:t`コマンドで型を調べると、`Integer`と`Bool`を受け取り、`Bool`を返す型として表示されます。⟦s000743-s000747⟧\n\nHaskellがこの型を導いた根拠は次のとおりです。⟦s000756-s000758, s000761, s000766-s000767⟧\n\n1. 年齢を整数と比較しているため、年齢の引数は整数(Integer)でなければならない。Haskellは文字列と整数の比較を許さないため、この推論が成り立ちます。⟦s000757-s000758, s000808-s000811⟧\n2. 別の引数を`True`と比べているため、その引数は真偽値(Bool)でなければならない。⟦s000761, s000813-s000814⟧\n3. 2つの条件を`||`(or)で結んでいるため、論理演算の結果はBoolになり、それが戻り値の型になる。⟦s000766-s000767, s000815-s000816⟧\n\n### 型推論に関するよくある疑問\n\n- **比較演算子 `== True` を省略できるか**: 省略できます。本体が真偽値の式だけであれば、型は同じように推論されます。⟦s000792-s000793, s000832-s000833⟧ 教材では、型の動きを明確に示すために書いていました。⟦s000793-s000794⟧\n- **`:: Integer`の型注釈を省略するとどうなるか**: 型はより広い型である`Num`(整数と浮動小数点数を含む数値の上位型)に決まり、整数でも小数でも扱えるようになります。⟦s000785-s000789⟧\n\nHaskellは、型推論を使えるため、型注釈を書くことは基本的に任意です。⟦s000799-s000802⟧ 型注釈を書いた場合、その型が推論結果と食い違うとエラーになります。⟦s000836-s000837⟧\n\n## 🚫 厳密な型検査と自動変換の禁止\n\nHaskellは型の不一致を許さない、厳密な言語です。整数と真偽値を比べたり、0を偽・1を真とみなしたりする暗黙の変換は行われません。⟦s000771-s000775, s000839-s000843⟧ 比較できるのは、整数どうし、真偽値どうしといった同じ型どうしだけです。⟦s000774-s000775, s000810⟧\n\nこれは、型推論で型宣言を省略できることと両立します。型宣言を省略しても、型の整合性は検査されます。⟦s000852⟧ 具体例として、`isOld 53.5 False`のように浮動小数点数を整数の引数に渡すと、C++では小数が整数に変換されて動作しますが、Haskellではエラーになります。⟦s000857-s000859⟧ 型を合わせたい場合は、プログラマが明示的に変換を書く必要があります。⟦s000777-s000779, s000820-s000821⟧\n\n## 🎯 まとめ\n\n- 関数シグネチャは、引数の型を順に並べ、最後に戻り値の型を書く宣言であり、定義の上に置く。⟦s000647-s000649, s000711-s000712⟧\n- 関数定義は`return`なしで、等号の右側の式がそのまま結果になる。関数呼び出しは括弧やカンマを使わず、引数を空白で並べる。⟦s000620-s000624, s000653-s000654⟧\n- 型注釈を省略しても、型推論によって引数と戻り値の型は必ず決まり、型は厳密に検査される。⟦s000799-s000802, s000849-s000852⟧\n\n<!-- Using no figures: the topic is textual syntax and type rules that are clear without visuals. -->", "5": "# 5. Haskellの評価規則と条件分岐\n\nHaskellでは、括弧のない関数呼び出しは左から順に読まれ、関数呼び出しは演算子より優先されます。また、`if`は文ではなく式であるため`else`が必須になり、ガードはそれと等価な分岐を読みやすく書くための構文糖衣(syntactic sugar)です。\n\n## 🔍 左から右へ読まれる関数適用\n\nHaskellでは、`f g 2`を「`g 2`を先に計算してから`f`に渡す」とは読まず、まず`f`に`g`を渡し、その結果に`2`を適用する形として解釈します。Haskellは関数呼び出しを左から右へ評価するため、この関数適用は**左結合(left associativity)**と呼ばれます。⟦s000915-s000917⟧\n\n直感的には「2を`g`に渡し、その結果を`f`に渡す」と読みたくなりますが、それはHaskellの解釈ではありません。⟦s000918-s000923⟧ `f g`の部分で`g`は引数として渡されており、Haskellでは関数を引数として渡すことが可能です。⟦s000924-s000926⟧ 次に、その結果に`2`を渡すという形になります。⟦s000927-s000929⟧ 結果が関数でなければ、この解釈は成立せず、エラーになります。⟦s000928⟧\n\n目的どおりに「`g`を2に適用してから`f`に渡す」ことを書くには、括弧で囲みます。⟦s000947-s000951⟧\n\n```haskell\nf (g 2)   -- g 2 を先に評価し、その結果を f に渡す\n```\n\nこのため、Haskellでは括弧が必要な場面で必ず括弧を使い、それ以外は左から右の規則に任せます。⟦s000954-s000956⟧\n\n## ⚙️ 関数呼び出しと演算子の優先順位\n\nHaskellでは、関数呼び出しは数学の演算子より高い優先順位を持ちます。⟦s000963-s000965⟧ そのため`f 3 * 10`は`f (3 * 10)`ではなく、まず`f 3`を計算してから結果に10を掛けます。⟦s000966-s000967⟧ 講義の例では`f`が2乗を計算するため、`f 3`は9となり、最終結果は90になります。⟦s000968-s000969⟧\n\n演算子同士の間では、通常の優先順位が適用されます。⟦s001057-s001059⟧ ただし、関数呼び出しはそれらの演算子よりも優先されます。⟦s001059-s001060⟧ 数学的な感覚で`f (3 * 10)`と書きたい場合は、括弧で明示する必要があります。⟦s000970-s000971⟧\n\n## 🔁 二項演算子を前置形式で使う\n\n二項演算子(binary operator)は、通常は二つの値の間に置かれます(中置形式)。しかし、演算子を括弧で囲むと、二つの引数を取る通常の関数呼び出しとして使えます。⟦s001015-s001020⟧ 例えば`x * 10`は`(*) x 10`と書けます。⟦s001015-s001024⟧\n\n他の例として、`6 - 5`は`(-) 6 5`、`8 <= b`は`(<=) 8 b`、論理積は`(&&)`を使って書けます。⟦s001025-s001028⟧ 括弧で囲まれた演算子は関数として扱われるため、他の関数へ渡すこともできます。⟦s001065-s001068⟧\n\n> 例: `(+) 2 4 * 5`\n\nこの式では、`(+) 2 4`が関数呼び出しとして先に評価されるため、`(2 + 4) * 5`と同じ30になります。⟦s001039-s001048⟧ 講義では、「加算の優先順位は乗算より低いが、関数は演算子より常に優先される」という点が強調されました。⟦s001044-s001048⟧\n\n## 🧩 if式: なぜelseが必須なのか\n\nHaskellの`if`は**if式(if expression)**であり、文(statement)ではありません。⟦s001070-s001071⟧ Haskellでは、`5 + 3 * 7`や`f 7`と同じように、すべてが式であり、式は必ず何らかの値に評価されなければなりません。⟦s001093-s001098⟧ そのため、`if`式には必ず`else`節が必要になります。⟦s001071-s001072⟧\n\n理由は次のとおりです。Haskellの関数には無効な関数(void function)が存在せず、すべての関数は値を返す必要があります。⟦s001084-s001086⟧ 例えば、価格が100を超えれば20%割引、そうでなければ10%割引とする関数を考えます。⟦s001072-s001074⟧ `else`がないと、条件が偽のときに返す値が決まらず、この要件が破られてしまいます。⟦s001087-s001090⟧ `if`式は必ず値を返すため、真偽どちらの場合にも結果が必要です。⟦s001098-s001107⟧\n\n## 🚦 ガードと構文糖衣\n\n**ガード(guards)**は、複数の条件とそれぞれに対応する結果を縦に並べて書く分岐構文です。⟦s001133-s001134⟧ 各ガードは縦線(パイプ文字)で始まり、条件を書き、等号の後に結果の式を書きます。⟦s001144-s001148⟧ ガードは上から順に評価され、最初に条件が成立したものの結果を返して、残りは評価しません。⟦s001126-s001130⟧ これは、入れ子になった`if-else`を順に調べていく動きに対応します。⟦s001140-s001142⟧\n\nガードを使う関数では、関数の定義行に等号を書きません。⟦s001201-s001205⟧ 代わりに、各ガードの条件の後に等号を書きます。⟦s001204-s001205⟧ `otherwise`は、上のどの条件にも一致しなかった場合に実行される既定の分岐で、最後の`else`に相当します。⟦s001197-s001200⟧\n\nガードは**構文糖衣(syntactic sugar)**の一例です。構文糖衣とは、内部の複雑な仕組みを隠し、より簡潔な書き方を言語が提供することを指します。⟦s001210-s001215⟧ ガードは入れ子の`if-else`と完全に等価であり、読みやすさだけが異なります。⟦s001214-s001216⟧ 最終的には、すべての構文が単純な関数の合成、例えば`f (g x)`に還元されます。⟦s001217-s001222⟧\n\n## 💡 例: 階乗をifとガードで書き比べる\n\n階乗関数は、`if`式とガードの両方で書けます。⟦s001226-s001229⟧ `if`式版では、`n`が0なら1を返し、そうでなければ`n * factorial (n - 1)`を返します。⟦s001226-s001231⟧ 括弧は必要で、これがないと`factorial n`を計算してから1を引く解釈になってしまいます。⟦s001230-s001231⟧\n\n```haskell\n-- if式版\nfactorial n = if n == 0 then 1 else n * (factorial (n - 1))\n\n-- ガード版\nfactorial n\n  | n == 0    = 1\n  | otherwise = n * (factorial (n - 1))\n```\n\nガード版は同じ型シグネチャと宣言行を持ち、`n == 0`なら1、それ以外なら`n * factorial (n - 1)`を返します。⟦s001233-s001234⟧ 講義では、ガード版の方がすっきりして読みやすいと述べられました。⟦s001235-s001236⟧ なお、ここで扱われた分岐の書き方は、次に扱われるパターンマッチングにもつながるものとして紹介されました。⟦s001237⟧\n\n## 🎯 Key Takeaway\n\n- Haskellの括弧のない関数適用は左から右に読まれ、`f g 2`は`(f g) 2`として解釈されます。⟦s000915-s000917, s000922-s000923⟧\n- 関数呼び出しは数学の演算子より優先されるため、`f 3 * 10`は`(f 3) * 10`になります。⟦s000963-s000967⟧\n- 演算子を括弧で囲むと前置形式の関数として使え、`(+) 2 4`のように書けます。⟦s001015-s001020⟧\n- `if`は式なので`else`が必須であり、ガードは入れ子の`if`と等価な構文糖衣です。⟦s001093-s001098, s001214-s001216⟧", "6": "# 6. 再帰・局所定義と配列指向の考え方\n\n関数が自分自身を呼び出す**再帰（recursion）**と、計算の途中で名前を一時的に結び付ける**局所束縛（local binding）**は、関数型言語で問題を組み立てる基本道具です。さらに、要素を一つずつ回す代わりに配列全体を一度に扱う**配列指向プログラミング（array-oriented programming）**の考え方が、現代の機械学習ライブラリにも影響を与えたことを理解します。\n\n## 🔍 再帰（recursion）の仕組みと遅延評価\n\n再帰では、関数がより小さな問題に対して自分自身を呼び出し、**基底条件（base case）**に到達したところで計算を止めます。階乗関数を例にすると、ガードを使って`n`が`0`なら`1`を返し、それ以外では`n`と`factorial (n - 1)`を掛け合わせる形になります。⟦s001233-s001234⟧\n\n\\[\n\\text{factorial}(n) =\n\\begin{cases}\n1 & (n = 0) \\\\\nn \\times \\text{factorial}(n-1) & (\\text{それ以外})\n\\end{cases}\n\\]\n\nif式で書く場合は`(n - 1)`の括弧が必要です。括弧がないと、先に`n`の階乗を計算してから`1`を引いてしまうためです。⟦s001226-s001231⟧\n\nここで重要なのは、Haskellが`n - 1`を即座に計算しないという点です。`n - 1`は**遅延評価（lazy evaluation）**の対象となり、計算の約束だけが**サンク（thunk）**と呼ばれる仕組みに包まれて渡されます。サンクは「必要になったときに`n - 1`を計算する」という指示を持つ関数のようなもので、実際に値が必要になるまで計算は実行されません。⟦s001262-s001263, s001313-s001317⟧\n\n講義では`factorial 2`の流れを追うために、`n - 1`を先に計算したと仮定して`1`と書き、その後`factorial 1`、`factorial 0`へと進む様子を示しました。ただし実際のHaskellでは、ガードで`n`が`0`かどうかを判定する時点で初めて`n - 1`が評価されます。⟦s001264-s001273, s001290-s001296⟧\n\n> 判定が必要になると、その時点で引数の評価が強制されます。これが遅延評価の本質です。⟦s001294-s001296⟧\n\nサンクは、変数を捕捉した状態で値を指すポインタのようなものと説明されました。そのため、渡された`n`は計算時点の値を指し、後から使う場面で評価されます。⟦s001326-s001335⟧ なお、この詳細は学習者が知っておくべき一般概念であり、試験で細かく問われることはないと明示されています。⟦s001348-s001353⟧\n\n<!-- FIGURE: type=\"diagram\" title=\"factorial 2 の再帰呼び出しと戻り値の流れ\" description=\"上から下へ factorial 2 → factorial 1 → factorial 0 と呼び出しが進み、factorial 0 が 1 を返す。そこから戻りの方向へ 1 × 1 = 1、2 × 1 = 2 と掛け算結果が上位の呼び出しに返される。各ノードには n の値とガード判定（n == 0 か否か）を併記し、n - 1 はサンクとして遅れて評価される点を注記する。\" -->\n\n## ⚙️ 局所束縛（local binding）と`let`式\n\n`let`式は、式の中だけで有効な局所変数を定義する仕組みです。名前と値を結び付けたものを束縛（binding）と呼び、`let`式は一つ以上の局所変数（束縛）を定義できます。定義した束縛は`in`キーワードの後の式で参照されます。⟦s001367-s001370⟧\n\n基本的な構文は次のとおりです。⟦s001403-s001405⟧\n\n```haskell\nlet variable1 = ...\n    variable2 = ...\nin  式（variable1, variable2 を使う）\n```\n\n局所変数は他の局所変数や関数の引数を参照できます。例えば円の面積の例では、`pi value`を定義し、その値を使って`pi value * r^2`を計算しています。また、`square x`や`square y`を定義し、それらを使って`sum of squares`を求めています。⟦s001363-s001364, s001406-s001408⟧\n\nこれらの局所変数は定数であり、一度だけ初期化され、後から変更することはできません。⟦s001364-s001365⟧ `let`の中の`let`のように入れ子にすることも可能です。⟦s001366⟧\n\n`let`式も遅延的に動作します。`in`の後の式が局所変数を使わなければ、その局所変数は評価されません。つまり、局所変数は使われるときにだけ評価されます。⟦s001377-s001384, s001396-s001401⟧\n\n## 🆚 `let`と`where`節の違いと使い分け\n\n**`where`節（where clause）**は、`let`と似た局所定義を関数定義の末尾にまとめて書く方法です。関数本体を先に読みやすく書き、補助的な計算の詳細を下に置けるため、読みやすさが大きな利点になります。⟦s001414-s001415, s001424-s001428⟧\n\n| 観点 | `let`式 | `where`節 |\n|---|---|---|\n| 位置 | 式の前に定義を書く | 関数定義の後ろにまとめて書く |\n| 主な利点 | 式の中で局所的に値を定義できる | 関数本体のロジックを先に読める |\n| ガード（guard）との併用 | 使えない | 使える（必須） |\n\n`where`で定義した変数は、関数定義の上側からも参照できます。定義が下にあっても、Haskellは上側から使えるように扱います。⟦s001429-s001431⟧\n\n`where`の基本構文は、式（またはガード）が変数を使い、その後に`where`で各変数を定義する形です。⟦s001431-s001433⟧ 円の面積の例では、`circle area R = pi R squared`と本体を書き、`where`の中で`pi`や`sum of squares`を定義すると、本体だけを読めば意味がわかるようになります。⟦s001433-s001438⟧\n\n使い分けの基準は次のとおりです。\n\n- **単一の式**であれば、`let`と`where`のどちらを使っても構いません。好みの問題です。⟦s001453-s001462⟧\n- **複数の式**、つまりガードのように複数の分岐を持つ場合は、必ず`where`を使います。⟦s001469-s001471, s001498-s001499⟧\n\nなぜ`where`だけがガードと組み合わせられるのかについて、明確な理由はありません。言語設計上の選択であり、別の言語では`let`をガードと組み合わせることも可能だと説明されています。⟦s001472-s001478⟧\n\nまた、ガードで書いた条件分岐は、内部的には入れ子の`if`式にまとめられる単一の式として扱われることがあります。そのため、「式が一つなのになぜ`where`が必要なのか」と感じる場合がありますが、書き方上はガードが複数の式として記述されるため`where`が必要になります。⟦s001482-s001492⟧\n\n## 🧩 ネストした関数とスコープ（scope）\n\n関数の中にさらに関数を定義することもできます。Pythonの入れ子関数に近い考え方で、`where`や`let`の中に補助関数を書き、外側の関数からその関数を呼び出します。⟦s001503-s001505, s001513-s001514⟧\n\n例として、名前が`Carry`なら「12歳のように振る舞う」、それ以外なら「大人のように振る舞う」という関数を考えます。`where`の中の`behaves like`関数は、名前と文字列を受け取り、それらを連結して出力を作ります。⟦s001506-s001516⟧ 補助関数は外側の関数の中からのみ見える局所的な存在であり、呼び出しは通常の関数と同じように行えます。⟦s001519-s001523⟧\n\n**スコープ（scope）**の観点では、内側の関数は外側の関数の引数や束縛にアクセスできます。例えば外側の関数の引数`name`を、内側の関数から直接参照できます。その場合、補助関数に`name`を渡す必要がなくなります。⟦s001561-s001570⟧ これは外側の値を読み取るだけで変更しないため、関数型の制約に反しません。⟦s001575-s001580⟧ 内側の関数の中にさらに関数がある場合も、途中の関数と最外側の関数の変数に参照できます。⟦s001589-s001590⟧\n\n## 💡 例題：素数判定（`isPrime`）\n\n素数判定では、整数`n`を受け取って真偽値を返す`isPrime`関数を作り、その中で補助関数`checkDivisors`を再帰的に呼び出します。`checkDivisors`には最初の引数として`n`、2番目の引数として`n - 1`から始まる除数を渡します。⟦s001593-s001598⟧\n\n各分岐の考え方は次のとおりです。\n\n- **除数が`1`のとき**：`1`より大きい約数が見つからなかったので、素数であり`true`を返します。⟦s001609-s001613⟧\n- **`n mod divisor == 0`のとき**：`1`以外の約数で割り切れたので、素数ではなく`false`を返します。⟦s001615-s001619⟧\n- **それ以外のとき**：除数を一つ減らして`checkDivisors`を再帰的に呼び出します。⟦s001620-s001621, s001633-s001635⟧\n\n再帰呼び出しでは`(divisor - 1)`の括弧が必要です。括弧がないと、`checkDivisors`の結果から`1`を引く意味になってしまいます。⟦s001621-s001625⟧\n\nただし、この実装には`n = 1`の場合の不備があると指摘されました。ガードに`n == 0`の条件を追加するなどの修正が必要です。⟦s001626-s001627⟧\n\n## 🧮 配列指向プログラミング（array-oriented programming）とAPL\n\n**APL**は1957年頃に、配列を含む数学的な式を書くための記法として生まれました。その後、プログラミング言語へと発展しました。最初は言語ではなく、数学的計算を表す記法だったという点がポイントです。⟦s001648-s001653⟧\n\nAPLの最大の特徴は、明示的なループを書かずに配列や行列の演算を行うことです。関数は独特な記号で表され、一つの記号が配列同士の対応する要素のペアリングや乗算などの意味を持ちます。記号を理解しないとプログラムを読めない点は、難解さの原因にもなっています。⟦s001658-s001664⟧\n\n内積、行列積、回転、転置といった操作も、一つの記号で表現できます。これは、配列全体を一度に扱う**配列指向設計（array-oriented design）**の考え方を示しています。⟦s001668-s001672⟧\n\nこの考え方は、現代の機械学習と深く関係します。行列演算をGPUで効率よく行う技術の基礎になったとされ、APLは**NumPy**、**TensorFlow**、**PyTorch**などの機械学習関連技術に間接的な影響を与えました。現在のライブラリは記号名がより読みやすくなっていますが、テンソルや行列の演算という発想はAPLに由来します。⟦s001678-s001684⟧\n\n## 🎯 Key Takeaway\n\n- **再帰**は、基底条件に到達するまで問題を小さくして自分自身を呼び出す方法であり、Haskellでは`n - 1`のような引数が必要になるまで評価されない**遅延評価**によって動きます。⟦s001290-s001296⟧\n- **`let`式**は式の中の局所束縛を定義し、**`where`節**は関数の後ろに補助定義をまとめて読みやすさを高めます。ガードと組み合わせる場合は`where`が必須です。⟦s001414-s001415, s001469-s001471⟧\n- **ネストした関数**は外側の引数や束縛を参照でき、値を変更しない限り関数型の考え方と矛盾しません。⟦s001571-s001573⟧\n- **配列指向プログラミング**は、ループの代わりに行列やベクトル全体への演算として計算を記述する考え方であり、APLを通じてNumPy、TensorFlow、PyTorchの発想に受け継がれています。⟦s001681-s001684⟧"}, "fun_facts": {"title": "電話が絶対に落ちない秘密は「純粋」な設計にあった 📞", "hook": "電話交換機が1年間に停止する時間はわずか数十ミリ秒という、信じがたい記録が存在するって知っていましたか？\n\nその裏には、処理をやり直しても結果が変わらない「純粋な関数」という考え方が隠れていたんです。", "body": "今日学んだ純粋関数の「同じ入力なら必ず同じ出力を返し、外の状態を書き換えない」という性質が、実は通信インフラを支える最前線で命綱になっているんです。\n\n1990年代、エリクソンの交換機AXD301は、ソフトウェアの規模が200万行を超えるにもかかわらず、9ナイン（99.9999999%）の稼働率を記録したと語り継がれてきました⟦1⟧。\n\nもちろん、この数字には「本当にそこまで証明されたのか」という議論もあり、実際はC言語部分や冗長化されたハードウェアの貢献も大きかったとされています⟦2⟧。\n\nそれでも、このシステムを作ったErlangの設計思想は「状態を共有せず、処理を独立させる」ことで、障害が起きたら影響範囲を小さく保ち、再起動して復旧させる仕組みを重視していました⟦3⟧。\n\nもし処理が外部状態に依存しない純粋な変換であれば、途中で失敗しても同じ入力でやり直すだけで済む。今日学んだ概念が、電話網を止めないための発想につながっていると思うと、次の講義が待ち遠しくなりませんか？", "sources": ["https://medium.com/fullstackhacks/erlang-no-process-was-harmed-in-the-making-of-this-post-247a80223f19", "https://www.javacodegeeks.com/2026/09/let-it-crash-vs-try-catch-erlang-beam-supervision-trees-against-javas-exception-model.html", "https://dockyard.com/blog/2018/07/18/all-for-reliability-reflections-on-the-erlang-thesis"]}}, "ran": ["deep_notes", "fun_facts", "review_cards"], "checks": {"review_cards": {"calls": 6, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 6698, "exclamations": 12, "question_marks": 6, "citations": 86, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 19, "input_tokens": 79286, "output_tokens": 23937, "max_output_tokens_single_call": 5059, "sum_call_seconds": 109.8, "max_call_seconds": 24.07, "topics": 6, "topics_with_bad_card_sequence": 0}, "deep_notes": {"calls": 6, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 22281, "exclamations": 3, "question_marks": 0, "citations": 221, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 75, "input_tokens": 75760, "output_tokens": 22875, "max_output_tokens_single_call": 5137, "sum_call_seconds": 108.2, "max_call_seconds": 24.73}, "fun_facts": {"calls": 1, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 572, "exclamations": 0, "question_marks": 2, "citations": 3, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 39778, "output_tokens": 569, "max_output_tokens_single_call": 569, "sum_call_seconds": 4.6, "max_call_seconds": 4.56, "fun_fact_sources": 3}}, "errors": {}}, "v1": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🧭", "title": "その言語、本当に一つの道しかない？", "content_blocks": [{"type": "paragraph", "text": "前回はインタプリタの仕組みを見ましたね。今日はその続きで、もっと根本的な疑問に進みます。"}, {"type": "quote", "text": "Pythonは必ずインタプリタで動く言語？それとも、ただ『たいていそうなる』だけ？"}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "言語と処理方式は別々のもの", "content_blocks": [{"type": "paragraph", "text": "よくあるイメージは、C++はコンパイラで、Pythonはインタプリタで動く、という組み合わせです。でも先生の答えは『どんな言語でも、コンパイルもインタプリトもできる』でした。⟦s000002-s000013⟧"}, {"type": "paragraph", "text": "つまり、コンパイラやインタプリタは言語そのものの性質ではなく、**処理方式**です。作る側がどちらを選ぶかの話なんですね。⟦s000013⟧"}, {"type": "paragraph", "text": "『動的型付けの言語はインタプリタ、静的型付けの言語はコンパイラ』というルールも、実は規則ではなく、**よくある傾向**にすぎません。⟦s000019-s000023⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "『簡単』と『不可能』は違う", "content_blocks": [{"type": "callout", "alert_type": "warning", "explanation": "", "items": []}, {"type": "paragraph", "text": "ここが先生の一番の強調点です。どの言語でもできる、というのは『原理的にできる』という意味で、『楽にできる』という意味ではありません。⟦s000017-s000018⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次は『型』の話へ", "content_blocks": [{"type": "paragraph", "text": "今日は、コンパイラとインタプリタは言語の性質ではなく処理方式であり、どちらも原理的には任意の言語に使えることを見ました。"}, {"type": "paragraph", "text": "次は、型付けの考え方を、関数型プログラミングの流れと合わせて見ていきましょう。ラムダ計算やHaskellの話につながっていきますよ！"}]}], "2": [{"card_type": "hook", "hero_emoji": "🔒", "title": "変数が変えられない世界へようこそ！", "content_blocks": [{"type": "quote", "text": "関数型プログラミングでは、一度作った変数は二度と変えられない！"}, {"type": "paragraph", "text": "ふつうのプログラミングだと、変数 i に i + 1 を代入して数字を増やすのは当たり前ですよね。でも関数型の世界では、そんな書き方は禁止です。最初は「えっ、それでどうやってプログラムを書くの？」と戸惑うはず。その戸惑いこそ、この講義の出発点です。"}]}, {"card_type": "core_why", "hero_emoji": "⚙️", "title": "同じ入力なら同じ答え", "content_blocks": [{"type": "paragraph", "text": "関数型プログラミングの中心には、純粋関数（pure function）という考え方があります。ポイントは、同じ x を渡せば必ず同じ y が返ってくることです。1を入れたら10、もう一度1を入れても10。当たり前に見えますが、ここが大事です。 ⟦s000240-s000242⟧"}, {"type": "paragraph", "text": "対照的に、C++でランダムな数字を返す関数は、呼ぶたびに答えが変わります。これは外の世界、たとえば現在時刻や変わり続ける全体変数に頼っているからです。純粋関数は、外の状態に頼らず、引数だけで答えを作ります。 ⟦s000221-s000223⟧ ⟦s000245-s000246⟧"}, {"type": "code", "language": "python", "explanation": "この関数は、引数 x だけを使って結果を作るので、純粋関数です。 ⟦s000253-s000254⟧", "items": []}, {"type": "callout", "alert_type": "info", "code_string": "", "language": "", "explanation": "", "items": []}]}, {"card_type": "gotcha", "hero_emoji": "💥", "title": "副作用がバグの元凶！", "content_blocks": [{"type": "callout", "alert_type": "warning", "explanation": "", "items": []}, {"type": "paragraph", "text": "副作用（side effect）とは、関数の外の状態を読んだり書き換えたりすることです。例えば、関数の外にある全体変数を書き換えた瞬間、その関数は純粋ではなくなります。 ⟦s000264-s000265⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次の一歩を考えよう", "content_blocks": [{"type": "paragraph", "text": "今回は、関数型プログラミングがなぜ変数を変えないのか、そして純粋関数が何をしてくれるのかを学びました。純粋関数は、同じ入力に同じ出力を返すことで、テストや並列化をずっと楽にしてくれます。"}, {"type": "paragraph", "text": "今回は時間の都合で詳しく触れなかった内容もあります。ぜひ自分でも調べてみてください。"}, {"type": "list", "items": ["ラムダ計算（lambda calculus）が、どのように計算可能性の考え方につながるのか ⟦s000138-s000145⟧", "チャーチ＝チューリングの考え方（Church–Turing thesis）と、チューリングマシンとの関係 ⟦s000158-s000163⟧", "LISPが関数型言語の先駆けになった経緯 ⟦s000168-s000172⟧", "Haskellという名前の由来 ⟦s000183-s000189⟧"]}, {"type": "paragraph", "text": "でも、副作用を一切使わないと、プログラムは本当に動くの？という疑問が残りますよね。副作用を避けたまま、遅延評価（lazy evaluation）やサンク（thunk）といった仕組みで計算がどう進むのかは、次のトピックで一緒に解き明かしましょう！"}]}], "3": [{"card_type": "hook", "hero_emoji": "🍜", "title": "注文が来るまで作らないラーメン屋", "content_blocks": [{"type": "quote", "text": "Haskellは「お客さんが本当に食べると言うまで、麺を茹でない」お店みたいなものなんです！"}, {"type": "paragraph", "text": "命令型のプログラムは、言われた手順を上から順番に全部こなす職人さんです。一方、関数型の世界では、計算は「レシピの手順」ではなく「関数の組み合わせ」として考えます。ちょっと不思議ですが、ここから一緒に見ていきましょう！"}]}, {"card_type": "core_why", "hero_emoji": "🧩", "title": "純粋な関数なら順番は自由", "content_blocks": [{"type": "paragraph", "text": "命令型では、関数が外の状態を変えることがあるので、呼び出し順序がとても大事になります。ファイルを書き換えたり、グローバル変数を増やしたりするからです。⟦s000394⟧⟦s000400-s000402⟧"}, {"type": "paragraph", "text": "関数型では、同じ入力を渡せば、いつ呼んでも必ず同じ出力が返ってきます。これを**純粋関数（pure function）**と呼びます。⟦s000415-s000417⟧"}, {"type": "paragraph", "text": "だから、呼ぶ順番を入れ替えても、結果は変わりません。必要なければ呼ばないことだってできます。コンパイラは、速く計算できる順番を自由に選べるのです。⟦s000418-s000422⟧"}, {"type": "code", "language": "haskell", "explanation": "yを使わなくても、zの値だけで結果が決まるので、yの計算は省略できます。⟦s000474⟧", "items": []}]}, {"card_type": "gotcha", "hero_emoji": "💤", "title": "必要になるまで計算しない遅延評価", "content_blocks": [{"type": "callout", "alert_type": "info", "code_string": "", "language": "", "explanation": "", "items": []}, {"type": "paragraph", "text": "Haskellは、変数の値が本当に使われるまで計算を始めません。これを**遅延評価（lazy evaluation）**と呼びます。⟦s000431-s000434⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "遅延評価のしくみを次の一歩に", "content_blocks": [{"type": "paragraph", "text": "今回は、命令型と関数型の違いから始めて、副作用があると順序が大事になること、純粋関数なら順番を自由に決められることを見ました。そして、Haskellは必要になるまで計算を遅らせる遅延評価で動いていることも確認しました。"}, {"type": "paragraph", "text": "授業では触れましたが、今回のカードでは扱いきれなかった話題もあります。ぜひ自分で調べてみてください。"}, {"type": "list", "items": ["初期のHaskellが入出力を持たなかった理由と、その後の対処法 ⟦s000511-s000517⟧", "関数の引数がサンクとして渡され、使われた時に評価される細かい仕組み ⟦s000477-s000478⟧"]}, {"type": "paragraph", "text": "でも、Haskellは型にもとても厳しい言語です。次の『関数定義と型推論』では、関数シグネチャや型推論を通して、その厳しさの正体をのぞいてみましょう！"}]}], "4": [{"card_type": "hook", "hero_emoji": "🧩", "title": "関数は『式』そのもの", "content_blocks": [{"type": "quote", "text": "Haskellの関数は『return』を書かない。数式をそのまま書けば、それが答えになる！⟦s000620⟧"}, {"type": "paragraph", "text": "普段の言語では『この箱に値を入れて返す』という手順を書きがちですよね。でもHaskellでは、数学の式 \\(3x^2\\) をそのまま書くだけ。まるで数学の授業のノートを写すような感覚で、関数が書けちゃうんです！"}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "型シグネチャを読み解こう", "content_blocks": [{"type": "paragraph", "text": "Haskellの関数定義は、まず『型シグネチャ』という1行を書きます。最初の型が引数、最後の型が戻り値です。⟦s000594-s000603⟧"}, {"type": "code", "language": "haskell", "explanation": "poly関数は、Double型を受け取り、Double型を返す。⟦s000566-s000569⟧", "items": []}, {"type": "list", "items": ["引数の型は、左から順に並ぶ", "最後に書かれた型が戻り値の型", "括弧やカンマは使わない"]}, {"type": "paragraph", "text": "呼び出しも簡単です。関数名のあとに、スペースで区切って引数を並べるだけ。poly 2 のように書けば、4の二乗の3倍、つまり12が返ってきます。⟦s000572⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "Haskellは型をこっそり推論する", "content_blocks": [{"type": "paragraph", "text": "型シグネチャを書かなくても、Haskellは関数の中身を見て型を推論してくれます。isOldの例では、ageを整数と比べているから整数、hasAchesを真偽値と比べているから真偽値、と判断されました。⟦s000756-s000761⟧"}, {"type": "callout", "alert_type": "warning", "explanation": "Haskellは厳格です。", "items": []}, {"type": "paragraph", "text": "ここが大事なポイント！Haskellは0と1を真偽値として扱うような暗黙の型変換を一切しません。整数と真偽値の比較はエラーになります。C++のように自動で変換してくれると思ったら大間違いです。⟦s000771-s000775⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "ここまでのまとめと次へ", "content_blocks": [{"type": "paragraph", "text": "今回は、Haskellで関数を定義して呼び出す基本の流れを学びました。戻り値は式そのものであり、型はシグネチャで書くか、Haskellに推論させられること、そして型変換は行われない厳格な言語であることを確認しました。"}, {"type": "paragraph", "text": "ここでは、まだ詳しく扱わなかった内容を、ぜひご自身で調べてみてください。"}, {"type": "list", "items": ["字下げを使った複数行の関数定義の細かいルール ⟦s000676-s000677⟧", "関数シグネチャの書き方の理由や、引数が複数あるときの型の並び方 ⟦s000681-s000689⟧", "カリー化と部分適用の考え方 ⟦s000695-s000697⟧"]}, {"type": "paragraph", "text": "ところで、関数の呼び出しで引数を並べるだけで演算が正しく進むのはなぜでしょう？次のトピックでは、演算子の優先順位や括弧の使い方、そしてif式やガードといった条件分岐の書き方を学んでいきます。きっと、ここで見た『スペースで並べる』ルールが効いてくるはずですよ！"}]}], "5": [{"card_type": "hook", "hero_emoji": "🎯", "title": "関数は左から順番に食べられる", "content_blocks": [{"type": "quote", "text": "Haskellで『f of g of 2』と書くと、あなたの予想とは違う順番で計算が進むかもしれません！"}, {"type": "paragraph", "text": "ふつうは『2をgに渡して、その結果をfに渡す』と考えたくなりますよね。でも、Haskellは左から読んでいくので、思っていた順番とはズレてしまうんです。びっくりですが、ここが最初のつまずきポイントです！"}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "左から読む、関数は強い", "content_blocks": [{"type": "paragraph", "text": "Haskellは関数呼び出しを左から評価するので、『f g 2』は『fにgを渡し、その結果に2を適用する』と解釈されます。これを関数適用の左結合（left associativity）と呼びます。⟦s000915⟧⟦s000917⟧"}, {"type": "callout", "alert_type": "info", "explanation": "", "items": []}, {"type": "code", "language": "haskell", "explanation": "括弧で先にgを2に適用させる書き方。⟦s000947⟧⟦s000953⟧", "items": []}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "関数呼び出しは演算子より強い", "content_blocks": [{"type": "callout", "alert_type": "warning", "explanation": "", "items": []}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "次はパターンと再帰へ", "content_blocks": [{"type": "paragraph", "text": "今回は、Haskellが関数呼び出しを左から評価すること、括弧で順序を変えられること、関数呼び出しが演算子より優先されることを学びました。ifは値を返す式なので、elseが必須という点も大切です。"}, {"type": "paragraph", "text": "ここまでの仕組みを押さえたら、次は関数を組み立てる別の見方に進みます。どんな道具でつながっていくのか、楽しみにしていてください！"}]}], "6": [{"card_type": "hook", "hero_emoji": "🪆", "title": "入れ子人形のように関数を呼ぶ", "content_blocks": [{"type": "quote", "text": "再帰は、関数が自分自身を呼び出して、答えを少しずつ積み上げていく仕組みです！"}, {"type": "paragraph", "text": "階乗を例に考えてみましょう。もし「n=2の階乗」を求めたいなら、関数は「n=1の階乗」を呼び、それがさらに「n=0の階乗」を呼びます。ちょうど入れ子の人形を開けていくように、一番奥まで進んでから、答えを持って戻ってくるんです。⟦s001253⟧⟦s001256⟧⟦s001276⟧"}]}, {"card_type": "core_why", "hero_emoji": "⏳", "title": "計算は必要になるまで待つ", "content_blocks": [{"type": "paragraph", "text": "Haskellでは、引数の n-1 をその場で計算せず、「あとで必要になったら計算してね」という約束事を渡します。この約束事の正体がサンク（thunk）です。⟦s001263⟧⟦s001315⟧"}, {"type": "callout", "alert_type": "info", "explanation": "", "items": []}, {"type": "paragraph", "text": "ではいつ計算されるのでしょうか？答えは「判断が必要になった瞬間」です。n==0かどうかを調べる時点で初めてn-1が評価されます。⟦s001292⟧⟦s001294⟧⟦s001295⟧"}, {"type": "code", "language": "haskell", "explanation": "let式で局所変数を定義し、式の中で使う例です。", "items": []}]}]}, "deep_notes": {"1": "# 1. コンパイラとインタプリタの役割と違い\n\nコンパイラ（compiler）とインタプリタ（interpreter）は、どちらもプログラムを実行可能な形にするための仕組みですが、そのやり方が大きく異なります。さらに重要なのは、**「コンパイル型」「インタプリタ型」は言語そのものの性質ではなく、言語をどう実装するかという方式の違い**だという点です。⟦s000002-s000003, s000013⟧\n\n## 🔍 2つの言語処理方式の基本\n\nまず大まかなイメージをつかみましょう。コンパイラは、プログラム全体を**機械語（machine code）**へ変換してから実行します。一方インタプリタは、プログラムを**1行ずつ（line by line）解釈しながら実行を進める**仕組みです。⟦s000050-s000051⟧\n\nこのため、同じプログラムでも「事前にまとめて変換するか」「その場で読み解きながら動かすか」という点で性質が変わります。\n\n## ⚙️ コンパイラの特徴\n\nコンパイラは、変換を済ませた機械語を実行するため、実行時の速度が速くなる傾向があります。講義では、コンパイル済みコードは一般に実行が速い、と説明されました。⟦s000050, s000054⟧\n\nその一方で、コードを変更するたびに**再コンパイル（recompilation）**や**リンク（linking）**が必要になることが多く、試行錯誤のスピードが落ちやすいという欠点があります。⟦s000052-s000053⟧\n\n> 補足：コンパイル処理そのものに時間がかかるため、「少し直して試す」という作業のリズムが遅くなる、と考えると分かりやすいです。⟦s000052-s000053⟧\n\n## ⚙️ インタプリタの特徴\n\nインタプリタは、コードを変換せずに解釈して実行するので、変更を加えてすぐに結果を確かめられます。そのため、反復的な作業や対話的なデバッグに向いています。⟦s000054-s000055⟧\n\n一方で、実行時に毎回解釈する分、一般にはコンパイル済みコードより実行速度が遅くなります。講義では、インタプリタには最適化（optimizations）がほとんどなく、多くの場合は実質的なコンパイルも行わない、と対比されました。⟦s000054-s000055⟧\n\n## 🆚 コンパイラとインタプリタの比較\n\n両者は「プログラムを動かす」という目的は同じですが、次のように性質が対照的です。\n\n- **実行速度**：コンパイラは速く、インタプリタは遅い傾向があります。⟦s000050-s000054⟧\n- **反復の速さ（iteration speed）**：コンパイラは再コンパイルやリンクの手間で遅く、インタプリタは変更をすぐ試せるため速いです。⟦s000052-s000054⟧\n- **得意な場面**：コンパイラは完成したコードを効率よく動かすのに向き、インタプリタは試行錯誤や対話的な作業に向いています。⟦s000052-s000054⟧\n\nこの違いは、「事前に全体を変換するか」「その場で解釈するか」という処理のタイミングの差から生まれています。⟦s000050-s000051⟧\n\n## ⚠️ よくある誤解：言語の性質か、実装方式か\n\n多くの人は「C++はコンパイル型、Pythonはインタプリタ型」と言語ごとに決まっていると考えがちです。しかし、どの言語もどちらの方式でも実装できる、というのが重要なポイントです。⟦s000002-s000003, s000013⟧\n\n- 言語によっては機械語への変換が難しいことがあります。例えばCはポインタなどがあるため、解釈するのが難しい場合があります。⟦s000017-s000018, s000030⟧\n- しかし、原理的に不可能というわけではありません。どの言語でもコンパイルも解釈も可能である、という前提で考えるべきです。⟦s000030-s000031, s000024-s000025⟧\n\nまた、「動的型付け（dynamically typed）言語は必ず解釈され、静的型付け（statically typed）言語は必ずコンパイルされる」という対応も**規則ではなく、よくある傾向にすぎません**。Pythonのように動的型付けの言語でも、コンパイルされる仕組みは存在します。⟦s000019-s000023, s000032-s000034⟧\n\n## 💡 具体例：SinteとCython\n\n講義で挙げられた2つの例は、「コンパイル型の言語をインタプリタで動かす」「インタプリタ型の言語をコンパイルする」という両方向を示しています。⟦s000027⟧\n\n- **Sinte（シント）**：1990年代に作られた、CとC++のインタプリタです。CERNで科学計算に使われていました。これは「コンパイル型として知られる言語をインタプリタで実装した例」です。⟦s000028⟧\n- **Cython（サイソン）**：PythonをいったんCへ変換（トランスパイル）し、その後C++コンパイラで機械語にコンパイルします。これは「インタプリタ型として知られる言語をコンパイルした例」です。⟦s000029⟧\n\n## 🎯 まとめ\n\n- コンパイラはプログラム全体を機械語に変換し、速い実行速度を得られますが、変更のたびに再コンパイルやリンクが必要になり、反復が遅くなりがちです。⟦s000050, s000052-s000054⟧\n- インタプリタは1行ずつ解釈しながら実行するため、変更をすぐ試せますが、一般に実行は遅くなります。⟦s000051, s000054-s000055⟧\n- コンパイルか解釈かは言語に固定された性質ではなく、実装方式の選択です。動的型付けと解釈の結びつきも、ただの傾向にすぎません。⟦s000022-s000023, s000027, s000032-s000034⟧", "2": "# 2. 関数型プログラミングの基礎と数学的背景\n\n**関数型プログラミング（functional programming）**とは、変数の値を順に書き換える手続きではなく、関数の適用と合成によって値を変換していくことでプログラムを組み立てる考え方です。その中心にあるのが、入力だけで出力が決まる**純粋関数（pure function）**であり、この性質が理解しやすさ、並列化、形式的な推論といった利点につながります。⟦s000192-s000193, s000236-s000237⟧\n\n## 🔍 関数型プログラミングの基本ルール\n\n関数型プログラミングでは、まず関数の形に強い前提があります。これらの前提を知っておくと、後で出てくる純粋関数の定義が自然に理解できます。⟦s000192-s000197⟧\n\n- **引数と戻り値**：すべての関数は少なくとも1つの引数を受け取り、値を返します。戻り値のない関数は、関数型プログラミングでは有効な関数とみなされません。⟦s000194-s000197⟧\n- **引数の数**：純粋な関数型言語では引数はちょうど1つですが、ここでは「少なくとも1つ」に緩めて考えます。引数を取らない関数は、純粋な関数型言語では使えません。⟦s000198-s000201⟧\n- **関数もデータ**：関数は整数や文字列と同じように変数へ代入でき、引数として別の関数に渡すこともでき、戻り値として返すこともできます。⟦s000202-s000211⟧\n\nたとえば、\\( f(x) = x + 5 \\) という関数を変数 \\( y \\) に代入すれば、\\( y \\) は関数そのものを保持します。また、関数 \\( f \\) を別の関数 \\( g \\) の引数として渡すことも可能です。⟦s000206-s000210⟧\n\n## 📜 歴史的背景：ラムダ計算からHaskellまで\n\n関数型プログラミングの数学的な出発点は、**ラムダ計算（lambda calculus）**にあります。1930年代にアロンゾ・チャーチ（Alonzo Church）が発展させたもので、「計算可能な問題はいくつかの関数を合成することで解ける」という考え方を表します。⟦s000138-s000142⟧\n\nここでいう**関数合成（function composition）**とは、ある関数の出力を次の関数の入力に渡すことです。たとえば \\( y = f(g(h(x))) \\) のように、\\( h \\) の出力を \\( g \\) に、\\( g \\) の出力を \\( f \\) に渡していく形になります。⟦s000143-s000146⟧ ラムダ計算では、各関数が持つ引数は最大で1つに限られます。⟦s000146-s000147⟧\n\n1937年にはアラン・チューリングが、ラムダ計算とチューリング機械（Turing machine）が等価であることを証明しました。つまり、チューリング機械で計算できるものは、関数の合成によっても計算できることになります。これが**チャーチ＝チューリングの考え方（Church–Turing thesis）**として紹介されました。⟦s000157-s000163⟧\n\nそのあとの流れは次のとおりです。\n\n- **1958年**：ジョン・マッカーシーが**LISP**を開発しました。最初期の関数型言語で、ラムダ計算の考え方をもとにしています。ガベージコレクション（garbage collection）やクロージャ（closure）といった概念も導入しました。⟦s000168-s000172⟧\n- **1987年**：関数型言語の共通の標準を作るため、Functional Programming Conference（Portland, Oregon）で新しいオープンな言語を定義する取り組みが始まりました。その成果が**Haskell**です。当時は多くの関数型言語があったものの、共通の標準がなかったことが背景にあります。⟦s000176-s000182⟧\n- Haskellという名前は、形式的手法でプログラムの振る舞いを評価した数学者ハスケル・カリー（Haskell Curry）に由来します。⟦s000183-s000184⟧\n\nここで押さえておきたいのは、Haskellが「純粋な関数型言語（pure functional language）」の代表例だという点です。そのため、関数型の考え方を明確に示す題材として選ばれています。⟦s000106-s000107⟧\n\n## 🔒 不変性（immutability）と変数の扱い\n\n純粋な関数型プログラミングでは、**不変性（immutability）**が前提になります。これは、変数を一度初期化したら値を変更できないという性質です。つまり、すべての変数は実質的に定数として振る舞います。⟦s000109-s000112⟧\n\n具体的には、次のような書き方は許されません。\n\n- \\( i = i + 1 \\) のように値を更新すること\n- `i++` のように値を増やすこと\n\n純粋な関数型プログラミングでは、変数を変更すること自体が認められません。⟦s000212-s000214⟧ 一見すると「どうやってプログラムを書くのか」と疑問に思うかもしれませんが、状態を変えずに値を変換していく書き方に慣れることが、この分野の出発点になります。⟦s000214-s000215⟧\n\n## 🧪 純粋関数（pure function）の定義\n\n関数型プログラミングの中心にあるのが、**純粋関数（pure function）**です。これは次の2つの性質を満たす関数です。⟦s000239-s000251⟧\n\n1. **同じ入力には常に同じ出力**：入力 \\( x \\) を与えたとき、\\( f(x) \\) は毎回必ず同じ値 \\( y \\) を返します。たとえば、1を入れると毎回10が返り、2を入れると毎回20が返ります。2を入れて25が返ることはありません。⟦s000240-s000244⟧\n2. **入力だけに基づいて計算する**：出力は引数のみと内部の計算から決まり、呼び出しのたびに変わりうる外部データ（現在時刻、変化するグローバル変数など）には頼りません。⟦s000245-s000250⟧\n\n純粋関数は、**参照透過（referentially transparent）**な関数とも呼ばれます。意味は同じですが、こちらではより発音しやすい「純粋」という言葉を使います。⟦s000236-s000238⟧\n\n### 定数の扱い\n\nここで、「入力だけに基づく」という条件に疑問が生じるかもしれません。関数の中で定数を使うことは問題ありません。変化しないグローバル変数を参照することも、その変数が**定数**であれば許されます。⟦s000269-s000274⟧\n\n### 純粋関数の性質が保証すること\n\n- 関数の呼び出し結果は、入力さえ同じなら何度呼んでも変わりません。\n- 外部の状態の変化に影響されないため、関数の振る舞いを入力と出力の対応だけで理解できます。\n- このため、数学的に推論しやすいと考えられています。⟦s000230-s000232⟧\n\n## 🆚 純粋関数と不純な関数の対比\n\n純粋ではない関数は、**不純な関数（impure function）**と呼ばれます。両者の違いは、外部の状態に触れるかどうかにあります。⟦s000252-s000261⟧\n\n<!-- FIGURE: type=\"diagram\" title=\"純粋関数と不純な関数の入出力の違い\" description=\"左側に純粋関数を描く。入力 x のみが矢印で入り、内部計算を経て出力 y のみが出る。外部の変数や状態への矢印はない。右側に不純な関数を描く。入力 x に加えて、外部のグローバル変数や乱数生成器などの外部状態から矢印が関数に入り、関数の内部からも外部の状態へ書き戻す矢印が出ている。左右で、外部との接続の有無が一目で分かるようにする。\" -->\n\n| 観点 | 純粋関数 | 不純な関数 |\n|---|---|---|\n| 入力が同じ場合の出力 | 常に同じ | 呼び出しごとに変わりうる |\n| 外部の状態 | 読まない・変更しない | 読む、または変更する |\n| 具体例 | 1を入れると毎回10 | 乱数を返す、グローバル変数を書き換える |\n\n**具体例で確認しましょう。**\n\n- **純粋な例**：引数を1つ受け取り、何らかの計算をして変数に入れ、その値を返す関数です。同じ引数を与えれば、結果は毎回同じになります。⟦s000252-s000256⟧\n- **不純な例**：グローバル変数を持ち、呼び出すたびにその変数を変更する関数です。呼び出すたびに結果が変わるため、不純になります。⟦s000257-s000260⟧\n- **C++との対比**：乱数を生成して返す関数は、呼び出すたびに異なる値を返します。このような関数は関数型言語では書けません。⟦s000221-s000223⟧\n\nここで重要なのは、**副作用（side effect）**という考え方です。副作用とは、関数の外側の状態に対する変更のことです。純粋関数は副作用を持たず、不純な関数は副作用を持ちます。⟦s000264-s000265⟧ 関数が外部の状態を読んだり書いたりすると、その関数の結果はいつでも変わりうるため、関数単体で振る舞いを予測できなくなります。⟦s000224-s000229⟧\n\n## 🎁 純粋関数がもたらす利点\n\n純粋関数を使う理由は、主に次のような利点にあります。⟦s000275-s000338⟧\n\n- **デバッグのしやすさ**：変化する状態を参照しないため、別の場所で変数が書き換わって問題が起きる、という事態が起きにくくなります。⟦s000284-s000288⟧\n- **並列化の容易さ**：変更可能な共有状態がなければ、**競合状態（race condition）**の心配が減ります。並列実行に向いた効率的なコードを書きやすくなります。⟦s000292-s000297⟧\n  - 従来の並行処理では、共有された変更可能な状態を**ミューテックス（mutex）**などで守る必要がありました。\n- **振る舞いの予測しやすさ**：同じ入力に対する出力が決まっているため、何が起きるかを予測しやすく、結果を決定的（deterministic）に理解できます。⟦s000301-s000302⟧\n- **形式的な推論と証明**：入力と出力の対応が明確なので、「この入力に対してこの出力になる」という証明を組み立てやすくなります。⟦s000322-s000326⟧\n  - 数学的な証明に使われる言語として**Lean**が挙げられました。Leanも関数型言語であり、推論しやすい性質を活かしています。⟦s000327-s000330⟧\n- **コンパイラによる最適化**：変数の値が途中で変わるかどうかを気にしなくてよいので、最適化を強力に行いやすくなります。⟦s000333-s000335⟧\n\n一方で、**モジュール性**については注意が必要です。関数だけで構成されるため、モジュール的に書ける可能性はありますが、関数型であることが自動的にモジュール性を保証するわけではありません。悪いコードはどの言語でも非モジュール的になりえます。⟦s000307-s000313⟧ また、コンパイラの作りやすさについても、複雑な問題が残るため一概には言えません。⟦s000317-s000319⟧\n\n### ⚠️ 注意：関数型は再帰に慣れる必要がある\n\n関数型プログラミングの欠点として、**再帰（recursion）**に習熟する必要があることが挙げられました。ループを使えないため、繰り返し処理は再帰的な関数呼び出しで表現することになります。⟦s000339, s000350-s000351⟧\n\n## 🧭 命令型プログラミングとの違い\n\n**命令型プログラミング（imperative programming）**は、C++やPythonのように、文と変数の変更、ループを順に積み重ねる書き方です。アルゴリズム的な手順を書くイメージです。⟦s000342-s000343⟧\n\n一方、関数型プログラミングでは、関数呼び出しによる変換と再帰で問題を表します。文やループ、変更可能な変数は使いません。⟦s000344-s000346, s000349⟧ 命令型では変数の状態変化が必要不可欠ですが、関数型ではすべての変数が定数です。⟦s000347-s000349⟧\n\nこのため、関数型では「計算を手順の列として捉える」のではなく、「関数の合成として捉える」ことになります。⟦s000352-s000355⟧\n\n### 並行処理と実行順序\n\n命令型では、マルチスレッド（multi-threading）が扱いにくく、誤りを起こしやすいとされました。関数型では、変更される状態がないため、マルチスレッドを扱いやすくなります。⟦s000356-s000357⟧ 命令型では、副作用があるとコードの実行順序が重要になり、順序を慎重に管理する必要があります。⟦s000358-s000360⟧\n\n## 🎯 Key Takeaway\n\n- **純粋関数**は、同じ入力には常に同じ出力を返し、外部の変化する状態に依存しない関数です。⟦s000239-s000251⟧\n- 外部状態の読み書きを行わない（**副作用がない**）ことで、関数の振る舞いは入力だけから予測できます。⟦s000264-s000265, s000245-s000250⟧\n- この性質により、デバッグ、並列化、最適化、形式的な証明が行いやすくなります。⟦s000332-s000337⟧\n- 関数型プログラミングでは、**不変性**を前提とし、ループの代わりに**再帰**で問題を解く必要があります。⟦s000212-s000213, s000339⟧", "3": "# 3. 副作用のない計算と遅延評価\n\n**関数型プログラミング**では、プログラムを手順の列としてではなく、関数の呼び出しと変換の組み合わせとして組み立てます。そのため、**副作用**（side effect）がないことで結果が予測しやすくなり、さらに**遅延評価**（lazy evaluation）によって「本当に必要になった値だけを計算する」という性質が生まれます。\n\n## 🔀 命令型と関数型の違い\n\n**命令型プログラミング**（imperative programming）は、C++やPythonのように、文やループを順に実行し、変数の値を変えながら処理を進める方式です。⟦s000342-s000343, s000347-s000348⟧\n\n一方、**関数型プログラミング**（functional programming）では、処理は関数呼び出しによる変換で表現され、ループや代入可能な変数、文は存在しません。⟦s000344-s000346⟧ 講義では、手順のレシピではなく、関数を計算するものだという言い方で説明されています。⟦s000352-s000353⟧\n\n- **命令型**: 状態を変化させる（変数の更新、ループ、文の列）⟦s000347-s000351⟧\n- **関数型**: すべての変数は定数で、変更は許されない。計算は関数の合成と再帰呼び出しで行う⟦s000349-s000351, s000355⟧\n\nこの違いは並列処理にも影響します。命令型では複数スレッドの扱いが難しく、エラーが起きやすいとされています。⟦s000356⟧ 関数型ではそれが容易だと説明されています。⟦s000357⟧\n\n## ⚠️ 副作用があると順序が問題になる理由\n\n命令型プログラムでは、コードを実行する順番が結果を左右します。⟦s000359-s000360⟧ 関数が外部の状態を変えるなら、どちらを先に実行するかで結果が変わり、競合状態（race condition）の心配も出てきます。⟦s000360-s000362⟧\n\nここで**副作用**とは、関数が計算結果を返すこと以外に、外部の状態を変えてしまう作用のことです。例として、ファイルの書き換えやグローバル変数の変更が挙げられています。⟦s000394-s000397⟧\n\n> 副作用があると、関数の出力は同じ入力に対しても呼び出し時期によって変わりうる。\n\nこれがコンパイラにとっての制約になります。順序を守らなければならないので、並べ替えによる最適化ができない場面が生まれます。⟦s000408-s000410, s000412-s000414⟧\n\n逆に関数型では、どの時点で呼び出しても同じ入力には同じ出力が返ります。⟦s000415-s000417⟧ つまり、順序を気にする必要が小さくなり、コンパイラは計算順序を入れ替えたり、一部の呼び出しを省略したりできます。⟦s000418-s000422⟧ 順序の重要性が低いという意味は、この性質から来ています。⟦s000363, s000423-s000425⟧\n\n## 🧮 同じ構造の2つのプログラム\n\n講義では、命令型風の関数と、Haskellで書いた同じ関数を比べています。どちらも、入力`arg`から`y`と`z`を求め、条件によって結果を決める点で同じです。⟦s000369-s000371, s000377-s000381⟧\n\nHaskell版では次の形になります。\n\n```haskell\nsomeFunc arg = if z == 7 then 0 else y\n  where\n    y = func1 arg\n    z = func2 arg\n```\n\n> 補足: 講義では、条件として最初は`y`が7かどうかと述べられ、その後のHaskell版では`z`が7かどうかで書かれています。ここでは、遅延評価の説明に使われた`z`の条件版を基準にしています。⟦s000371, s000379-s000381⟧\n\nHaskellの`where`節は、ローカル変数を関数の末尾にまとめて定義するための書き方で、講義では「少し変わった定義の仕方」と紹介されています。⟦s000381-s000383⟧\n\n## 💤 遅延評価: 必要になるまで計算しない\n\nC++のような命令型の言語では、`y = func1`、`z = func2`と書かれた順にそのまま実行されます。⟦s000429-s000430⟧ 一方、Haskellは式を上から順に評価せず、変数の値は実際に使われるときにだけ計算されます。⟦s000427-s000428, s000431-s000434⟧\n\n次の場合を考えると分かりやすくなります。\n\n1. `z`を計算すると7になる。⟦s000436-s000438⟧\n2. 条件分岐で`z == 7`が真なので、即座に`0`を返す。⟦s000439-s000440⟧\n3. `y`は一度も使われないので、Haskellは`func1`を一切呼び出さない。⟦s000440-s000442⟧\n\nこのように、Haskellは判断や結果に必要な値が確定するまで待ち、必要になった時点で初めて計算します。⟦s000443-s000444⟧ 関数は同じ入力に同じ出力を返すため、後から計算しても問題が起きないことが、この戦略を支えています。⟦s000443-s000444⟧\n\nまた、条件分岐の一方の結果が確定すれば、もう一方の値を作る関数を呼ぶ必要はありません。⟦s000497-s000502⟧ 最終的に値を表示するときには、その時点で評価が行われます。⟦s000502-s000503⟧\n\n> 遅延評価の原則: 言語は、強制されたとき、つまり本当に必要なときだけ式を評価する。⟦s000504-s000506⟧\n\n## 🧩 引数もサンクとして渡される\n\n遅延評価は変数の定義だけでなく、関数の引数にも及びます。`f (g x)`と書いたとき、`f`の中で`g x`が使われなければ、`g x`は評価されません。⟦s000468-s000471, s000475-s000477⟧\n\n講義では、`f`が引数を受け取っても常に0を返す例が示されました。この場合、Haskellは`g x`を先に計算せず、後で必要になったら計算される「サンク」（thunk）と呼ばれるものとして渡します。⟦s000473-s000479⟧\n\n- 引数を使わなければ、`g x`は何段階も深い式でも実行されない。⟦s000480-s000483⟧\n- 使われた場合にのみ、サンクが計算を実行する。⟦s000477-s000479⟧\n\nこれは、一般的な「引数をまず計算してから関数に渡す」という感覚とは異なります。⟦s000480-s000482⟧\n\n## 🎯 Key Takeaway\n\n- **関数型プログラミング**は、変数の変更を避けて関数の変換で計算を組み立てる。⟦s000344-s000349⟧\n- **副作用**がないため、同じ入力には常に同じ出力が返り、計算順序の制約が小さくなる。⟦s000415-s000417, s000423⟧\n- **遅延評価**では、値が本当に必要になるまで計算を行わず、使われない式は実行されない。⟦s000431-s000434, s000504-s000506⟧\n- **サンク**は、まだ計算していない式を保持し、必要になったときに評価するための仕組みである。⟦s000477-s000479⟧\n\n講義では、Haskellは純粋な関数だけで設計されたため、最初のバージョンでは入出力もできなかったと説明されています。入力は呼び出すたびに違う値を返すため、副作用を伴うからです。⟦s000511-s000517⟧", "4": "# 4. Haskellの関数定義と型推論\n\nHaskellでは、関数の型を先頭の宣言で示し、本体には計算式をそのまま書きます。さらに、型を省略してもコンパイラが型を推論し、型の不一致は自動変換されずにエラーとして検出されます。\n\n## 🚀 最初のHaskellプログラム\n\n最初の例は、円の面積を計算する関数 `area` です。この関数はファイルに保存し、インタプリタ GHCi (GHCi) に読み込んで実行します。⟦s000518-s000524⟧ GHCi は対話型インタプリタ(REPL)であり、同時にコンパイラとしても動作します。⟦s000524-s000525⟧\n\n読み込みの手順は次のとおりです。\n\n- ファイル名は `area.hs` のように拡張子まで書く必要はなく、`area` と書けば読み込めます。⟦s000527-s000528⟧\n- 読み込まれた関数は、括弧を付けずに `area 10` のように引数を空白で続けて呼び出します。⟦s000529-s000531⟧\n- 半径10の円の面積として `314` が出力されました。⟦s000531-s000532⟧\n\nプログラムを変更した場合は、ファイルを保存してから GHCi で `:r` を実行すると再読み込みできます。⟦s000532-s000536⟧ 例では、定数 `3.14` を Haskell に組み込まれている定数 `pi` に置き換えました。その結果、より高い精度の値が出力されました。⟦s000533-s000536, s000540⟧\n\n> Haskellのプログラムは、数百行の大規模なものではなく、10〜15行程度の小さな関数を組み合わせて書くことが中心になります。⟦s000538-s000539⟧\n\n## ✍️ 関数定義の基本ルール\n\n### 数式をそのまま書く\n\n次の例は、3x²を返す関数 `poly` です。C++ での同等のコードと比べると、Haskell の `=` は代入ではなく「関数の本体はこの式である」という定義を表します。⟦s000565-s000570⟧ Pythonのコロンのように読むと理解しやすくなります。⟦s000567-s000569⟧\n\n```haskell\npoly :: Double -> Double\npoly x = 3 * x^2\n```\n\nこの関数を GHCi で `poly 2` と呼び出すと、結果は `12` になります。⟦s000571-s000572⟧\n\n### 定義の要素\n\n関数定義について、観察された特徴は次のとおりです。\n\n- **型シグネチャが定義の上に置かれる**: 関数名の型宣言を、関数本体の定義より前に書きます。⟦s000647⟧\n- **引数の型が先に並び、最後の型が戻り値の型になる**: 型宣言の最初の型は引数の型を、最後の型は関数全体の戻り値の型を表します。⟦s000594-s000600, s000648-s000649⟧ 引数が複数ある場合は、引数の型を順に並べ、最後の型が戻り値になります。⟦s000601-s000603, s000711-s000712⟧\n- **引数を括弧で囲まない**: 引数の周りに括弧は付けず、呼び出しも名前の後に引数を空白で並べます。⟦s000650, s000653-s000654⟧\n- **return文を書かない**: 本体には式を直接書き、その値が結果になります。これを暗黙の戻り値(implicit return)と呼びます。⟦s000617-s000624⟧\n- **区切りは改行と空白だけ**: セミコロンや括弧は不要で、構文は空白と改行に基づいています。⟦s000607-s000615, s000627-s000631⟧\n\n### 関数名が2回現れる理由\n\n型宣言と定義本体の両方で、関数名を書く必要があります。⟦s000637-s000639⟧ これは言語設計者が選んだ仕様であり、別の書き方も可能です。形式的な必然性はなく、Haskellの特徴(quirk)の一つです。⟦s000641-s000646⟧\n\n## 📐 複数引数と複数行の関数\n\n2つの値を比較する `isGreater` を例に、複数引数の型宣言を見ます。この関数は1つ目の引数が2つ目より大きいかを判定し、戻り値は `Bool` です。⟦s000658-s000660, s000709⟧\n\n```haskell\nisGreater :: Double -> Double -> Bool\nisGreater first second = first > second\n```\n\n- 型宣言の `Double -> Double -> Bool` は、2つの引数と1つの戻り値を表します。⟦s000711-s000712⟧\n- 型を引数名の下に揃えて書くと見やすくなりますが、この揃え方は必須ではありません。⟦s000719-s000727⟧\n- 関数本体を複数行に分けて書く場合は、行頭を揃えるインデントが必要です。インデントの幅は自由ですが、同じ関数の中では一貫させる必要があります。⟦s000676-s000677, s000713⟧\n\n呼び出しの際も、引数はカンマを使わず空白で区切ります。⟦s000714-s000715⟧\n\n> 引数をまとめて一行に並べる型表記は読みにくく感じられますが、この形にはなにか理由があります。その理由は、カリー化(currying)と部分適用(partial function application)を扱う際に説明されます。⟦s000680-s000681, s000686-s000687, s000696-s000697⟧\n\n関数に引数を1つだけ与えて呼び出すと、残りの引数を待つ関数が作られます。これは部分適用と呼ばれる仕組みで、後で詳しく扱われます。⟦s000669-s000671⟧\n\n## 🔎 型推論: 型を書かなくても決まる仕組み\n\n### 例: isOld\n\n次の関数 `isOld` には型シグネチャがありません。引数は年齢と「体の痛みがあるか」を表し、年齢が30より大きいか、痛みがあれば「年寄り」と判定します。⟦s000734-s000737⟧\n\n```haskell\nisOld age hasAches = age > 30 || hasAches == True\n```\n\n型シグネチャがないにもかかわらず、`:t isOld` で型を尋ねると `Int -> Bool -> Bool` と返ります。⟦s000743-s000747⟧ `:t` は、値や関数の型を調べるための命令です。⟦s000743, s000746⟧\n\n### 型が導かれる過程\n\nHaskellは、関数の本体の使われ方から型を推論します。⟦s000748-s000750⟧\n\n1. `age` は整数 `30` と比較されているため、整数型(`Int`)でなければなりません。⟦s000756-s000757⟧ 文字列などを整数と比較できないため、この判断が成り立ちます。⟦s000758, s000808-s000812⟧\n2. `hasAches` は `True` と比較されているため、真偽値(`Bool`)でなければなりません。⟦s000761, s000814⟧\n3. 戻り値は `||` の結果であり、論理演算は真偽値を返すため、戻り値も `Bool` になります。⟦s000765-s000767, s000815-s000817⟧\n\nこのように、本体の使い方から各引数と戻り値の型が決まります。型を書かなくても、各値の型は必ず一つに決まっています。⟦s000849-s000851⟧\n\n### 型注釈を書いた場合と省略した場合\n\n- 型注釈 `:: Int` を書いた場合は、型が明示されるので推論結果は変わりません。⟦s000820-s000821⟧\n- 型注釈を外した場合は、型が`Int`に固定されず、整数と浮動小数点数の両方を含む、より広い数値型(`number`)として推論されます。⟦s000785-s000789⟧\n- `hasAches == True` の部分は、`hasAches` だけでも `Bool` と推論できるため省略が可能です。⟦s000792-s000793, s000830-s000833⟧ ただし、講師はこの比較を理解を明確にするために書いたと述べています。⟦s000794⟧\n\n### 型推論の位置づけ\n\n現在の多くの言語は、何らかの形で型推論を備えています。⟦s000844-s000846⟧ Haskellでは、型を書かなくても定義は成立し、実務で必要な場合を除いて型シグネチャを書く必要は通常ありません。⟦s000799-s000802, s000805-s000807⟧ 型を省略しても、型が存在しないわけではなく、コンパイラが推論して固定しているという点が重要です。⟦s000847-s000852⟧\n\n## 🛑 厳密な型検査: 自動変換は行われない\n\nHaskellは型に非常に厳格で、異なる型の値を暗黙に変換して合わせることはありません。⟦s000771-s000775, s000842-s000843⟧ 例えば、真偽値の `False` を整数 `0` として扱うことや、`1` を `True` として扱うことは行われません。⟦s000772-s000773⟧\n\n- 整数と整数、真偽値と真偽値のように、同じ型同士の比較のみが許されます。⟦s000774-s000775, s000810⟧\n- `if 0 == True` や `0 == False` のような比較はエラーになります。⟦s000839-s000841⟧\n- 整数を必要とする関数に浮動小数点数を渡すこともエラーになります。C++であれば自動的に整数へ変換される場面でも、Haskellは変換を行いません。⟦s000777-s000779, s000852-s000854⟧\n- 例えば `isOld 53.5 False` を呼び出すと、C++では小数が整数に変換されて動作しますが、Haskellではエラーになります。⟦s000857-s000859⟧\n\n型の変換が必要な場合は、プログラマーが明示的に変換を行う必要があります。⟦s000779, s000820-s000822⟧ なお、この操作は講義では「キャスト(casting)」と呼ばれましたが、正確には変換(conversion)と呼ぶべきだとされています。⟦s000820-s000821⟧\n\nまた、型注釈と本体の内容が矛盾する場合は、型の不一致としてエラーになります。⟦s000836-s000837⟧\n\n## 🎯 Key Takeaway\n\n- **関数定義**: 型宣言を定義の上に書き、引数の型を並べ、最後に戻り値の型を書きます。⟦s000647-s000649, s000711-s000712⟧\n- **関数の書き方**: 括弧やカンマを使わず、本体は式をそのまま書き、return文は不要です。⟦s000617-s000624, s000653-s000654⟧\n- **型推論**: 型を省略しても、本体の使い方から型が一意に決まります。⟦s000748-s000751, s000844-s000851⟧\n- **厳密な型検査**: 型の自動変換は行われず、型が合わない場合はエラーになります。⟦s000852-s000854, s000859-s000860⟧", "5": "# 5. Haskellの評価規則と条件分岐\n\nHaskellでは、括弧のない関数呼び出しは左から順にまとめて読まれ、関数呼び出しは演算子より優先されます。また、`if`は文ではなく値を返す式なので`else`が必須になり、ガードはその分岐を読みやすく書くための構文糖衣(syntactic sugar)として働きます。\n\n## 🔍 左結合の関数適用(left associativity)\n\nHaskellで関数 `f` と `g` を次のように定義します。`f` は \\(x^2\\)、`g` は \\(3x\\) を計算し、どちらも整数を受け取って整数を返します。⟦s000866-s000867⟧\n\n```haskell\nf x = x * x      -- f は x^2 を計算する\ng x = 3 * x      -- g は 3x を計算する\n```\n\nここで `y = f g 2` と `z = f 5 * 10` を考えます。前者は直感的には「`g 2` を先に計算して、その結果を `f` に渡す」と読みたくなりますが、Haskellはそうは読みません。⟦s000869, s000915-s000916⟧\n\nHaskellは関数呼び出しを左から右へ評価するため、この読み方を**左結合(left associativity)**と呼びます。`f g 2` は次のように解釈されます。⟦s000915-s000917, s000922-s000923⟧\n\n1. まず `f` に `g` を引数として渡す。(関数は引数として渡せる。)⟦s000924-s000926⟧\n2. その結果に `2` を適用する。⟦s000927⟧\n\nつまり `f g 2` の結果は、`f g` が関数を返すという場合にだけ意味を持ちます。今回の `f` は整数を返すので、`2` を適用できず**エラー**になります。⟦s000914, s000928-s000929⟧\n\n逆に、`g 2` を先に計算させたい場合は、括弧で囲んで意図を示します。`f (g 2)` は \\(g(2) = 6\\) を先に求め、それを `f` に渡して \\(6^2 = 36\\) を得ます。⟦s000903-s000904, s000947-s000951⟧\n\n```haskell\ny = f (g 2)   -- 36 (g 2 = 6 を先に計算)\nz = f 5 * 10  -- 250 (f 5 = 25、そのあと 10 を掛ける)\n```\n\n> 括弧は、Haskellで入れ子の呼び出しを表すときに**必ず**必要になる場面があります。ただし、それは意図を曖昧さなく示すためだけに使われ、左から右の読み方を変えない限り不要です。⟦s000954-s000956⟧\n\n## ⚙️ 関数呼び出しと演算子の優先順位(operator precedence)\n\nHaskellでは、関数呼び出しは数学の演算子より**優先順位が高い**と扱われます。そのため、`f 3 * 10` は `f (3 * 10)` ではなく、まず `f 3` を計算してから10を掛けます。⟦s000963-s000967⟧\n\n- `f 3` は \\(3^2 = 9\\) なので、結果は \\(9 \\times 10 = 90\\) です。⟦s000967-s000969⟧\n- 数学の表記で \\(f(3) \\times 10\\) と書く意図を、Haskellでは `f 3 * 10` と書くだけで表せます。⟦s000972, s000965-s000966⟧\n- 逆に、数学の \\(f(g(x))\\) のように入れ子にする場合は、Haskellでも括弧を追加する必要があります。⟦s000974-s000976⟧\n\nこの優先順位は、Cとほぼ同じ演算子の優先順位が採用されていることからも理解しやすいでしょう。ただし、関数呼び出しの優先順位はそれより上なので、「演算子の順序だけで決まる」と考えると誤解が生まれます。⟦s000960-s000961, s001057-s001059⟧\n\n## 🧩 二項演算子の前置形式(prefix form of a binary operator)\n\nHaskellでは、二つの値の間に置く二項演算子(infix)を括弧で囲むと、前置形式(prefix)の**普通の関数呼び出し**に変わります。⟦s001016-s001020⟧\n\n```haskell\nx * 10        -- 中置(infix)の書き方\n(*) x 10      -- 前置(prefix)の書き方、同じ意味\n```\n\nこの変換は、演算子を二つの引数を取る関数として読み替えることに相当します。`(*) x 10` は「掛け算関数に `x` と `10` を渡す」と考えると理解しやすいです。⟦s001021-s001024⟧\n\n同じ考え方は他の演算子にも使えます。⟦s001025-s001028⟧\n\n| 中置の書き方 | 前置の書き方 | 役割 |\n|---|---|---|\n| `6 - 5` | `(-) 6 5` | 引き算 |\n| `a <= b` | `(<=) a b` | 比較 |\n| `boolean1 && boolean2` | `(&&) boolean1 boolean2` | 論理積 |\n\nこの性質によって、演算子を通常の関数と同様に別の関数へ引数として渡すこともできます。⟦s001065-s001068⟧\n\n### 💡 例題: `(+) 2 4 * 5` はいくつか\n\nこの式を見たとき、「\\(2 + 4 = 6\\) で、\\(6 \\times 5 = 30\\)」と読むのが自然に思えます。ところがHaskellでは `(+) 2 4` が関数呼び出しとして先に評価されるため、次のように読まれます。⟦s001029-s001032, s001040-s001043⟧\n\n```haskell\n(+) 2 4 * 5\n= (2 + 4) * 5   -- まず関数呼び出し (+) 2 4 が評価される\n= 6 * 5\n= 30\n```\n\n答えは30です。関数呼び出しは、たとえ `+` の優先順位が `*` より低くても、先に行われます。⟦s001044-s001048, s001062-s001064⟧\n\n## 🔀 `if`は式である(if expression)\n\nHaskellの `if` は**文(statement)ではなく式(expression)**です。Haskellでは、\\(5 + 3 \\times 7\\) や `f 7`、`a` や `b` と同じように、`if` 式も一つの値に評価されます。⟦s001070-s001071, s001093-s001097⟧\n\n例えば、価格に応じて割引率を決める関数を考えます。価格が100ドルを超えたら20%、それ以外は10%の割引になります。⟦s001073-s001074⟧\n\n```haskell\ndiscount price = if price > 100 then 20 else 10\n```\n\nここで `else` 節を省略できない理由は次のとおりです。⟦s001079-s001080, s001084-s001091⟧\n\n- すべての式は必ず何らかの値に評価されなければならない。⟦s001098-s001099⟧\n- Haskellの関数は引数を受け取り、必ず値を返す。`void` のような「何も返さない関数」は存在しない。⟦s001084-s001086⟧\n- もし `else` がないと、価格が100以下のときに何を返すべきかが決まらず、値を返せない。⟦s001087-s001090, s001102-s001103⟧\n\nこのため、`else` を省略すると、関数が値を返せない場合が生まれ、関数型プログラミングの前提に反します。⟦s001104-s001107⟧\n\n> 命令型言語の `if` は文として実行され、値を返さないことがあります。一方、Haskellの `if` は必ず値を返す式なので、両方の分岐に結果が必要です。⟦s001093-s001095, s001098⟧\n\n## 🪜 ガード(guards)と構文糖衣(syntactic sugar)\n\nガードは、複数の条件とそれぞれに対応する結果を上から並べて書く構文です。`if`-`else` を入れ子にする代わりに使われ、複数の条件をすっきり扱えます。⟦s001133-s001134, s001137⟧\n\nガードは次のように動きます。⟦s001126-s001131, s001140-s001143⟧\n\n1. 各ガードは `|` (パイプ)で始まり、その後に条件を書く。⟦s001144-s001146⟧\n2. 条件が成り立つかを**上から順に**調べる。⟦s001140, s001149-s001150⟧\n3. 最初に真になった条件の右側の式を返し、残りは評価しない。⟦s001128-s001130⟧\n4. どの条件も一致しなければ、`otherwise` 節の値を返す。`otherwise` は最後の `else` に当たるデフォルトの場合である。⟦s001197-s001200⟧\n\n```mermaid\nflowchart TD\n    A[ガードの評価を開始] --> B{条件1は真か}\n    B -- はい --> R1[結果1を返す]\n    B -- いいえ --> C{条件2は真か}\n    C -- はい --> R2[結果2を返す]\n    C -- いいえ --> D[otherwise の結果を返す]\n```\n\n<!-- FIGURE: type=\"diagram\" title=\"ガードの上から下への評価\" description=\"開始ノードから条件1の判定を行い、真なら結果1を返して終了する。偽なら条件2の判定へ進み、同様に真なら結果2を返す。どの条件も偽なら otherwise の値を返す。判定は上から順に行われ、最初に真になった時点で評価が止まることを示す。\" -->\n\nガードを使うときは、関数定義の先頭の `=` を書きません。代わりに、各条件の後ろに `=` を置きます。⟦s001201-s001205⟧\n\n### 💡 例題: 階乗関数を2通りで書く\n\n同じ階乗関数を、`if` 式とガードの両方で書きます。⟦s001226-s001229, s001233-s001234⟧\n\n```haskell\n-- if 式版\nfactorial :: Integer -> Integer\nfactorial n = if n == 0 then 1 else n * (factorial (n - 1))\n\n-- ガード版\nfactorial :: Integer -> Integer\nfactorial n\n  | n == 0    = 1\n  | otherwise = n * (factorial (n - 1))\n```\n\n`if` 版では `(n - 1)` を括弧で囲む必要があります。括弧がないと、`factorial n` を先に計算してから1を引いてしまうためです。⟦s001229-s001231⟧\n\nガード版は、同じ処理を簡潔に書けるため、関数型言語で問題を解くときによく使われる書き方です。⟦s001234-s001236⟧\n\n### 🔑 構文糖衣とは何か\n\n**構文糖衣(syntactic sugar)**とは、言語が複雑な仕組みを隠して、より簡単な書き方を提供することです。ガードは、多数の `if`-`else` と余分なキーワードを書かずに済むようにした構文糖衣の一例です。⟦s001210-s001215⟧\n\nガードと `if` 式は**完全に等価**であり、どちらを使っても結果は同じです。⟦s001216⟧ 関数型プログラミングでは、すべての操作が関数合成(function composition)として整理されるため、最終的には `f (g x)` のような単純な関数の組み合わせに変換されます。⟦s001217-s001222⟧\n\n## 🎯 Key Takeaway\n\n- **左結合**: 括弧のない `f g 2` は `f` に `g` を渡し、その結果に `2` を適用すると読まれる。意図した入れ子は `f (g 2)` と括弧で書く。⟦s000915-s000917, s000947-s000951⟧\n- **優先順位**: 関数呼び出しは演算子より優先される。`f 3 * 10` は `(f 3) * 10` の意味になる。⟦s000965-s000967⟧\n- **前置形式**: 二項演算子を括弧で囲むと、二引数の関数呼び出しに変わる。`(+) 2 4 * 5` は30になる。⟦s001020-s001024, s001040-s001043⟧\n- **`if` は式**: 必ず値を返すため `else` が必須になる。⟦s001093-s001098, s001104-s001107⟧\n- **ガード**: 上から順に条件を調べ、最初に真になった結果を返す。`if` の入れ子と等価な構文糖衣である。⟦s001140-s001143, s001216⟧", "6": "# 6. 再帰・局所定義と配列指向の考え方\n\n関数が自分自身を呼び出す**再帰**(recursion)、必要になるまで計算を後回しにする**遅延評価**(lazy evaluation)、関数の内側だけで有効な名前を作る**局所束縛**(local binding)、そして配列全体に対して演算を書く**配列指向プログラミング**(array-oriented programming)を、順に見ていきます。\n\n## 🔍 再帰の仕組み（階乗の例）\n\n再帰は、関数がより小さな問題に対して自分自身を呼び出し、**基底条件**(base case)に到達したところで止まる方法です。ここでの例は階乗関数で、`n` が 0 なら 1 を返し、それ以外では `n` と `factorial (n - 1)` を掛け合わせます。⟦s001226-s001229, s001234⟧ 式の場合は `n * (factorial (n - 1))` と括弧が必要で、括弧がないと先に `factorial n` が計算されてから 1 を引いてしまいます。⟦s001230-s001231⟧\n\nガードを使った版は、同じ型シグネチャのまま、条件分岐を `|` で並べて書けます。ガードのほうが読みやすく、関数型言語では典型的な書き方とされています。⟦s001233-s001236⟧\n\n`factorial 2` を追跡すると、次のように進みます。\n\n1. `n = 2` で、`n == 0` は偽なので `factorial (n - 1)` を呼ぶ。\n2. 次の呼び出しでは `n = 1` となり、やはり 0 ではないので `factorial 0` を呼ぶ。\n3. `factorial 0` は `n == 0` が真で、1 を返す。\n4. 戻った各段で掛け算を行い、最終的に 2 が得られる。⟦s001253-s001263, s001276-s001287⟧\n\nこのように、基底条件で値が決まり、その結果が呼び出し元へ順に返っていくのが再帰の基本的な流れです。\n\n## ⚙️ 遅延評価と thunk\n\nここで重要なのは、`factorial (n - 1)` の `n - 1` が**その場では計算されない**という点です。講義では分かりやすくするため「1 として計算された」ように見せましたが、実際の Haskell では `n - 1` は計算されず、**遅延された計算**(deferred computation)として渡されます。⟦s001261-s001263, s001270-s001273⟧\n\nこの遅延された計算を **thunk**(サンク)と呼びます。thunk は「必要になったら `n - 1` を計算してね」という約束を表す、計算を実行できる関数へのポインタのようなものです。中には変数 `n` が捕捉されており、その変数が指す値を使います。⟦s001314-s001317, s001327-s001335⟧\n\nthunk が実際に評価されるのは、比較 `n == 0` を行って分岐を決める必要が生じたときです。関数型言語では、どちらの分岐に進むかを決めるために引数の値が必要になるため、その時点で初めて計算されます。⟦s001290-s001296, s001318-s001323⟧ 細かい評価の仕組みは隠されているので、ここでは「必要になるまで計算しない」という一般的な考え方を押さえれば十分です。⟦s001348-s001353⟧\n\n## 🧩 局所束縛：let と where\n\n**局所束縛**とは、関数や式の範囲内で、名前と値を結び付けることです。名前と値の組を **binding** と呼び、この束縛で作られた変数は一度決めたら変更できない定数です。⟦s001364-s001368, s001365⟧\n\n### let 式\n\n`let` 式は、1 つ以上の局所変数を定義し、`in` の後の式でそれらを使うための書き方です。⟦s001369-s001371⟧ 構文は次のとおりです。\n\n```haskell\nlet variable1 = ...\n    variable2 = ...\nin  式（variable1, variable2 を使う）\n```\n\n円の面積の例では、`pi` の値を定義し、その値を使って面積 `pi * r * r` を計算します。二乗の例では `square x = x * x` と `square y = y * y` を定義し、`square x + square y` を返しています。⟦s001406-s001408⟧\n\n`let` で定義された変数は、使われたときにだけ計算されます。`in` の後の式が使っていない変数は評価されないため、全体として遅延的に振る舞います。⟦s001377-s001384, s001396-s001401⟧ また、局所変数同士で互いを参照することもでき、`let` の中に `let` を入れることも可能です。⟦s001363, s001366⟧\n\n### where 節\n\n`where` 節は、`let` と似ていますが、局所変数を**関数の本体の後ろ**にまとめて書きます。関数の本体は普通に書き、その中で `where` より前に定義されていない変数を参照できます。⟦s001414-s001416, s001419-s001422⟧ 例えば、`nerd` の状態を判定する関数では、本体にガードで「スコア 100 超なら super nerdy、それ以外は nerd」と書き、詳細の計算は `where` の中に置きます。⟦s001416-s001418, s001431-s001433⟧\n\nこの書き方の利点は**読みやすさ**です。関数の論理だけを先に読み、詳細が必要なら下にある `where` を見ればよくなります。⟦s001425-s001429⟧ 同じ関数でも、`let` と `where` のどちらを使うかは基本的に好みの問題です。⟦s001453-s001455⟧\n\n## 🆚 let と where の違い\n\n- **共通点**: どちらも局所変数を定義し、その値を関数の中で使えます。\n- **違い**: 式が単一の場合は、どちらを使っても構いません。⟦s001457-s001465⟧\n- **違い**: 複数の式、つまりガードを使う場合は、`where` を使わなければなりません。`let` はガードとは組み合わせられません。⟦s001469-s001471, s001498-s001499⟧\n\nガードの連なりは、内部的には入れ子の `if` 式を一つにまとめたものと考えられるため、形式上は一つの式です。それでも文法上は `where` が必要になります。⟦s001483-s001486⟧ これは言語の設計上の決まりであり、論理的な必然ではありません。別の言語では `let` をガードと組み合わせることも可能だとされています。⟦s001472-s001477, s001480-s001481⟧\n\n## 🔭 ネストした関数とスコープ\n\n関数の中に、さらに関数を定義することもできます。`what's the behavior of` の例では、`name` が `\"Carry\"` なら `behaveLike name \"12-year-old\"` を呼び、それ以外は `behaveLike name \"grown-up\"` を呼びます。⟦s001506-s001511⟧ その補助関数 `behaveLike` は `where` 節の中で、`n` と `what` の 2 つの引数を取り、`n` と `\"behave like a\"`、`what`、`\"!\"` を連結して返します。⟦s001512-s001516⟧\n\nネストした関数は、定義された外側の関数の**スコープ**(scope)を読めます。例えば、外側の関数の引数 `name` を内側の関数から直接参照できるため、内側の関数には引数を一つ減らして渡すだけで済みます。⟦s001561-s001570, s001582-s001584⟧ 内側の関数から外側の変数を参照できるという性質は、**クロージャ**(closure)的な参照とも呼ばれます。\n\nこれが純粋関数の制約に違反しないかという質問に対しては、外側の値を**読むだけで変更しない**なら問題ないと確認されました。⟦s001575-s001580, s001581⟧ 補助関数は外側の関数の中でのみ見えるので、その外から呼び出すことはできません。⟦s001521-s001523⟧\n\n## 💡 例題：isPrime を埋める\n\n`isPrime` 関数は、整数 `n` を受け取り、素数なら `True`、そうでなければ `False` を返します。補助関数 `checkDivisors` に、`n` と除数（最初は `n - 1`）を渡し、除数を 1 ずつ減らしながら再帰的に調べます。⟦s001592-s001599⟧\n\n各部分の考え方は次のとおりです。\n\n- **除数が 1 のとき**: 1 より大きい約数が一つも見つからなかったので、素数です。`True` を返します。⟦s001609-s001613⟧\n- **`n mod divisor == 0` のとき**: 1 以外の約数で割り切れたので、素数ではありません。`False` を返します。⟦s001615-s001619⟧\n- **それ以外のとき**: 除数を一つ減らして、次の候補で再帰的に `checkDivisors` を呼びます。⟦s001620-s001621, s001634-s001635⟧ このとき、再帰呼び出しの除数部分は `(divisor - 1)` と**括弧で囲む**必要があります。括弧がないと、`checkDivisors` の結果から 1 を引いてしまうためです。⟦s001622-s001625⟧\n\n質疑では、`n = 1` の場合にこのコードが正しく動かないことが指摘されました。`n = 0` のためのガードが足りていないためで、不完全な点が認められています。⟦s001626-s001627, s001631-s001632⟧\n\n## 🧮 配列指向プログラミングと APL\n\n**配列指向プログラミング**とは、要素を一つずつループで処理するのではなく、配列や行列全体への演算として計算を書く考え方です。その代表例が APL です。⟦s001642-s001645, s001658-s001660⟧ APL は 1957 年に、配列を含む数学的な式を書くための**記法**(notation)として生まれ、その後プログラミング言語になりました。⟦s001647-s001653, s001657⟧\n\nAPL では、内積、行列の掛け算、回転、転置といった演算を、一つの記号で表せます。反面、記号の種類が多く、記号ごとの意味を覚えなければ読めないという難しさがあります。⟦s001661-s001664, s001668-s001670⟧\n\nこの考え方は現代にもつながっています。行列演算を大量に行う AI や機械学習の計算は、GPU で行われることが多く、その基盤となった配列処理の考え方は APL に由来します。NumPy、TensorFlow、PyTorch などは APL から間接的に影響を受けており、記号の名前は現在のほうが読みやすくなっていますが、テンソルや行列を一括で扱う発想は APL が源流です。⟦s001675-s001684, s001681-s001682⟧\n\n## 🎯 Key Takeaway\n\n- **再帰**では、基底条件で止まり、その結果を呼び出し元へ返していく流れを押さえることが大切です。⟦s001249-s001251, s001282-s001287⟧\n- **遅延評価**では、式は必要になるまで計算されず、thunk として後回しにされます。判断が必要になった時点で評価されます。⟦s001290-s001296⟧\n- **let と where** は局所定義を作る道具です。ガードを使うときは `where` が必要です。⟦s001469-s001471, s001498-s001499⟧\n- **配列指向**の考え方は、行列やベクトル全体への演算を一度に書くという発想で、現代の機械学習ライブラリにも受け継がれています。⟦s001681-s001684⟧"}, "fun_facts": {"title": "99.9999999%の稼働率を支えた関数の秘密 📡", "hook": "電話網の交換機が、わずか1年で数十ミリ秒しか止まらなかったという驚きの記録があります。その裏にあるのは、同じ入力なら必ず同じ結果を返す関数たちでした！", "body": "純粋関数は「同じ入力には必ず同じ出力を返し、外の状態を書き換えない」という性質を持ち、これが実は巨大な通信システムの土台になっているんです。\n\n1980年代、スウェーデンの通信機器大手Ericssonは、何十万人もの利用者を同時にさばく電話交換機を、絶対に落ちない形で作る必要に迫られました。⟦1⟧\n\nその解決策として生まれたのがErlangという言語で、プログラムを多数の小さな独立したプロセスに分け、互いに状態を共有せず、メッセージのやり取りだけで動かす仕組みを採用しました。⟦2⟧\n\n途中のプロセスが壊れても、監督役のプロセスが同じ入力を使って再起動させるだけで、システム全体は止まらずに元の状態へ戻れます。⟦3⟧\n\n一方で、AXD301が達成したとされる「9が9つ（99.9999999%）」の稼働率は、後年の検証では慎重に扱うべき数字だとも指摘されています。⟦4⟧ それでも、状態を持たない部品を組み合わせて壊れても戻せる設計という発想そのものが、今日の堅牢なシステム設計を大きく変えたのです。", "sources": ["https://www.erlang-factory.com/upload/presentations/243/ErlangFactorySFBay2010-MatsCronqvist.pdf", "https://highscalability.com/paper-making-reliable-distributed-systems-in-the-presence-of/", "https://qconlondon.com/london-2009/qconlondon.com/dl/qcon-london-2009/slides/JoeArmstrong_ErlangALanguageForProgrammingReliableSystems.pdf", "https://www.javacodegeeks.com/2026/09/let-it-crash-vs-try-catch-erlang-beam-supervision-trees-against-javas-exception-model.html"]}}, "ran": ["deep_notes", "fun_facts", "review_cards"], "checks": {"review_cards": {"calls": 6, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 4815, "exclamations": 16, "question_marks": 7, "citations": 42, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 9, "input_tokens": 91057, "output_tokens": 12544, "max_output_tokens_single_call": 3400, "sum_call_seconds": 66.8, "max_call_seconds": 17.04, "topics": 6, "topics_with_bad_card_sequence": 1}, "deep_notes": {"calls": 6, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 27312, "exclamations": 3, "question_marks": 0, "citations": 247, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 87, "input_tokens": 77380, "output_tokens": 30739, "max_output_tokens_single_call": 6831, "sum_call_seconds": 142.0, "max_call_seconds": 30.77}, "fun_facts": {"calls": 1, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 555, "exclamations": 1, "question_marks": 0, "citations": 4, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 39812, "output_tokens": 557, "max_output_tokens_single_call": 557, "sum_call_seconds": 4.0, "max_call_seconds": 3.99, "fun_fact_sources": 4}}, "errors": {}}, "v1b": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "🍳", "title": "同じレシピ、違う調理法", "content_blocks": [{"type": "paragraph", "text": "前回は、ソースコードが構文木になり、インタプリタがその木を順にたどって実行する仕組みを見ましたね。今日はその続きで、「インタプリタとコンパイラは、そもそも言語の種類を決めるものなの？」という素朴な疑問に迫ります。"}, {"type": "quote", "text": "料理のレシピは、作り置きしてから食べることもできるし、注文を受けてその場で作ることもできる。レシピ（言語）と調理法（処理方式）は別物なんです！"}]}, {"card_type": "core_why", "hero_emoji": "⚙️", "title": "言語と処理方式は別々のもの", "content_blocks": [{"type": "paragraph", "text": "多くの人は「C++はコンパイル言語、Pythonはインタプリタ言語」と覚えがちです。でも教授によれば、これは言語そのものの性質ではなく、ふつうそうなっているという実装の傾向にすぎません。 ⟦s000002-s000003⟧"}, {"type": "paragraph", "text": "コンパイラ（compiler）は、ソースコード全体を機械語に変換してから実行します。一方、インタプリタ（interpreter）は、ソースコードを順に読み取り、その場で実行します。どちらも「どの言語にも適用できる道具」なので、言語が決まれば処理方式も決まる、というわけではありません。 ⟦s000013⟧"}, {"type": "callout", "alert_type": "info", "text": "教授の結論はこれです。どんな言語でもコンパイルもインタプリトもできる。インタプリタ型のC言語も、コンパイル型のPythonも、実際に存在するわけです。 ⟦s000024-s000025⟧"}, {"type": "paragraph", "text": "つまり、「インタプリタを作る」「コンパイラを作る」は言語に縛られた選択ではなく、設計者が選ぶ道具の違いなんです。 ⟦s000027⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🚨", "title": "「動的＝インタプリタ」は規則ではない", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "「動的型付けの言語は必ずインタプリタ、静的型付けの言語は必ずコンパイル」というのは、ルールではなく典型的な傾向です。教授ははっきり「That's not a rule.（それは規則ではない）」と言っています。 ⟦s000019-s000023⟧"}, {"type": "paragraph", "text": "実際にPythonにもコンパイル版が存在します。また、CINTはC/C++のインタプリタとして、1990年代に科学計算の現場で使われていました。ここからも、型の付け方と処理方式は独立していることがわかります。 ⟦s000014-s000015⟧ ⟦s000028⟧"}, {"type": "paragraph", "text": "ただし、「簡単か難しいか」は別の問題です。C言語はポインタなどの仕組みがあるので、インタプリタ化は難しくなりがちです。でも、「原理的にできない」わけではありません。 ⟦s000017-s000018⟧ ⟦s000030-s000031⟧"}, {"type": "paragraph", "text": "だから「Pythonは必ずインタプリタ」と覚えるのではなく、「Pythonはインタプリタで実行されることが多い」と覚えるのが正解です。 ⟦s000032-s000034⟧"}]}, {"card_type": "next_action", "hero_emoji": "🧭", "title": "次の一歩：型と処理方式を見分ける", "content_blocks": [{"type": "paragraph", "text": "今回学んだのは、言語の性質（型付けなど）と、処理方式（コンパイルかインタプリトか）は別々に考えるべきだということです。どちらの言語も、設計次第でどちらの方式にもできるんですね。"}, {"type": "paragraph", "text": "今回は省略した細かい話もあります。興味があれば、以下も自分で調べてみてください。"}, {"type": "list", "items": ["Cythonが、PythonをいったんCに変換してからC++コンパイラに渡す具体的な流れ ⟦s000029⟧", "C言語のポインタがインタプリタ化を難しくする理由 ⟦s000030⟧"]}, {"type": "paragraph", "text": "さて、次は「言語そのものの設計」に目を向けます。関数型プログラミングや、ラムダ計算、チャーチ＝チューリングの考え方が出てきます。言語の見方がもう一段深まるはずなので、お楽しみに！"}]}], "2": [{"card_type": "hook", "hero_emoji": "🧃", "title": "自販機みたいな関数", "content_blocks": [{"type": "quote", "text": "ボタンAを押したら、いつも同じ飲み物が出てくる。これが『純粋関数』のイメージです！"}, {"type": "paragraph", "text": "ふつうのプログラムは、同じ操作をしても、そのときの状況で結果が変わることがありますよね。でも関数型プログラミングでは、入力さえ同じなら、いつ呼んでも同じ答えが返ってくる関数を目指します。最初は『当たり前じゃない？』と思うかもしれません。でも、この当たり前が、あとで大きな武器になるんです！"}]}, {"card_type": "core_why", "hero_emoji": "🧠", "title": "なぜ『変えない』と『同じ答え』にこだわるのか", "content_blocks": [{"type": "paragraph", "text": "関数型プログラミングでは、変数の中身を後から書き換えることをしません。一度入れた値は変わらず、変数は実質的に定数になります。ここが、命令型のプログラミングとの大きな違いです。 ⟦s000109-s000112⟧"}, {"type": "callout", "alert_type": "info", "text": "純粋関数は『入力だけで出力が決まる関数』です。外の状態を読んだり書き換えたりしないので、思わぬ変化が起きません。 ⟦s000236-s000241⟧"}, {"type": "paragraph", "text": "こうすると、いくつもの関数が同時に動いても、お互いの値を壊し合う心配がなくなります。たとえば、共有変数を取り合ってケンカさせる『排他制御』の苦労が減るんです。また、関数の中身を数学の式のように推論できるので、プログラムの正しさを証明しやすくなります。 ⟦s000292-s000297⟧ ⟦s000322-s000326⟧"}, {"type": "code", "language": "haskell", "code_string": "f x = x + 5   -- 同じ x を渡せば、いつも同じ結果になる", "explanation": "この関数は外の状態に頼らないので、純粋関数の典型例です。 ⟦s000206-s000207⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "『外を見る』と副作用が起きる", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "純粋関数の条件は『同じ入力に同じ出力』と『外の変わる情報に頼らない』の2つ。どちらかが崩れた瞬間、副作用（side effect）が発生します。 ⟦s000236-s000251⟧"}, {"type": "paragraph", "text": "たとえば、グローバル変数の値を読んで計算する関数や、呼ぶたびに値が変わる関数は、純粋ではありません。同じ入力 1 を渡しても、そのときのグローバル変数次第で答えが変わってしまうからです。このように関数の外側に影響を与えたり、外の状態に影響されたりすることを、副作用と呼びます。 ⟦s000257-s000265⟧"}, {"type": "paragraph", "text": "ここで『じゃあ定数は使ってもいいの？』と疑問が湧くかもしれません。実は、変わらない定数を参照するのはOKです。大事なのは、外の『変わるかもしれないもの』に頼らないことなんです。 ⟦s000271-s000273⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "ここまでのまとめと次への扉", "content_blocks": [{"type": "paragraph", "text": "今回は、関数型プログラミングが『変数を変えない』『純粋関数を使う』という2つの約束に立っていることを学びました。この約束のおかげで、プログラムが予測しやすくなり、並列化や証明もやりやすくなります。"}, {"type": "paragraph", "text": "授業では触れたけど、このカードには載せきれなかったテーマがあります。ぜひ自分でも調べてみてください。"}, {"type": "list", "items": ["ラムダ計算（lambda calculus）の細かい定義と、一つの引数だけを持つ関数の考え方 ⟦s000138-s000148⟧", "チャーチ＝チューリングの考え方（Church–Turing thesis）が証明された流れ ⟦s000158-s000163⟧", "LISPやHaskellが生まれた経緯と、1987年の標準化の話 ⟦s000168-s000182⟧", "OCamlとHaskellの違い、そして実務での関数型言語の使われ方 ⟦s000080-s000093⟧", "再帰（recursion）を使った問題の解き方 ⟦s000339⟧"]}, {"type": "paragraph", "text": "さて、副作用を避けると計算がきれいになる一方で、『外の状態を使わない』とどう効率よく計算を進めるのかという新しい問いが生まれます。次のテーマでは、副作用のない計算と遅延評価（lazy evaluation）、そしてその裏で動くサンク（thunk）の話に進みます。さあ、どんな仕組みか楽しみにしていてください！"}]}], "3": [{"card_type": "hook", "hero_emoji": "🍳", "title": "注文を聞いてから作る厨房", "content_blocks": [{"type": "quote", "text": "食材を全部先に切っておくのではなく、本当に皿に載せる瞬間まで何も切らない厨房、それが遅延評価です！"}, {"type": "paragraph", "text": "命令型の言語は『まず材料を切る、次に炒める、次に盛る』と手順通りに進みます。一方、関数型の言語は『この料理はこの材料からできている』と、料理の材料を組み合わせていくイメージです。さあ、どちらが効率よく動くか、一緒に見ていきましょう！"}]}, {"card_type": "core_why", "hero_emoji": "🧊", "title": "同じ入力なら同じ答え", "content_blocks": [{"type": "paragraph", "text": "命令型のプログラムでは、関数がファイルを書き換えたり、グローバル変数を増やしたりします。これが副作用（side effect）です。⟦s000394⟧⟦s000400⟧ 副作用があると、先に呼ぶか後に呼ぶかで結果が変わってしまうので、コンパイラは順番を崩せません。⟦s000390⟧⟦s000402⟧"}, {"type": "callout", "alert_type": "info", "text": "純粋関数（pure function）とは、同じ入力に対して必ず同じ出力を返す関数のことです。つまり、いつ呼んでも結果は変わりません。⟦s000415⟧⟦s000423⟧"}, {"type": "paragraph", "text": "関数型の世界では、この安心感が大きな武器になります。結果が変わらないなら、順番を入れ替えても、一度も呼ばなくても、コンパイラが自由に最適化できるんです。⟦s000418⟧⟦s000422⟧ 例えば \\( f(x)=5x \\) のような関数なら、\\( x=1 \\) を入れれば、いつ呼んでも必ず 5 が返ってきます。"}, {"type": "code", "language": "haskell", "code_string": "f arg = if z == 7 then 0 else y\n  where\n    y = func1 arg\n    z = func2 arg", "explanation": "命令型では func1 が先に呼ばれるのが普通ですが、Haskellでは y と z の定義の順番は計算の順番を意味しません。⟦s000379⟧⟦s000381⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💤", "title": "使うまでは眠っている計算", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Haskellは上から順番に計算しません。変数の値が本当に必要になるまで、計算を後回しにします。これが遅延評価（lazy evaluation）です！⟦s000431⟧⟦s000433⟧"}, {"type": "paragraph", "text": "例えば z が 7 だったら、if 文は即座に 0 を返します。y は一度も使われないので、func1 は呼ばれません。C++のように上から全部計算する必要はなく、必要なものだけを計算するんです。⟦s000436⟧⟦s000441⟧"}, {"type": "paragraph", "text": "さらに、関数に渡される引数も、使われるまで計算されません。引数は、まだ計算されていない式を包んだサンク（thunk）として渡されます。使う段階になって初めて中身が計算される『未来の計算の予約票』のようなものです。⟦s000477⟧⟦s000479⟧ たとえ式が5段階深くても、本当に使われなければ計算されません。⟦s000482⟧⟦s000483⟧"}, {"type": "paragraph", "text": "ここで大事なのは、遅延評価は『副作用がないから安全に後回しできる』という前提の上に成り立っていることです。順番を気にしなくてよいからこそ、必要になるまで待つことができるんですね。⟦s000418⟧⟦s000420⟧"}]}, {"card_type": "next_action", "hero_emoji": "🧭", "title": "ここまでの道のりと次の一歩", "content_blocks": [{"type": "paragraph", "text": "今回は、命令型と関数型の違いから出発しました。副作用のない純粋関数は同じ入力に必ず同じ出力を返すので、計算の順番を自由に変えられます。その結果、Haskellは『本当に必要になったときだけ計算する』遅延評価を採用しています。"}, {"type": "paragraph", "text": "以下は授業では触れたものの、今回のカードでは詳しく扱わなかった内容です。気になるものがあれば、自分で調べてみてください。"}, {"type": "list", "items": ["多重スレッドで命令型プログラムが扱いにくくなる理由 ⟦s000356⟧⟦s000357⟧", "初期版Haskellが入出力を持たなかった経緯と、その後の解決法 ⟦s000511⟧⟦s000517⟧"]}, {"type": "pa
