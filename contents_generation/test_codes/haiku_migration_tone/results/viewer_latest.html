ut whose needs get built in first ⟦s000205-s000209⟧"]}, {"type": "paragraph", "text": "Next up, we'll look at the HCI design lens, where intentional design and inclusive assumptions about users shape the real consequences of voice assistants. Let's see how far those assumptions reach!"}]}], "2": [{"card_type": "hook", "hero_emoji": "🎭", "title": "No Accidents Allowed", "content_blocks": [{"type": "quote", "text": "Every app you've ever rage-tapped was built on purpose, and that frustration might be a design choice you never noticed!"}, {"type": "paragraph", "text": "Think of a restaurant menu: the order of items is never random, and someone decided what you'd notice first. Technology works the same way, so that moment of joy or frustration was likely shaped by someone's choices."}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "Designs Steer Our Minds", "content_blocks": [{"type": "paragraph", "text": "Designers don't just build tools; they shape how we experience ourselves, each other, and the world. ⟦s000226-s000228⟧"}, {"type": "paragraph", "text": "Every interaction quietly **promotes** some behaviors and **demotes** others, nudging how we reason, whether that's cognitive, social, or emotional. ⟦s000230-s000233⟧"}, {"type": "callout", "alert_type": "info", "text": "Early HCI and AI thinkers described design as devising artifacts, and Don Norman later showed how great designers think about these everyday choices. ⟦s000219-s000223⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🔍", "title": "Your Questions Pick Your Answers", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Pro-tip from the professor: the way we pose questions directly influences the kinds of answers we allow ourselves to accept and the things we learn. ⟦s000239-s000241⟧"}, {"type": "paragraph", "text": "So when someone says \"you're probably just doing it wrong,\" remember the problem might be an unintended consequence of the design, not your fault. ⟦s000215-s000218⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Wear the HCI Lens", "content_blocks": [{"type": "paragraph", "text": "We learned that every technology interaction is deliberately designed, and that those designs shape our reasoning, feelings, and relationships. The big goal is to bring an HCI lens to any problem you meet, in engineering, research, or beyond."}, {"type": "paragraph", "text": "Curious? Dig into these too:"}, {"type": "list", "items": ["The student projects from earlier in the course, like a platform helping local speakers improve public health communication and VR/3D tools for creating shapes in a game engine ⟦s000267-s000278⟧", "The project theme framework for novel data interaction, covering what kind of data you're working with, where it comes from, and whether a reliable database exists ⟦s000281-s000282⟧"]}, {"type": "paragraph", "text": "So how do we turn this lens into real research? Next up, we'll explore user research, interviews, personas, and iterative prototyping, starting with the U.S. immigration visa process!"}]}], "3": [{"card_type": "hook", "hero_emoji": "🧭", "title": "Don't Build First, Hunt First", "content_blocks": [{"type": "quote", "text": "Great products don't start with code. They start with a hunch, a few real people, and a lot of listening!"}, {"type": "paragraph", "text": "Think of it like a detective's case file. You start with a suspicion, go gather testimony from the people who actually live the problem, and only then decide what the real crime is. The project in this lecture kicks off the exact same way."}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "Hypothesis, Research, Problem", "content_blocks": [{"type": "paragraph", "text": "The team's starting hunch was that the U.S. immigration process is often confusing and incomprehensible. ⟦s000544⟧ That hunch is only a guess, so the next move is to find out who is actually struggling."}, {"type": "paragraph", "text": "Research means building **user profiles**, which are groups of the people you want to target, and then mapping how those users interact with your system. ⟦s000545-s000546⟧ ⟦s000552-s000559⟧"}, {"type": "callout", "alert_type": "info", "text": "The payoff of all this research is a **problem statement**: people need reliable and understandable sources outside of attorneys, but that information is hard to find and hard to interpret. ⟦s000560-s000565⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "A Guess Is Not a Problem", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Your hypothesis is where you start, not where you finish. The **problem statement** has to be earned through research, not assumed from your first gut feeling. ⟦s000543-s000544⟧ ⟦s000560-s000564⟧"}, {"type": "paragraph", "text": "The real pain was not just that immigration is complicated. It was that good information is scarce and hard to interpret, which adds to the confusion and anxiety. ⟦s000565-s000566⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "Take the Next Step", "content_blocks": [{"type": "paragraph", "text": "We just saw how a project goes from a rough hunch to a clear problem statement, using user research to figure out who is actually affected and what they struggle with. Keep the hypothesis as a starting point, and let the people you're studying shape the real problem."}, {"type": "paragraph", "text": "Make sure to cover these:"}, {"type": "list", "items": ["Storyboarding the targeted user's journey, telling the story of what they go through ⟦s000568-s000569⟧", "Process maps and diagrams, which start out analog and on paper ⟦s000547-s000549⟧", "Paper prototyping and the later build of the actual system ⟦s000570⟧"]}, {"type": "paragraph", "text": "So we know how to find a problem worth solving. Next up, we'll look at real interactive system examples, including a cross-device idea capture tool called Scrapper and a domain-specific decision helper for fishing regulations, and see how they get tested with iterative field feedback!"}]}], "4": [{"card_type": "hook", "hero_emoji": "🎯", "title": "Don't Build for Everyone", "content_blocks": [{"type": "quote", "text": "Great interactive systems don't try to solve everything; they zoom in on one real person's one real problem."}, {"type": "paragraph", "text": "Think of it like a tailor who makes one perfect suit instead of a rack of clothes that fits nobody. The professor's examples show how a single focused problem can grow into a whole system."}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "Notes That Remember for You", "content_blocks": [{"type": "paragraph", "text": "The Scrapper team started from a real pain point: writers have ideas and then forget they already had them. ⟦s000592-s000593⟧"}, {"type": "callout", "alert_type": "info", "text": "The system spans devices: a Chrome extension and a companion mobile app sync through your Google account, so an idea captured anywhere lands in one shared database. ⟦s000589-s000599⟧"}, {"type": "paragraph", "text": "Later, when you write something similar, the system compares your new thought against the stored notes and offers its **top three suggestions**. ⟦s000604-s000611⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🐟", "title": "One Problem, Real Feedback", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Professor's pro-tip: the team 'pinpointed and focused on' one problem and made an entire system around it. That focus is the whole point. ⟦s000612-s000614⟧"}, {"type": "paragraph", "text": "The fishing app shows the same idea in another domain. California's fishing rules depend on location, species, and size, so the app takes a photo, sends it to an LLM for species identification, and combines that with the user's location and length to say whether a fish must be released. ⟦s000619-s000627⟧ ⟦s000639-s000645⟧"}, {"type": "paragraph", "text": "Systems like this are never finished on the first try. The team pitched ideas to real users, got direct feedback, and went back and forth between interviews and prototypes for 10 weeks. ⟦s000655-s000659⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "Wrapping Up the Showcase", "content_blocks": [{"type": "paragraph", "text": "We saw two student projects, Scrapper and a fishing regulations app, and how each began with one focused problem and was refined through repeated user feedback."}, {"type": "paragraph", "text": "Curious? Dig into these too:"}, {"type": "list", "items": ["The ranking algorithm that picks the top three similar notes in Scrapper", "The API layer that sends fishing photos to an LLM for species identification", "The gamification system that ranks anglers by catches"]}, {"type": "paragraph", "text": "Today's lecture started with analyzing user goals and the context of use, moved through HCI design lenses and inclusive assumptions, and built toward user research, personas, and iterative prototyping. These student projects put all of that into practice, showing how a focused problem can become a working system."}]}]}, "deep_notes": {"1": "# 1. Analyzing Interactive Experiences and Their Contexts\n\nEvery interface is used by a particular person, in a particular place, for a particular purpose, and with particular effects. Analyzing an interaction means looking past the screen or control to ask about the **context of use**, the **user goals**, the **interface choices and affordances**, and the **user experience and impact** that together determine whether the design actually works for someone.\n\n## 🔍 Starting From Everyday Interactions\n\nThe analysis begins with familiar moments. Students were asked to recall one day's worth of interactions, and several described making espresso coffee on a machine. One student said they only pressed a few buttons, such as the power button and another button.⟦s000098-s000100⟧ Another student made coffee on a machine with a specific named function, and a different student described using a microwave.⟦s000102-s000105, s000113⟧ These examples show how ordinary tasks already involve interfaces with buttons, modes, and outcomes, which is the starting point for asking deeper questions.\n\nThe questions to ask about such interactions fall into a few groups. They include the context, the setting, the users, the relationships between users, the goals, and the impact on the person.⟦s000132-s000137⟧ For instance, the presence of a roommate or family member watching while someone makes coffee or heats oatmeal changes what the interaction means.⟦s000134-s000135⟧\n\n## 🌍 Context of Use\n\n**Context of use** includes the physical, social, and situational conditions in which someone interacts with a technology. The physical part covers where the interaction happens, while the social part covers who is present, such as a roommate, a family member, or a crying child.⟦s000135-s000136⟧ The situational part includes conditions like whether a user can hear audio or is watching alone or with a group.⟦s000151⟧\n\nContext also extends beyond the room. The analysis includes the **social and political context** in which media is delivered to a person, not only the physical environment.⟦s000152-s000153⟧ The reason this matters is that the same interface can support one person well and hinder another, depending on these circumstances.\n\n## 🎯 User Goals\n\n**User goals** are the outcomes people seek through an interaction. These goals may differ from the immediate task that an interface appears to support. The key distinction is between a direct goal and a means to an end. Drinking coffee may be the explicit goal, or coffee may be a means of making it to class on time.⟦s000136⟧\n\nConsidering both kinds of goals helps designers see which actions an interface makes easy and which broader needs it may overlook. A person who only needs coffee quickly has different needs from a person who needs to leave for class, even though both are using the same machine.\n\n## 🧭 Interface Choices and Affordances\n\n**Interface choices and affordances** are the options, controls, and cues that shape how people can act within a system. Examining them shows how an interface guides attention and action rather than presenting neutral features.⟦s000142-s000146⟧\n\nThe YouTube example illustrates this clearly. On the left side of the layout, options such as home, shorts, subscriptions, and history appear.⟦s000144-s000145⟧ The analysis asks which goals these options facilitate, which they promote or demote, and where a user is likely to begin when faced with many simultaneous choices.⟦s000146-s000147, s000154-s000156⟧\n\nThese questions also reveal assumptions about the **intended user**. Designers may assume a particular kind of physical device or a particular viewing situation.⟦s000148, s000150⟧\n\n## 🏠 Context and Choices in Other Technologies\n\nThe same questions apply to other technologies. Voice assistants, such as Siri, Echo, and Alexa, are placed in many settings, including next to a nightstand, in the kitchen, in a car, or in a bathroom. Each placement changes what the interaction means and what data might be gathered to support it.⟦s000158-s000159, s000164-s000169⟧\n\nA specific feature shows how context shapes interpretation. One voice assistant allowed a user to turn a deceased loved one's voice into the assistant's voice.⟦s000160⟧ In a benign context, a person might miss a grandmother and want to hear her voice. In another context, the same feature could feel creepy or disrespectful, particularly if the relationship was strained.⟦s000161-s000163⟧ The feature is the same, but its appropriateness depends on context and who is using it.\n\nChatbot tools present a parallel case. Typing natural language and receiving text or code may feel routine, but the analysis asks whether this is the only interaction that should be supported.⟦s000172-s000174⟧ A person deep in a code base may need information without switching to a separate chat interface or leaving a visual environment.⟦s000175-s000179⟧ The questions then turn to which goals this interaction makes easy and what expectations users bring, including the veracity of the information and the speed and format of its delivery.⟦s000180-s000182⟧\n\n## ❤️ User Experience and Impact\n\n**User experience** includes how an interaction affects a person cognitively, emotionally, and practically. The analysis considers what information a person wishes they had during a task. Examples include knowing that oatmeal is about to boil over, or knowing that coffee is over-extracted or under-extracted.⟦s000137-s000139⟧\n\nEmotional state also matters. The analysis asks how a person feels before, during, and after an interaction.⟦s000157⟧ This perspective captures consequences that are not measured by whether a task can technically be completed.\n\nHealth-tracking devices illustrate this dimension. Smart watches, Fitbits, rings, and similar devices collect health data, and the analysis asks what data is collected and how it is presented to the user.⟦s000184-s000196⟧ When Apple Health was first rolled out, one aspect of health was not included in the initial release, namely the menstrual period.⟦s000199-s000208⟧ The omission suggests that assumptions about who the end user is shape which needs a system addresses, and that end users can indirectly set expectations about who the users are.⟦s000209-s000210⟧\n\n## 🎯 Key Takeaway\n\nAnalyzing an interaction requires asking who is involved, where and when it happens, what the person is trying to achieve, how the interface shapes action, and what effects the interaction has on the person. Each of these questions can reveal gaps between what a technology supports and what its users actually need.", "2": "# 2. Design Consequences and the HCI Perspective\n\nThe HCI design lens treats every interactive technology as the result of deliberate choices, and it asks who a system serves, what it encourages or discourages, and what information it collects or presents. Because those choices have consequences, a user's difficulty is not automatically a personal failing.\n\n## 🔍 What the HCI Design Lens Asks\n\nThe HCI design lens is a way of examining how interactive technologies shape people's experiences, relationships, and actions. It asks who a system is designed for, what it encourages or discourages, and what information it collects or provides.⟦s000195-s000196⟧ Applying the lens to a health-tracking device, for example, means asking what data is being collected and how it is presented back to us.⟦s000192-s000196⟧\n\n## ⚙️ Interfaces Are Never Accidental\n\nThe central claim is that **no interaction with technology happens by accident**. Interactions are intentionally designed, and those designs are constant, shaping every experience a person has with a system.⟦s000211-s000212⟧ This is the core of **intentional design**: an interface's structure and behavior come from decisions about what the system makes possible or difficult.\n\nThis connects directly to lived experience. Whether an app produces frustration or immense joy, other people may have a different experience of the same system.⟦s000213-s000214⟧ When someone concludes \"I'm probably just not doing it right,\" that conclusion might not actually be the user's fault or the designer's fault. It may instead be an **unintended consequence** of how the technology was built.⟦s000215-s000218⟧\n\n## 🧭 Design as Devising Artifacts\n\nEarly research in AI and HCI described design as being concerned with devising artifacts.⟦s000219-s000220⟧ Don Norman, an engineer who became a cognitive scientist, popularized this view in *The Design of Everyday Things*, which explored how good designers think about the things people use.⟦s000220-s000222⟧ Viewing design this way means treating every product as a made object whose reasoning and consequences can be examined.\n\n## 🌐 Consequences for Ourselves, Each Other, and the World\n\nDesign choices affect people's experiences with themselves, with each other, and with the world.⟦s000226-s000228⟧ Designers should pay attention to three kinds of choices:\n\n- **What is promoted and what is demoted** in an interaction.⟦s000230-s000231⟧\n- **Which reasoning is facilitated**, whether cognitive, social, or emotional.⟦s000232-s000233⟧\n- **Who the system is built for**, and who it leaves out.⟦s000209, s000282⟧\n\n## 🩺 Example: The Apple Health Omission\n\nThe initial rollout of Apple Health, a health-tracking app that monitors many metrics, did not include period tracking.⟦s000203-s000206, s000208⟧ The example shows that a product implicitly defines its expected users through what it measures. An omission communicates an assumption, and it leaves an important user need unsupported.⟦s000206-s000209⟧ The lesson is that inclusive design requires asking which people and needs a system represents and which it excludes.\n\n## ❓ How Questions Shape Answers\n\nThe way we pose questions influences the kinds of answers we allow ourselves to accept and the things we learn.⟦s000239-s000241⟧ For a data-focused project, this means asking who a system enables, for what purpose, what type of data is involved, where that data comes from, and whether a reliable source exists.⟦s000281-s000282⟧ Designers are encouraged to observe, listen, and ask questions constantly, of themselves, of each other, and of the artifacts they encounter and create.⟦s000248-s000249⟧\n\n## 🎯 Key Takeaway\n\nThe most important idea is to bring an **HCI lens** to any future problem, whether in engineering, research, computer science, or cognitive science.⟦s000234-s000236⟧ Doing so means recognizing that design decisions carry consequences, and that difficulties users face should be examined as possible design outcomes rather than dismissed as individual failures.⟦s000215-s000218, s000226-s000228⟧", "3": "# 3. User Research and Project Development\n\nThe project process described here moves from a rough idea, through user research, to a problem statement, personas, and scenarios, and finally to prototypes and a built system. Each stage builds on the one before it, so research findings shape who the system is for and what it should do.⟦s000511⟧\n\n## 🔍 Starting From a Hypothesis\n\nThe process begins with a hypothesis, which is a working guess about a problem worth exploring.⟦s000543⟧ In the example given, the team's hypothesis was that the U.S. immigration process is often confusing and incomprehensible.⟦s000544⟧ The motivation came from experience: many group members had family members or loved ones who had applied for either a work visa or an F-1 visa, and had seen how convoluted the process could be.⟦s000540-s000542⟧\n\nThe team's premise was to make the process less convoluted by turning it into a linear, step-by-step process, at least for informational purposes.⟦s000524⟧ This framing shows how a broad hypothesis narrows into a specific design goal.\n\n## 🧭 User Research and User Interviews\n\nOnce the hypothesis is set, the next step is user research, which aims to identify the people the system should serve and the problems they face.⟦s000545-s000546⟧ Based on this research, designers conduct user interviews and create diagrams and process maps.⟦s000547-s000548⟧ The process is intentionally analog at the start: the early work is done on paper rather than in software.⟦s000549⟧\n\nThe interviews are the bridge between a hypothesis and real user experience. They reveal how people actually encounter the difficulties, which the team can then translate into design decisions.\n\n## 👥 From Research to Personas and Scenarios\n\nAfter research is complete, the findings are grouped into **user profiles**, which organize the different people the team intends to target.⟦s000552-s000554⟧ Once the team has a clear idea of the group it is trying to help, it begins sketching a flow that shows how it expects those users to interact with the system.⟦s000555-s000559⟧\n\nPersonas, as described by former students, capture the target audience, what that audience wants, and what challenges it faces with respect to the problem.⟦s000578-s000583⟧ Designers then focus on these people and craft the interactive system around them.⟦s000584-s000585⟧ Scenarios describe the situations these users will go through inside the system, and the project also includes some form of evaluation.⟦s000586-s000588⟧\n\n## 📝 The Problem Statement\n\nAfter user research, the team writes a **problem statement** that names the people affected and the gap they experience. In the visa example, the problem statement was that people in the U.S. immigration process seek reliable and understandable sources outside of attorneys.⟦s000561-s000564⟧ The statement also explains the obstacle: this information is often hard to find and difficult to interpret for people of various backgrounds, which adds to confusion and anxiety about the process.⟦s000565-s000566⟧\n\nA **storyboard** follows the problem statement. It tells a story of what the targeted user is going through, connecting the problem to a concrete experience.⟦s000568-s000569⟧\n\n## 🛠️ Iterative Prototyping\n\nDevelopment proceeds in stages. The team begins with the most basic prototype, a paper prototype, and later moves toward actually building the system.⟦s000570⟧ Research, prototyping, and refinement happen over the course of the quarter rather than as a single step.⟦s000570⟧\n\nThe design is not limited to one format. The example system included a Google Chrome extension together with a companion mobile app, showing that the interactive system can take forms beyond a computer or website.⟦s000589, s000590-s000591⟧\n\n## 🎯 Key Takeaway\n\n- **Research drives design:** Hypotheses, user interviews, personas, and problem statements each narrow the focus until the system is built around specific people and their needs.⟦s000543, s000547, s000578-s000585⟧\n- **Prototypes come first, then refinement:** Starting with paper prototypes allows the team to explore interactions before committing to implementation.⟦s000549, s000570⟧", "4": "# 4. Interactive System Examples and Evaluation\n\nThis segment walks through two student-built interactive systems to show how interview findings and a clearly chosen problem can be turned into a working tool. The Scrapper project pairs a browser extension with a mobile companion for cross-device idea capture, while the fishing-regulation app uses photo, location, and size data to support a legal keep-or-release decision, refined through repeated field feedback.\n\n## 🧭 From User Research to a Focused Problem\n\nThe path to a system begins with user research, which is grouped into user profiles and then narrowed to a single problem. In the Scrapper example, the team defined the problem as people in the US immigration process seeking reliable and understandable sources outside of attorneys, where such information is often hard to find and difficult to interpret for people of various backgrounds, adding to confusion and anxiety.⟦s000560-s000566⟧ Once the problem is clear, the team builds personas, which describe who the target audience is, what they want, and what challenges they face with regard to the problem.⟦s000577-s000583⟧\n\nPersonas then guide the design. The team focuses on these people, crafts the interactive system around them, and maps out the scenarios each persona will go through within the system, along with some form of evaluation.⟦s000584-s000588⟧ Earlier stages in this process include a storyboard that narrates what the targeted user experiences, which precedes the system design.⟦s000568-s000569⟧\n\n## 🧩 Cross-Device Idea Capture in Scrapper\n\nThe Scrapper team used interviews to learn about the everyday challenges writers face, and this led them to decide that one device was not enough.⟦s000592-s000595⟧ The system therefore combined a **Google Chrome extension** with a **companion mobile app**, and the team believed few other groups in their quarter used a browser extension in this way.⟦s000589⟧ Writers can create notes on a computer or on the mobile app, and both sync together when logged into the same Google account.⟦s000598-s000599⟧\n\nThe key idea is what happens when a writer later cannot recall where an idea was recorded. The system stores a database of notes, and a writer who suspects they once had a similar thought can compare new writing against that database.⟦s000600, s000603-s000606⟧\n\n## 🔎 Similarity-Based Note Retrieval\n\nThe retrieval feature addresses a specific gap: the writer remembers an idea was recorded but not where it lives. Scrapper returns a short ranked list, specifically the top three suggestions, produced by a ranking algorithm, so the writer can check whether something similar was already written.⟦s000609-s000611⟧ The team emphasized that this single problem was pinpointed and focused on, and the entire system was built around it.⟦s000612-s000614⟧\n\n> The design principle here is that a system can be organized around one well-chosen problem rather than many loosely related features.⟦s000612-s000614⟧\n\n## 🐟 Domain-Specific Decision Support for Fishing\n\nThe second example began with a team member who fishes often and wanted an app that makes the act of recording a catch easy. The difficulty lies in regulations: in California, legality depends on the fishing area, the size of the fish, and the species.⟦s000620-s000627⟧ The goal was to streamline this check so fishermen can determine what they are allowed to do with a catch.⟦s000628-s000629⟧\n\nThe app brings these pieces of information together in a sequence:\n\n1. **Species identification:** An API layer sends a photo to an LLM, which identifies the species.⟦s000639-s000640⟧\n2. **Context entry:** The user types in the location and the length of the fish, for example 12 inches.⟦s000641-s000642⟧\n3. **Regulatory verdict:** The app tells the user whether the fish must be released, indicating the catch cannot be kept.⟦s000645⟧\n\nThe app also supports record keeping. Users document how many fish they caught and how many they released, and the history view shows totals for catches, safe releases, and safe keeps.⟦s000646-s000648⟧ A gamified element shows ranks based on how many fish a user catches.⟦s000649-s000650⟧\n\n## 🔁 Iterative Field Feedback\n\nThe fishing team developed the app through repeated contact with its intended users. They pitched the idea to fishermen, received direct feedback, and went back and forth on certain features, with the process cycling through interviewing, prototyping, and interviewing again.⟦s000655-s000658⟧ The final result reflects about ten weeks of this iterative work.⟦s000657⟧ This approach shows that user research does not end at the start of a project; it continues as the system takes shape.⟦s000655-s000659⟧\n\n## 🎯 Key Takeaways\n\n* **Focus on one problem:** A clearly defined problem, supported by personas and scenarios, guides which features a system needs.⟦s000577-s000588, s000612-s000614⟧\n* **Look beyond the default device:** Interview insights can justify combining a browser extension with a mobile companion, or other non-standard formats.⟦s000589-s000592⟧\n* **Combine data for decisions:** Domain-specific tools can merge photos, location, size, and species to answer a rule-based question.⟦s000639-s000645⟧\n* **Iterate with users:** Repeated feedback from intended users shapes features throughout development.⟦s000655-s000658⟧"}, "fun_facts": {"title": "The Voice Assistant That Couldn't Hear Half the World 🎙️", "hook": "Did you know that early voice recognition systems could misunderstand women's speech far more often than men's, simply because the engineers training them had mostly recorded men? It turns out a voice assistant can be quietly unfair to half its users without anyone intending it.", "body": "The idea behind today's HCI design lens, that a system only serves the people its designers pictured, shows up dramatically in how voice technology learned to listen.\n\nIn one audit of OpenAI's Whisper speech model, the baseline version had a word error rate of 11.69% for women compared with 9.07% for men, a gap that quietly penalized every female speaker who used it⟦1⟧.\n\nThe culprit was unbalanced training data: when speech systems learn mostly from one group's voices, they become fluent in that group and stumble over everyone else, a pattern researchers have tied to the fact that voice recognition was often designed by and largely for men⟦2⟧.\n\nThe fix was not simply to add more women, because researchers found the best balance appeared around 60 to 70 percent women in the training set, showing that fairness depends on careful design rather than a neat 50-50 split⟦3⟧.\n\nThe next time your phone misunderstands you, remember that the question is not just how smart the machine is, but whose voice it was built to hear.", "sources": ["https://arxiv.org/html/2502.18434v1", "https://makingnoiseandhearingthings.com/2016/07/12/googles-speech-recognition-has-a-gender-bias/", "https://www.researchgate.net/publication/389351890_Exploring_Gender_Disparities_in_Automatic_Speech_Recognition_Technology"]}}, "ran": ["deep_notes", "fun_facts", "review_cards"], "checks": {"review_cards": {"calls": 4, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 8994, "exclamations": 5, "question_marks": 6, "citations": 34, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 34091, "output_tokens": 14553, "max_output_tokens_single_call": 4274, "sum_call_seconds": 63.4, "max_call_seconds": 17.95, "topics": 4, "topics_with_bad_card_sequence": 0}, "deep_notes": {"calls": 4, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 20146, "exclamations": 0, "question_marks": 0, "citations": 87, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 28183, "output_tokens": 8353, "max_output_tokens_single_call": 2842, "sum_call_seconds": 39.9, "max_call_seconds": 13.37}, "fun_facts": {"calls": 1, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 1366, "exclamations": 0, "question_marks": 1, "citations": 3, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 39528, "output_tokens": 465, "max_output_tokens_single_call": 465, "sum_call_seconds": 3.4, "max_call_seconds": 3.44, "fun_fact_sources": 3}}, "errors": {}}, "v1": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "☕", "title": "Your Coffee Machine Is Asking Questions", "content_blocks": [{"type": "quote", "text": "Every button you press was designed by someone who had a picture of you in their head!"}, {"type": "paragraph", "text": "Think about the espresso machine or microwave you used this morning. Did it feel effortless, or did you fight with it a little? That gap between what you wanted and what the device expected is exactly what we're studying today. ⟦s000098⟧ ⟦s000113⟧"}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "Four Questions Behind Every Screen", "content_blocks": [{"type": "paragraph", "text": "When you look at any interface, the professor wants you to ask four questions. First, what is the **context of use**: the physical place, the social setting, and the political environment? ⟦s000134⟧ ⟦s000153⟧"}, {"type": "paragraph", "text": "Second, who are the **users**, and what are their **user goals**? Were you making coffee because you wanted coffee, or because you needed to get to class on time? ⟦s000135⟧ ⟦s000136⟧"}, {"type": "paragraph", "text": "Third, look at the **interface choices and affordances**. On YouTube's left sidebar, why are options like Home, Shorts, and Subscriptions there, and which goals do they promote or demote? ⟦s000144⟧ ⟦s000147⟧"}, {"type": "callout", "alert_type": "info", "explanation": "", "items": []}]}, {"card_type": "gotcha", "hero_emoji": "🍎", "title": "Whose Body Did the Designers Forget?", "content_blocks": [{"type": "callout", "alert_type": "warning", "items": []}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Who Gets Left Out Next?", "content_blocks": [{"type": "paragraph", "text": "Today we learned that every interface, from a coffee machine to a voice assistant, carries assumptions about its context, its users, their goals, and the impact it has on them. Those assumptions are never neutral."}, {"type": "paragraph", "text": "Next, we'll dig into how designers make these choices on purpose through an HCI design lens, and what happens when their assumptions about users are too narrow. Can we design better from the start?"}]}], "2": [{"card_type": "hook", "hero_emoji": "🎭", "title": "Nothing Happens By Accident", "content_blocks": [{"type": "quote", "text": "Every app you use was designed on purpose, and that design quietly shapes how you feel and act! ⟦s000211-s000212⟧"}, {"type": "paragraph", "text": "Ever been frustrated by an app and thought, \"Ugh, I must be doing something wrong\"? Maybe you are, but maybe the design itself caused it. Your frustration might be an unintended consequence of how the technology was built, not your fault at all! ⟦s000213-s000218⟧"}]}, {"card_type": "core_why", "hero_emoji": "🔭", "title": "Design Shapes Who We Are", "content_blocks": [{"type": "paragraph", "text": "Early researchers in AI and HCI described design as the work of devising artifacts, the tools and things we make. Don Norman, an engineer who turned cognitive scientist and wrote the popular book The Design of Everyday Things, pushed this idea further. ⟦s000219-s000223⟧"}, {"type": "callout", "alert_type": "info", "items": []}, {"type": "paragraph", "text": "Here's the big picture: the way we design things affects our experiences with ourselves, with each other, and with the world. ⟦s000224-s000228⟧"}, {"type": "paragraph", "text": "Design choices are about what we promote and what we demote. They also decide what kinds of reasoning we encourage, whether cognitive, social, or emotional. ⟦s000230-s000233⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "Ask Better Questions, Get Better Answers", "content_blocks": [{"type": "callout", "alert_type": "warning", "explanation": "Professor's core message", "items": []}, {"type": "paragraph", "text": "The professor says that if you take just one thing from this course, it should be to bring an HCI lens to any future problem, whether in engineering, research, or cognitive science. ⟦s000234-s000236⟧"}, {"type": "paragraph", "text": "Here's the twist: how we pose questions influences the kinds of answers we allow ourselves to accept, and what we end up learning. So stay curious and question your own assumptions. ⟦s000239-s000241⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Your Course Compass", "content_blocks": [{"type": "paragraph", "text": "We learned that technology is always intentionally designed, and those choices shape our experiences with ourselves, each other, and the world. The HCI lens means asking how design promotes certain reasoning and how our questions shape our answers."}, {"type": "paragraph", "text": "Covered in class but not on these cards, worth exploring on your own:"}, {"type": "list", "items": ["Course logistics and the rule about not using computers or phones in class ⟦s000253⟧", "Past student projects, such as a public health speaking platform and VR shape creation ⟦s000267-s000278⟧", "The remarks about collaborating with strangers versus friends on creative work ⟦s000289-s000291⟧", "This quarter's project theme of novel data interaction and its open questions about data types and sources ⟦s000281-s000282⟧"]}, {"type": "paragraph", "text": "Next up is User Research and Project Development, where we will dig into user research for the U.S. immigration visa process, user interviews, personas, and iterative prototyping. How do we turn these design insights into something real? Stay tuned!"}]}], "3": [{"card_type": "hook", "hero_emoji": "🧭", "title": "Start With a Guess, Then Go Find Out", "content_blocks": [{"type": "quote", "text": "Building a product is like navigating a maze: you don't sprint in blindfolded, you start with a guess and then go ask the people who actually walk the maze! ⟦s000543-s000544⟧"}, {"type": "paragraph", "text": "Your team's first idea is just a **hypothesis**, a starting guess you have to test. The class example was the confusing U.S. immigration process, and the team's first guess was that it is often confusing and hard to understand. ⟦s000544⟧"}]}, {"card_type": "core_why", "hero_emoji": "🔁", "title": "The Research-to-Prototype Engine", "content_blocks": [{"type": "paragraph", "text": "Think of this as a loop, not a straight line. You begin with **user research**, which means figuring out who you are actually trying to help. ⟦s000545-s000546⟧ Then you run **user interviews** and make diagrams and process maps to see the problem through their eyes. ⟦s000547-s000549⟧"}, {"type": "paragraph", "text": "Next, you group people into **personas and user scenarios**, which are simply clear profiles of the people you're targeting. ⟦s000552-s000554⟧ Once you know the group, you map how they interact with your system, and then write a problem statement based on what you learned. ⟦s000555-s000564⟧"}, {"type": "callout", "alert_type": "info", "explanation": "", "items": []}, {"type": "paragraph", "text": "Finally, you build a storyboard showing your user's journey, and then start with the simplest **iterative prototyping** step: a paper prototype. ⟦s000568-s000569⟧ ⟦s000570⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "Research Decides the Problem, Not Your Gut", "content_blocks": [{"type": "callout", "alert_type": "warning", "explanation": "", "items": []}, {"type": "paragraph", "text": "Here's the catch: the problem statement should come out of your research, not out of your original hypothesis. The class team's problem statement was that people seek reliable, understandable sources outside of attorneys, but that information is hard to find and hard to interpret. ⟦s000561-s000566⟧"}, {"type": "paragraph", "text": "Prototypes are never finished on the first try. You start on paper, then keep refining until the real system is built. ⟦s000570⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Your Research Toolkit Awaits", "content_blocks": [{"type": "paragraph", "text": "We learned that good projects begin with a hypothesis, get tested through user research and interviews, and turn into a problem statement and prototypes that keep improving. The core idea is to let evidence from real users shape every next step."}, {"type": "paragraph", "text": "Here are the methods we skipped over, worth exploring on your own:"}, {"type": "list", "items": ["The details of the diagrams and process maps used to visualize user journeys ⟦s000547-s000549⟧", "The flow plot showing how users interact with the system ⟦s000557-s000559⟧", "The storyboard technique for telling your target user's story ⟦s000568-s000569⟧"]}, {"type": "paragraph", "text": "Next up, we move from understanding users to building something real, and we'll see how a working system can capture ideas across devices, find similar notes, support fishing regulation decisions, and improve through iterative field feedback. Can you guess which of those will be the trickiest to build?"}]}], "4": [{"card_type": "hook", "hero_emoji": "🎣", "title": "Start With the Person, Not the Gadget", "content_blocks": [{"type": "quote", "text": "Before you build anything, ask: who is this for, and what is driving them crazy?"}, {"type": "paragraph", "text": "Imagine you are a writer who had a brilliant idea three months ago, and you cannot remember it now. Or imagine you are a fisherman staring at a pile of California fishing rules while a fish flops on the deck. Those two people have very different problems, and the professor's group showed that a good interactive system starts by picking one of them and focusing hard on that person."}, {"type": "paragraph", "text": "Surprise! The students did not begin with a fancy app. They began with real people, and the gadgets came later. ⟦s000577-s000585⟧"}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "Personas, Scenarios, and Two Clever Tools", "content_blocks": [{"type": "paragraph", "text": "A **persona** is a made-up but realistic profile of your target user. It answers three questions: who they are, what they want, and what challenges they face with your problem. ⟦s000578-s000583⟧"}, {"type": "paragraph", "text": "Once you have a persona, you design the system around that person and walk them through **scenarios**, which are step-by-step situations they will actually go through. Then you evaluate whether the system really helps them. ⟦s000584-s000588⟧"}, {"type": "paragraph", "text": "Scrapper is the writers' example. Its core idea is **cross-device idea capture**: you jot a thought on your computer or phone, and both devices stay in sync when you are signed in to the same Google account. ⟦s000592-s000599⟧"}, {"type": "callout", "alert_type": "info", "language": "", "explanation": "", "items": []}, {"type": "paragraph", "text": "The second engine is **similarity-based note retrieval**. Think of it as a memory helper. Your new thought goes into a database, and a year later the system looks for past notes that feel similar, then shows you the top three matches with a ranking algorithm. It does not need an exact match, just a close one. ⟦s000600-s000611⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🔁", "title": "Feedback Is the Real Secret Sauce", "content_blocks": [{"type": "callout", "alert_type": "warning", "explanation": "", "items": []}, {"type": "paragraph", "text": "Look at the fishing app. A user takes a photo, types in the location and the length, and the system tells them whether the fish must be released under the local rules. That is **domain-specific decision support for fishing regulations**: the tool knows one narrow domain deeply, so it can give a clear yes or no. ⟦s000619-s000629⟧"}, {"type": "paragraph", "text": "But the first version is never the final version. The team pitched their idea to real users, collected **iterative field feedback**, and went back and forth on features. Over ten weeks they cycled between interviewing and prototyping again and again. ⟦s000652-s000659⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "Wrapping Up Today's Lecture", "content_blocks": [{"type": "paragraph", "text": "This segment showed how a team turns interview findings into personas and scenarios, then builds around one focused problem. Scrapper combines cross-device capture with similarity-based retrieval, the fishing app offers domain-specific rules guidance, and both were refined through iterative field feedback."}, {"type": "paragraph", "text": "Here are some parts the lecture covered that these cards did not dig into. Explore them on your own when you have time:"}, {"type": "list", "items": ["The LLM-based API layer that reads a fish photo and identifies its species ⟦s000639-s000640⟧", "The ranking algorithm that selects the top three similar past notes ⟦s000609-s000610⟧", "The gamification system that ranks anglers by their catch totals ⟦s000649-s000650⟧"]}, {"type": "paragraph", "text": "Today we followed one thread from start to finish: understanding the context of use and user goals, shaping interface choices around real people, and building personas, scenarios, and iterative prototypes. The final examples showed that thread in action, with every system refined by feedback from the people it was built for. You have now seen the full loop, so well done!"}]}]}, "deep_notes": {"1": "# 1. Analyzing Interactive Experiences and Their Contexts\n\nEvery interface is shaped by where it is used, who is using it, and what that person is trying to accomplish, so the same design can help one person and frustrate another. Analyzing an interaction means asking questions about its context, its user goals, the choices the interface offers, and the impact it has on the people who use it.\n\n## 🔍 What Context of Use Means\n\n**Context of use** covers the physical, social, and situational conditions in which someone interacts with a technology. It is more than the device itself. The lecture pointed to who is physically present, whether the audio can be heard, and whether you are watching alone or with a group.⟦s000135, s000151⟧\n\nThe social and political setting also counts. The media you see is delivered within a larger social and political framework, not only a physical room.⟦s000153⟧ Context also changes what a good interaction looks like. A voice assistant that plays audio is helpful in a private room and disruptive in a shared one.⟦s000151, s000164-s000167⟧\n\nContext matters because a design that works in one setting can fail in another. A kitchen, a car, a bathroom, and a nightstand each create different expectations and different risks for the same device.⟦s000164-s000167⟧\n\n## 🎯 User Goals: Direct Tasks vs. Means to an End\n\n**User goals** are the outcomes people actually want from an interaction. They may differ from the immediate task the interface seems to support.⟦s000136⟧\n\nThe lecture contrasted two kinds of goals for the same action:\n\n- **Direct goal:** You want to drink the coffee itself.⟦s000136⟧\n- **Means to an end:** You want the coffee so you can get to class on time.⟦s000136⟧\n\nThese two goals lead to different needs. Someone who only wants caffeine may care about taste, while someone rushing to class may care most about speed. Designers who focus only on the surface task can miss the broader need behind it.⟦s000136⟧\n\nThe lecture also raised goals that are not even about the task, such as ignoring a crying child, a roommate, or a parent while making coffee.⟦s000136⟧ Noticing these hidden goals helps show which needs an interface overlooks.\n\n## 🧭 Interface Choices and Affordances\n\n**Interface choices and affordances** are the options, controls, and cues that determine what a person can do in a system. An interface is never neutral. Its layout guides attention and action.⟦s000142-s000147⟧\n\nThe YouTube example illustrates this well. The left-hand navigation offers options such as Home, Shorts, Subscriptions, and History. To analyze them, you can ask:⟦s000144-s000147⟧\n\n- Which goals do these options **facilitate**?\n- Which goals do they **promote or demote**?\n- Who is the **intended user**, and what kind of physical device do they probably use?⟦s000147-s000150⟧\n\nThe layout also raises the question of where a user is supposed to begin. When many options appear at once, it becomes harder to know where to start, which shapes what people end up doing.⟦s000154-s000156⟧\n\n## ⚖️ Chatbots and Voice Assistants: Context in Action\n\nThe same questions apply to newer products. Voice assistants such as Siri, Echo, and Alexa raise questions about setting, privacy, and data. Where should the device sit, and what data might it collect in order to work well?⟦s000158-s000159, s000164-s000169⟧\n\nOne example was an Alexa option that lets a person turn a deceased loved one's voice into Alexa's voice. The same feature can mean very different things depending on context:⟦s000160-s000163⟧\n\n- **Benign reading:** Someone misses their grandmother and wants to hear her voice again.⟦s000162⟧\n- **Troubling reading:** The feature feels creepy or disrespectful, especially if the relationship was difficult.⟦s000163⟧\n\nChatbots raise a related set of questions. Natural-language input and output feel ordinary, but designers still need to ask whether this is the only kind of interaction worth supporting. For example, a developer deep in a codebase may want a different kind of help than a quick factual question.⟦s000172-s000177⟧ Expectations also matter. Users may expect the answer to be accurate, and they may also expect a particular speed and format.⟦s000181-s000182⟧\n\n## 💡 User Experience and Impact\n\n**User experience** includes how an interaction affects a person cognitively, emotionally, and practically. Whether a task can technically be completed is only part of the story.⟦s000137, s000157⟧\n\nThe lecture suggested three moments to consider:\n\n1. **Before** the interaction, such as your emotional state going in.⟦s000157⟧\n2. **During** the interaction, such as what information you wanted while doing the task.⟦s000138-s000139⟧\n3. **After** the interaction, such as how it left you feeling.⟦s000137, s000157⟧\n\nInformation gaps are one concrete form of impact. You might wish you knew that your oatmeal was about to boil over, or that your coffee was over-extracted or under-extracted.⟦s000138-s000139⟧ An interface that hides these cues forces people to guess.\n\nSome impacts are unintended. A frustrating experience may come from design choices rather than from a user's mistake, and the designer may not have intended the outcome.⟦s000213-s000218⟧\n\n## 🩺 Health Tracking: Whose Needs Are Included\n\nHealth-tracking devices, such as watches, rings, and necklaces, collect data and present it back to users. Two questions guide the analysis: what data is collected, and how is it presented?⟦s000184-s000196⟧\n\nThe example of Apple Health's first rollout shows how design choices shape who a product is built for. When the app launched, it tracked many health metrics, but one aspect was left out of the initial release: menstrual periods.⟦s000198-s000208⟧ The lecture framed this as a sign that the people a design includes, and excludes, indirectly determine who the designers expect their end users to be.⟦s000209-s000210⟧\n\n## 🎯 Key Takeaway\n\nDesigning and analyzing technology means considering context, goals, interface choices, and impact together. Every interface choice carries assumptions about the setting, the user, and what matters, and those assumptions affect people's experiences with themselves, with each other, and with the world.⟦s000140-s000141, s000226-s000228⟧ Because no interaction happens by accident, asking these questions helps reveal the intent behind a design and the consequences that may follow.⟦s000211-s000212⟧", "2": "# 2. Design Consequences and the HCI Perspective\n\nEvery interaction with technology is the result of design decisions, so its frustrations, joys, and gaps are consequences of those choices rather than accidents. The **HCI design lens** asks who a system is built for, what it encourages or discourages, and what it collects or shows, so that users' difficulties are not automatically blamed on the users.\n\n## 🔍 Why Interactions Are Never Accidental\n\nThe starting claim is that **no interaction with technology happens by accident**. Interfaces are intentionally designed, and those designs are constant, meaning they shape every experience a person has with them.⟦s000211-s000212⟧ This is the idea of **intentional design**: an interface's structure and behavior come from decisions someone made, which means those decisions can be examined and questioned.\n\n## 🧭 The HCI Design Lens\n\nThe lens connects design choices to real effects on people. The way we design things affects our experiences with ourselves, with each other, and with the world.⟦s000226-s000228⟧ When designing an interaction, the choices involved include:\n\n- **What we promote**, meaning which actions and behaviors the system makes easy.\n- **What we demote**, meaning which actions and behaviors the system makes harder or leaves out.\n- **What kinds of reasoning we facilitate**, whether cognitive, social, or emotional.⟦s000230-s000233⟧\n\nSeen this way, a design question is never only \"does it work?\" It is also \"what does this make easy, what does it make hard, and what kind of thinking does it invite?\"\n\n## 🩺 Example: Whose Needs Does a System Count?\n\nThe lecture's concrete case comes from health-tracking apps. Apple Health is an app that tracks a range of health data and presents it to users, and when it was first rolled out, one aspect of health was not included: the menstrual period.⟦s000203-s000206⟧ The example shows how a product can implicitly define its expected users through what it measures. The omission communicates an assumption about who the app is for and leaves an important user need unsupported.⟦s000207-s000209⟧\n\nThis connects to the inclusive assumptions idea. Before asking whether a system works, ask which people and needs it represents and which it may quietly exclude.\n\n## ⚠️ Unintended Consequences, Not Individual Failures\n\nA common reaction to a bad experience is to assume the fault lies with the person (\"I'm probably just not doing it right\"). The lecture pushes back on this. A difficulty might not be your fault or anyone else's; it might be an **unintended consequence** of how the technology was designed.⟦s000213-s000218⟧\n\nThe practical result is a shift in attention. When something frustrates users, the first question is what the design made possible or difficult, not what is wrong with the user.\n\n## 📚 Design as Devising Artifacts\n\nEarly research in AI and HCI described design as the activity of devising artifacts, meaning deliberately creating the tools and systems people use.⟦s000219-s000220⟧ Don Norman, who moved from engineering into cognitive science, wrote *The Design of Everyday Things* to discuss how skilled designers think about these artifacts.⟦s000220-s000223⟧ This grounds the lens in a long-standing tradition: designed objects carry the reasoning of their designers.\n\n## 🎯 Carrying the Lens Forward\n\nThe main takeaway is to **bring an HCI lens to any future problem**, whether in engineering, research, or other fields outside computer science or cognitive science.⟦s000234-s000236⟧ Several habits follow from this:\n\n- **Stay curious**, because the way we pose questions shapes the answers we allow ourselves to accept and what we end up learning.⟦s000239-s000241⟧\n- **Observe, listen, and ask questions**, of ourselves, of each other, and of the artifacts we encounter and create.⟦s000248-s000249⟧\n- **Practice the core skills of HCI**, including user research, prototyping to learn, and communicating design choices and trade-offs.⟦s000243-s000246⟧\n\n## 🔬 Project Focus: Enabling Novel Data Interaction\n\nThe current project theme is **enabling novel data interaction**. Applying the lens means asking who the interaction enables and for what purpose, and it also means asking practical questions about the data: whether it is quantitative, tabular, video, or text; where it comes from; whether it must be collected; and whether a reliable database exists or the data has to be gathered from users.⟦s000281-s000282⟧ Those questions also prompt a broader check on what interactions already exist and what new ones might be worth making available.⟦s000282⟧", "3": "# 3. User Research and Project Development\n\nThis topic lays out the full arc of a design project, from a hunch about a problem to a working system. The core idea is that you start with a hypothesis, use user research to understand the people affected, and let those findings shape a problem statement, personas, and scenarios before anything is built. ⟦s000511, s000542-s000544⟧\n\n## 🔍 Where the Project Begins: A Hypothesis\n\nThe project starts with an idea you want to explore, which becomes a **hypothesis**. In the example given, the group's hypothesis was that the U.S. immigration process is often confusing and incomprehensible.⟦s000542-s000544⟧ The group's motivation was personal: many members had family or loved ones who had applied for a work visa or an F1 visa.⟦s000540-s000542⟧\n\nThe project's premise was that applying for an immigration visa is very difficult and convoluted. The goal was to turn that process into a **linear, step-by-step guide**, at least for informational purposes.⟦s000524⟧\n\n## 🧭 Doing User Research\n\nOnce you have a hypothesis, the next step is **user research**, which means learning about the people who would actually use your system. You are trying to create different profiles of the people you want to target and figure out which problem you want to solve for them.⟦s000545-s000546⟧\n\nUser research is carried out through **user interviews**, and the research also produces **diagrams and process maps**.⟦s000547-s000548⟧ The early stage is intentionally low-tech: it is \"very analog and on paper to start.\"⟦s000549⟧\n\n## 👥 From Research to Personas and Problem Statement\n\nResearch findings are grouped into **user profiles**, which are clusters of the different people you are trying to reach.⟦s000552-s000554⟧ Once you have a clear idea of the group you are solving for, you can start mapping how you think those users will interact with your system, which is described as a flow.⟦s000555-s000559⟧\n\nFrom the research, you then write a **problem statement**. For the immigration project, it said that people in the U.S. immigration process seek reliable and understandable sources outside of attorneys.⟦s000561-s000564⟧ It also noted two obstacles that add to the confusion and anxiety around the process:\n\n- The information is often hard to find.⟦s000565⟧\n- The information is difficult to interpret for people of various backgrounds.⟦s000565-s000566⟧\n\nThe context discussion adds that **personas** capture who the target audience is, what they want, and what challenges they face, all in relation to the problem.⟦s000577-s000583⟧ The design should then focus on those personas and build the interactive system around them. The personas also set up **scenarios**, which are the situations those users will go through inside the system.⟦s000584-s000587⟧\n\n## 📖 Storyboards and Evaluation\n\nAfter the problem statement, you create a **storyboard** that tells the story of what the targeted user is going through.⟦s000568-s000569⟧ The context discussion also notes that the project includes some form of evaluation of the interactive system.⟦s000587-s000588⟧\n\n## ⚙️ How the Project Moves Toward a Product\n\nThe project progresses in stages, with each stage building on the one before:\n\n1. **Research and hypothesis:** Identify the problem and the people affected.\n2. **Personas and scenarios:** Group users and describe how they will encounter the system.\n3. **Problem statement and storyboard:** Define the problem clearly and show the user's journey.\n4. **Paper prototype:** Begin with the most basic version, which is paper.⟦s000570⟧\n5. **Working system:** The process culminates in actually building the system.⟦s000570⟧\n\nLater in the quarter, the work continues with additional user research, system development, and prototyping.⟦s000570⟧ The process is iterative, since research, prototyping, and refinement happen over time rather than as one linear step.\n\n<!-- FIGURE: type=\"diagram\" title=\"Project Development Pipeline\" description=\"A left-to-right or top-down flow with boxes connected by arrows. Start with 'Hypothesis (confusing U.S. immigration process)'. Arrow to 'User Research & Interviews' with a side note 'analog, paper-based process maps'. Arrow to 'User Profiles / Personas & Scenarios'. Arrow to 'Problem Statement' (reliable, understandable info outside attorneys). Arrow to 'Storyboard' and 'User-Interaction Flow'. Arrow to 'Paper Prototype'. Final arrow to 'Built System'. Include a loop-back arrow from 'Paper Prototype' to 'User Research' to show iteration.\" -->\n\n## 🆚 Choosing the Form of Your System\n\nYour system is not limited to a website. The context discussion points out that a project can combine different kinds of interfaces. One example combined a Google Chrome extension with a companion mobile app, and the speaker noted that few other teams that quarter took that approach.⟦s000589-s000591⟧ The takeaway is that the system's form should follow from the users and their scenarios, not from a default assumption.⟦s000590-s000591⟧\n\n## 🎯 Key Takeaway\n\nGood project work starts with people, not technology. A hypothesis leads to user research, research becomes personas and a problem statement, and those personas and scenarios guide a system that is prototyped on paper first and refined over time.⟦s000543-s000547, s000568-s000570⟧", "4": "# 4. Interactive System Examples and Evaluation\n\nA good interactive system starts with a specific problem for a specific group of people, and then the system is built around that group's goals and challenges. The two examples here show how that works in practice: **Scrapper**, a cross-device idea-capture tool for writers, and a **fishing app** that helps anglers check catch regulations. Both were refined through repeated contact with the people they were built for.\n\n## 🧭 From User Research to a Focused System\n\nThe process begins with user research, which is then turned into a set of structured artifacts. Research findings are grouped into **user profiles** that describe the kinds of people you want to help.⟦s000552-s000554⟧ Once the group is clear, you write a **problem statement** that captures the issue you are solving for them.⟦s000555-s000556, s000560-s000561⟧\n\nFor the immigration example from earlier, that problem was that people seek reliable and understandable sources outside of attorneys, but that information is hard to find and hard to interpret across different backgrounds, which adds to confusion and anxiety.⟦s000562-s000566⟧\n\nThe notes then add a few more layers:\n\n- **Summary of user research:** the findings from interviews that support the problem statement.⟦s000577-s000578⟧\n- **Personas:** a description of the target audience, including what they want to accomplish and what challenges they face with respect to the problem.⟦s000579-s000583⟧\n- **Scenarios:** the situations personas will go through when they use the system, which are used to plan the interactive system and its evaluation.⟦s000584-s000588⟧\n\nThe key idea is that personas keep the design focused. You concentrate on those people and build the interactive system around their needs, rather than around every possible user.⟦s000584-s000585⟧\n\n## 🧩 Example One: Scrapper and Cross-Device Idea Capture\n\nThe Scrapper team turned interview findings about the everyday challenges writers face into a system with two parts: a **Google Chrome extension** and a **companion mobile app**.⟦s000589, s000592-s000595⟧ The speaker notes that the extension was an unusual choice for the class, which shows that an interactive system does not have to be a website or a traditional computer application.⟦s000589-s000591⟧\n\nThe two parts work together. Users can create notes on their computer or on their phone, and the notes sync when both devices are logged into the same Google account.⟦s000598-s000599⟧ This matters because writers often have an idea in one setting and need to access it in another, so the system follows them across devices.\n\n> Cross-device capture: a note saved on either device is stored in one shared database and becomes available from both.⟦s000598-s000603⟧\n\n## 🔎 Example One, Continued: Similarity-Based Note Retrieval\n\nThe core problem Scrapper addresses appears when a writer has recorded an idea but cannot remember it. A writer might think they had a similar idea a year earlier but cannot recall what it was or where it is stored.⟦s000600, s000604-s000606⟧\n\nThe solution is **similarity-based retrieval**. The user writes something new, and the system compares it with the stored notes in the database.⟦s000603, s000609-s000610⟧ It then returns a short ranked list, with the top three suggestions, so the user can check whether something similar was already written.⟦s000609-s000611⟧ The speaker describes the ranking as a ranking algorithm, but the transcript does not go into how it works.⟦s000610⟧\n\nThis feature is the answer to the single problem the team identified and focused on. The whole system was then built around that problem.⟦s000612-s000614⟧\n\n## 🎣 Example Two: Fishing Regulations as Domain-Specific Decision Support\n\nThe fishing app solves a different kind of problem. The team's idea came from a fisher who goes out often and wanted a quick way to handle the rules that apply when a fish is caught.⟦s000619-s000622⟧ In California, the legality of keeping a catch depends on the area being fished, the size of the fish, and the species.⟦s000623-s000627⟧ The goal was to make this process streamlined and easy for fishermen.⟦s000628-s000629⟧\n\nThe app brings these details together in one place:\n\n1. **Photo:** a picture of the fish is sent through an API layer to an LLM, which identifies the species.⟦s000639-s000640⟧\n2. **Location:** the user types in where the fish was caught.⟦s000641⟧\n3. **Length:** the user enters the length, for example 12 inches.⟦s000642⟧\n4. **Decision:** the app checks these inputs against the rules and tells the user whether the fish must be released.⟦s000645⟧\n\nThis is what makes it domain-specific. The system does not just store information; it combines several inputs and applies a particular set of rules to support a single decision, whether the catch can be kept or must be let go.⟦s000624-s000627, s000645⟧\n\nThe app also tracks what happens after each catch. Users can record how many fish they caught and how many they released, and the history shows total catches, saved releases, and saved keeps.⟦s000646-s000648⟧ The team also added gamification, where users earn ranks based on how many fish they catch.⟦s000649-s000650⟧\n\n> Note: the transcript mentions that the app offers \"two options\" but the details of those options are not fully covered in the segment, so they are not described here.⟦s000632⟧\n\n## 🔁 Iterative Field Feedback\n\nThe fishing team did not design the app once and stop. Their process was to pitch ideas to fishermen, collect direct feedback, and then revise the system.⟦s000655-s000656⟧ Some features went back and forth several times before the team settled on a final version.⟦s000656-s000657⟧\n\nThe process repeated the same cycle over ten weeks: interviewing users, moving to prototyping, then interviewing again and returning to prototyping.⟦s000657-s000658⟧ This is what iterative field feedback means. Each round of contact with the intended users changes the system, and the final result reflects what was learned along the way.⟦s000655-s000659⟧\n\n## 🎯 Key Takeaways\n\n- **Start with a focused problem:** user profiles, a problem statement, personas, and scenarios keep the system centered on a specific group's needs.⟦s000553-s000556, s000579-s000588⟧\n- **The system is not limited to a website:** Scrapper combined a browser extension with a mobile app, and the team saw that the form factor is a design choice.⟦s000589-s000591⟧\n- **Retrieval solves a memory problem:** Scrapper's similarity-based ranking helps users locate earlier notes they remember writing but cannot find.⟦s000604-s000612⟧\n- **Decision support combines inputs and rules:** the fishing app uses photo, location, length, and species to answer whether a catch can be kept.⟦s000639-s000645⟧\n- **Evaluation happens with real users:** repeated interviews and prototype revisions shaped both systems.⟦s000655-s000658⟧"}, "fun_facts": {"title": "The Voice Assistant That Couldn't Hear Half of Us 🎙️", "hook": "Did you know that early voice recognition systems once struggled far more with women's voices, transcribing them with noticeably higher error rates than men's? It turns out the machine was not the only thing that was biased—the data it learned from was.", "body": "This is exactly the kind of HCI lens question you were just introduced to: who did the designers quietly assume the 'default' user would be?\n\nIn the early days of speech-to-text, engineers trained their systems on large collections of recorded voices, and those collections were heavily skewed toward men, so the software learned men's speech patterns far better than women's⟦1⟧.\n\nThe result was startling: in one early Google study, the average female speaker had less than half of her words captioned correctly (47%), while the average male speaker was captioned correctly 60% of the time⟦2⟧.\n\nResearchers later found the gap could be pushed in either direction by changing the training data mix, with the most fair and accurate results appearing near a 60–70% women split rather than a simple 50-50 balance⟦3⟧.\n\nSo the next time a voice interface misunderstands you, remember that someone had to decide whose voice counted as normal—and that decision is design, which means you can make a different one.", "sources": ["https://makingnoiseandhearingthings.com/2016/07/12/googles-speech-recognition-has-a-gender-bias/", "https://makingnoiseandhearingthings.com/2016/07/12/googles-speech-recognition-has-a-gender-bias/", "https://arxiv.org/html/2502.18434v1"]}}, "ran": ["deep_notes", "fun_facts", "review_cards"], "checks": {"review_cards": {"calls": 4, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 10024, "exclamations": 7, "question_marks": 12, "citations": 42, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 41769, "output_tokens": 8927, "max_output_tokens_single_call": 3661, "sum_call_seconds": 46.2, "max_call_seconds": 18.02, "topics": 4, "topics_with_bad_card_sequence": 0}, "deep_notes": {"calls": 4, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 23177, "exclamations": 1, "question_marks": 8, "citations": 102, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 2, "input_tokens": 29263, "output_tokens": 11185, "max_output_tokens_single_call": 3040, "sum_call_seconds": 53.4, "max_call_seconds": 15.09}, "fun_facts": {"calls": 1, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 1313, "exclamations": 0, "question_marks": 2, "citations": 3, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 39562, "output_tokens": 440, "max_output_tokens_single_call": 440, "sum_call_seconds": 3.3, "max_call_seconds": 3.29, "fun_fact_sources": 3}}, "errors": {}}, "v1b": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "☕", "title": "Your Morning Machines", "content_blocks": [{"type": "quote", "text": "Your espresso machine, microwave, and snooze button are all interfaces, and every one of them was designed by someone with a particular person in mind!"}, {"type": "paragraph", "text": "Think about your own morning. Someone pressed a few buttons to make your coffee, and that little interaction felt totally ordinary. Today we're going to ask why those buttons are there, who they were built for, and how they made you feel."}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "Four Lenses on Any Interface", "content_blocks": [{"type": "paragraph", "text": "Your professor gave you a simple toolkit for analyzing any interaction. Start with **context of use**, which means the physical setting, the social setting, and even the political setting where the interface lives. ⟦s000134⟧ ⟦s000152⟧ ⟦s000153⟧"}, {"type": "paragraph", "text": "Next ask about **user goals**. Did you want the coffee itself, or was it just a means to making it to class on time? ⟦s000136⟧ Then look at the **interface choices and affordances**, meaning what the design lets you do and which options it puts in front of you, like the left-hand menu on YouTube. ⟦s000144⟧ ⟦s000146⟧"}, {"type": "callout", "alert_type": "info", "text": "Finally, think about **user experience and impact**: how the interaction made you feel before, during, and after, and what information you wished you had. ⟦s000137⟧ ⟦s000138⟧ ⟦s000157⟧"}, {"type": "paragraph", "text": "Use these four lenses on a voice assistant too. Who wants to ask it for something private, and for what purpose? Is a bedroom placement helpful, or a little too close for comfort? ⟦s000161⟧ ⟦s000166⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🧩", "title": "The Hidden User Behind the Screen", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Here's the professor's big warning: an interface doesn't just show options, it quietly decides who the end user is. ⟦s000209⟧"}, {"type": "paragraph", "text": "Let's look at Apple Health. When it first rolled out, it tracked a huge range of health metrics, yet menstrual period tracking was missing. ⟦s000205⟧ ⟦s000206⟧ ⟦s000207⟧ ⟦s000208⟧ That gap tells you that the team imagined a narrower user, and whoever is left out of that picture ends up with a product that doesn't fit them."}, {"type": "paragraph", "text": "So the next time you open an app, ask yourself who it expects you to be. The answer is usually written into the buttons, the defaults, and the features that are missing. ⟦s000209⟧ ⟦s000210⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎯", "title": "Dig Deeper, Then Look Ahead", "content_blocks": [{"type": "paragraph", "text": "Today we learned to analyze any interaction by asking about its context of use, the user's goals, the interface choices and affordances, and the resulting user experience and impact. We also saw that every interface quietly assumes who its users are, from the YouTube sidebar to the missing feature in Apple Health."}, {"type": "paragraph", "text": "These topics came up in class but didn't make it onto these cards, so they're worth exploring on your own:"}, {"type": "list", "items": ["The data sources that voice assistants might collect from their surroundings, and what that means for privacy ⟦s000168⟧ ⟦s000169⟧", "How chatbot users form expectations about the veracity, speed, and format of answers ⟦s000181⟧ ⟦s000182⟧"]}, {"type": "paragraph", "text": "Now that you can spot who an interface is built for, the next question is what that means for the designers making these choices. We'll move into the HCI design lens, intentional design, and the inclusive assumptions we bring about users, and see how those choices play out in voice assistants. Get ready to look at the designer's side of the screen!"}]}], "2": [{"card_type": "hook", "hero_emoji": "🎯", "title": "Nothing Happens By Accident", "content_blocks": [{"type": "quote", "text": "Every tech experience you've ever had was designed on purpose, even the ones that made you want to throw your phone!"}, {"type": "paragraph", "text": "Think about that moment when an app made you furious, or one that made you grin without knowing why. Those feelings didn't just pop out of nowhere. Someone made choices, and those choices are still shaping what you feel right now."}]}, {"card_type": "core_why", "hero_emoji": "🧠", "title": "Design Shapes How We Think and Feel", "content_blocks": [{"type": "paragraph", "text": "Here's the big idea. Design isn't just about making things look pretty. The way we design things affects our experiences with ourselves, with each other, and with the world. ⟦s000225-s000228⟧"}, {"type": "paragraph", "text": "Early work in AI and HCI described design as the act of devising artifacts, and Don Norman, an engineer who turned cognitive scientist, wrote the popular book *The Design of Everyday Things* about how great designers think. ⟦s000219-s000222⟧"}, {"type": "callout", "alert_type": "info", "text": "Every design is a set of choices about what to **promote** and what to **demote**. Those choices decide which kinds of reasoning, whether cognitive, social, or emotional, get encouraged. ⟦s000230-s000233⟧"}, {"type": "paragraph", "text": "So when someone says, \"I must just be bad at this,\" it might not be their fault at all. It could be an unintended consequence of how the technology was built. ⟦s000215-s000218⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🔍", "title": "The HCI Lens Is Your Superpower", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "The professor's one big takeaway: bring an **HCI lens** to any problem you encounter, whether you're in engineering, research, or cognitive science. ⟦s000234-s000237⟧"}, {"type": "paragraph", "text": "Here's the sneaky part. The way you *ask* a question shapes the kind of answer you'll accept. If you frame a problem narrowly, you'll only learn narrow things. Staying curious and questioning your own framing is what keeps your discoveries honest. ⟦s000239-s000241⟧"}, {"type": "paragraph", "text": "So the habit to build is simple: keep asking, \"Who is this design enabling, and what is it quietly leaving out?\" That question is the HCI lens in action. ⟦s000237-s000241⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Look Closer and Get Ready", "content_blocks": [{"type": "paragraph", "text": "We just learned that no technology interaction is accidental. Design choices promote some ways of thinking and feeling while demoting others, so an HCI lens means asking who a design serves and what it leaves out."}, {"type": "paragraph", "text": "These came up in class but didn't make it onto these cards, so they're worth exploring on your own:"}, {"type": "list", "items": ["The student project examples, including a public health platform and VR/3D interaction tools, and how they were iterated and evaluated ⟦s000267-s000278⟧", "This quarter's project theme of enabling novel data interaction, and the guiding questions about who is enabled, for what purpose, and what kind of data is involved ⟦s000281-s000282⟧", "The reflection on how the most successful collaborations happened with strangers, through creative and vulnerable work ⟦s000289-s000291⟧"]}, {"type": "paragraph", "text": "So how do we actually find out what real people experience with the technology we build? Next up is User Research and Project Development, where we'll start with user interviews, personas, and iterative prototyping. Let's see how those tools help us ask better questions!"}]}], "3": [{"card_type": "hook", "hero_emoj
