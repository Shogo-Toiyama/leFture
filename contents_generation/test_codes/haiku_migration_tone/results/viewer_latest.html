i": "🧭", "title": "Don't Build for a Ghost", "content_blocks": [{"type": "quote", "text": "Building a product before you understand your user is like cooking a dinner for a stranger without ever asking what they like to eat!"}, {"type": "paragraph", "text": "Our class project starts with a messy real-world problem: the U.S. immigration visa process. It is confusing, convoluted, and full of anxiety, and that is exactly why it makes a great starting point. Your first move is not to code. It is to find out who is actually struggling and why."}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "From Guess to Real Problem", "content_blocks": [{"type": "paragraph", "text": "Every project begins with a **hypothesis**, which is just your best guess about the problem. For this team, the guess was that the U.S. immigration process is often confusing and hard to understand. ⟦s000543-s000544⟧"}, {"type": "paragraph", "text": "Next comes **user research**. You try to figure out which people are affected, then run **user interviews** to hear their experiences firsthand. You can start this very analog, with paper, diagrams, and process maps. ⟦s000545-s000549⟧"}, {"type": "paragraph", "text": "Once you have the research, you group people into **personas and user scenarios**, which are basically profiles of the people you want to help. Then you map out how those users interact with your system as a flow. ⟦s000552-s000559⟧"}, {"type": "paragraph", "text": "Finally, you write a **problem statement** that says who is struggling and why. For this project, the core issue was that people need reliable, easy-to-understand sources beyond attorneys, and those sources are hard to find. ⟦s000560-s000566⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "Your Hypothesis Is Not the Finish Line", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Pay attention here! The hypothesis is only the starting point. The problem statement must come from what your research actually reveals, not from what you assumed at the beginning. ⟦s000543-s000544⟧⟦s000560-s000561⟧"}, {"type": "paragraph", "text": "Think of the hypothesis like a rough map drawn before you have walked the road. Interviews and profiles are how you check the map against reality. If the research shows a different problem, you update the problem statement instead of forcing the research to fit your first idea. ⟦s000547-s000549⟧"}, {"type": "paragraph", "text": "This is why the process runs in a loop of research, grouping, and refining rather than one straight line. Each step gives you new information that shapes the next one. ⟦s000552-s000567⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Research First, Then Build", "content_blocks": [{"type": "paragraph", "text": "We just saw how a project begins with a hypothesis, moves through user research and interviews, and becomes a clear problem statement built on real user profiles. The big lesson is that understanding the person comes before designing the solution."}, {"type": "paragraph", "text": "Here is what we skipped on these cards, so you can explore it on your own:"}, {"type": "list", "items": ["How process maps and diagrams are drawn on paper to capture each step of a user's journey ⟦s000547-s000549⟧", "How a storyboard turns a problem statement into a story of what the target user goes through ⟦s000568-s000569⟧", "How a paper prototype grows, step by step, into a fully built system with iterative prototyping ⟦s000570⟧"]}, {"type": "paragraph", "text": "So far we have a clear problem, but how do we know whether a real system actually solves it? Next, we will look at interactive system examples and how they get evaluated, including ideas like cross-device idea capture, similarity-based note retrieval, domain-specific decision support for fishing regulations, and iterative field feedback. Get ready to see how real systems get tested out in the world!"}]}], "4": [{"card_type": "hook", "hero_emoji": "📓", "title": "The Notebook That Remembers", "content_blocks": [{"type": "quote", "text": "Imagine a notebook that follows you everywhere, catches every half-formed idea, and quietly says, 'Hey, you thought of this a year ago!'"}, {"type": "paragraph", "text": "That is basically the system this group built. Instead of asking 'what cool tech can we make?', they started with one real frustration and built the whole thing around it. Ready to see how?"}]}, {"card_type": "core_why", "hero_emoji": "🎯", "title": "Start With a Person, Not a Gadget", "content_blocks": [{"type": "paragraph", "text": "Every good interactive system begins with a **problem statement** and a **persona**, which is a made-up but grounded picture of your target user: who they are, what they want, and what challenges they face. ⟦s000577-s000583⟧"}, {"type": "callout", "alert_type": "info", "text": "Then you design around that person's **scenarios**, the step-by-step situations they will actually go through in your system. ⟦s000584-s000588⟧"}, {"type": "paragraph", "text": "Here, the persona was a writer. The team learned from user interviews that writers struggle to find ideas they already had. That one pinpointed problem became the seed for Scrapper. ⟦s000592-s000593⟧ ⟦s000612-s000614⟧"}, {"type": "paragraph", "text": "Because writers jump between their laptop and their phone, the group decided on two pieces: a **Chrome extension** for the computer and a **companion mobile app**. Notes sync between them when you are logged into your Google account. ⟦s000595-s000599⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "One Problem, Whole System", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "The professor's big tip: you do NOT have to build a website. 'The world's your oyster!' Pick the device that fits the user's real life. ⟦s000589-s000591⟧"}, {"type": "paragraph", "text": "Scrapper's **similarity-based note retrieval** is the best example of a focused system. Say you wrote an idea a year ago and now feel a sense of déjà vu. The app compares your new note to everything stored in its database and gives you your **top three suggestions**, so you can see if you have written something similar. ⟦s000600-s000611⟧"}, {"type": "paragraph", "text": "The fishing app shows **domain-specific decision support**: a tool built for one specific world. Regulations in California depend on the area, the species, and the fish's size, so the app takes a photo, identifies the species, and checks the location and length to tell you whether to keep or release it. ⟦s000622-s000629⟧ ⟦s000645⟧"}, {"type": "callout", "alert_type": "info", "text": "Notice the pattern: both projects are narrow, focused, and tailored to one real group of people. That focus is what makes them work. ⟦s000612-s000614⟧"}, {"type": "paragraph", "text": "Finally, the team did not get it right on the first try. They pitched ideas, got direct **iterative field feedback** from real users, went back to prototyping, and repeated this over 10 weeks. Back and forth is the normal process, not a sign of failure. ⟦s000655-s000659⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "Wrapping Up the Lecture", "content_blocks": [{"type": "paragraph", "text": "We just saw how a strong interactive system starts with a clear problem and a persona. Scrapper shows cross-device capture and similarity-based retrieval, while the fishing app shows how a domain-specific tool can help users make a real decision in the field. Both improved through repeated feedback."}, {"type": "paragraph", "text": "These were covered in class but not on these cards, so they are worth exploring on your own:"}, {"type": "list", "items": ["How the fishing app's API layer sends a photo to an LLM to identify the species ⟦s000639-s000642⟧", "The ranking algorithm that picks Scrapper's top three similar notes ⟦s000609-s000610⟧", "The gamification system that ranks anglers by how many fish they catch ⟦s000649-s000650⟧", "How the catch, release, and keep history gets logged and displayed ⟦s000646-s000648⟧"]}, {"type": "paragraph", "text": "Today's lecture started with Analyzing Interactive Experiences and Their Contexts, then looked at Design Consequences and the HCI Perspective, and moved into User Research and Project Development with interviews, personas, and iterative prototyping. This final example pulls it all together: real context, real users, and real feedback drive every design choice."}]}]}, "deep_notes": null, "fun_facts": null}, "ran": ["review_cards"], "checks": {"review_cards": {"calls": 4, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 12966, "exclamations": 9, "question_marks": 8, "citations": 58, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 0, "input_tokens": 37689, "output_tokens": 15343, "max_output_tokens_single_call": 4492, "sum_call_seconds": 67.2, "max_call_seconds": 19.32, "topics": 4, "topics_with_bad_card_sequence": 0}}, "errors": {}}, "v1c": {"outputs": {"review_cards": {"1": [{"card_type": "hook", "hero_emoji": "☕", "title": "Your Coffee Machine Is Asking Questions", "content_blocks": [{"type": "quote", "text": "Every time you press a button on an interface, something is quietly deciding what you care about!"}, {"type": "paragraph", "text": "Think about your espresso machine this morning. Did you just hit the power button and wait? Your classmates did the same thing, and that tiny moment is actually a little design story. ⟦s000098⟧ ⟦s000100⟧ ⟦s000103⟧"}, {"type": "paragraph", "text": "Hey, don't worry if you've never thought about this before. Today we're going to start noticing these hidden questions, and it'll get fun fast!"}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "The Four Lenses of Interaction", "content_blocks": [{"type": "paragraph", "text": "Professor's big idea: when you look at any interface, ask about the **context** (physical, social, and political setting), the **user goals** (what you're really trying to get done), the **interface choices and affordances** (what the design makes easy or possible), and the **user experience and impact** (how it makes you feel and act). ⟦s000134⟧ ⟦s000136⟧ ⟦s000137⟧"}, {"type": "paragraph", "text": "Let's try it on YouTube. Why are there options like Home, Shorts, and Subscriptions on the left? Each one promotes certain goals and demotes others. ⟦s000144⟧ ⟦s000146⟧ ⟦s000147⟧"}, {"type": "callout", "alert_type": "info", "text": "Pause here: the key question is who the intended user is. Is it someone on a phone, alone, or with a group? ⟦s000148⟧ ⟦s000151⟧"}, {"type": "paragraph", "text": "Context isn't just the room you're in. It also includes the social and political setting in which the media reaches you. ⟦s000152⟧ ⟦s000153⟧"}]}, {"card_type": "gotcha", "hero_emoji": "⚠️", "title": "Designers Hide Assumptions Inside Products", "content_blocks": [{"type": "callout", "alert_type": "warning", "text": "Pay attention to this! Every feature quietly assumes a specific user, and what's left out is just as telling as what's included. ⟦s000205⟧ ⟦s000206⟧ ⟦s000209⟧"}, {"type": "paragraph", "text": "Take Apple Health's first rollout. It tracked lots of metrics, but it left out the menstrual period, which is a big deal for many users. That omission tells you who the designers pictured as the end user. ⟦s000205⟧ ⟦s000206⟧ ⟦s000208⟧"}, {"type": "paragraph", "text": "Voice assistants work the same way. Should a device sit by your bed or in the bathroom? Should it let you recreate a loved one's voice? Each choice depends on a context and on assumptions about who is listening. ⟦s000164⟧ ⟦s000166⟧ ⟦s000160⟧ ⟦s000162⟧ ⟦s000163⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Wrap Up and Look Ahead", "content_blocks": [{"type": "paragraph", "text": "We saw that every interface, from a coffee machine to a chatbot to a health app, carries assumptions about its context, its users, and their goals. Asking these questions helps us notice what a design makes easy and what it quietly leaves out."}, {"type": "paragraph", "text": "So how do we deliberately build interfaces that account for these assumptions, and whose needs get pushed aside when we don't? Those are exactly the questions we'll tackle next as we look at design consequences and the HCI perspective!"}]}], "2": [{"card_type": "hook", "hero_emoji": "🎯", "title": "Nothing Is By Accident", "content_blocks": [{"type": "quote", "text": "No interaction with technology is by accident. Every design was chosen on purpose, and those choices are constant! ⟦s000211⟧⟦s000212⟧"}, {"type": "paragraph", "text": "Ever felt a rush of frustration or pure joy while using an app? You might think it's just you. But sometimes the feeling comes from choices someone made long before you ever tapped the screen. ⟦s000213⟧"}]}, {"card_type": "core_why", "hero_emoji": "🧠", "title": "Design Shapes Who We Are", "content_blocks": [{"type": "paragraph", "text": "Here's the big idea: the way we design things affects our experiences with ourselves, with each other, and with the world. That's a big claim, so let's slow down! ⟦s000226⟧⟦s000227⟧⟦s000228⟧"}, {"type": "paragraph", "text": "Think of every design as a set of choices about what to **promote** and what to **demote**. Those choices decide what kinds of reasoning get encouraged, whether cognitive, social, or emotional. ⟦s000230⟧⟦s000231⟧⟦s000232⟧⟦s000233⟧"}, {"type": "paragraph", "text": "Early work in AI and HCI described design as devising artifacts, and Don Norman, an engineer turned cognitive scientist, made this idea popular with *The Design of Everyday Things*. ⟦s000219⟧⟦s000220⟧⟦s000221⟧⟦s000222⟧"}]}, {"card_type": "gotcha", "hero_emoji": "🔍", "title": "Wear the HCI Lens", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "Professor's #1 takeaway: bring an **HCI lens** to any future problem, whether it's in engineering, research, or cognitive science! ⟦s000234⟧⟦s000235⟧⟦s000236⟧"}, {"type": "paragraph", "text": "Here's the trick that makes it click. The way you pose a question steers the kind of answer you let yourself accept, and that in turn shapes what you end up learning. ⟦s000239⟧⟦s000240⟧⟦s000241⟧"}, {"type": "paragraph", "text": "So when something feels off, don't stop at \"that's just how it is.\" Ask who the design serves, what it assumes, and what it quietly pushes people toward. ⟦s000248⟧⟦s000249⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Where We Go Next", "content_blocks": [{"type": "paragraph", "text": "We learned that no interaction with technology is accidental. Designs are intentional, they shape how we think, feel, and relate to others, and bringing an HCI lens means questioning both the design and our own questions."}, {"type": "paragraph", "text": "Here's what these cards skipped, all worth exploring on your own:"}, {"type": "list", "items": ["The course skills in prototyping, communicating design trade-offs, and observing and listening carefully ⟦s000243⟧⟦s000245⟧⟦s000246⟧⟦s000248⟧", "This quarter's project theme on enabling novel data interaction, and the questions about who it serves and what data it uses ⟦s000281⟧⟦s000282⟧", "The story about how the most successful creative collaborations happened with strangers rather than friends ⟦s000289⟧⟦s000290⟧⟦s000291⟧"]}, {"type": "paragraph", "text": "So how do we move from spotting a flawed design to actually fixing it? Next up is User Research and Project Development, where we'll start talking to real users, building personas, and prototyping our way toward better designs. Stay curious!"}]}], "3": [{"card_type": "hook", "hero_emoji": "🧭", "title": "Don't Build Blind!", "content_blocks": [{"type": "quote", "text": "Imagine building a map for a city you've never visited. You'd end up with a beautiful map of the wrong streets!"}, {"type": "paragraph", "text": "That is exactly the trap this lecture warns you about. Before anyone writes a line of code or draws a single screen, a good project starts by figuring out who the real people are and what they actually struggle with. Ready to see how the team did it?"}]}, {"card_type": "core_why", "hero_emoji": "🔍", "title": "Hunch, Then Listen", "content_blocks": [{"type": "paragraph", "text": "Every project begins with a **hypothesis**, which is just your best guess about a problem. The team's guess was that the U.S. immigration process is often confusing and hard to understand. ⟦s000543⟧⟦s000544⟧"}, {"type": "paragraph", "text": "Next comes **user research**, where you find out who is actually affected. You group people into **personas**, which are simple profiles of the kinds of people you want to help. ⟦s000545⟧⟦s000546⟧⟦s000552⟧⟦s000553⟧"}, {"type": "paragraph", "text": "Then you run **user interviews** and sketch **process maps** to see how these people really move through the system. Notice the order: you learn first, and only then do you know what to solve. ⟦s000547⟧⟦s000548⟧"}, {"type": "list", "items": ["Hypothesis: your initial guess", "User research: find out who is affected", "Personas: group the people you are targeting", "User interviews and process maps: see their journey", "Problem statement: define the exact problem to solve"]}]}, {"card_type": "gotcha", "hero_emoji": "⚡", "title": "The Problem Statement Is The Hinge", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "The professor's key message: a problem statement only comes after research. It is the bridge between 'what we think' and 'what we will fix.' ⟦s000560⟧⟦s000561⟧"}, {"type": "paragraph", "text": "In the visa example, the problem statement said people outside the process look for reliable, understandable sources besides attorneys, but that information is hard to find and hard to interpret. ⟦s000562⟧⟦s000563⟧⟦s000564⟧⟦s000565⟧⟦s000566⟧"}, {"type": "paragraph", "text": "Then comes a **storyboard**, which tells the story of your target user going through their situation. Only after that does the team build, starting with a **paper prototype** and moving toward a working system. ⟦s000568⟧⟦s000569⟧⟦s000570⟧"}]}, {"card_type": "next_action", "hero_emoji": "🚀", "title": "Your Research Toolkit Awaits", "content_blocks": [{"type": "paragraph", "text": "We saw how a project grows from a hunch into a clear problem by listening to real users first. Hypotheses, personas, interviews, and problem statements all work together to point you at the right target."}, {"type": "paragraph", "text": "Want to go deeper on the hands-on parts? These were mentioned in class but not covered on these cards, so they are worth exploring on your own:"}, {"type": "list", "items": ["The detailed process maps and diagrams used to chart user journeys ⟦s000548⟧", "Storyboards as a storytelling tool for the targeted user ⟦s000568⟧⟦s000569⟧", "The paper prototype stage that comes before building the final system ⟦s000570⟧"]}, {"type": "paragraph", "text": "Once you have a clear problem, the next question is how to bring your ideas to life and test them with real people. We'll explore interactive system examples next, including how idea capture and feedback shape what gets built!"}]}], "4": [{"card_type": "hook", "hero_emoji": "🎯", "title": "One Problem, Whole System", "content_blocks": [{"type": "quote", "text": "Real interactive systems don't start with a cool gadget. They start with one annoying problem and a real person who has it!"}, {"type": "paragraph", "text": "Think of a tailor: they don't sew one suit for everyone. They measure one customer first, then build around that person. That's exactly how these student teams worked. ⟦s000584-s000585⟧"}]}, {"card_type": "core_why", "hero_emoji": "🧭", "title": "Design Around the People", "content_blocks": [{"type": "paragraph", "text": "Before building anything, the team wrote a problem statement and summarized their user research. Then they created **personas**: a target audience, what that audience wants, and the challenges they face. ⟦s000577-s000583⟧"}, {"type": "paragraph", "text": "Next, you focus on those people and build the system around them. Each persona walks through **scenarios** inside the system, and evaluation checks whether it actually helps them. ⟦s000584-s000588⟧"}, {"type": "paragraph", "text": "Scrapper is the example. Interviews showed writers struggle with everyday idea tracking, so the team built a browser extension and a companion mobile app that sync through a Google account. ⟦s000592-s000599⟧"}]}, {"card_type": "gotcha", "hero_emoji": "💡", "title": "Ideas Hiding In Your Notes", "content_blocks": [{"type": "callout", "alert_type": "info", "text": "Professor's pro-tip: your interactive system doesn't have to live on a computer or website. The world's your oyster! ⟦s000589-s000591⟧"}, {"type": "paragraph", "text": "Scrapper relies on **similarity-based note retrieval**. Imagine you had an idea a year ago and now vaguely feel you've thought of it before. The system searches its stored notes and returns your top three similar ones. ⟦s000600-s000611⟧"}, {"type": "paragraph", "text": "The fishing app shows **domain-specific decision support for fishing regulations**. You enter the location, species, and length, and it tells you whether the fish must be released under California rules. The system simplifies dense legal rules so fishermen don't have to decode them. ⟦s000622-s000629⟧ ⟦s000641-s000645⟧"}, {"type": "paragraph", "text": "Teams refined their work through **iterative field feedback**. They pitched to real users, gathered responses, went back to prototyping, and repeated the loop for ten weeks. Iteration is how the final design gets built. ⟦s000655-s000659⟧"}]}, {"card_type": "next_action", "hero_emoji": "🎓", "title": "Wrap It Up", "content_blocks": [{"type": "paragraph", "text": "We saw two student systems built from one focused problem. Scrapper captures and finds ideas across devices, while the fishing app helps fishermen follow California rules. Both came from interviews, personas, scenarios, and repeated feedback loops."}, {"type": "paragraph", "text": "These were covered in class but not on these cards, so they're worth exploring on your own:"}, {"type": "list", "items": ["How the similarity ranking scores and picks your top three past notes ⟦s000609-s000610⟧", "The API layer that sends a fish photo to an LLM to identify the species ⟦s000639-s000640⟧", "How gamified ranks are earned from your catches and releases ⟦s000648-s000650⟧"]}, {"type": "paragraph", "text": "Today we moved from analyzing experiences and their contexts, through HCI design lenses and intentional design choices, into user research, personas, and prototyping. This final segment showed those ideas working in real projects, and both systems began with a user, not a gadget. You now have the full arc from understanding people to testing a system with them. Nice work!"}]}]}, "deep_notes": null, "fun_facts": null}, "ran": ["review_cards"], "checks": {"review_cards": {"calls": 4, "error": null, "finish_reasons": ["stop"], "truncated_calls": 0, "json_parse_errors": 0, "chars": 10839, "exclamations": 14, "question_marks": 10, "citations": 89, "malformed_citations": 0, "placeholder_leak": 0, "english_gloss_parens": 4, "input_tokens": 43709, "output_tokens": 10563, "max_output_tokens_single_call": 4600, "sum_call_seconds": 52.6, "max_call_seconds": 21.37, "topics": 4, "topics_with_bad_card_sequence": 0}}, "errors": {}}, "v2": {"outputs": {"review_cards": null, "deep_notes": null, "fun_facts": null}, "ran": [], "checks": {}, "errors": {}}, "v3": {"outputs": {"review_cards": null, "deep_notes": null, "fun_facts": null}, "ran": [], "checks": {}, "errors": {}}, "v4": {"outputs": {"review_cards": null, "deep_notes": null, "fun_facts": null}, "ran": [], "checks": {}, "errors": {}}}}]};

if (!DATA.lectures[state.lec]) state.lec = 0;
if (!VNAMES.includes(state.ver)) state.ver = VNAMES[VNAMES.length - 1];
const VNOTE = { v0: "本番プロンプト", v1: "v1 + JSON強制(緩)", v1b: "v1・JSON強制なし", v1c: "v1 + JSON強制(厳密)", v2: "長さ・テンション強化(6件のみ)", v3: "DeepNotesメタ発言対策(2件のみ)", v4: "ReviewCardsキャッシュ版(3件のみ)" };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function inline(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\\\((.+?)\\\)/g, '<span class="math">$1</span>');
  h = h.replace(/⟦([^⟧]*)⟧/g, '<span class="cite">$1</span>');
  return h;
}
function block(b) {
  switch (b.type) {
    case "paragraph": return `<p class="blk-p">${inline(b.text)}</p>`;
    case "quote": return `<p class="blk-quote">${inline(b.text)}</p>`;
    case "callout": { const t = ["info","warning","error"].includes(b.alert_type) ? b.alert_type : "info";
      return `<div class="blk-callout ${t}"><span class="tag">${t}</span>${inline(b.text)}</div>`; }
    case "list": return `<ul class="blk-list">${(b.items||[]).map(i => `<li>${inline(i)}</li>`).join("")}</ul>`;
    case "code": return `<div class="blk-code"><pre><code>${esc(b.code_string)}</code></pre>${b.explanation ? `<div class="expl">${inline(b.explanation)}</div>` : ""}</div>`;
    default: return `<pre>${esc(JSON.stringify(b, null, 1))}</pre>`;
  }
}
function cards(list) {
  if (!list || !list.length) return `<p class="empty">出力なし</p>`;
  return list.map(c => `<article class="card"><div class="card-head"><span class="emoji">${esc(c.hero_emoji||"")}</span>
    <div><div class="type">${esc(c.card_type)}</div><div class="title">${inline(c.title)}</div></div></div>
    ${(c.content_blocks||[]).map(block).join("")}</article>`).join("");
}
function md(src) {
  if (!src) return `<p class="empty">出力なし</p>`;
  let s = src.replace(/<!--\s*FIGURE:([\s\S]*?)-->/g, (_, a) => `\n\n<div class="figure">図の指定: ${esc(a.trim())}</div>\n\n`);
  s = s.replace(/⟦([^⟧]*)⟧/g, '<span class="cite">$1</span>');
  let html;
  try { html = window.marked ? marked.parse(s) : `<pre>${esc(src)}</pre>`; } catch (e) { html = `<pre>${esc(src)}</pre>`; }
  return `<div class="note">${html}</div>`;
}
function funfact(f) {
  if (!f) return `<p class="empty">出力なし</p>`;
  const body = String(f.body||"").split(/\n\n+/).map(p => `<p>${inline(p)}</p>`).join("");
  const src = (f.sources || (f.metadata && f.metadata.sources) || []);
  return `<div class="ff"><div class="t">${inline(f.title)}</div><div class="h">${inline(f.hook)}</div><div class="b">${body}</div>
    ${src.length ? `<div class="src">${src.map((u,i)=>`[${i+1}] ${esc(u)}`).join("<br>")}</div>` : ""}</div>`;
}
function stats(c) {
  if (!c) return "";
  const items = [["calls", c.calls], ["文字数", c.chars], ["！", c.exclamations], ["？", c.question_marks], ["引用", c.citations],
    ["原語併記", c.english_gloss_parens], ["出力tok(合計)", c.output_tokens], ["最長呼び出し", (c.max_call_seconds||0) + "s"]];
  const bad = [["途中切れ", c.truncated_calls], ["JSON失敗", c.json_parse_errors], ["タグ混入", c.placeholder_leak], ["カード順違反", c.topics_with_bad_card_sequence]];
  return `<div class="stats">${items.map(([k,v]) => `<span>${k} <b>${v ?? "-"}</b></span>`).join("")}
    ${bad.filter(([,v]) => v !== undefined).map(([k,v]) => `<span class="${v ? "bad" : ""}">${k} <b>${v}</b></span>`).join("")}</div>`;
}
function pair(left, right) {
  return `<div class="pair"><div class="col haiku"><div class="col-label"><span class="dot"></span>Haiku 5.5 (${esc(state.ver)})</div>${left}</div>
    <div class="col gemini"><div class="col-label"><span class="dot"></span>Gemini 2.5 Flash（既存・参考）</div>${right}</div></div>`;
}
function render() {
  try { localStorage.setItem("haikuViewer2", JSON.stringify(state)); } catch (e) {}
  const m = DATA.versions.find(v => v.name === state.ver).meta;
  document.getElementById("runmeta").textContent = `${m.created_at} · ${m.model} · effort=${m.reasoning_effort} · max_tokens=${m.max_tokens} · $${m.token_cost_usd_total}`;
  document.getElementById("versions").innerHTML = VNAMES.map(v =>
    `<button class="chip" id="ver-${v}" aria-pressed="${v === state.ver}" data-ver="${v}">${esc(v)}<span class="lang">${esc(VNOTE[v] || "")}</span></button>`).join("");
  document.getElementById("lectures").innerHTML = DATA.lectures.map((l, i) =>
    `<button class="chip" id="lec-${i}" aria-pressed="${i === state.lec}" data-lec="${i}">${esc(l.title)}<span class="lang">${esc(l.lang)}</span></button>`).join("");
  document.getElementById("tasks").innerHTML = TASKS.map(([k, n]) =>
    `<button class="chip" id="task-${k}" aria-pressed="${k === state.task}" data-task="${k}">${n}</button>`).join("");
  const L = DATA.lectures[state.lec], t = state.task, HV = L.haiku[state.ver];
  if (!HV.ran.includes(t)) {
    document.getElementById("content").innerHTML = `<p class="empty">${esc(state.ver)} では ${esc(t)} を実行していません。別の版を選んでください。</p>`;
    return;
  }
  const HO = HV.outputs;
  let out = stats(HV.checks[t]);
  if (HV.errors[t]) out += `<div class="errorbox">エラー: ${esc(HV.errors[t])}</div>`;
  if (t === "fun_facts") {
    out += `<section class="topic">${pair(funfact(HO.fun_facts), funfact(L.gemini.fun_facts))}</section>`;
  } else {
    for (const tp of L.topics) {
      const h = t === "review_cards" ? cards((HO.review_cards || {})[tp.idx]) : md((HO.deep_notes || {})[tp.idx]);
      const g = t === "review_cards" ? cards(L.gemini.review_cards[tp.idx]) : md(L.gemini.deep_notes[tp.idx]);
      out += `<section class="topic"><h2><small>Topic ${esc(tp.idx)}</small>${esc(tp.title)}</h2>${pair(h, g)}</section>`;
    }
  }
  document.getElementById("content").innerHTML = out;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button.chip"); if (!b) return;
  if (b.dataset.lec !== undefined) state.lec = +b.dataset.lec;
  if (b.dataset.task) state.task = b.dataset.task;
  if (b.dataset.ver) state.ver = b.dataset.ver;
  render(); window.scrollTo({ top: 0 });
});
render();
</script>
