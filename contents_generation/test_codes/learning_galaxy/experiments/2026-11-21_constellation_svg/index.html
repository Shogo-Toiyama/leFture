<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Galaxy - 具体モチーフの星座絵テスト</title>
  <style>
    :root {
      --bg-space: #070a14;
      --neon-cyan: #38bdf8;
      --neon-blue: #60a5fa;
      --neon-glow: rgba(56, 189, 248, 0.45);
      --text-muted: #94a3b8;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --panel-border: rgba(56, 189, 248, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-space);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 宇宙の背景 */
    .space-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.12) 0%, transparent 65%),
        radial-gradient(circle at 20% 25%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 75%, rgba(168, 85, 247, 0.08) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    /* ヘッダー */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .badge {
      display: inline-block;
      align-self: flex-start;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--neon-cyan);
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff 50%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* モチーフ切り替えタブ & 表示コントローラー */
    .toolbar {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .tab-group, .controls {
      display: flex;
      gap: 6px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
    }

    .tab-btn, .ctrl-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .ctrl-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--neon-cyan);
      color: #fff;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
    }

    .tab-btn:hover, .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* キャンバス領域 */
    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    svg#constellation-canvas {
      width: 100%;
      max-width: 980px;
      height: 82vh;
      filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.18));
    }

    /* ネオンSVGスタイル */
    .neon-art-glow {
      stroke: var(--neon-cyan);
      stroke-width: 4.5;
      fill: none;
      filter: blur(6px);
      opacity: 0.55;
    }

    .neon-art-core {
      stroke: #f0f9ff;
      stroke-width: 1.6;
      fill: none;
      opacity: 0.9;
    }

    .neon-art-sub {
      stroke: #7dd3fc;
      stroke-width: 1.0;
      fill: none;
      opacity: 0.65;
    }

    .neon-art-dashed {
      stroke: #38bdf8;
      stroke-width: 1.2;
      stroke-dasharray: 6 5;
      fill: none;
      opacity: 0.75;
    }

    /* 星座結線 (エッジ) */
    .edge-glow {
      stroke: #0284c7;
      stroke-width: 6.0;
      opacity: 0.45;
      filter: blur(4px);
    }

    .edge-core {
      stroke: #7dd3fc;
      stroke-width: 2.2;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px #38bdf8);
    }

    /* 星ノード */
    .star-node {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .star-node:hover {
      transform: scale(1.4);
    }

    .star-pulse {
      animation: pulse 2.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { r: 15; opacity: 0.3; }
      50% { r: 24; opacity: 0.65; }
    }

    .star-label {
      font-size: 11px;
      font-weight: 700;
      fill: #e0f2fe;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-shadow: 0 0 8px #000, 0 0 12px rgba(56, 189, 248, 0.8);
      transition: opacity 0.3s ease;
    }

    /* 解説ミニフッター */
    .legend {
      position: absolute;
      bottom: 24px;
      left: 32px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      font-size: 13px;
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.5;
      pointer-events: none;
    }

    .legend strong {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="space-bg"></div>

  <!-- ヘッダー -->
  <header>
    <div class="title-block">
      <div class="badge">Constellation Motif Test</div>
      <h1 id="constellation-title">ノートPC座 (The Laptop)</h1>
      <div class="subtitle" id="constellation-desc">絵の主要な角・節目に星を配置するテスト</div>
    </div>

    <div class="toolbar">
      <!-- モチーフ切り替えタブ -->
      <div class="tab-group">
        <button class="tab-btn active" onclick="switchMotif('laptop')">💻 1. ノートPC座</button>
        <button class="tab-btn" onclick="switchMotif('robot')">🤖 2. ロボット座</button>
      </div>

      <!-- 表示要素トグル -->
      <div class="controls">
        <button class="ctrl-btn active" id="btn-art" onclick="toggleArt()">ネオン絵</button>
        <button class="ctrl-btn active" id="btn-edges" onclick="toggleEdges()">星座結線</button>
        <button class="ctrl-btn active" id="btn-labels" onclick="toggleLabels()">星名</button>
      </div>
    </div>
  </header>

  <!-- 星座キャンバス (SVG) -->
  <div class="viewport">
    <svg id="constellation-canvas" viewBox="0 0 1000 800">
      <defs>
        <!-- 星の放射状グラデーション -->
        <radialGradient id="star-halo">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="star-halo-gold">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- ======================================================== -->
      <!-- 1. モチーフ: ノートPC座 (The Laptop) -->
      <!-- ======================================================== -->
      <g id="motif-laptop">
        <!-- 1-A. ネオン絵 (開いたノートPCのアウトライン・画面・コード) -->
        <g id="art-laptop" class="art-layer">
          <!-- ディスプレイの外枠 -->
          <polygon points="300,160 700,160 660,420 340,420" class="neon-art-glow" />
          <polygon points="300,160 700,160 660,420 340,420" class="neon-art-core" />

          <!-- ディスプレイのベゼル内側 (画面枠) -->
          <polygon points="325,185 675,185 642,398 358,398" class="neon-art-sub" stroke-dasharray="8 4" />

          <!-- ウィンドウのヘッダーバー (Macの3つの丸ボタン) -->
          <circle cx="348" cy="204" r="3.5" class="neon-art-sub" fill="#38bdf8" />
          <circle cx="362" cy="204" r="3.5" class="neon-art-sub" fill="#38bdf8" />
          <circle cx="376" cy="204" r="3.5" class="neon-art-sub" fill="#38bdf8" />
          <line x1="330" y1="216" x2="670" y2="216" class="neon-art-sub" />

          <!-- 画面内のコード & プロンプトシンボル -->
          <!-- 左の括弧とコードライン: >_ code -->
          <path d="M 360,260 L 380,275 L 360,290" class="neon-art-glow" />
          <path d="M 360,260 L 380,275 L 360,290" class="neon-art-core" />
          <line x1="395" y1="275" x2="470" y2="275" class="neon-art-core" stroke-width="2.5" />
          <line x1="480" y1="265" x2="480" y2="285" class="neon-art-core" stroke-width="2.5" /> <!-- カーソル -->

          <!-- コードの並び線 (行) -->
          <line x1="360" y1="320" x2="520" y2="320" class="neon-art-dashed" />
          <line x1="380" y1="340" x2="560" y2="340" class="neon-art-dashed" />
          <line x1="380" y1="360" x2="490" y2="360" class="neon-art-dashed" />

          <!-- 右上の象徴シンボル: { } -->
          <text x="590" y="300" font-family="monospace" font-size="64" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.45">{ }</text>

          <!-- ヒンジ部 (蝶番) -->
          <line x1="340" y1="420" x2="660" y2="420" class="neon-art-core" stroke-width="3" />

          <!-- キーボードベース (パームレスト外枠) -->
          <polygon points="340,420 660,420 780,640 220,640" class="neon-art-glow" />
          <polygon points="340,420 660,420 780,640 220,640" class="neon-art-core" />

          <!-- キーボードのキーボードエリア -->
          <polygon points="365,438 635,438 710,555 290,555" class="neon-art-sub" stroke-dasharray="6 3" />
          <!-- キーのグリッド行 -->
          <line x1="350" y1="465" x2="650" y2="465" class="neon-art-sub" opacity="0.4" />
          <line x1="330" y1="495" x2="670" y2="495" class="neon-art-sub" opacity="0.4" />
          <line x1="310" y1="525" x2="690" y2="525" class="neon-art-sub" opacity="0.4" />
          <!-- スペースバー -->
          <line x1="430" y1="542" x2="570" y2="542" class="neon-art-core" stroke-width="2" />

          <!-- トラックパッド -->
          <polygon points="440,575 560,575 575,628 425,628" class="neon-art-sub" />
        </g>

        <!-- 1-B. 星座結線 (絵の主要な骨格を結ぶライン) -->
        <g id="edges-laptop" class="edges-layer">
          <!-- 画面の外枠ライン -->
          <line x1="300" y1="160" x2="700" y2="160" class="edge-glow" />
          <line x1="700" y1="160" x2="660" y2="420" class="edge-glow" />
          <line x1="660" y1="420" x2="340" y2="420" class="edge-glow" />
          <line x1="340" y1="420" x2="300" y2="160" class="edge-glow" />
          <!-- 画面から中央コード核(500,300)への結線 -->
          <line x1="300" y1="160" x2="500" y2="300" class="edge-glow" />
          <line x1="700" y1="160" x2="500" y2="300" class="edge-glow" />
          <line x1="340" y1="420" x2="500" y2="300" class="edge-glow" />
          <line x1="660" y1="420" x2="500" y2="300" class="edge-glow" />
          <!-- キーボードベースの結線 -->
          <line x1="340" y1="420" x2="220" y2="640" class="edge-glow" />
          <line x1="660" y1="420" x2="780" y2="640" class="edge-glow" />
          <line x1="220" y1="640" x2="500" y2="605" class="edge-glow" />
          <line x1="780" y1="640" x2="500" y2="605" class="edge-glow" />
          <line x1="500" y1="300" x2="500" y2="605" class="edge-glow" /> <!-- 画面核とトラックパッドの接続軸 -->

          <!-- コア結線 -->
          <line x1="300" y1="160" x2="700" y2="160" class="edge-core" />
          <line x1="700" y1="160" x2="660" y2="420" class="edge-core" />
          <line x1="660" y1="420" x2="340" y2="420" class="edge-core" />
          <line x1="340" y1="420" x2="300" y2="160" class="edge-core" />
          <line x1="300" y1="160" x2="500" y2="300" class="edge-core" />
          <line x1="700" y1="160" x2="500" y2="300" class="edge-core" />
          <line x1="340" y1="420" x2="500" y2="300" class="edge-core" />
          <line x1="660" y1="420" x2="500" y2="300" class="edge-core" />
          <line x1="340" y1="420" x2="220" y2="640" class="edge-core" />
          <line x1="660" y1="420" x2="780" y2="640" class="edge-core" />
          <line x1="220" y1="640" x2="500" y2="605" class="edge-core" />
          <line x1="780" y1="640" x2="500" y2="605" class="edge-core" />
          <line x1="500" y1="300" x2="500" y2="605" class="edge-core" />
        </g>

        <!-- 1-C. 絵の頂点・主要部に置かれた星たち (8つの星) -->
        <g id="stars-laptop" class="stars-layer">
          <!-- 1. 画面左上 -->
          <g class="star-node" transform="translate(300, 160)">
            <circle r="16" fill="url(#star-halo)" class="star-pulse" />
            <circle r="6" fill="#fff" />
            <text x="-14" y="-12" text-anchor="end" class="star-label">画面・左上星</text>
          </g>
          <!-- 2. 画面右上 -->
          <g class="star-node" transform="translate(700, 160)">
            <circle r="16" fill="url(#star-halo)" class="star-pulse" />
            <circle r="6" fill="#fff" />
            <text x="14" y="-12" text-anchor="start" class="star-label">画面・右上星</text>
          </g>
          <!-- 3. 画面中央・核星 (プロンプト) -->
          <g class="star-node" transform="translate(500, 300)">
            <circle r="22" fill="url(#star-halo-gold)" class="star-pulse" />
            <circle r="8" fill="#fff" />
            <text x="0" y="26" text-anchor="middle" class="star-label">主星 (ターミナル核)</text>
          </g>
          <!-- 4. ヒンジ左 (画面左下) -->
          <g class="star-node" transform="translate(340, 420)">
            <circle r="15" fill="url(#star-halo)" class="star-pulse" />
            <circle r="5.5" fill="#fff" />
            <text x="-16" y="4" text-anchor="end" class="star-label">ヒンジ・左星</text>
          </g>
          <!-- 5. ヒンジ右 (画面右下) -->
          <g class="star-node" transform="translate(660, 420)">
            <circle r="15" fill="url(#star-halo)" class="star-pulse" />
            <circle r="5.5" fill="#fff" />
            <text x="16" y="4" text-anchor="start" class="star-label">ヒンジ・右星</text>
          </g>
          <!-- 6. キーボードベース左前 -->
          <g class="star-node" transform="translate(220, 640)">
            <circle r="16" fill="url(#star-halo)" class="star-pulse" />
            <circle r="6" fill="#fff" />
            <text x="-14" y="20" text-anchor="end" class="star-label">パームレスト・左星</text>
          </g>
          <!-- 7. トラックパッド中央 -->
          <g class="star-node" transform="translate(500, 605)">
            <circle r="15" fill="url(#star-halo)" class="star-pulse" />
            <circle r="5.5" fill="#fff" />
            <text x="0" y="24" text-anchor="middle" class="star-label">トラックパッド星</text>
          </g>
          <!-- 8. キーボードベース右前 -->
          <g class="star-node" transform="translate(780, 640)">
            <circle r="16" fill="url(#star-halo)" class="star-pulse" />
            <circle r="6" fill="#fff" />
            <text x="14" y="20" text-anchor="start" class="star-label">パームレスト・右星</text>
          </g>
        </g>
      </g>

      <!-- ======================================================== -->
      <!-- 2. モチーフ: ロボット座 (The Robot / AI Companion) -->
      <!-- ======================================================== -->
      <g id="motif-robot" style="display: none;">
        <!-- 2-A. ネオン絵 (アンテナ、四角い顔、光る目、胴体、腕) -->
        <g id="art-robot" class="art-layer">
          <!-- アンテナ棒 -->
          <line x1="500" y1="210" x2="500" y2="120" class="neon-art-core" stroke-width="3" />
          <circle cx="500" cy="120" r="14" class="neon-art-glow" />

          <!-- 頭部 (角丸長方形風) -->
          <rect x="360" y="210" width="280" height="180" rx="40" class="neon-art-glow" />
          <rect x="360" y="210" width="280" height="180" rx="40" class="neon-art-core" />
          
          <!-- 耳パーツ (左右のヘッドフォン/ボルト) -->
          <rect x="330" y="260" width="30" height="80" rx="8" class="neon-art-sub" />
          <rect x="640" y="260" width="30" height="80" rx="8" class="neon-art-sub" />

          <!-- 顔のバイザー画面 -->
          <rect x="390" y="240" width="220" height="100" rx="20" class="neon-art-sub" stroke-dasharray="6 3" />
          
          <!-- 笑顔・口 (ピクセル風) -->
          <path d="M 440,360 Q 500,385 560,360" class="neon-art-core" stroke-width="3" />

          <!-- 首 -->
          <line x1="460" y1="390" x2="460" y2="430" class="neon-art-sub" />
          <line x1="540" y1="390" x2="540" y2="430" class="neon-art-sub" />

          <!-- 胴体 (ボディ) -->
          <polygon points="370,430 630,430 600,640 400,640" class="neon-art-glow" />
          <polygon points="370,430 630,430 600,640 400,640" class="neon-art-core" />

          <!-- 胸のコア・メーターパネル -->
          <circle cx="500" cy="520" r="35" class="neon-art-sub" stroke-dasharray="4 3" />

          <!-- 左腕 & ハンド -->
          <path d="M 370,450 L 260,510 L 250,590" class="neon-art-glow" />
          <path d="M 370,450 L 260,510 L 250,590" class="neon-art-core" stroke-width="2.5" />
          <circle cx="250" cy="590" r="16" class="neon-art-sub" /> <!-- 左手 -->

          <!-- 右腕 & ハンド -->
          <path d="M 630,450 L 740,510 L 750,590" class="neon-art-glow" />
          <path d="M 630,450 L 740,510 L 750,590" class="neon-art-core" stroke-width="2.5" />
          <circle cx="750" cy="590" r="16" class="neon-art-sub" /> <!-- 右手 -->
        </g>

        <!-- 2-B. 星座結線 (ロボットの骨格) -->
        <g id="edges-robot" class="edges-layer">
          <line x1="500" y1="120" x2="500" y2="210" class="edge-glow" />
          <line x1="500" y1="210" x2="450" y2="290" class="edge-glow" />
          <line x1="500" y1="210" x2="550" y2="290" class="edge-glow" />
          <line x1="450" y1="290" x2="550" y2="290" class="edge-glow" />
          <line x1="450" y1="290" x2="370" y2="440" class="edge-glow" />
          <line x1="550" y1="290" x2="630" y2="440" class="edge-glow" />
          <line x1="370" y1="440" x2="630" y2="440" class="edge-glow" />
          <line x1="370" y1="440" x2="500" y2="520" class="edge-glow" />
          <line x1="630" y1="440" x2="500" y2="520" class="edge-glow" />
          <line x1="370" y1="440" x2="250" y2="590" class="edge-glow" /> <!-- 左手 -->
          <line x1="630" y1="440" x2="750" y2="590" class="edge-glow" /> <!-- 右手 -->
          <line x1="500" y1="520" x2="400" y2="640" class="edge-glow" />
          <line x1="500" y1="520" x2="600" y2="640" class="edge-glow" />
          <line x1="400" y1="640" x2="600" y2="640" class="edge-glow" />

          <!-- コア結線 -->
          <line x1="500" y1="120" x2="500" y2="210" class="edge-core" />
          <line x1="500" y1="210" x2="450" y2="290" class="edge-core" />
          <line x1="500" y1="210" x2="550" y2="290" class="edge-core" />
          <line x1="450" y1="290" x2="550" y2="290" class="edge-core" />
          <line x1="450" y1="290" x2="370" y2="440" class="edge-core" />
          <line x1="550" y1="290" x2="630" y2="440" class="edge-core" />
          <line x1="370" y1="440" x2="630" y2="440" class="edge-core" />
          <line x1="370" y1="440" x2="500" y2="520" class="edge-core" />
          <line x1="630" y1="440" x2="500" y2="520" class="edge-core" />
          <line x1="370" y1="440" x2="250" y2="590" class="edge-core" />
          <line x1="630" y1="440" x2="750" y2="590" class="edge-core" />
          <line x1="500" y1="520" x2="400" y2="640" class="edge-core" />
          <line x1="500" y1="520" x2="600" y2="640" class="edge-core" />
          <line x1="400" y1="640" x2="600" y2="640" class="edge-core" />
        </g>

        <!-- 2-C. ロボットの要所に置かれた星たち -->
        <g id="stars-robot" class="stars-layer">
          <!-- アンテナ星 -->
          <g class="star-node" transform="translate(500, 120)">
            <circle r="18" fill="url(#star-halo-gold)" class="star-pulse" />
            <circle r="6.5" fill="#fff" />
            <text x="0" y="-16" text-anchor="middle" class="star-label">アンテナ星</text>
          </g>
          <!-- 左目 -->
          <g class="star-node" transform="translate(450, 290)">
            <circle r="16" fill="url(#star-halo)" class="star-pulse" />
            <circle r="6" fill="#fff" />
            <text x="-16" y="0" text-anchor="end" class="star-label">左目星</text>
          </g>
          <!-- 右目 -->
          <g class="star-node" transform="translate(550, 290)">
            <circle r="16" fill="url(#star-halo)" class="star-pulse" />
            <circle r="6" fill="#fff" />
            <text x="16" y="0" text-anchor="start" class="star-label">右目星</text>
          </g>
          <!-- 左肩 -->
          <g class="star-node" transform="translate(370, 440)">
            <circle r="14" fill="url(#star-halo)" class="star-pulse" />
            <circle r="5" fill="#fff" />
            <text x="-14" y="4" text-anchor="end" class="star-label">左肩星</text>
          </g>
          <!-- 右肩 -->
          <g class="star-node" transform="translate(630, 440)">
            <circle r="14" fill="url(#star-halo)" class="star-pulse" />
            <circle r="5" fill="#fff" />
            <text x="14" y="4" text-anchor="start" class="star-label">右肩星</text>
          </g>
          <!-- 左手 -->
          <g class="star-node" transform="translate(250, 590)">
            <circle r="15" fill="url(#star-halo)" class="star-pulse" />
            <circle r="5.5" fill="#fff" />
            <text x="-16" y="18" text-anchor="end" class="star-label">左手星</text>
          </g>
          <!-- 右手 -->
          <g class="star-node" transform="translate(750, 590)">
            <circle r="15" fill="url(#star-halo)" class="star-pulse" />
            <circle r="5.5" fill="#fff" />
            <text x="16" y="18" text-anchor="start" class="star-label">右手星</text>
          </g>
          <!-- 胸のコア (主星) -->
          <g class="star-node" transform="translate(500, 520)">
            <circle r="22" fill="url(#star-halo-gold)" class="star-pulse" />
            <circle r="8" fill="#fff" />
            <text x="0" y="28" text-anchor="middle" class="star-label">ハートコア (主星)</text>
          </g>
          <!-- 左腰/足 -->
          <g class="star-node" transform="translate(400, 640)">
            <circle r="14" fill="url(#star-halo)" class="star-pulse" />
            <circle r="5" fill="#fff" />
            <text x="-14" y="20" text-anchor="end" class="star-label">左腰星</text>
          </g>
          <!-- 右腰/足 -->
          <g class="star-node" transform="translate(600, 640)">
            <circle r="14" fill="url(#star-halo)" class="star-pulse" />
            <circle r="5" fill="#fff" />
            <text x="14" y="20" text-anchor="start" class="star-label">右腰星</text>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <!-- フッター説明 -->
  <div class="legend">
    <strong>💡 検証ポイント:</strong><br>
    右上の「ネオン絵」ボタンをOFFにしてみてください。絵を消しても、<strong>星と結線だけでノートPC（またはロボット）の骨格がはっきりと浮かび上がる</strong>のが確認できます。
  </div>

  <script>
    let currentMotif = 'laptop';
    let showArt = true;
    let showEdges = true;
    let showLabels = true;

    function switchMotif(motif) {
      currentMotif = motif;
      
      const laptopGroup = document.getElementById('motif-laptop');
      const robotGroup = document.getElementById('motif-robot');
      const title = document.getElementById('constellation-title');
      const desc = document.getElementById('constellation-desc');
      
      const tabs = document.querySelectorAll('.tab-btn');
      tabs[0].classList.toggle('active', motif === 'laptop');
      tabs[1].classList.toggle('active', motif === 'robot');

      if (motif === 'laptop') {
        laptopGroup.style.display = 'block';
        robotGroup.style.display = 'none';
        title.textContent = 'ノートPC座 (The Laptop)';
        desc.textContent = '開いた画面とキーボードの要所（角・ヒンジ・パームレスト・核）に星を配置';
      } else {
        laptopGroup.style.display = 'none';
        robotGroup.style.display = 'block';
        title.textContent = 'ロボット座 (The Companion Robot)';
        desc.textContent = 'アンテナ、両目、胸のコア、手足の関節に星を配置';
      }
    }

    function toggleArt() {
      showArt = !showArt;
      document.querySelectorAll('.art-layer').forEach(el => {
        el.style.opacity = showArt ? "1" : "0";
      });
      document.getElementById('btn-art').classList.toggle('active', showArt);
    }

    function toggleEdges() {
      showEdges = !showEdges;
      document.querySelectorAll('.edges-layer').forEach(el => {
        el.style.opacity = showEdges ? "1" : "0";
      });
      document.getElementById('btn-edges').classList.toggle('active', showEdges);
    }

    function toggleLabels() {
      showLabels = !showLabels;
      document.querySelectorAll('.star-label').forEach(el => {
        el.style.opacity = showLabels ? "1" : "0";
      });
      document.getElementById('btn-labels').classList.toggle('active', showLabels);
    }
  </script>
</body>
</html>
