<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pause Probe</title></head>
<body>
<pre id="out">starting</pre>
<script>
// Does MediaRecorder.pause()/resume() with AAC-in-MP4 give one valid file whose duration excludes the
// paused time? Records 6 s, pauses 6 s, records 6 s (same settings as the webapp: 64 kbps, 10 s slices),
// then uploads the file and a log through serve.py. Run in Chrome with a fake mic:
//   --use-fake-ui-for-media-stream --use-fake-device-for-media-stream
(async () => {
  const out = document.getElementById('out');
  const events = [];
  const t0 = performance.now();
  const log = (m) => { events.push(`${((performance.now() - t0) / 1000).toFixed(2)}s ${m}`); out.textContent = events.join('\n'); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream, { mimeType: 'audio/mp4;codecs=mp4a.40.2', audioBitsPerSecond: 64000 });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); log(`dataavailable ${e.data.size}`); };
    rec.onpause = () => log('pause event');
    rec.onresume = () => log('resume event');
    const stopped = new Promise((r) => { rec.onstop = r; });
    rec.start(10000); log('start');
    await wait(6000);
    rec.pause(); log(`paused state=${rec.state}`);
    await wait(6000);
    rec.resume(); log(`resumed state=${rec.state}`);
    await wait(6000);
    rec.stop(); await stopped; log('stopped');
    const blob = new Blob(chunks, { type: 'audio/mp4' });
    const ctx = new OfflineAudioContext(1, 1, 48000);
    try {
      const audio = await ctx.decodeAudioData(await blob.arrayBuffer());
      log(`browser decode duration=${audio.duration.toFixed(2)}s`);
    } catch (e) { log(`browser decode failed ${e.name}`); }
    const name = `pause_probe_${Date.now()}`;
    await fetch(`/save?name=${name}.m4a`, { method: 'POST', body: blob });
    await fetch(`/save?name=${name}.json`, { method: 'POST', body: JSON.stringify({ expectedActiveSeconds: 12, wallSeconds: 18, events }) });
    log('saved');
  } catch (e) {
    log(`error ${e.name}: ${e.message}`);
  }
})();
</script>
</body>
</html>
