<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Permission Probe</title></head>
<body><pre id="out"></pre>
<script>
// What can a page learn about screen-capture permission before calling getDisplayMedia()?
(async () => {
  const result = { userAgentData: navigator.userAgentData ? navigator.userAgentData.platform : null };
  for (const name of ['display-capture', 'microphone', 'camera']) {
    try {
      const status = await navigator.permissions.query({ name });
      result[name] = status.state;
    } catch (e) {
      result[name] = `throws ${e.name}: ${e.message}`;
    }
  }
  document.getElementById('out').textContent = JSON.stringify(result);
  await fetch(`/save?name=permission_probe_${Date.now()}.json`, { method: 'POST', body: JSON.stringify(result) });
})();
</script></body></html>
