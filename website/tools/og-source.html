<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden; position:relative;
    background:#111422;
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',-apple-system,sans-serif;
    color:#F2F4F8;
  }
  .glow-a { position:absolute; left:50%; bottom:-360px; width:1500px; height:760px;
    margin-left:-750px; border-radius:50%;
    background:radial-gradient(ellipse at center,
      rgba(216,243,255,.42) 0%, rgba(107,203,255,.20) 26%,
      rgba(185,139,255,.14) 46%, rgba(255,95,162,.07) 62%, transparent 76%);
    filter:blur(2px); }
  .glow-b { position:absolute; left:50%; bottom:-250px; width:620px; height:420px;
    margin-left:-310px; border-radius:50%;
    background:radial-gradient(ellipse at center,
      rgba(255,205,150,.34) 0%, rgba(255,79,162,.14) 48%, transparent 72%); }
  .stars i { position:absolute; border-radius:50%; background:#fff; }
  .vig { position:absolute; inset:0;
    background:
      radial-gradient(ellipse 70% 46% at 50% 34%, rgba(17,20,34,.5) 0%, rgba(17,20,34,.18) 55%, transparent 82%),
      linear-gradient(180deg, rgba(17,20,34,.72) 0%, transparent 26%); }
  .wrap { position:relative; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:0 96px; text-align:center; }
  .brand { display:flex; align-items:center; gap:13px; margin-bottom:30px; }
  .mark { width:44px; height:44px; border-radius:13px;
    background:linear-gradient(135deg,#FFB300,#FF8F00);
    display:flex; align-items:center; justify-content:center; font-size:23px;
    box-shadow:0 3px 20px rgba(255,179,0,.45); }
  .name { font-size:33px; font-weight:800; letter-spacing:-.02em; }
  .eyebrow { font-size:14px; font-weight:700; letter-spacing:.22em;
    text-transform:uppercase; color:#FFB300; margin-bottom:26px;
    padding:7px 18px; border:1px solid rgba(255,179,0,.34);
    border-radius:999px; background:rgba(255,179,0,.09); }
  h1 { font-size:63px; font-weight:800; line-height:1.16; letter-spacing:-.03em; }
  h1 .gold { display:block;
    background:linear-gradient(120deg,#FFD166,#FFB300 45%,#CC8D00);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  p { margin-top:24px; font-size:21px; line-height:1.7; color:#C9D2E0; max-width:800px; }
  .wave { display:flex; align-items:center; gap:5px; height:64px; margin-top:38px; }
  .wave b { width:6px; border-radius:99px;
    background:linear-gradient(180deg,#FFE89F,#FFC42E);
    box-shadow:0 0 10px rgba(255,193,51,.7); }
  .clay { position:absolute; }
  .clay img { width:100%; }
  .r { left:56px; top:96px; width:150px; transform:rotate(-13deg);
    filter:drop-shadow(0 10px 34px rgba(255,140,66,.6)); }
  .g { right:52px; top:74px; width:164px; transform:rotate(9deg);
    filter:drop-shadow(0 10px 34px rgba(185,139,255,.6)); }
</style></head>
